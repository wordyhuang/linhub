<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于系统 - LinHub 林枢</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .si-page { min-height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    /* 详情卡一行多列（1440px 宽两列，更宽屏更多列）；tips 与统计卡横跨全行 */
    .si-panels {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
      gap: 14px;
    }

    .si-panels > .wd-tips,
    .si-panels > .si-stats { grid-column: 1 / -1; }

    /* —— 环境概览统计卡：容器统一 wd-panel mode="card"，不再自绘 div 卡片 —— */
    .si-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .si-stat-num {
      font-size: 22px;
      font-weight: 600;
      color: #0066CC;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }

    .si-stat-sub {
      margin-top: 4px;
      font-size: 12px;
      color: #909399;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .si-stat-sub.is-warn { color: #e6a23c; }

    .si-stat-sub.is-danger { color: #f56c6c; }

    .si-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .si-item {
      flex: 0 1 auto; min-width: 120px; max-width: 420px; box-sizing: border-box;
      background: var(--el-fill-color-light, #f5f7fa); border: 1px solid var(--el-border-color-lighter, #ebeef5);
      border-radius: 8px; padding: 10px 14px;
    }
    .si-item .k { font-size: 12px; color: var(--el-text-color-secondary, #909399); }
    .si-item .v { font-size: 14px; font-weight: 600; line-height: 1.5; color: var(--el-text-color-primary, #303133); margin-top: 4px; word-break: break-all; }
    .si-ext { display: flex; flex-wrap: wrap; gap: 8px; }
    .si-ext .ext-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .si-bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; margin-top: 12px; }
    .si-bar-name { color: var(--el-text-color-secondary, #909399); flex: none; }
    .si-bar-track { height: 8px; width: 280px; flex: none; background: var(--el-fill-color-light, #eef1f6); border-radius: 4px; overflow: hidden; }
    .si-bar-fill { height: 100%; background: linear-gradient(90deg, #8cc5ff, #409eff); border-radius: 4px; }
    .si-bar-num { text-align: right; color: var(--el-text-color-primary, #303133); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="si-tpl">
    <div class="si-page" v-loading="loading" element-loading-text="加载中...">
      <div class="si-panels">
        <wd-tips type="box" style="margin-bottom:0">
          只读展示当前平台运行环境与服务器概况，用于排查环境与版本问题。本页不承载任何写操作，敏感凭证（API Key/数据库密码等）不会在此展示。
        </wd-tips>

        <!-- 环境概览：统计卡容器统一 wd-panel mode="card" -->
        <div class="si-stats">
          <wd-panel title="平台版本" :border="true" mode="card">
            <div class="si-stat-num">v{{ d.platform.version || '—' }}</div>
            <div class="si-stat-sub">{{ d.server.software || d.server.hostname || '' }}</div>
          </wd-panel>
          <wd-panel title="PHP 运行时" :border="true" mode="card">
            <div class="si-stat-num">v{{ d.php.version || '—' }}</div>
            <div class="si-stat-sub">{{ d.php.sapi || '—' }} · {{ d.php.memory_limit || '—' }}</div>
          </wd-panel>
          <wd-panel title="数据库" :border="true" mode="card">
            <div class="si-stat-num">{{ d.database.version || d.database.driver || '—' }}</div>
            <div class="si-stat-sub">{{ d.database.host }}:{{ d.database.port }} · {{ d.database.database || '—' }}</div>
          </wd-panel>
          <wd-panel title="磁盘可用" :border="true" mode="card">
            <div class="si-stat-num">{{ bytes(d.system.disk_free) }}</div>
            <div class="si-stat-sub" :class="{ 'is-warn': diskUsedPct() >= 80, 'is-danger': diskUsedPct() >= 90 }">
              {{ d.system.disk_total > 0 ? ('总 ' + bytes(d.system.disk_total) + ' · 已用 ' + diskUsedPct() + '%') : '—' }}
            </div>
          </wd-panel>
          <wd-panel title="关键扩展" :border="true" mode="card">
            <div class="si-stat-num">{{ extLoaded() }} / {{ extTotal() }}</div>
            <div class="si-stat-sub" :class="{ 'is-danger': extLoaded() < extTotal() }">
              {{ extLoaded() < extTotal() ? '存在未加载扩展，请检查' : '全部已加载' }}
            </div>
          </wd-panel>
          <wd-panel title="UAIS 认证" :border="true" mode="card">
            <div class="si-stat-num" :style="{ color: d.uais.status === '已连接' ? '#0066CC' : (d.uais.status === '连接失败' ? '#f56c6c' : '#909399') }">{{ d.uais.status || '—' }}</div>
            <div class="si-stat-sub">App 凭证{{ (d.uais.app_key_configured && d.uais.app_secret_configured) ? '已配置' : '未完整配置' }}</div>
          </wd-panel>
          <wd-panel title="Redis" :border="true" mode="card">
            <div class="si-stat-num" :style="{ color: d.redis.status === '已连接' ? '#0066CC' : (d.redis.status === '连接失败' ? '#f56c6c' : '#909399') }">{{ d.redis.status || '—' }}</div>
            <div class="si-stat-sub">{{ d.redis.host ? (d.redis.host + ':' + d.redis.port) : '—' }} · 密码{{ d.redis.pass_configured ? '已配置' : '未配置' }}</div>
          </wd-panel>
        </div>

        <!-- 平台与服务器（原「平台版本」+「服务器环境」合并） -->
        <wd-panel title="平台与服务器" icon="Cpu" description="平台版本与运行主机信息" description-align="right" :border="true" mode="card">
          <div class="si-grid">
            <div class="si-item"><div class="k">平台版本号</div><div class="v">v{{ d.platform.version }}</div></div>
            <div class="si-item"><div class="k">框架版本</div><div class="v">ThinkPHP v{{ d.platform.framework || '—' }}</div></div>
            <div class="si-item"><div class="k">操作系统（PHP_OS）</div><div class="v">{{ d.server.os }}</div></div>
            <div class="si-item"><div class="k">主机名</div><div class="v">{{ d.server.hostname }}</div></div>
            <div class="si-item" v-if="d.server.software"><div class="k">Web 服务器软件</div><div class="v" style="font-size:12px;font-weight:400">{{ d.server.software }}</div></div>
          </div>
        </wd-panel>

        <!-- PHP 运行时 -->
        <wd-panel title="PHP 运行时" icon="MagicStick" description="解释器版本与运行参数" description-align="right" :border="true" mode="card">
          <div class="si-grid">
            <div class="si-item"><div class="k">PHP 版本</div><div class="v">v{{ d.php.version }}</div></div>
            <div class="si-item"><div class="k">运行方式（SAPI）</div><div class="v">{{ d.php.sapi }}</div></div>
            <div class="si-item"><div class="k">时区</div><div class="v">{{ d.php.timezone }}</div></div>
            <div class="si-item"><div class="k">内存上限</div><div class="v">{{ d.php.memory_limit }}</div></div>
            <div class="si-item"><div class="k">上传文件上限</div><div class="v">{{ d.php.upload_max_filesize }}</div></div>
            <div class="si-item"><div class="k">POST 上限</div><div class="v">{{ d.php.post_max_size }}</div></div>
            <div class="si-item"><div class="k">最大执行时间</div><div class="v">{{ d.php.max_execution_time }} 秒</div></div>
            <div class="si-item" v-if="d.php.loaded_config"><div class="k">php.ini 路径</div><div class="v" style="font-size:12px;font-weight:400">{{ d.php.loaded_config }}</div></div>
          </div>
        </wd-panel>

        <!-- 资源概况 -->
        <wd-panel title="资源概况" icon="DataAnalysis" description="磁盘与内存使用情况" description-align="right" :border="true" mode="card">
          <div class="si-grid">
            <div class="si-item"><div class="k">磁盘总量</div><div class="v">{{ bytes(d.system.disk_total) }}</div></div>
            <div class="si-item"><div class="k">磁盘可用</div><div class="v">{{ bytes(d.system.disk_free) }}</div></div>
            <div class="si-item"><div class="k">当前进程内存</div><div class="v">{{ bytes(d.system.memory_usage) }}</div></div>
            <div class="si-item"><div class="k">峰值内存</div><div class="v">{{ bytes(d.system.memory_peak) }}</div></div>
          </div>
          <div v-if="d.system.disk_total > 0">
            <div class="si-bar-row">
              <span class="si-bar-name">磁盘占用</span>
              <div class="si-bar-track"><div class="si-bar-fill" :style="{ width: diskUsedPct() + '%' }"></div></div>
              <span class="si-bar-num">{{ diskUsedPct() }}%</span>
            </div>
          </div>
        </wd-panel>

        <!-- 数据库连接 -->
        <wd-panel title="数据库连接" icon="Connection" description="仅展示非敏感连接信息" description-align="right" :border="true" mode="card">
          <div class="si-grid">
            <div class="si-item"><div class="k">驱动类型</div><div class="v">{{ d.database.driver }}</div></div>
            <div class="si-item"><div class="k">主机地址</div><div class="v">{{ d.database.host }}</div></div>
            <div class="si-item"><div class="k">端口</div><div class="v">{{ d.database.port }}</div></div>
            <div class="si-item"><div class="k">数据库名</div><div class="v">{{ d.database.database }}</div></div>
            <div class="si-item"><div class="k">字符集</div><div class="v">{{ d.database.charset }}</div></div>
            <div class="si-item" v-if="d.database.version"><div class="k">数据库版本</div><div class="v">{{ d.database.version }}</div></div>
          </div>
        </wd-panel>

        <!-- UAIS 认证 -->
        <wd-panel title="UAIS 认证" icon="Key" description="统一身份认证接入状态（不含任何凭证明文）" description-align="right" :border="true" mode="card">
          <div class="si-grid">
            <div class="si-item"><div class="k">服务地址</div><div class="v" style="font-size:12px;font-weight:400">{{ d.uais.base_url || '—' }}</div></div>
            <div class="si-item">
              <div class="k">连接状态</div>
              <div class="v">{{ d.uais.status }}</div>
            </div>
            <div class="si-item">
              <div class="k">App 凭证</div>
              <div class="v">{{ (d.uais.app_key_configured && d.uais.app_secret_configured) ? '已配置' : (d.uais.app_key_configured || d.uais.app_secret_configured ? '部分配置' : '未配置') }}</div>
            </div>
            <div class="si-item"><div class="k">超管判定 tag</div><div class="v" style="font-size:12px;font-weight:400">{{ d.uais.admin_tag || '—' }}</div></div>
          </div>
          <div v-if="d.uais.error" style="margin-top:8px;">
            <el-alert type="warning" :closable="false" show-icon :title="d.uais.error" />
          </div>
          <div style="margin-top:8px;">
            <el-text type="info" size="small">此项仅展示 UAIS 统一身份认证服务接入情况，不展示任何 App Key / Secret / Token 明文。</el-text>
          </div>
        </wd-panel>

        <!-- Redis 通信 -->
        <wd-panel title="Redis 通信" icon="Message" description="功能包事件总线的 Stream 接入状态（不含任何凭证明文）" description-align="right" :border="true" mode="card">
          <div class="si-grid">
            <div class="si-item"><div class="k">服务地址</div><div class="v">{{ d.redis.host ? (d.redis.host + ':' + d.redis.port) : '—' }}</div></div>
            <div class="si-item"><div class="k">连接状态</div><div class="v">{{ d.redis.status || '—' }}</div></div>
            <div class="si-item"><div class="k">连接密码</div><div class="v">{{ d.redis.pass_configured ? '已配置' : '未配置' }}</div></div>
            <div class="si-item"><div class="k">用途</div><div class="v" style="font-size:12px;font-weight:400">功能包事件总线（Redis Stream）</div></div>
          </div>
          <div v-if="d.redis.error" style="margin-top:8px;">
            <el-alert type="warning" :closable="false" show-icon :title="d.redis.error" />
          </div>
          <div style="margin-top:8px;">
            <el-text type="info" size="small">此项仅展示 Redis Stream 事件总线接入情况，不展示连接密码明文。</el-text>
          </div>
        </wd-panel>

        <!-- 关键扩展检测 -->
        <wd-panel title="关键扩展检测" icon="Box" description="平台依赖的 PHP 扩展加载情况" description-align="right" :border="true" mode="card">
          <div class="si-ext">
            <el-tag
              v-for="(on, name) in d.extensions"
              :key="name"
              :type="on ? 'success' : 'danger'"
              effect="plain"
              class="ext-tag"
            >{{ name }}：{{ on ? '已加载' : '未加载' }}</el-tag>
          </div>
        </wd-panel>
      </div>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script src="/static/linhub/auth-guard.js?v=2"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive } = Vue;

    const app = Vue.createApp({
      template: '#si-tpl',
      setup() {
        const loading = ref(false);
        const d = reactive({
          platform: { version: '', framework: '' },
          php: { version: '', sapi: '', timezone: '', memory_limit: '', upload_max_filesize: '', post_max_size: '', max_execution_time: '0', loaded_config: '' },
          server: { os: '', hostname: '', software: '' },
          system: { disk_total: 0, disk_free: 0, memory_usage: 0, memory_peak: 0 },
          extensions: {},
          database: { driver: '', host: '', port: '', database: '', charset: '', version: '' },
          uais: { base_url: '', app_key_configured: false, app_secret_configured: false, admin_tag: '', status: '', error: '' },
          redis: { host: '', port: '', pass_configured: false, status: '', error: '' },
        });

        async function load() {
          loading.value = true;
          try {
            const res = await WD.request.get('/admin/system_info/info');
            if (!res.success) {
              ElementPlus.ElMessage.error(res.message || '加载失败');
              return;
            }
            Object.assign(d, res.data);
          } finally {
            loading.value = false;
          }
        }

        function bytes(n) {
          n = Number(n) || 0;
          if (n < 1024) return n + ' B';
          if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
          if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
          return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }
        function diskUsedPct() {
          const total = Number(d.system.disk_total) || 0;
          const free = Number(d.system.disk_free) || 0;
          if (total <= 0) return 0;
          return Math.max(0, Math.min(100, Math.round((total - free) / total * 100)));
        }
        function extLoaded() {
          return Object.values(d.extensions).filter(Boolean).length;
        }
        function extTotal() {
          return Object.keys(d.extensions).length;
        }

        load();
        return { loading, d, bytes, diskUsedPct, extLoaded, extTotal };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
