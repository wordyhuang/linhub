<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部单据 - LinHub 林枢</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ap-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .ap-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .ap-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    .ap-pager { display: flex; justify-content: flex-end; margin-top: 12px; }
    .ap-stat { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="ap-index-tpl">
    <div class="ap-page">
      <wd-panel :border="true">
        <wd-tips type="box" style="margin-bottom:12px">
          全部单据：平台审批服务（AP）跨功能包全量视图。孤儿态（包已卸载）单据标注提示且不可审批，重装同名包后自动接管恢复推进。
        </wd-tips>

        <div class="ap-stat">
          <el-tag effect="plain">总单据 {{ stats.total }}</el-tag>
          <el-tag type="warning" effect="plain">在办 {{ stats.pending }}</el-tag>
          <el-tag type="success" effect="plain">已通过 {{ stats.approved }}</el-tag>
          <el-tag type="danger" effect="plain">已驳回 {{ stats.rejected }}</el-tag>
          <el-tag type="info" effect="plain">已撤回 {{ stats.cancelled }}</el-tag>
          <el-tag type="warning" effect="dark">孤儿态 {{ stats.orphaned }}</el-tag>
        </div>

        <form class="ap-filter" @submit.prevent="search">
          <el-select v-model="filters.status" placeholder="单据状态" style="width:140px" clearable>
            <el-option label="在办" value="pending" />
            <el-option label="已通过" value="approved" />
            <el-option label="已驳回" value="rejected" />
            <el-option label="已撤回" value="cancelled" />
          </el-select>
          <el-select v-model="filters.orphaned" placeholder="孤儿态" style="width:130px" clearable>
            <el-option label="仅孤儿" value="yes" />
            <el-option label="仅正常" value="no" />
          </el-select>
          <el-input v-model="filters.package" placeholder="功能包" style="width:150px" clearable @keyup.enter="search" />
          <el-input v-model="filters.flow_key" placeholder="流程 key" style="width:160px" clearable @keyup.enter="search" />
          <el-input v-model="filters.keyword" placeholder="标题 / 单据编号 / 提交人" style="width:220px" clearable @keyup.enter="search" />
          <el-date-picker v-model="dateRange" type="daterange" value-format="YYYY-MM-DD"
            start-placeholder="提交起" end-placeholder="提交止" style="width:260px" />
          <el-button native-type="submit" type="primary" :icon="Search" :loading="loading">检索</el-button>
          <el-button :icon="RefreshLeft" @click="reset">重置</el-button>
        </form>

        <wd-data-grid :data-source="rows" border stripe :with-index="false" :with-pager="false" v-loading="loading">
          <el-table-column prop="approval_no" label="单据编号" min-width="200">
            <template #default="{ row }">
              <a class="ap-mono" :href="'/admin/ApprovalAdmin/detail?no=' + row.approval_no">{{ row.approval_no }}</a>
            </template>
          </el-table-column>
          <el-table-column prop="package" label="功能包" min-width="120">
            <template #default="{ row }">
              <span class="ap-mono">{{ row.package }}</span>
              <el-tag v-if="row.orphaned" size="small" type="warning" effect="dark" style="margin-left:4px">包已卸载</el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="flow_key" label="流程" min-width="150">
            <template #default="{ row }"><span class="ap-mono">{{ row.flow_key }}@v{{ row.flow_version }}</span></template>
          </el-table-column>
          <el-table-column prop="title" label="标题" min-width="180" show-overflow-tooltip />
          <el-table-column label="提交人" min-width="120">
            <template #default="{ row }">{{ row.submitter_name || row.submitter_id }}</template>
          </el-table-column>
          <el-table-column label="状态" width="100">
            <template #default="{ row }">
              <el-tag size="small" :type="statusType(row.status)">{{ statusText(row.status) }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="submitted_at" label="提交时间" width="180" />
          <el-table-column prop="finished_at" label="结束时间" width="180">
            <template #default="{ row }">{{ row.finished_at || '—' }}</template>
          </el-table-column>
          <el-table-column label="操作" width="90" fixed="right">
            <template #default="{ row }">
              <el-button size="small" text type="primary" @click="openDetail(row)">详情</el-button>
            </template>
          </el-table-column>
          <template #empty><el-empty description="暂无审批单据" :image-size="80" /></template>
        </wd-data-grid>

        <div class="ap-pager">
          <el-pagination
            v-model:current-page="page" v-model:page-size="size"
            :total="total" :page-sizes="[20, 50, 100]"
            layout="total, sizes, prev, pager, next, jumper"
            @current-change="load" @size-change="onSizeChange" />
        </div>
      </wd-panel>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive } = Vue;
    const { Search, RefreshLeft } = window.ElementPlusIconsVue || {};

    const STATUS_TEXT = { pending: '在办', approved: '已通过', rejected: '已驳回', cancelled: '已撤回' };
    const STATUS_TYPE = { pending: 'warning', approved: 'success', rejected: 'danger', cancelled: 'info' };

    const app = Vue.createApp({
      template: '#ap-index-tpl',
      setup() {
        const loading = ref(false);
        const rows = ref([]);
        const total = ref(0);
        const page = ref(1);
        const size = ref(20);
        const dateRange = ref([]);
        const filters = reactive({ status: '', orphaned: '', package: '', flow_key: '', keyword: '' });
        const stats = reactive({ total: 0, pending: 0, approved: 0, rejected: 0, cancelled: 0, orphaned: 0 });

        function statusText(s) { return STATUS_TEXT[s] || s || '—'; }
        function statusType(s) { return STATUS_TYPE[s] || 'info'; }

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        async function load() {
          loading.value = true;
          try {
            const range = dateRange.value || [];
            const res = await WD.request.get('/admin/approval_admin/rows' + qs({
              status: filters.status,
              orphaned: filters.orphaned,
              package: filters.package,
              flow_key: filters.flow_key,
              keyword: filters.keyword,
              date_from: range[0] || '',
              date_to: range[1] ? range[1] + ' 23:59:59' : '',
              page: page.value,
              size: size.value
            }));
            if (!res.success) {
              ElementPlus.ElMessage.error(res.message || '加载失败');
              return;
            }
            rows.value = res.data.list || [];
            total.value = res.data.total || 0;
            const st = res.data.stats || {};
            stats.total = st.total || 0;
            stats.pending = st.pending || 0;
            stats.approved = st.approved || 0;
            stats.rejected = st.rejected || 0;
            stats.cancelled = st.cancelled || 0;
            stats.orphaned = st.orphaned || 0;
          } finally {
            loading.value = false;
          }
        }

        function search() { page.value = 1; load(); }
        function reset() {
          filters.status = ''; filters.orphaned = ''; filters.package = '';
          filters.flow_key = ''; filters.keyword = ''; dateRange.value = [];
          page.value = 1; load();
        }
        function onSizeChange() { page.value = 1; load(); }
        function openDetail(row) { location.href = '/admin/ApprovalAdmin/detail?no=' + row.approval_no; }

        load();

        return {
          loading, rows, total, page, size, filters, dateRange, stats,
          load, search, reset, onSizeChange, openDetail, statusText, statusType,
          Search, RefreshLeft
        };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
