<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部单据 - LinHub 林枢</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <link rel="stylesheet" href="/static/linhub/cards.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ap-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .ap-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .ap-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="ap-index-tpl">
    <div class="ap-page">
      <wd-panel description-align="right" :border="true">
        <wd-tips type="box" style="margin-bottom:12px">
          全部单据：平台审批服务（AP）跨功能包全量视图，顶部页签区分单据状态（「待办」为当前登录账号名下有活跃审批任务的单据）。孤儿态（包已卸载）单据标注提示且不可审批，重装同名包后自动接管恢复推进。
        </wd-tips>

        <el-tabs v-model="activeTab" style="margin-bottom:12px" @tab-change="search">
          <el-tab-pane name="all">
            <template #label>全部 <el-badge :value="stats.total" type="primary" style="margin-left:4px" /></template>
          </el-tab-pane>
          <el-tab-pane name="running">
            <template #label>在办 <el-badge :value="stats.pending" type="warning" style="margin-left:4px" /></template>
          </el-tab-pane>
          <el-tab-pane name="todo">
            <template #label>待办 <el-badge :value="stats.todo" type="warning" style="margin-left:4px" /></template>
          </el-tab-pane>
          <el-tab-pane name="approved">
            <template #label>已通过 <el-badge :value="stats.approved" type="success" style="margin-left:4px" /></template>
          </el-tab-pane>
          <el-tab-pane name="rejected">
            <template #label>已驳回 <el-badge :value="stats.rejected" type="danger" style="margin-left:4px" /></template>
          </el-tab-pane>
          <el-tab-pane name="cancelled">
            <template #label>已撤回 <el-badge :value="stats.cancelled" type="info" style="margin-left:4px" /></template>
          </el-tab-pane>
        </el-tabs>

        <form class="ap-filter" @submit.prevent="search">
          <el-select v-model="filters.orphaned" placeholder="孤儿态" style="width:130px" clearable>
            <el-option label="仅孤儿" value="yes" />
            <el-option label="仅正常" value="no" />
          </el-select>
          <el-input v-model="filters.package" placeholder="功能包" style="width:150px" clearable @keyup.enter="search" />
          <el-input v-model="filters.flow_key" placeholder="流程 key" style="width:160px" clearable @keyup.enter="search" />
          <el-input v-model="filters.keyword" placeholder="标题 / 单据编号 / 提交人" style="width:220px" clearable @keyup.enter="search" />
          <el-date-picker v-model="dateRange" type="daterange" value-format="YYYY-MM-DD"
            start-placeholder="提交起" end-placeholder="提交止" style="width:260px" />
          <el-button native-type="submit" type="primary" :icon="Search">检索</el-button>
          <el-button :icon="RefreshLeft" @click="reset">重置</el-button>
        </form>

        <!-- DataGrid api 模式：内建分页（GET currentPage/pageSize + param 嵌套搜索参数，后端已兼容） -->
        <wd-data-grid ref="grid" api="/admin/approval_admin/rows" api-method="get" :active="true"
                      border stripe :with-index="false">
          <el-table-column prop="approval_no" label="单据编号" min-width="200">
            <template #default="{ row }">
              {{ row.approval_no }}
            </template>
          </el-table-column>
          <el-table-column prop="package" label="功能包" min-width="120">
            <template #default="{ row }">
              <span class="ap-mono">{{ row.package }}</span>
              <el-tag v-if="row.orphaned" size="small" type="warning" effect="dark" style="margin-left:4px">包已卸载</el-tag>
            </template>
          </el-table-column>
          <el-table-column v-if="showFlowCol" prop="flow_key" label="流程" min-width="150">
            <template #default="{ row }"><span class="ap-mono">{{ row.flow_key }}@v{{ row.flow_version }}</span></template>
          </el-table-column>
          <el-table-column prop="title" label="标题" min-width="180" show-overflow-tooltip />
          <el-table-column label="提交人" min-width="120">
            <template #default="{ row }">{{ row.submitter_name || row.submitter_id }}</template>
          </el-table-column>
          <el-table-column label="状态" width="100">
            <template #default="{ row }">
              <el-tag size="small" :type="statusType(row.status)">{{ statusText(row.status) }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="submitted_at" label="提交时间" width="180" />
          <el-table-column v-if="showFinishCol" prop="finished_at" label="结束时间" width="180">
            <template #default="{ row }">{{ row.finished_at || '—' }}</template>
          </el-table-column>
          <el-table-column label="操作" width="90" fixed="right">
            <template #default="{ row }">
              <wd-drawer-button size="small" type="primary" label="详情" drawer-size="80%" :url="'/admin/ApprovalAdmin/detail?no=' + row.approval_no"></wd-drawer-button>
            </template>
          </el-table-column>
          <template #empty><el-empty description="暂无审批单据" :image-size="80" /></template>
          <!-- ── 卡片模式（DataGrid modeSwitch 内建视图；统一 lh-card 结构） ── -->
          <template #card-item="{ row }">
            <div class="lh-card">
              <div class="lh-card__head">
                <div class="lh-card__title">{{ row.title || '未命名单据' }}</div>
                <div class="lh-card__tags">
                  <el-tag v-if="row.orphaned" size="small" type="warning" effect="dark">包已卸载</el-tag>
                  <el-tag size="small" :type="statusType(row.status)">{{ statusText(row.status) }}</el-tag>
                </div>
                <div class="lh-card__extra">
                  <div class="lh-card__stamp ap-mono">{{ row.approval_no }}</div>
                </div>
              </div>
              <div class="lh-card__fields">
                <div class="lh-card__field">
                  <div class="k">功能包</div>
                  <div class="v ap-mono">{{ row.package || '—' }}</div>
                </div>
                <div class="lh-card__field">
                  <div class="k">流程</div>
                  <div class="v ap-mono">{{ row.flow_key ? row.flow_key + '@v' + row.flow_version : '—' }}</div>
                </div>
                <div class="lh-card__field">
                  <div class="k">发起人</div>
                  <div class="v">{{ row.submitter_name || row.submitter_id || '—' }}</div>
                </div>
                <div class="lh-card__field">
                  <div class="k">提交时间</div>
                  <div class="v">{{ row.submitted_at || '—' }}</div>
                </div>
                <div v-if="showFinishCol" class="lh-card__field">
                  <div class="k">结束时间</div>
                  <div class="v">{{ row.finished_at || '—' }}</div>
                </div>
              </div>
              <div class="lh-card__ops">
                <wd-drawer-button size="small" type="primary" label="详情" drawer-size="80%" :url="'/admin/ApprovalAdmin/detail?no=' + row.approval_no"></wd-drawer-button>
              </div>
            </div>
          </template>
        </wd-data-grid>
      </wd-panel>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script src="/static/linhub/auth-guard.js?v=2"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive, computed } = Vue;
    const { Search, RefreshLeft } = window.ElementPlusIconsVue || {};

    const STATUS_TEXT = { pending: '在办', approved: '已通过', rejected: '已驳回', cancelled: '已撤回' };
    const STATUS_TYPE = { pending: 'warning', approved: 'success', rejected: 'danger', cancelled: 'info' };

    const app = Vue.createApp({
      template: '#ap-index-tpl',
      setup() {
        const grid = ref(null);
        const dateRange = ref([]);
        const activeTab = ref('all');
        const filters = reactive({ orphaned: '', package: '', flow_key: '', keyword: '' });
        const stats = reactive({ total: 0, pending: 0, todo: 0, approved: 0, rejected: 0, cancelled: 0 });

        // 列随页签数据特征显隐：在办/待办无结束时间；已完结（已通过/已驳回/已撤回）无进行中流程
        const showFinishCol = computed(() => !['running', 'todo'].includes(activeTab.value));
        const showFlowCol = computed(() => !['approved', 'rejected', 'cancelled'].includes(activeTab.value));

        function statusText(s) { return STATUS_TEXT[s] || s || '—'; }
        function statusType(s) { return STATUS_TYPE[s] || 'info'; }

        // 统计卡独立拉取（rows 已收敛为 DataGrid 内建分页，列表数据由 grid 自管）
        async function loadStats() {
          const res = await WD.request.get('/admin/approval_admin/stats');
          if (!res.success) return;
          const st = res.data || {};
          stats.total = st.total || 0;
          stats.pending = st.pending || 0;
          stats.todo = st.todo || 0;
          stats.approved = st.approved || 0;
          stats.rejected = st.rejected || 0;
          stats.cancelled = st.cancelled || 0;
        }

        function searchParams() {
          const range = dateRange.value || [];
          return {
            state: activeTab.value,
            orphaned: filters.orphaned,
            package: filters.package,
            flow_key: filters.flow_key,
            keyword: filters.keyword,
            date_from: range[0] || '',
            date_to: range[1] || ''
          };
        }

        function search() {
          grid.value && grid.value.search(searchParams());
          loadStats();
        }

        function reset() {
          activeTab.value = 'all';
          filters.orphaned = ''; filters.package = '';
          filters.flow_key = ''; filters.keyword = ''; dateRange.value = [];
          grid.value && grid.value.reset();
          loadStats();
        }

        loadStats();

        return {
          grid, activeTab, filters, dateRange, stats,
          showFinishCol, showFlowCol,
          search, reset, statusText, statusType,
          Search, RefreshLeft
        };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
