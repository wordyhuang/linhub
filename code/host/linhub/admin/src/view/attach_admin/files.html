<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>附件文件管理器 - LinHub 林枢</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .af-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .af-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .af-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .af-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .af-pager { display: flex; justify-content: flex-end; margin-top: 12px; }
    .af-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid var(--el-border-color-lighter, #ebeef5); }
    .af-json { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.6; }
    .af-hint { margin-left: 10px; font-size: 12px; color: var(--el-text-color-secondary, #909399); }
    .af-up-list { width: 100%; max-height: 220px; overflow-y: auto; border: 1px solid var(--el-border-color-lighter, #ebeef5); border-radius: 4px; padding: 6px 10px; box-sizing: border-box; }
    .af-up-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--el-border-color-lighter, #ebeef5); }
    .af-up-item:last-child { border-bottom: none; }
    .af-up-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .af-up-size { font-size: 12px; color: var(--el-text-color-secondary, #909399); white-space: nowrap; }
    .af-up-status { white-space: nowrap; }
    .af-up-err { flex-basis: 100%; font-size: 12px; color: var(--el-color-danger, #f56c6c); margin: 0 0 2px; }

    /* ===== Windows 文件浏览器「大图标」模式（AT-10）===== */
    /* 卡片容器：自适应换行平铺，贴近资源管理器图标视图 */
    .af-explorer .wd-datagrid__cards {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 6px;
      padding: 12px;
      background: var(--el-bg-color, #fff);
    }
    /* 单个磁贴：固定宽度、透明无边框，hover/选中时整格浅蓝底（Windows 风格）*/
    .af-explorer .wd-datagrid__card {
      flex: 0 0 104px;
      width: 104px;
      height: 138px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 3px;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }
    .af-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 8px 6px 6px;
      box-sizing: border-box;
      border-radius: 3px;
      cursor: default;
      user-select: none;
    }
    .af-explorer .wd-datagrid__card:hover .af-tile { background: #e8f1fb; }
    .af-tile.is-selected { background: #cfe4f9; }
    .af-explorer .wd-datagrid__card:hover .af-tile.is-selected { background: #c2dcf7; }
    /* 图标区：64px 缩略图 / 文件类型图标 */
    .af-tile-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin-bottom: 6px;
    }
    .af-tile-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--el-border-color-lighter, #ebeef5);
      background: #fff;
    }
    .af-tile-doc { font-size: 56px; color: #b6bcc4; }
    /* 文件名：居中、最多两行省略 */
    .af-tile-name {
      width: 100%;
      font-size: 12px;
      line-height: 18px;
      text-align: center;
      color: var(--el-text-color-primary, #303133);
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* hover/选中时文件名下方浮现操作，占位保留避免跳动 */
    .af-tile-ops {
      display: flex;
      justify-content: center;
      gap: 2px;
      height: 22px;
      margin-top: 2px;
      opacity: 0;
    }
    .af-explorer .wd-datagrid__card:hover .af-tile-ops,
    .af-tile.is-selected .af-tile-ops { opacity: 1; }
    .af-tile-ops .el-button {
      margin-left: 0;
      padding: 2px;
      height: 20px;
      font-size: 12px;
    }
    /* 已删文件：图标灰显 */
    .af-tile.is-deleted { opacity: .55; }
    .af-tile.is-deleted .af-tile-name { color: var(--el-text-color-secondary, #909399); }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="af-tpl">
    <div class="af-page">
      <wd-panel :border="true">
        <wd-tips type="box" style="margin-bottom:12px">
          附件托管服务（AT-10）文件管理器：查看平台托管的全部附件元数据与状态，可上传、预览、下载或删除（删除后元数据置为已删，存储对象尽力清理）。
        </wd-tips>

        <!-- 用量概览 -->
        <div class="af-stats">
          <el-tag effect="plain">总记录 {{ stats.total }}</el-tag>
          <el-tag type="success" effect="plain">有效 {{ stats.active }}</el-tag>
          <el-tag type="warning" effect="plain">公开 {{ stats.public }}</el-tag>
          <el-tag type="info" effect="plain">占用 {{ bytes(stats.bytes) }}</el-tag>
          <el-tag type="info" effect="plain">驱动 {{ stats.driver || '-' }}</el-tag>
        </div>

        <!-- 筛选 -->
        <form class="af-filter" @submit.prevent="search">
          <el-input v-model="filters.keyword" placeholder="文件名 / Token / 上传者" style="width:220px" clearable @keyup.enter="search" />
          <el-input v-model="filters.owner_pkg" placeholder="归属功能包" style="width:150px" clearable @keyup.enter="search" />
          <el-input v-model="filters.uploader_id" placeholder="上传者 ID" style="width:150px" clearable @keyup.enter="search" />
          <el-select v-model="filters.status" placeholder="状态" style="width:110px" clearable>
            <el-option label="有效 active" value="active" />
            <el-option label="已删 deleted" value="deleted" />
          </el-select>
          <el-select v-model="filters.is_public" placeholder="公开性" style="width:110px" clearable>
            <el-option label="公开" value="1" />
            <el-option label="私有" value="0" />
          </el-select>
          <el-button native-type="submit" type="primary" :icon="Search" :loading="loading">检索</el-button>
          <el-button :icon="RefreshLeft" @click="reset">重置</el-button>
          <el-button type="success" :icon="Upload" @click="openUpload">上传附件</el-button>
        </form>

        <wd-data-grid
          ref="gridRef"
          class="af-explorer"
          :data-source="rows"
          border stripe
          :with-index="false"
          :with-pager="false"
          mode-switch
          :tools="{ refresh: true, size: false }"
          v-loading="loading">
          <el-table-column label="预览" width="72">
            <template #default="{ row }">
              <img v-if="row.is_image && row.status === 'active'" class="af-thumb" :src="row.url" :alt="row.origin_name" />
              <el-icon v-else style="font-size:26px;color:#c0c4cc;margin-top:8px"><Document /></el-icon>
            </template>
          </el-table-column>
          <el-table-column prop="origin_name" label="文件名" min-width="160" show-overflow-tooltip />
          <el-table-column label="Token" min-width="180">
            <template #default="{ row }"><span class="af-mono">{{ row.token }}</span></template>
          </el-table-column>
          <el-table-column prop="owner_pkg" label="归属包" width="110">
            <template #default="{ row }"><span class="af-mono">{{ row.owner_pkg || '—' }}</span></template>
          </el-table-column>
          <el-table-column label="上传者" width="130">
            <template #default="{ row }">{{ row.uploader_name || row.uploader_id || '—' }}</template>
          </el-table-column>
          <el-table-column label="大小" width="90">
            <template #default="{ row }">{{ bytes(row.size) }}</template>
          </el-table-column>
          <el-table-column label="公开" width="76">
            <template #default="{ row }">
              <el-tag size="small" :type="row.is_public ? 'success' : 'info'">{{ row.is_public ? '公开' : '私有' }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column label="状态" width="86">
            <template #default="{ row }">
              <el-tag size="small" :type="row.status === 'active' ? 'success' : 'danger'" effect="light">{{ row.status }}</el-tag>
            </template>
          </el-table-column>
          <el-table-column prop="created_at" label="上传时间" width="190" />
          <el-table-column label="操作" width="170" fixed="right">
            <template #default="{ row }">
              <el-button size="small" text type="primary" @click="openMeta(row)">元数据</el-button>
              <el-button size="small" text type="primary" :disabled="row.status !== 'active'" @click="download(row)">下载</el-button>
              <el-button size="small" text type="danger" :disabled="row.status !== 'active'" @click="remove(row)">删除</el-button>
            </template>
          </el-table-column>
          <template #empty><el-empty description="暂无匹配的附件" :image-size="80" /></template>
          <!-- list 模式：Windows 文件浏览器「大图标」磁贴 -->
          <template #card-item="{ row }">
            <div
              class="af-tile"
              :class="{ 'is-selected': selectedToken === row.token, 'is-deleted': row.status !== 'active' }"
              :title="tileTitle(row)"
              @click="selectedToken = row.token"
              @dblclick="row.status === 'active' && download(row)">
              <div class="af-tile-icon">
                <img v-if="row.is_image && row.status === 'active'" class="af-tile-thumb" :src="row.url" :alt="row.origin_name" />
                <el-icon v-else class="af-tile-doc"><Document /></el-icon>
              </div>
              <div class="af-tile-name">{{ row.origin_name }}</div>
              <div class="af-tile-ops">
                <el-button size="small" text type="primary" title="元数据" @click.stop="openMeta(row)"><el-icon><InfoFilled /></el-icon></el-button>
                <el-button size="small" text type="primary" title="下载" :disabled="row.status !== 'active'" @click.stop="download(row)"><el-icon><Download /></el-icon></el-button>
                <el-button size="small" text type="danger" title="删除" :disabled="row.status !== 'active'" @click.stop="remove(row)"><el-icon><Delete /></el-icon></el-button>
              </div>
            </div>
          </template>
        </wd-data-grid>

        <div class="af-pager">
          <el-pagination
            v-model:current-page="page" v-model:page-size="size"
            :total="total" :page-sizes="[20, 50, 100]"
            layout="total, sizes, prev, pager, next, jumper"
            @current-change="load" @size-change="onSizeChange" />
        </div>
      </wd-panel>

      <!-- 元数据抽屉 -->
      <el-drawer v-model="metaVisible" title="附件元数据" size="42%">
        <el-descriptions :column="1" border>
          <el-descriptions-item label="Token"><span class="af-mono">{{ meta.token }}</span></el-descriptions-item>
          <el-descriptions-item label="原始文件名">{{ meta.origin_name }}</el-descriptions-item>
          <el-descriptions-item label="归属功能包"><span class="af-mono">{{ meta.owner_pkg || '—' }}</span></el-descriptions-item>
          <el-descriptions-item label="上传者">{{ meta.uploader_name || '—' }}（<span class="af-mono">{{ meta.uploader_id }}</span>）</el-descriptions-item>
          <el-descriptions-item label="存储驱动">{{ meta.driver }}</el-descriptions-item>
          <el-descriptions-item label="存储路径"><span class="af-mono" style="word-break:break-all">{{ meta.storage_path }}</span></el-descriptions-item>
          <el-descriptions-item label="MIME"><span class="af-mono">{{ meta.mime }}</span></el-descriptions-item>
          <el-descriptions-item label="扩展名">{{ meta.ext || '—' }}</el-descriptions-item>
          <el-descriptions-item label="大小">{{ bytes(meta.size) }}（{{ meta.size }} B）</el-descriptions-item>
          <el-descriptions-item label="是否图片">{{ meta.is_image ? '是' : '否' }}</el-descriptions-item>
          <el-descriptions-item label="公开性">{{ meta.is_public ? '公开（免鉴权）' : '私有（管理员/上传者）' }}</el-descriptions-item>
          <el-descriptions-item label="状态">{{ meta.status }}</el-descriptions-item>
          <el-descriptions-item label="过期时间">{{ meta.expire_at || '永不过期' }}</el-descriptions-item>
          <el-descriptions-item label="创建时间">{{ meta.created_at }}</el-descriptions-item>
          <el-descriptions-item label="更新时间">{{ meta.updated_at }}</el-descriptions-item>
          <el-descriptions-item label="访问 URL">
            <span class="af-mono" style="word-break:break-all">{{ meta.url }}</span>
          </el-descriptions-item>
        </el-descriptions>
      </el-drawer>

      <!-- 上传附件弹窗 -->
      <el-dialog v-model="uploadVisible" title="上传附件" width="560px" @closed="onUploadClosed">
        <el-form label-width="96px">
          <el-form-item label="归属功能包">
            <el-input v-model="uploadForm.owner_pkg" placeholder="默认 admin" maxlength="32" style="width:200px" />
          </el-form-item>
          <el-form-item label="公开性">
            <el-switch v-model="uploadForm.is_public" active-text="公开（免鉴权）" inactive-text="私有" />
          </el-form-item>
          <el-form-item label="有效期（天）">
            <el-input-number v-model="uploadForm.expire_days" :min="0" :max="3650" />
            <span class="af-hint">0 表示永不过期</span>
          </el-form-item>
          <el-form-item label="选择文件">
            <el-upload
              ref="uploadRef"
              drag
              multiple
              :auto-upload="false"
              :show-file-list="false"
              :on-change="onFileChange"
              action="">
              <el-icon class="el-icon--upload"><UploadFilled /></el-icon>
              <div class="el-upload__text">拖拽文件到此处，或<em>点击选择</em>（可多选）</div>
            </el-upload>
          </el-form-item>
          <el-form-item v-if="uploadFiles.length" label="待传文件">
            <div class="af-up-list">
              <div v-for="f in uploadFiles" :key="f.uid" class="af-up-item">
                <span class="af-up-name" :title="f.name">{{ f.name }}</span>
                <span class="af-up-size">{{ bytes(f.size) }}</span>
                <el-tag size="small" :type="upTagType(f.status)" class="af-up-status">{{ upStatusText(f.status) }}</el-tag>
                <el-button v-if="f.status === 'fail'" size="small" text type="primary" @click="retryFile(f)">重试</el-button>
                <el-button size="small" text type="danger" :disabled="f.status === 'doing'" @click="removeFile(f)">移除</el-button>
                <div v-if="f.status === 'fail' && f.error" class="af-up-err">{{ f.error }}</div>
              </div>
            </div>
          </el-form-item>
        </el-form>
        <p class="af-hint">文件大小与类型受服务端 ATTACH_MAX_SIZE / ATTACH_ALLOW_TYPES 约束；上传人为当前管理员。</p>
        <template #footer>
          <el-button @click="uploadVisible = false">关闭</el-button>
          <el-button type="primary" :icon="Upload" :loading="uploading" :disabled="!pendingCount" @click="submitUpload">
            {{ uploading ? '上传中…' : '开始上传' }}
          </el-button>
        </template>
      </el-dialog>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, reactive, computed, onMounted, nextTick } = Vue;

    const app = Vue.createApp({
      template: '#af-tpl',
      setup() {
        const Search = Icons.Search;
        const RefreshLeft = Icons.RefreshLeft;
        const Upload = Icons.Upload;
        const loading = ref(false);
        const rows = ref([]);
        const total = ref(0);
        const page = ref(1);
        const size = ref(20);
        const filters = reactive({ keyword: '', owner_pkg: '', uploader_id: '', status: '', is_public: '' });
        const stats = reactive({ total: 0, active: 0, public: 0, bytes: 0, driver: '' });
        const metaVisible = ref(false);
        const meta = reactive({});
        // 组件内部以 table/card 区分模式，card 即 Windows 大图标模式
        const gridRef = ref(null);
        const selectedToken = ref('');
        const switched = ref(false);

        // ===== 管理员上传附件 =====
        const uploadVisible = ref(false);
        const uploading = ref(false);
        const uploadRef = ref(null);
        const uploadForm = reactive({ owner_pkg: 'admin', is_public: false, expire_days: 0 });
        // 每项：{ uid, file, name, size, status: pending|doing|success|fail, error }
        const uploadFiles = ref([]);
        const pendingCount = computed(() =>
          uploadFiles.value.filter(f => f.status === 'pending' || f.status === 'fail').length
        );

        function openUpload() {
          uploadVisible.value = true;
        }

        // el-upload 选择/追加文件（自动上传已关，仅收集进本地列表）
        function onFileChange(uploadFile) {
          if (!uploadFile || !uploadFile.uid) return;
          if (!uploadFiles.value.some(f => f.uid === uploadFile.uid)) {
            uploadFiles.value.push({
              uid: uploadFile.uid,
              file: uploadFile.raw,
              name: uploadFile.name,
              size: uploadFile.size || (uploadFile.raw ? uploadFile.raw.size : 0),
              status: 'pending',
              error: ''
            });
          }
        }

        function removeFile(item) {
          uploadFiles.value = uploadFiles.value.filter(f => f.uid !== item.uid);
        }

        function retryFile(item) {
          item.status = 'pending';
          item.error = '';
        }

        function onUploadClosed() {
          uploadFiles.value = [];
          uploadForm.owner_pkg = 'admin';
          uploadForm.is_public = false;
          uploadForm.expire_days = 0;
          if (uploadRef.value && uploadRef.value.clearFiles) uploadRef.value.clearFiles();
        }

        function upStatusText(status) {
          return { pending: '待上传', doing: '上传中', success: '成功', fail: '失败' }[status] || status;
        }
        function upTagType(status) {
          return { pending: 'info', doing: 'warning', success: 'success', fail: 'danger' }[status] || 'info';
        }

        async function uploadOne(item) {
          item.status = 'doing';
          item.error = '';
          const fd = new FormData();
          fd.append('file', item.file);
          fd.append('owner_pkg', uploadForm.owner_pkg.trim() || 'admin');
          fd.append('is_public', uploadForm.is_public ? '1' : '0');
          fd.append('expire_days', String(uploadForm.expire_days || 0));
          try {
            const resp = await fetch('/admin/attach_admin/upload', {
              method: 'POST', body: fd, credentials: 'same-origin'
            });
            const json = await resp.json();
            if (json.code === 0) {
              item.status = 'success';
            } else {
              item.status = 'fail';
              item.error = json.message || '上传失败';
            }
          } catch (e) {
            item.status = 'fail';
            item.error = '上传请求失败：' + (e && e.message ? e.message : '网络错误');
          }
        }

        // 逐个串行上传 pending/失败项，全部结束后刷新列表并提示结果
        async function submitUpload() {
          const ownerPkg = uploadForm.owner_pkg.trim();
          if (ownerPkg && !/^[a-zA-Z0-9_-]{1,32}$/.test(ownerPkg)) {
            ElementPlus.ElMessage.error('归属功能包仅支持 1-32 位字母、数字、下划线或短横线');
            return;
          }
          uploading.value = true;
          try {
            for (const item of uploadFiles.value) {
              if (item.status === 'pending' || item.status === 'fail') {
                await uploadOne(item);
              }
            }
          } finally {
            uploading.value = false;
          }
          const ok = uploadFiles.value.filter(f => f.status === 'success').length;
          const fail = uploadFiles.value.filter(f => f.status === 'fail').length;
          if (fail === 0) {
            ElementPlus.ElMessage.success('全部上传成功（' + ok + ' 个）');
            uploadVisible.value = false;
            page.value = 1;
            load();
          } else {
            ElementPlus.ElMessage.warning('成功 ' + ok + ' 个，失败 ' + fail + ' 个，可对失败项重试或移除');
            load();
          }
        }

        // 组件无“初始模式”prop：挂载后程序化触发一次其自带的模式切换按钮，
        // 从默认 table 切到 card（大图标），保持与手动点击完全一致的内部状态
        async function switchToList() {
          if (switched.value) return;
          await nextTick();
          const root = gridRef.value && gridRef.value.$el;
          // 工具栏右侧仅 refresh + 模式切换（size 已关），切换按钮恒为最后一个
          const btn = root && root.querySelector('.wd-datagrid__toolbar-right .el-button:last-of-type');
          if (btn) {
            btn.click();
            switched.value = true;
          }
        }

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        async function load() {
          loading.value = true;
          try {
            const res = await WD.request.get('/admin/attach_admin/rows' + qs({
              ...filters, page: page.value, size: size.value
            }));
            if (!res.success) {
              ElementPlus.ElMessage.error(res.message || '加载失败');
              return;
            }
            rows.value = res.data.list || [];
            total.value = res.data.total || 0;
            Object.assign(stats, res.data.stats || {});
          } finally {
            loading.value = false;
          }
        }

        function search() { page.value = 1; load(); }
        function reset() {
          Object.keys(filters).forEach(k => filters[k] = '');
          page.value = 1; load();
        }
        function onSizeChange() { page.value = 1; load(); }

        function bytes(n) {
          n = Number(n) || 0;
          if (n < 1024) return n + ' B';
          if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
          if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + ' MB';
          return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        // 磁贴原生 tooltip：图标模式不展示列信息，完整元数据收进悬浮提示
        function tileTitle(row) {
          return [
            row.origin_name,
            '归属包：' + (row.owner_pkg || '—'),
            '上传者：' + (row.uploader_name || row.uploader_id || '—'),
            '大小：' + bytes(row.size),
            (row.is_public ? '公开' : '私有') + ' / ' + row.status,
            '上传时间：' + row.created_at,
            '双击' + (row.status === 'active' ? '下载' : '（已删不可用）')
          ].join('\n');
        }

        function openMeta(row) {
          Object.keys(meta).forEach(k => delete meta[k]);
          Object.assign(meta, row);
          metaVisible.value = true;
        }
        function download(row) {
          window.open(row.url, '_blank');
        }
        async function remove(row) {
          try {
            await ElementPlus.ElMessageBox.confirm(
              '确认删除附件「' + row.origin_name + '」？存储对象将尽力清理，元数据置为已删。',
              '删除确认', { confirmButtonText: '删除', cancelButtonText: '取消', type: 'warning' }
            );
          } catch (e) { return; }
          const res = await WD.request.post('/admin/attach_admin/delete', { token: row.token });
          ElementPlus.ElMessage[res.success ? 'success' : 'error'](res.message || (res.success ? '已删除' : '删除失败'));
          if (res.success) load();
        }

        onMounted(() => {
          // 组件挂载后工具栏按钮就绪，切到大图标（card）模式；数据返回后再兜底一次
          switchToList();
          setTimeout(switchToList, 300);
        });

        load();
        return {
          loading, rows, total, page, size, filters, stats, metaVisible, meta,
          gridRef, selectedToken,
          load, search, reset, onSizeChange, bytes, tileTitle, openMeta, download, remove,
          uploadVisible, uploading, uploadRef, uploadForm, uploadFiles, pendingCount,
          openUpload, onFileChange, removeFile, retryFile, onUploadClosed,
          upStatusText, upTagType, submitUpload,
          Search, RefreshLeft, Upload
        };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
