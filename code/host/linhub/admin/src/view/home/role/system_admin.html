<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{$roleLabel}首页 - {:htmlspecialchars($siteName)}</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--wd-bg-color, #f5f7fa);
      color: var(--wd-text-color, #1f2937);
    }

    .home {
      padding: 24px;
      max-width: 1320px;
      margin: 0 auto;
    }

    /* —— 顶部欢迎区 —— */
    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      /* hero 背景随皮肤主题变化：主色取 --wd-color-primary（切肤时由 workdesktop-ai 注入主题样式），深/浅两端用 color-mix 派生 */
      background: linear-gradient(135deg,
        color-mix(in srgb, var(--wd-color-primary, #0066CC) 60%, #000) 0%,
        var(--wd-color-primary, #0066CC) 60%,
        color-mix(in srgb, var(--wd-color-primary, #0066CC) 70%, #fff) 100%);
      color: #fff;
      border-radius: 16px;
      padding: 26px 28px;
      margin-bottom: 20px;
      box-shadow: 0 10px 24px color-mix(in srgb, var(--wd-color-primary, #0066CC) 18%, transparent);
    }

    .hero::after {
      content: '';
      position: absolute;
      right: -40px;
      top: -70px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .08);
      pointer-events: none;
    }

    .hero-main {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .hero img {
      width: 52px;
      height: 52px;
      flex: none;
    }

    .hero-text h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
    }

    .hero-text p {
      margin: 0;
      font-size: 14px;
      line-height: 1.6;
      opacity: .9;
      max-width: 640px;
    }

    .hero-side {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      flex: none;
    }

    .role-tag {
      font-size: 13px;
      font-weight: 600;
      background: rgba(255, 255, 255, .18);
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .hero-clock {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .hero-date {
      font-size: 12px;
      opacity: .85;
    }

    .hero-time {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: .5px;
      line-height: 1.2;
    }

    /* —— 主体两栏布局 —— */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 20px;
      align-items: start;
    }

    .col-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .col-side {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 4px 0 12px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
    }

    .section-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-count {
      font-size: 12px;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    /* 右侧信息面板：容器统一用 wd-panel mode="card"，不再自绘 div 卡片 */

    /* 我的账号 */
    .account-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .uavatar {
      background: rgba(0, 102, 204, .1);
      color: #0066CC;
      flex: none;
    }

    .acc-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
      word-break: break-all;
    }

    .acc-role {
      font-size: 12px;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    .meta-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px dashed #eef1f5;
      padding-top: 12px;
      margin-bottom: 14px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .meta-row .k {
      color: var(--wd-text-color-secondary, #6b7280);
      flex: none;
    }

    .meta-row .v {
      font-weight: 500;
      text-align: right;
      word-break: break-all;
    }

    .uactions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 使用提示 */
    .tips-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tips-list li {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: #4b5563;
      line-height: 1.6;
    }

    .tips-list .dot {
      flex: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #0066CC;
      margin-top: 7px;
    }

    /* 审批统计卡（服务设置开启「工作台统计」后显示）：容器为 wd-panel mode="card" */
    .ap-panel {
      margin-bottom: 20px;
    }

    .ap-stats-items {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .ap-stat {
      text-align: center;
      padding: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s ease;
    }

    .ap-stat:hover {
      background: rgba(0, 102, 204, .06);
    }

    .ap-stat .ap-num {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .ap-num-todo { color: #E6A23C; }
    .ap-num-done { color: #909399; }
    .ap-num-approved { color: #67C23A; }
    .ap-num-rejected { color: #F56C6C; }

    .ap-stat .ap-lbl {
      font-size: 12px;
      color: var(--wd-text-color-secondary, #6b7280);
      margin-top: 2px;
    }

    .perm-summary {
      font-size: 13px;
      color: var(--wd-text-color-secondary, #6b7280);
      margin-bottom: 10px;
    }

    .perm-code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      color: #0066CC;
    }

    /* —— 最近操作：容器为 wd-panel mode="card" —— */
    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 2px;
      border-bottom: 1px dashed #f1f3f5;
      font-size: 13px;
    }

    .recent-item:last-child {
      border-bottom: 0;
    }

    .recent-time {
      color: #9ca3af;
      font-size: 12px;
      flex: none;
      font-variant-numeric: tabular-nums;
    }

    .recent-op {
      flex: none;
      color: #0066CC;
      background: rgba(0, 102, 204, .08);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-msg {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    .recent-action {
      flex: none;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      color: #0066CC;
      background: rgba(0, 102, 204, .08);
      padding: 2px 8px;
      border-radius: 6px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-recent {
      text-align: center;
      padding: 22px 0;
      color: #9ca3af;
      font-size: 13px;
    }

    /* 平台信息 */
    .plat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      padding: 8px 0;
      border-bottom: 1px dashed #f1f3f5;
    }

    .plat-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .plat-row .k {
      color: var(--wd-text-color-secondary, #6b7280);
      flex: none;
    }

    .plat-row .v {
      font-variant-numeric: tabular-nums;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* —— 功能入口卡片：横向卡（图标左 / 文案右） —— */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .entry {
      text-decoration: none;
      color: inherit;
    }

    .entry .el-card {
      transition: transform .15s ease, box-shadow .15s ease;
      cursor: pointer;
    }

    .entry:hover .el-card {
      transform: translateY(-2px);
    }

    .entry .el-card__body {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }

    .entry .ico {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(0, 102, 204, .1);
      color: #0066CC;
    }

    .entry .etext {
      min-width: 0;
    }

    .entry h3 {
      margin: 0 0 4px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .entry p {
      margin: 0;
      font-size: 12px;
      color: var(--wd-text-color-secondary, #6b7280);
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 0;
      color: var(--wd-text-color-secondary, #6b7280);
      font-size: 14px;
    }

    /* 工作台插入锚点（功能包插槽）：卡片容器统一 wd-panel mode="card" */
    .slot-zone {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .slot-zone-top {
      margin-bottom: 20px;
    }

    .slot-zone-bottom {
      margin-top: 20px;
    }

    .slot-frame {
      width: 100%;
      height: 180px;
      border: 0;
      display: block;
      background: #fafafa;
    }

    /* 定制抽屉：已选入口拖拽排序 */
    .pick-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      cursor: move;
      user-select: none;
    }

    .pick-item.dragging {
      opacity: .5;
      border-style: dashed;
    }

    .pick-item .handle {
      color: #9ca3af;
      cursor: grab;
      font-size: 16px;
    }

    .pick-item .pico {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      background: rgba(0, 102, 204, .1);
      color: #0066CC;
    }

    .pick-item .pname {
      flex: 1;
      font-size: 14px;
    }

    .pick-item .pkg {
      font-size: 12px;
      color: #0066CC;
    }

    .avail-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fff;
    }

    .avail-item .pico {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: rgba(0, 102, 204, .1);
      color: #0066CC;
    }

    .avail-item .pname {
      flex: 1;
      font-size: 14px;
    }

    .drawer-sub {
      font-size: 13px;
      font-weight: 600;
      margin: 16px 0 8px;
      color: #374151;
    }

    .drawer-hint {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .perm-search {
      margin-bottom: 10px;
    }

    .perm-group-name {
      font-weight: 600;
    }

    .perm-group-desc {
      font-size: 12px;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    /* —— 响应式：窄屏收敛为单栏 —— */
    @media (max-width: 1024px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .col-side {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        align-items: start;
      }

      .ap-stats-items {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .home {
        padding: 16px;
      }

      .hero {
        flex-direction: column;
        align-items: flex-start;
      }

      .hero-side {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }

      .hero-time {
        font-size: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .col-side {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="home"></div>

  <script type="text/x-template" id="system-admin-tpl">
  <div class="hero">
    <div class="hero-main">
      <img src="/brand/mark.svg" alt="林枢">
      <div class="hero-text">
        <h1>{{ greet }}，{{ name }}</h1>
        <p>今天是 {{ todayText }} · 负责系统运行与平台配置，统筹用户、角色、权限、审计与运维保障。</p>
      </div>
    </div>
    <div class="hero-side">
      <span class="role-tag">{{ roleLabel }}</span>
      <div class="hero-clock">
        <div class="hero-date">实时时钟</div>
        <div class="hero-time">{{ clockText }}</div>
      </div>
    </div>
  </div>

  <div class="layout">
    <!-- 左侧主区：插槽 → 我的审批 → 功能入口 → 最近操作 → 插槽 -->
    <div class="col-main">
      <div v-if="zones['home.top'].length" class="slot-zone slot-zone-top">
        <wd-panel v-for="s in zones['home.top']" :key="s.id" :title="s.title" :border="true" mode="card">
          <iframe
            :src="s.render"
            class="slot-frame"
            loading="lazy"
            @load="onSlotFrameLoad($event, s.id)"
          ></iframe>
        </wd-panel>
      </div>

      <wd-panel v-if="apStats" title="我的审批" description="点击各项打开审批工作台对应页签" description-align="right" :border="true" mode="card" class="ap-panel">
        <div class="ap-stats-items">
          <div class="ap-stat" @click="openApprovalTab('todo')">
            <div class="ap-num ap-num-todo">{{ fmt(apStats.todo) }}</div>
            <div class="ap-lbl">待办</div>
          </div>
          <div class="ap-stat" @click="openApprovalTab('done')">
            <div class="ap-num ap-num-done">{{ fmt(apStats.handled) }}</div>
            <div class="ap-lbl">已办</div>
          </div>
          <div class="ap-stat" @click="openApprovalTab('approved')">
            <div class="ap-num ap-num-approved">{{ fmt(apStats.approved) }}</div>
            <div class="ap-lbl">已同意</div>
          </div>
          <div class="ap-stat" @click="openApprovalTab('rejected')">
            <div class="ap-num ap-num-rejected">{{ fmt(apStats.rejected) }}</div>
            <div class="ap-lbl">已驳回</div>
          </div>
        </div>
      </wd-panel>

      <div class="section-head">
        <span class="section-title">我的功能入口</span>
        <div class="section-actions">
          <span class="section-count">共 {{ entries.length }} 个入口</span>
          <el-button size="small" :icon="Setting" @click="openCustom">定制</el-button>
        </div>
      </div>

      <div class="grid">
        <div class="entry" v-for="m in entries" :key="m.id" @click="openTab(m.path, m.title)">
          <el-card shadow="hover">
            <div class="ico"><el-icon><component :is="iconOf(m.icon)" /></el-icon></div>
            <div class="etext">
              <h3>{{ m.title }}</h3>
              <p>{{ isPkg(m) ? '来自功能包「' + m.short + '」的功能入口。' : '平台内置功能入口。' }}</p>
            </div>
          </el-card>
        </div>
        <div v-if="entries.length === 0" class="empty">
          暂无功能入口，点击上方「定制」添加。
        </div>
      </div>

      <wd-panel v-if="statsReady" title="最近操作" description="平台操作留痕 · 最新 8 条" description-align="right" :border="true" mode="card">
        <div class="recent-list">
          <div v-for="(r, i) in stats.recent" :key="i" class="recent-item">
            <span class="recent-time">{{ r.time }}</span>
            <span class="recent-op" :title="r.operator">{{ r.operator || '系统' }}</span>
            <span class="recent-action">{{ r.action || '—' }}</span>
            <span class="recent-msg" :title="r.target">{{ r.target || '—' }}</span>
          </div>
          <div v-if="stats.recent.length === 0" class="empty-recent">暂无操作留痕</div>
        </div>
      </wd-panel>

      <div v-if="zones['home.bottom'].length" class="slot-zone slot-zone-bottom">
        <wd-panel v-for="s in zones['home.bottom']" :key="s.id" :title="s.title" :border="true" mode="card">
          <iframe
            :src="s.render"
            class="slot-frame"
            loading="lazy"
            @load="onSlotFrameLoad($event, s.id)"
          ></iframe>
        </wd-panel>
      </div>
    </div>

    <!-- 右侧信息区：账号 → 右侧插入点 → 平台信息 → 使用提示 -->
    <aside class="col-side">
      <wd-panel title="我的账号" description="个人信息" description-align="right" :border="true" mode="card">
        <div class="account-top">
          <el-avatar :size="44" class="uavatar">
            <el-icon :size="22"><UserFilled /></el-icon>
          </el-avatar>
          <div class="udesc">
            <div class="acc-name">{{ name }}</div>
            <div class="acc-role">{{ roleLabel }}</div>
          </div>
        </div>
        <div class="meta-list">
          <div class="meta-row">
            <span class="k">登录账号</span>
            <span class="v">{{ userId }}</span>
          </div>
          <div class="meta-row">
            <span class="k">角色</span>
            <span class="v">{{ roleLabel }}</span>
          </div>
        </div>
        <div class="uactions">
          <el-button size="small" :icon="Key" style="width: 100%;" @click="openPerms">查看权限</el-button>
          <wd-drawer-button size="small" :icon="Edit" label="修改资料" title="修改用户信息" mode="dialog" drawer-size="420px" @open="openProfile">
            <el-form label-width="72px" @submit.prevent>
              <el-form-item label="账号">
                <el-input :model-value="userId" disabled />
              </el-form-item>
              <el-form-item label="显示名称">
                <el-input v-model="profileName" maxlength="30" show-word-limit placeholder="请输入显示名称" />
              </el-form-item>
            </el-form>
            <template #footer="f">
              <el-button @click="f.close">取消</el-button>
              <el-button type="primary" :loading="saving" @click="saveProfile(f)">保存</el-button>
            </template>
          </wd-drawer-button>
        </div>
      </wd-panel>

      <div v-if="zones['home.right'].length" class="slot-zone">
        <wd-panel v-for="s in zones['home.right']" :key="s.id" :title="s.title" :border="true" mode="card">
          <iframe
            :src="s.render"
            class="slot-frame"
            loading="lazy"
            @load="onSlotFrameLoad($event, s.id)"
          ></iframe>
        </wd-panel>
      </div>

      <wd-panel title="平台信息" description="只读" description-align="right" :border="true" mode="card">
        <div class="plat-row"><span class="k">PHP 版本</span><span class="v">{{ stats.platform.php || '—' }}</span></div>
        <div class="plat-row"><span class="k">操作系统</span><span class="v">{{ stats.platform.os || '—' }}</span></div>
        <div class="plat-row"><span class="k">服务器时间</span><span class="v">{{ stats.platform.time || '—' }}</span></div>
        <div class="plat-row"><span class="k">功能入口</span><span class="v">{{ fmt(entries.length) }} 个</span></div>
        <div class="plat-row"><span class="k">首页插槽</span><span class="v">{{ fmt(slotsCount) }} 个</span></div>
      </wd-panel>

      <wd-panel title="使用提示" :border="true" mode="card">
        <ul class="tips-list">
          <li><span class="dot"></span><span>「最近操作」汇总平台最新操作留痕，可快速了解近期平台动态。</span></li>
          <li><span class="dot"></span><span>点击「定制」可调整首页功能入口及展示顺序。</span></li>
          <li><span class="dot"></span><span>点击审批数字可直接打开审批工作台对应页签。</span></li>
          <li><span class="dot"></span><span>显示名称可在「修改资料」中更改，登录账号保持不变。</span></li>
          <li><span class="dot"></span><span>「平台信息」为只读运行环境摘要，可用于日常巡检与问题定位。</span></li>
        </ul>
      </wd-panel>
    </aside>
  </div>

  <el-dialog v-model="permDlg" title="我的权限清单" width="640px">
    <div class="perm-summary">
      当前拥有 <strong>{{ permTotal }}</strong> 项权限。
    </div>
    <el-input
      v-model="permKeyword"
      placeholder="输入权限名称或简介关键字搜索"
      clearable
      class="perm-search"
    >
      <template #prefix><el-icon><Search /></el-icon></template>
    </el-input>
    <el-table
      :data="permTree"
      row-key="code"
      :tree-props="{ children: 'children' }"
      height="380"
      size="small"
      stripe
      default-expand-all
    >
      <el-table-column prop="title" label="权限名称" min-width="180">
        <template #default="{ row }">
          <span v-if="row.__group" class="perm-group-name">{{ row.title }}（{{ row.children.length }}）</span>
          <span v-else>{{ row.title }}</span>
        </template>
      </el-table-column>
      <el-table-column prop="description" label="权限简介" min-width="280">
        <template #default="{ row }">
          <span v-if="row.__group" class="perm-group-desc">权限点分组</span>
          <span v-else>{{ row.description || '—' }}</span>
        </template>
      </el-table-column>
    </el-table>
    <template #footer>
      <el-button type="primary" @click="permDlg = false">关闭</el-button>
    </template>
  </el-dialog>

  <el-drawer v-model="drawer" title="定制功能入口" size="380px" :destroy-on-close="false">
    <div class="drawer-sub">已选入口（拖拽可排序）</div>
    <div class="drawer-hint">拖动左侧手柄调整首页展示顺序，取消勾选即从首页移除。</div>

    <div
      v-for="(m, idx) in chosen"
      :key="m.id"
      class="pick-item"
      :class="{ dragging: dragIndex === idx }"
      draggable="true"
      @dragstart="onDragStart(idx, $event)"
      @dragover.prevent="onDragOver(idx)"
      @dragend="dragIndex = -1"
      @drop.prevent="onDrop(idx)"
    >
      <span class="handle"><el-icon><Rank /></el-icon></span>
      <span class="pico"><el-icon><component :is="iconOf(m.icon)" /></el-icon></span>
      <span class="pname">{{ m.title }}</span>
      <span v-if="isPkg(m)" class="pkg">{{ m.short }}</span>
      <el-button size="small" text type="danger" @click="removeChosen(idx)">移除</el-button>
    </div>
    <div v-if="chosen.length === 0" class="drawer-hint">尚未选择任何入口，可从下方添加。</div>

    <div class="drawer-sub">可添加的菜单</div>
    <div
      v-for="m in available"
      :key="m.id"
      class="avail-item"
    >
      <span class="pico"><el-icon><component :is="iconOf(m.icon)" /></el-icon></span>
      <span class="pname">{{ m.title }}<span v-if="isPkg(m)" style="color:#0066CC;font-size:12px;">（{{ m.short }}）</span></span>
      <el-button size="small" type="primary" plain @click="addChosen(m)">添加</el-button>
    </div>
    <div v-if="available.length === 0" class="drawer-hint">全部可用菜单均已添加。</div>

    <template #footer>
      <div style="display:flex; justify-content:space-between; gap:8px;">
        <el-button @click="resetDefault" :loading="saving">恢复默认</el-button>
        <div style="display:flex; gap:8px;">
          <el-button @click="drawer = false">取消</el-button>
          <el-button type="primary" :loading="saving" @click="save">保存</el-button>
        </div>
      </div>
    </template>
  </el-drawer>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script src="/static/linhub/auth-guard.js?v=2"></script>
  <script src="/static/linhub/home-link.js?v=3"></script>
  <script>
    const SERVER_OPTIONS = {$optionsJson|raw};
    const SERVER_DEFAULT = {$defaultJson|raw};
    const SERVER_SELECTED = {$selectedJson|raw};
    const SERVER_SLOTS = {$slotsJson|raw};
    const APPROVAL_STATS = {$approvalStatsJson|raw};

    const app = Vue.createApp({
      template: '#system-admin-tpl',
      setup() {
        const { ref, computed, onMounted, onUnmounted } = Vue;
        const icons = window.ElementPlusIconsVue || {};

        const nameRef = ref('{$displayName}');
        const userId = '{$identity->id}';
        const roleLabel = '{$roleLabel}';
        const homeKey = '{$homeKey}';

        const entries = ref(SERVER_SELECTED);
        const zones = Vue.reactive({
          'home.top': SERVER_SLOTS['home.top'] || [],
          'home.right': SERVER_SLOTS['home.right'] || [],
          'home.bottom': SERVER_SLOTS['home.bottom'] || [],
        });
        const drawer = ref(false);
        const profileName = ref(nameRef.value);
        const permDlg = ref(false);
        const permRows = ref([]);
        const permTotal = ref(0);
        const permKeyword = ref('');
        const saving = ref(false);
        const draft = ref([]);
        const dragIndex = ref(-1);

        // —— 顶部实时日期与时钟 ——
        const WEEK_LABELS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const nowRef = ref(new Date());
        let clockTimer = null;
        const pad2 = (n) => String(n).padStart(2, '0');
        const todayText = computed(() => {
          const d = nowRef.value;
          return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WEEK_LABELS[d.getDay()]}`;
        });
        const clockText = computed(() => {
          const d = nowRef.value;
          return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
        });

        onMounted(() => {
          clockTimer = setInterval(() => { nowRef.value = new Date(); }, 1000);
        });
        onUnmounted(() => {
          if (clockTimer) clearInterval(clockTimer);
          clockTimer = null;
        });

        const greet = computed(() => {
          const h = nowRef.value.getHours();
          if (h < 6) return '夜深了';
          if (h < 12) return '上午好';
          if (h < 14) return '中午好';
          if (h < 18) return '下午好';
          return '晚上好';
        });

        // —— 最近操作与平台信息：加载 /admin/home/stats ——
        const stats = Vue.reactive({
          recent: [],
          platform: { php: '', os: '', time: '' },
        });
        const statsReady = ref(false);

        // 数字千分位
        const fmt = (v) => {
          const n = Number(v);
          if (!isFinite(n)) return '0';
          return n.toLocaleString('zh-CN');
        };

        const slotsCount = computed(() => zones['home.top'].length + zones['home.bottom'].length);

        async function loadStats() {
          try {
            const res = await fetch('/admin/home/stats').then((r) => r.json());
            if (res.code !== 0) throw new Error(res.message || '加载平台信息失败');
            const d = res.data || {};
            stats.recent = d.recent || [];
            stats.platform = { ...stats.platform, ...(d.platform || {}) };
            statsReady.value = true;
          } catch (e) {
            window.ElementPlus.ElMessage.error(e.message);
          }
        }
        loadStats();

        const iconOf = (icon) => icons[icon] || icons.Menu;
        // 第三方功能包入口（平台内置菜单不标来源）
        const isPkg = (m) => !m.builtin && !!m.short;

        // 锚点 iframe 高度自适应（同源可直读子文档高度）
        function onSlotFrameLoad(e, id) {
          const frame = e.target;
          try {
            const h = frame.contentDocument && frame.contentDocument.body
              ? frame.contentDocument.body.scrollHeight : 0;
            if (h > 0) frame.style.height = h + 'px';
          } catch (err) {
            /* 跨域或空文档时保持默认高度 */
          }
        }

        const chosen = computed(() => draft.value);
        const available = computed(() => {
          const ids = new Set(draft.value.map((m) => m.id));
          return SERVER_OPTIONS.filter((m) => !ids.has(m.id));
        });

        // 权限清单树：按分组（groupTitle）分组，关键字过滤名称/简介，空分组不显示
        const permTree = computed(() => {
          const kw = (permKeyword.value || '').trim().toLowerCase();
          const groups = [];
          const index = {};
          for (const p of permRows.value) {
            if (kw) {
              const hit = (p.title || '').toLowerCase().includes(kw)
                || (p.description || '').toLowerCase().includes(kw);
              if (!hit) continue;
            }
            const g = p.groupTitle || p.group || '其他';
            if (!index[g]) {
              index[g] = { code: `__group__${g}`, title: g, __group: true, children: [] };
              groups.push(index[g]);
            }
            index[g].children.push(p);
          }
          return groups;
        });

        function openCustom() {
          // 拷贝当前入口为草稿
          draft.value = entries.value.map((m) => ({ ...m }));
          drawer.value = true;
        }
        function addChosen(m) {
          draft.value.push({ ...m });
        }
        function removeChosen(idx) {
          draft.value.splice(idx, 1);
        }

        // —— HTML5 拖拽排序 ——
        function onDragStart(idx, e) {
          dragIndex.value = idx;
          e.dataTransfer.effectAllowed = 'move';
        }
        function onDragOver(idx) {
          const from = dragIndex.value;
          if (from === -1 || from === idx) return;
          const list = draft.value;
          const moved = list.splice(from, 1)[0];
          list.splice(idx, 0, moved);
          dragIndex.value = idx;
        }
        function onDrop(idx) {
          dragIndex.value = -1;
        }

        function post(body, url = '/admin/home/customSave') {
          return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          }).then((r) => r.json());
        }

        async function save() {
          saving.value = true;
          try {
            const res = await post({
              homeKey,
              menuIds: draft.value.map((m) => m.id),
            });
            if (res.code !== 0) throw new Error(res.message || '保存失败');
            entries.value = draft.value.map((m) => ({ ...m }));
            drawer.value = false;
            window.ElementPlus.ElMessage.success('已保存定制');
          } catch (e) {
            window.ElementPlus.ElMessage.error(e.message);
          } finally {
            saving.value = false;
          }
        }

        async function resetDefault() {
          saving.value = true;
          try {
            const res = await post({ homeKey, reset: 1 });
            if (res.code !== 0) throw new Error(res.message || '重置失败');
            entries.value = SERVER_DEFAULT.map((m) => ({ ...m }));
            draft.value = SERVER_DEFAULT.map((m) => ({ ...m }));
            window.ElementPlus.ElMessage.success('已恢复默认');
          } catch (e) {
            window.ElementPlus.ElMessage.error(e.message);
          } finally {
            saving.value = false;
          }
        }

        function openProfile() {
          profileName.value = nameRef.value;
        }

        async function openPerms() {
          permDlg.value = true;
          permRows.value = [];
          permTotal.value = 0;
          permKeyword.value = '';
          try {
            const res = await fetch('/admin/home/myPerms').then((r) => r.json());
            if (res.code !== 0) throw new Error(res.message || '加载失败');
            permRows.value = res.data.perms;
            permTotal.value = res.data.total;
          } catch (e) {
            permDlg.value = false;
            window.ElementPlus.ElMessage.error(e.message);
          }
        }

        async function saveProfile(f) {
          const value = profileName.value.trim();
          if (value === '') {
            window.ElementPlus.ElMessage.error('显示名称不能为空');
            return;
          }
          saving.value = true;
          try {
            const res = await post({ name: value }, '/admin/home/profileSave');
            if (res.code !== 0) throw new Error(res.message || '保存失败');
            nameRef.value = res.data.name;
            if (f) f.close();
            window.ElementPlus.ElMessage.success('已更新用户信息');
          } catch (e) {
            window.ElementPlus.ElMessage.error(e.message);
          } finally {
            saving.value = false;
          }
        }

        return {
          name: nameRef, userId, roleLabel,
          entries, zones, drawer, saving, chosen, available, draft, dragIndex,
          profileName, permDlg, permRows, permTotal, permKeyword, permTree,
          greet, todayText, clockText, slotsCount,
          stats, statsReady, fmt,
          Setting: icons.Setting, Rank: icons.Rank, Edit: icons.Edit, Key: icons.Key, Search: icons.Search,
          iconOf, isPkg, openCustom, addChosen, removeChosen,
          onDragStart, onDragOver, onDrop, onDragEnd: () => { dragIndex.value = -1; },
          onSlotFrameLoad,
          save, resetDefault, openProfile, saveProfile, openPerms,
          apStats: APPROVAL_STATS, openApprovalTab: window.linhubOpenApprovalWorkbench,
          openTab: window.linhubOpenTab,
        };
      }
    });
    for (const [cname, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(cname, comp);
    }
    app.use(window.ElementPlus);
    app.use(window.WorkDesktop.WorkDesktop);
    app.mount('.home');
  </script>
</body>

</html>
