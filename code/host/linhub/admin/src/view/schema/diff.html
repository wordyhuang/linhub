<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schema 差异看板 - LinHub 林枢</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<link rel="stylesheet" href="/static/vendor/element-plus/index.css">
<link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
<link rel="stylesheet" href="/static/linhub/cards.css">
<style>
  html, body, #app { height: 100%; margin: 0; }
  .sc-page { height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .sc-body { padding: 4px 0 24px; }
  .sc-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
  .sc-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  .sc-summary { display: flex; gap: 16px; margin: 8px 0 12px; flex-wrap: wrap; }
  .sc-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 14px; font-size: 12px; background: var(--wd-border-color, #f0f0f0); color: var(--wd-text-color, #1f2937); }
  .sc-diff-row { margin-bottom: 16px; }
  .sc-count { font-size: 13px; color: var(--wd-text-color-secondary, #6b7280); }

  /* —— 差异汇总统计卡（对齐平台内页 stats 风格） —— */
  .sc-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 4px; }
  .sc-stat { border: 1px solid #e5e7eb; border-radius: 10px; background: #fff; padding: 14px 16px; }
  .sc-stat-lbl { font-size: 13px; font-weight: 600; color: #1f2937; }
  .sc-stat-num { margin-top: 6px; font-size: 24px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .sc-stat-num.is-add { color: #67c23a; }
  .sc-stat-num.is-del { color: #f56c6c; }
  .sc-stat-num.is-chg { color: #e6a23c; }
  .sc-stat-num.is-ok { color: #909399; }
  .sc-stat-sub { margin-top: 4px; font-size: 12px; color: #909399; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* —— 区块筛选工具栏 —— */
  .sc-filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .sc-filter-count { font-size: 12px; color: #909399; }
</style>
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="sc-tpl">
  <div class="sc-page">
        <div class="sc-body">
          <wd-panel description-align="right" :border="true">
            <wd-tips type="box" style="margin-bottom:12px">
              对比当前数据库结构与功能包备份内的 schema 发版快照，识别待新增 / 待删除 / 变更的表、列与索引。
            </wd-tips>

          <!-- 数据库不可用降级（G8.2） -->
          <el-alert
            v-if="state.diagnostic"
            type="error" show-icon :closable="false"
            title="数据库连接不可用，无法读取当前库结构："
            style="margin-bottom:12px">
            <div class="sc-mono" style="white-space:pre-wrap">
              驱动: {{ state.diagnostic.driver }}
              地址: {{ state.diagnostic.host }}
              库名: {{ state.diagnostic.db }}
              错误: {{ state.diagnostic.error }}
            </div>
          </el-alert>

          <div v-loading="loading" element-loading-text="加载中...">
          <div class="sc-toolbar">
            <span style="font-size:13px;color:var(--wd-text-color-secondary, #6b7280)">功能包：</span>
            <el-select v-model="pkg" placeholder="选择包以比对" size="small" style="width:220px" :disabled="!!state.diagnostic">
              <el-option
                v-for="p in state.packages" :key="p.name"
                :label="(p.short || p.name) + ' · v' + (p.version || '-') + (p.snapshotCount > 0 ? '（含快照 ' + p.snapshotCount + '）' : '（无快照）')"
                :value="p.name" />
            </el-select>
            <el-button type="primary" size="small" :disabled="!pkg || !!state.diagnostic" @click="apply">查看差异</el-button>
            <span v-if="state.current" class="sc-chip">当前库 {{ state.current.tableCount }} 表</span>
            <span v-if="state.target" class="sc-chip">目标快照 {{ state.target.tableCount }} 表 · v{{ state.target.version }}</span>
          </div>

          <!-- 无快照提示 -->
          <el-empty
            v-if="state.report && state.report.noSnapshot"
            :description="state.report.message" :image-size="80" />

          <!-- 差异清单 -->
          <template v-if="state.report && !state.report.noSnapshot">
            <!-- 差异汇总 -->
            <div class="sc-stats">
              <div class="sc-stat">
                <div class="sc-stat-lbl">表数量（基线 → 目标）</div>
                <div class="sc-stat-num" :class="state.report.fromTableCount === state.report.toTableCount ? 'is-ok' : 'is-chg'">
                  {{ state.report.fromTableCount }} → {{ state.report.toTableCount }}
                </div>
                <div class="sc-stat-sub">当前库 {{ state.current ? state.current.tableCount + ' 表' : '—' }} · 目标快照 v{{ state.target ? state.target.version : '—' }}</div>
              </div>
              <div class="sc-stat">
                <div class="sc-stat-lbl">待新增</div>
                <div class="sc-stat-num" :class="totals.added ? 'is-add' : 'is-ok'">{{ totals.added }}</div>
                <div class="sc-stat-sub">表 / 列 / 索引合计</div>
              </div>
              <div class="sc-stat">
                <div class="sc-stat-lbl">待删除</div>
                <div class="sc-stat-num" :class="totals.removed ? 'is-del' : 'is-ok'">{{ totals.removed }}</div>
                <div class="sc-stat-sub">表 / 列 / 索引合计</div>
              </div>
              <div class="sc-stat">
                <div class="sc-stat-lbl">结构变更</div>
                <div class="sc-stat-num" :class="totals.changed ? 'is-chg' : 'is-ok'">{{ totals.changed }}</div>
                <div class="sc-stat-sub">表 / 列 / 索引合计</div>
              </div>
            </div>
            <div style="height:12px"></div>

            <!-- 关键字筛选 -->
            <div class="sc-filter-bar">
              <el-input v-model="scKw" placeholder="搜索表 / 名称 / 详情" clearable style="width:240px">
                <template #prefix><el-icon><Search /></el-icon></template>
              </el-input>
              <span class="sc-filter-count">共 {{ totalFiltered }} / {{ totalRows }} 项</span>
            </div>

            <div v-for="g in state.report.groups" :key="g.kind" class="sc-diff-row">
              <h3 style="margin:0 0 6px;font-size:15px">
                {{ g.title }}
                <span style="font-weight:400;font-size:12px;color:var(--wd-text-color-secondary, #6b7280)">
                  +{{ g.added.length }} / -{{ g.removed.length }} / ~{{ g.changed.length }}
                </span>
              </h3>

              <wd-data-grid v-if="filteredFlat(g).length > 0" :data-source="filteredFlat(g)" border stripe table-size="small" :with-index="false" :with-pager="false">
                <el-table-column label="性质" width="90">
                  <template #default="{ row }">
                    <el-tag size="small" :type="row.tag === 'added' ? 'success' : (row.tag === 'removed' ? 'danger' : 'warning')" effect="light">
                      {{ row.tag === 'added' ? '新增' : (row.tag === 'removed' ? '删除' : '变更') }}
                    </el-tag>
                  </template>
                </el-table-column>
                <el-table-column prop="table" label="表" min-width="150">
                  <template #default="{ row }"><span class="sc-mono">{{ row.table }}</span></template>
                </el-table-column>
                <el-table-column prop="name" label="名称" min-width="150">
                  <template #default="{ row }"><span class="sc-mono">{{ row.name }}</span></template>
                </el-table-column>
                <el-table-column prop="detail" label="详情" min-width="220" />
                <!-- ── 卡片清单模式（DataGrid 内建 modeSwitch 视图；统一 lh-card 结构，只读清单无操作行） ── -->
                <template #card-item="{ row }">
                  <div class="lh-card">
                    <div class="lh-card__head">
                      <div class="lh-card__title"><span class="sc-mono">{{ row.table }}</span></div>
                      <div class="lh-card__tags">
                        <el-tag size="small" :type="row.tag === 'added' ? 'success' : (row.tag === 'removed' ? 'danger' : 'warning')" effect="light">
                          {{ row.tag === 'added' ? '新增' : (row.tag === 'removed' ? '删除' : '变更') }}
                        </el-tag>
                      </div>
                    </div>
                    <div class="lh-card__fields">
                      <div class="lh-card__field">
                        <div class="k">名称</div>
                        <div class="v"><span class="sc-mono">{{ row.name || '—' }}</span></div>
                      </div>
                      <div v-if="row.detail" class="lh-card__field is-wide">
                        <div class="k">详情</div>
                        <div class="v">{{ row.detail }}</div>
                      </div>
                    </div>
                  </div>
                </template>
              </wd-data-grid>
              <p v-else class="sc-count">{{ (g.added.length + g.removed.length + g.changed.length) > 0 ? '无匹配项（已按关键字过滤）' : '无差异' }}</p>
            </div>
          </template>
          </div>

          <el-empty v-if="!state.diagnostic && !state.report && !loading" description="请选择一个功能包查看其发版结构与当前库的差异" :image-size="80" />
          </wd-panel>
        </div>
  </div>
</script>

<script src="/static/vendor/vue/vue.global.prod.js"></script>
<script src="/static/vendor/element-plus/index.full.min.js"></script>
<script src="/static/vendor/icons/index.iife.min.js"></script>
<script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
<script src="/static/linhub/auth-guard.js?v=2"></script>
<script>
  const WD = window.WorkDesktop;
  const ElementPlus = window.ElementPlus;
  const { WorkDesktop } = WD;
  const { ref, reactive, computed } = Vue;

  const app = Vue.createApp({
    template: '#sc-tpl',
    setup() {
      const pkg = ref('');
      const loading = ref(false);
      const scKw = ref('');
      const state = reactive({ packages: [], current: null, diagnostic: null, target: null, report: null });

      async function loadOptions() {
        const res = await WD.request.get('/admin/schema/options');
        if (!res.success) {
          ElementPlus.ElMessage.error(res.message || '加载失败');
          return;
        }
        state.packages = res.data.packages || [];
        state.current = res.data.current || null;
        state.diagnostic = res.data.diagnostic || null;
      }

      async function apply() {
        if (!pkg.value) return;
        loading.value = true;
        try {
          const res = await WD.request.get('/admin/schema/report', { package: pkg.value });
          if (!res.success) {
            ElementPlus.ElMessage.error(res.message || '加载失败');
            return;
          }
          state.current = res.data.current || null;
          state.diagnostic = res.data.diagnostic || null;
          state.target = res.data.target || null;
          state.report = res.data.report || null;
        } finally {
          loading.value = false;
        }
      }

      function flat(g) {
        const rows = [];
        ((g.added || []).map(r => ({ tag: 'added', ...r })))
          .concat((g.removed || []).map(r => ({ tag: 'removed', ...r })))
          .concat((g.changed || []).map(r => ({ tag: 'changed', ...r })))
          .forEach(r => rows.push(r));
        return rows;
      }

      // 关键字过滤后的差异行
      function filteredFlat(g) {
        const kw = scKw.value.trim().toLowerCase();
        const rows = flat(g);
        if (!kw) return rows;
        return rows.filter(r =>
          String(r.table || '').toLowerCase().includes(kw) ||
          String(r.name || '').toLowerCase().includes(kw) ||
          String(r.detail || '').toLowerCase().includes(kw));
      }

      // 三类差异合计
      const totals = computed(() => {
        const t = { added: 0, removed: 0, changed: 0 };
        if (state.report && !state.report.noSnapshot) {
          for (const g of state.report.groups) {
            t.added += (g.added || []).length;
            t.removed += (g.removed || []).length;
            t.changed += (g.changed || []).length;
          }
        }
        return t;
      });

      const totalRows = computed(() => totals.value.added + totals.value.removed + totals.value.changed);
      const totalFiltered = computed(() => {
        if (!state.report || state.report.noSnapshot) return 0;
        return state.report.groups.reduce((n, g) => n + filteredFlat(g).length, 0);
      });

      loadOptions();

      return { pkg, loading, scKw, state, apply, filteredFlat, totals, totalRows, totalFiltered, Search: window.ElementPlusIconsVue.Search };
    }
  });

  for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
    app.component(name, comp);
  }
  app.use(ElementPlus);
  app.use(WorkDesktop);
  app.mount('#app');
</script>
</body>
</html>
