<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限组管理 - LinHub 林枢</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <link rel="stylesheet" href="/static/linhub/cards.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .group-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .group-page > .wd-tips {
      flex: none;
    }

    /* 新增抽屉表单：抵消 workdesktop-ai 抽屉容器泄漏的 form-item 4px 压缩，恢复标准间距 */
    .el-form.group-create-form .el-form-item.el-form-item {
      margin-bottom: 16px;
    }
    .el-form.group-create-form .el-form-item__label,
    .el-form.group-create-form .el-form-item__content {
      line-height: 32px;
    }

    /* 面板撑满剩余高度，body 去内边距后交给左右分栏 */
    .group-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .group-panel.wd-panel {
      margin-bottom: 0;
    }

    .group-panel .wd-panel__content {
      flex: 1;
      min-height: 0;
    }

    .group-panel .wd-panel__content-inner {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .group-panel .wd-panel__body {
      flex: 1;
      min-height: 0;
      padding: 0;
      display: flex;
    }

    .group-split {
      display: flex;
      flex: 1;
      min-width: 0;
      min-height: 0;
    }

    /* ── 左侧：权限组列表 ── */
    .group-nav {
      width: 320px;
      flex: none;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--wd-border-color-light, #e4e7ed);
      background: var(--wd-bg-color-page, #fafbfc);
    }

    .group-nav__head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--wd-border-color-light, #e4e7ed);
    }

    .group-nav__list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
    }

    .group-nav__item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease;
    }

    .group-nav__item:hover {
      background: #fff;
      border-color: var(--wd-border-color-light, #e4e7ed);
    }

    .group-nav__item.is-active {
      background: var(--el-color-primary-light-9, #ecf5ff);
      border-color: var(--el-color-primary-light-7, #a0cfff);
    }

    .group-nav__item.is-active .group-nav__name {
      color: var(--el-color-primary, #409eff);
      font-weight: 600;
    }

    .group-nav__name {
      font-size: 14px;
      color: #1f2937;
      word-break: break-all;
    }

    .group-nav__meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
      font-size: 12px;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    .group-nav__counts {
      margin-left: auto;
      white-space: nowrap;
    }

    .group-nav__empty {
      padding: 32px 0;
    }

    /* ── 右侧：权限组详情 ── */
    .group-detail {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .group-detail__head {
      flex: none;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--wd-border-color-light, #e4e7ed);
    }

    .group-detail__name {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .group-name {
      font-size: 17px;
      font-weight: 600;
      color: #1f2937;
      word-break: break-all;
    }

    .group-detail__spacer {
      flex: 1;
    }

    .group-detail__sub {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 13px;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    .group-detail__body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px 16px 16px;
    }

    .group-detail__body .el-tabs {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .group-detail__body .el-tabs__content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .group-detail__body .el-tab-pane {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* 权限项页签：工具栏常驻顶部，下方权限项区域独立滚动 */
    .perm-pane {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .perm-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }

    .group-detail__empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── 权限项 ── */
    .perm-toolbar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 4px 0 14px;
    }

    .perm-summary {
      font-size: 13px;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    .perm-group {
      margin-bottom: 14px;
    }

    .perm-group__title {
      font-weight: 600;
      font-size: 13px;
      color: #1f2937;
      margin-bottom: 6px;
    }

    /* 分组全选框的文字保持标题样式 */
    .perm-group__title .el-checkbox__label {
      font-weight: 600;
      font-size: 13px;
      color: #1f2937;
    }

    .perm-check {
      margin-right: 10px;
    }

    .perm-title {
      display: inline-block;
      margin-right: 6px;
    }

    .perm-empty {
      padding: 12px 0;
      font-size: 13px;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    /* ── 用户 ── */
    .user-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--wd-text-color-secondary, #6b7280);
    }

    /* 用户页签：DataGrid 以页签容器为高度参照，并在四周留出间距 */
    .group-detail__body.is-users .el-tab-pane {
      padding: 0 6px 14px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="group-tpl">
  <div class="group-page">
    <wd-tips type="box" style="margin-bottom:12px;flex:none">
      权限组聚合一批权限点（T5.3）。左侧选择权限组，右侧维护其权限项与用户；挂接保存由后端校验权限码是否已登记。
    </wd-tips>

    <wd-panel class="group-panel" title="权限组管理" description="点击左侧权限组名称即可切换；右侧「编辑信息」可修改名称、针对角色与备注。" :border="true" shadow="none">
      <div class="group-split">
        <!-- 左侧：权限组列表 -->
        <aside class="group-nav">
          <div class="group-nav__head">
            <el-input v-model="keyword" placeholder="按权限组名称搜索" size="small" clearable style="flex:1">
              <template #prefix><el-icon><Search /></el-icon></template>
            </el-input>

            <wd-drawer-button label="新增" drawer-size="50%" size="small" title="新增权限组" type="primary" @open="openCreate">
              <template #default>
                <el-form label-width="90px" class="group-create-form">
                  <el-form-item label="组名称" required>
                    <el-input v-model="form.name" placeholder="输入权限组名称" maxlength="40" />
                  </el-form-item>
                  <el-form-item label="针对角色">
                    <el-checkbox-group v-model="form.roles">
                      <el-checkbox v-for="o in roleOptions" :key="o.type" :value="o.type">{{ o.name }}（{{ o.type }}）</el-checkbox>
                    </el-checkbox-group>
                    <div style="width:100%;margin-top:2px;color:var(--wd-text-color-secondary,#909399);font-size:12px">不勾选 = 不限角色（对所有角色可见）；超级管理员为平台占位角色，不在此列</div>
                  </el-form-item>
                  <el-form-item label="备注">
                    <el-input v-model="form.remark" type="textarea" :rows="3" placeholder="权限组备注（可选）" maxlength="200" show-word-limit />
                  </el-form-item>
                </el-form>
              </template>
              <template #footer="f">
                <el-button @click="f.close">取消</el-button>
                <wd-api-button label="保存" type="primary" api="/admin/group/save"
                               :api-param="{ mode: 'create', name: form.name, roles: form.roles, remark: form.remark }"
                               :head-refresh-datagrid="false"
                               @api-success="onCreated($event, f)">保存</wd-api-button>
              </template>
            </wd-drawer-button>
          </div>

          <div class="group-nav__list" v-loading="listLoading">
            <div v-for="row in filteredRows" :key="row.id"
                 class="group-nav__item"
                 :class="{ 'is-active': active && active.id === row.id }"
                 @click="selectGroup(row)">
              <div class="group-nav__name">{{ row.name }}</div>
              <div class="group-nav__meta">
                <template v-if="row.roles && row.roles.length">
                  <el-tag v-for="t in row.roles" :key="t" size="small" type="warning" effect="plain">{{ roleTypeName(t) }}</el-tag>
                </template>
                <el-tag v-else size="small" type="info" effect="plain">不限角色</el-tag>
                <span class="group-nav__counts">{{ row.permCount }} 项 / {{ row.userCount }} 人</span>
              </div>
            </div>
            <div v-if="!listLoading && !filteredRows.length" class="group-nav__empty">
              <el-empty :image-size="70" :description="rows.length ? '无匹配的权限组' : '暂无权限组'" />
            </div>
          </div>
        </aside>

        <!-- 右侧：权限项 / 用户 -->
        <section class="group-detail">
          <template v-if="active">
            <div class="group-detail__head">
              <div class="group-detail__name">
                <span class="group-name">{{ active.name }}</span>
                <span class="group-detail__spacer"></span>
                <wd-drawer-button label="编辑信息" title="编辑权限组" drawer-size="50%" size="small" @open="openEdit">
                  <template #default>
                    <el-form label-width="90px" class="group-create-form">
                      <el-form-item label="组名称" required>
                        <el-input v-model="editForm.name" placeholder="输入权限组名称" maxlength="40" />
                      </el-form-item>
                      <el-form-item label="针对角色">
                        <el-select v-model="editForm.roles" multiple placeholder="不选=不限角色" clearable style="width:100%">
                          <el-option v-for="o in roleOptions" :key="o.type" :label="o.name + '（' + o.type + '）'" :value="o.type" />
                        </el-select>
                      </el-form-item>
                      <el-form-item label="备注">
                        <el-input v-model="editForm.remark" type="textarea" :rows="3" placeholder="权限组备注（可选）" maxlength="200" show-word-limit />
                      </el-form-item>
                    </el-form>
                  </template>
                  <template #footer="f">
                    <el-button @click="f.close">取消</el-button>
                    <wd-api-button label="保存" type="primary" api="/admin/group/save"
                                   :api-param="{ mode: 'update', id: active.id, name: editForm.name, roles: editForm.roles, remark: editForm.remark }"
                                   :head-refresh-datagrid="false"
                                   @api-success="onUpdated($event, f)">保存</wd-api-button>
                  </template>
                </wd-drawer-button>
                <wd-popconfirm-button title="确认删除权限组？" api="/admin/group/delete"
                                      :api-param="{ id: active.id }"
                                      tip="删除后对该组已授权的用户将同步解除关联"
                                      :head-refresh-datagrid="false"
                                      type="danger" size="small"
                                      @api-success="onDeleted">删除</wd-popconfirm-button>
              </div>

              <div class="group-detail__sub">
                <span>针对角色：</span>
                <template v-if="active.roles && active.roles.length">
                  <el-tag v-for="t in active.roles" :key="t" size="small" type="warning" effect="plain">{{ roleTypeName(t) }}</el-tag>
                </template>
                <el-tag v-else size="small" type="info" effect="plain">不限角色</el-tag>
                <span>· 权限项 {{ active.permCount }} 项</span>
                <span>· 用户 {{ active.userCount }} 人</span>
                <span v-if="active.remark">· 备注：{{ active.remark }}</span>
              </div>
            </div>

            <div class="group-detail__body" :class="{ 'is-users': activeTab === 'users' }">
              <el-tabs v-model="activeTab">
                <el-tab-pane label="权限项" name="perms">
                  <div class="perm-pane">
                    <div class="perm-toolbar">
                      <div class="perm-summary">
                        当前对以上角色并集可见 {{ visiblePermissionCount }} 项，已选 <b>{{ permState.selected.length }}</b> 项，勾选后自动保存。
                        将鼠标悬停在权限项名称上，可查看该权限项的简介。
                      </div>
                    </div>

                    <div class="perm-scroll">
                      <div class="perm-group" v-for="(list, gname) in visibleGrouped" :key="gname">
                        <div class="perm-group__title">
                          <el-checkbox size="small"
                                       :model-value="isGroupAllSelected(list)"
                                       :indeterminate="isGroupIndeterminate(list)"
                                       @change="toggleGroup(list, $event)">{{ gname }}</el-checkbox>
                        </div>
                        <el-checkbox-group :model-value="permState.selected" @change="onPermSelected">
                          <el-checkbox class="perm-check" v-for="p in list" :key="p.code" :value="p.code">
                            <el-tooltip :content="p.description || '暂无简介'" placement="top">
                              <span class="perm-title">{{ p.title }}</span>
                            </el-tooltip>
                            <el-tooltip v-if="!p.open" :content="'仅可见角色：' + p.roles.join('、')" placement="top">
                              <el-tag size="small" type="info" effect="plain">{{ p.roles.length }} 角色</el-tag>
                            </el-tooltip>
                          </el-checkbox>
                        </el-checkbox-group>
                      </div>

                      <div v-if="permLoading" v-loading="true" style="height:120px"></div>
                      <div v-else-if="!visiblePermissionCount" class="perm-empty">
                        当前针对角色下无可见权限项。
                      </div>
                    </div>
                  </div>
                </el-tab-pane>

                <el-tab-pane :label="'用户（' + userSelected.length + '）'" name="users">
                  <wd-data-grid ref="userGrid"
                                :active="false"
                                :height="activeTab === 'users' ? 'fix' : undefined"
                                api="/admin/group/users"
                                api-method="get"
                                :api-param="{ group_id: active.id }"
                                row-key="id"
                                :with-index="false"
                                :border="true"
                                with-selection
                                selection-key="id"
                                :model-value="userSelected"
                                @update:model-value="onUserSelect"
                                @loaded="onUserGridLoaded">
                    <template #toolbar="{ list }">
                      <div class="user-toolbar">
                        <el-input v-model="userFilter.keyword" placeholder="按姓名 / 账户搜索" size="small" clearable
                                  style="width:220px" @input="queueUserRefresh" @clear="refreshUsers">
                          <template #prefix><el-icon><Search /></el-icon></template>
                        </el-input>
                        <el-checkbox v-model="userFilter.onlySelected" size="small" @change="refreshUsers">仅看已选</el-checkbox>
                        <span>已加入 <b>{{ userSelected.length }}</b> 人 / 共 {{ userTotal }} 人，勾选后自动保存，取消勾选即移出该组。</span>
                      </div>
                    </template>
                    <el-table-column prop="name" label="姓名" min-width="160" />
                    <el-table-column prop="refId" label="用户账户" min-width="200" />
                    <template #empty><el-empty :image-size="80" description="暂无用户" /></template>
                  </wd-data-grid>
                </el-tab-pane>
              </el-tabs>
            </div>
          </template>

          <div v-else class="group-detail__empty">
            <el-empty :image-size="100" description="请从左侧选择权限组" />
          </div>
        </section>
      </div>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script src="/static/linhub/auth-guard.js?v=2"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive, computed, onMounted, nextTick } = Vue;
    const { ElMessage } = ElementPlus;

    // 预设角色键 → 显示名（与后端 RbacRoles::PRESET_ROLES 一致，作为列表展示的兜底映射）
    const ROLE_TYPE_NAMES = {
      'WORKER': '工作者',
      'REVIEWER': '审核员',
      'FUNCTIONAL_ADMIN': '功能管理员',
      'SYSTEM_ADMIN': '系统管理员',
      'SUPER_ADMIN': '超级管理员'
    };

    const app = Vue.createApp({
      template: '#group-tpl',
      setup() {
        const keyword = ref('');
        const rows = ref([]);
        const listLoading = ref(false);
        const active = ref(null);
        const activeTab = ref('perms');
        const userGrid = ref(null);
        const form = reactive({ name: '', roles: [], remark: '' });
        const roleOptions = ref([]);
        const permState = reactive({ loaded: false, permissions: [], permMap: {}, selected: [], saved: [] });
        const permLoading = ref(true);
        // 权限项勾选是否由本人操作触发（切换权限组回显不算）
        let permsReady = false;
        // 自动保存串行队列：连点勾选时合并为最后一次结果，避免并发覆盖
        let savingPerms = false;
        let pendingPermSave = null;
        const userSelected = ref([]);
        const userSaved = ref([]);
        const userTotal = ref(0);
        // 成员表格筛选：姓名/账户关键词 + 仅看已选（服务端过滤）
        const userFilter = reactive({ keyword: '', onlySelected: false });
        let userFilterTimer = null;

        // 左侧列表按关键词本地过滤（大小写不敏感）
        const filteredRows = computed(() => {
          const kw = keyword.value.trim().toLowerCase();
          if (!kw) return rows.value;
          return rows.value.filter(r => String(r.name || '').toLowerCase().includes(kw));
        });

        // 角色类型键 → 显示名（优先 options 接口，兜底本地常量）
        function roleTypeName(key) {
          const opt = roleOptions.value.find(o => o.type === key);
          return opt ? opt.name : (ROLE_TYPE_NAMES[key] || key);
        }

        // 该权限点对权限组针对角色并集是否可见（组未设角色=不限）
        function visibleForGroup(p, roleKeys) {
          if (p.open) return true;
          if (!roleKeys || roleKeys.length === 0) return true;
          return roleKeys.some(k => p.visibleFor?.[k] === true);
        }

        // 按权限点所属集群分组
        const grouped = computed(() => {
          const map = {};
          for (const p of (permState.permissions || [])) {
            const gname = p.group || '未分组';
            (map[gname] = map[gname] || []).push(p);
          }
          for (const k in map) map[k].sort((a, b) => (a.title || '').localeCompare(b.title || ''));
          return map;
        });

        // 仅保留对当前权限组针对角色并集可见的非空分组
        const visibleGrouped = computed(() => {
          const roleKeys = active.value && Array.isArray(active.value.roles) ? active.value.roles : [];
          const out = {};
          for (const [g, lst] of Object.entries(grouped.value)) {
            const vis = lst.filter(p => visibleForGroup(p, roleKeys));
            if (vis.length) out[g] = vis;
          }
          return out;
        });

        const visiblePermissionCount = computed(() => {
          const roleKeys = active.value && Array.isArray(active.value.roles) ? active.value.roles : [];
          return (permState.permissions || []).filter(p => visibleForGroup(p, roleKeys)).length;
        });

        // 分组级全选：该组可见权限项是否全选 / 部分选中
        function isGroupAllSelected(list) {
          const codes = (list || []).map(p => p.code);
          return codes.length > 0 && codes.every(c => permState.selected.includes(c));
        }

        function isGroupIndeterminate(list) {
          const codes = (list || []).map(p => p.code);
          const picked = codes.filter(c => permState.selected.includes(c)).length;
          return picked > 0 && picked < codes.length;
        }

        // 勾选/取消勾选该分组下的全部权限项，其余分组的勾选保持不变
        function toggleGroup(list, checked) {
          const codes = (list || []).map(p => p.code);
          let next;
          if (checked) {
            next = permState.selected.slice();
            codes.forEach(c => { if (!next.includes(c)) next.push(c); });
          } else {
            next = permState.selected.filter(c => !codes.includes(c));
          }
          onPermSelected(next);
        }

        // 权限项勾选即保存：非用户操作（切组回显）不触发
        function onPermSelected(list) {
          const next = (list || []).map(String);
          permState.selected = next;
          if (!permsReady || !active.value) return;
          if (samePerms(next, permState.saved)) return;
          pendingPermSave = { groupId: active.value.id, codes: next };
          flushPermSave();
        }

        function samePerms(a, b) {
          if (a.length !== b.length) return false;
          const setB = new Set(b);
          return a.every(code => setB.has(code));
        }

        // 串行执行，期间新的勾选只保留最后一次
        async function flushPermSave() {
          if (savingPerms) return;
          savingPerms = true;
          try {
            while (pendingPermSave) {
              const task = pendingPermSave;
              pendingPermSave = null;
              const res = await WD.request.post('/admin/group/perms', {
                id: task.groupId,
                codes: task.codes
              });
              if (!res.success) {
                ElMessage.error(res.message || '保存失败');
                continue;
              }
              if (!active.value || active.value.id !== task.groupId) continue;
              permState.saved = task.codes.slice();
              permState.permMap[task.groupId] = task.codes.slice();
              syncPermCount(task.codes.length);
              ElMessage.success(res.message || '权限项已更新');
            }
          } catch (e) {
            ElMessage.error('保存失败');
          } finally {
            savingPerms = false;
          }
        }

        function syncPermCount(count) {
          if (!active.value) return;
          active.value.permCount = count;
          const row = rows.value.find(r => r.id === active.value.id);
          if (row) row.permCount = count;
        }

        // 权限点全量 + 已挂权限码 map（只拉一次）
        async function ensureOptions() {
          if (permState.loaded) return;
          try {
            const res = await WD.request.get('/admin/group/options');
            if (!res.success) { ElMessage.error(res.message || '权限项加载失败'); return; }
            permState.permissions = res.data.permissions || [];
            permState.permMap = res.data.permMap || {};
            roleOptions.value = res.data.roleOptions || [];
            permState.loaded = true;
          } catch (e) {
            ElMessage.error('权限项加载失败');
          } finally {
            permLoading.value = false;
          }
        }

        // 权限组列表；preferredId 指定刷新后要选中的组
        async function loadGroups(preferredId) {
          listLoading.value = true;
          try {
            const res = await WD.request.get('/admin/group/rows');
            if (!res.success) { ElMessage.error(res.message || '权限组加载失败'); return; }
            rows.value = res.data.list || [];
            const wantId = preferredId || (active.value ? active.value.id : '');
            const fresh = rows.value.find(r => r.id === wantId);
            if (fresh) {
              active.value = fresh;
              usersReady = false;
              permsReady = false;
              userSelected.value = [];
              userSaved.value = [];
              resetUserFilter();
              initPermSelection();
              loadUsers();
            } else if (rows.value.length) {
              selectGroup(rows.value[0]);
            } else {
              active.value = null;
            }
          } catch (e) {
            ElMessage.error('权限组加载失败');
          } finally {
            listLoading.value = false;
          }
        }

        // 选中权限组：回显已挂权限项，并刷新用户表格
        async function selectGroup(row) {
          if (active.value && active.value.id === row.id) return;
          active.value = row;
          usersReady = false;
          permsReady = false;
          userSelected.value = [];
          userSaved.value = [];
          resetUserFilter();
          await ensureOptions();
          initPermSelection();
          await loadUsers();
        }

        // 仅展示对该权限组针对角色并集可见的权限项；已挂但不可见的不带入
        function initPermSelection() {
          if (!active.value) {
            permState.selected = [];
            permState.saved = [];
            permsReady = true;
            return;
          }
          const roleKeys = Array.isArray(active.value.roles) ? active.value.roles : [];
          const selected = (permState.permMap[active.value.id] || []).filter(code => {
            const p = permState.permissions.find(x => x.code === code);
            return p ? visibleForGroup(p, roleKeys) : false;
          });
          permState.selected = selected;
          permState.saved = selected.slice();
          permsReady = true;
        }

        // 用户勾选是否由本人操作触发（表格首次加载/切组回显不算）
        let usersReady = false;
        // 自动保存串行队列：连点勾选时合并为最后一次结果，避免并发覆盖
        let savingUsers = false;
        let pendingUserSave = null;

        // 搜索输入防抖触发刷新
        function queueUserRefresh() {
          clearTimeout(userFilterTimer);
          userFilterTimer = setTimeout(refreshUsers, 300);
        }

        // 切换权限组时重置成员筛选
        function resetUserFilter() {
          clearTimeout(userFilterTimer);
          userFilter.keyword = '';
          userFilter.onlySelected = false;
        }

        // 按当前筛选条件刷新成员表格（回第一页）
        function refreshUsers() {
          if (!active.value || !userGrid.value || !userGrid.value.requestApi) return;
          userGrid.value.requestApi({
            apiParam: {
              group_id: active.value.id,
              keyword: userFilter.keyword.trim(),
              only_selected: userFilter.onlySelected ? 1 : 0
            },
            currentPage: 1
          });
        }

        async function loadUsers() {
          if (!active.value) return;
          await nextTick();
          await loadSelectedUsers();
          const grid = userGrid.value;
          if (grid && grid.requestApi) {
            grid.requestApi({ apiParam: { group_id: active.value.id } });
          }
        }

        // 已关联用户回显：表格接口同时返回全量 selected（不受当前页影响）
        async function loadSelectedUsers() {
          if (!active.value) return;
          const groupId = active.value.id;
          try {
            const res = await WD.request.get('/admin/group/users', {
              param: { group_id: groupId },
              currentPage: 1,
              pageSize: 1
            });
            if (!active.value || active.value.id !== groupId) return;
            if (res.success && res.data && Array.isArray(res.data.selected)) {
              const selected = res.data.selected.map(String);
              userSelected.value = selected;
              userSaved.value = selected.slice();
            }
          } catch (e) {
            // 勾选回显失败不阻塞表格加载
          }
        }

        // data-grid 启用了 reserve-selection，勾选结果跨页保留，直接整体回写
        function onUserSelect(list) {
          const next = (list || []).map(String);
          userSelected.value = next;
          // 非用户操作（首次加载、切组回显）不触发保存
          if (!usersReady || !active.value) return;
          if (sameUsers(next, userSaved.value)) return;
          pendingUserSave = { groupId: active.value.id, users: next };
          flushUserSave();
        }

        function sameUsers(a, b) {
          if (a.length !== b.length) return false;
          const setB = new Set(b);
          return a.every(id => setB.has(id));
        }

        // 勾选即保存：串行执行，期间新的勾选只保留最后一次
        async function flushUserSave() {
          if (savingUsers) return;
          savingUsers = true;
          try {
            while (pendingUserSave) {
              const task = pendingUserSave;
              pendingUserSave = null;
              const res = await WD.request.post('/admin/group/usersSave', {
                id: task.groupId,
                users: task.users
              });
              if (!res.success) {
                ElMessage.error(res.message || '保存失败');
                continue;
              }
              if (!active.value || active.value.id !== task.groupId) continue;
              userSaved.value = task.users.slice();
              syncUserCount(task.users.length);
              ElMessage.success(res.message || '成员已更新');
            }
          } catch (e) {
            ElMessage.error('保存失败');
          } finally {
            savingUsers = false;
          }
        }

        function syncUserCount(count) {
          if (!active.value) return;
          active.value.userCount = count;
          const row = rows.value.find(r => r.id === active.value.id);
          if (row) row.userCount = count;
        }

        function onUserGridLoaded(res) {
          const payload = (res && res.data) ? res.data : res;
          userTotal.value = Number((payload && payload.total) || 0);
          usersReady = true;
        }

        function openCreate() {
          form.name = '';
          form.roles = [];
          form.remark = '';
        }

        async function onCreated(res, scope) {
          scope && scope.close && scope.close();
          const newId = res && res.data && res.data.id;
          await loadGroups(newId);
        }

        // 编辑抽屉表单：打开时以当前组信息填充
        const editForm = reactive({ id: '', name: '', roles: [], remark: '' });

        function openEdit() {
          if (!active.value) return;
          editForm.id = active.value.id;
          editForm.name = active.value.name;
          editForm.roles = Array.isArray(active.value.roles) ? active.value.roles.slice() : [];
          editForm.remark = active.value.remark || '';
        }

        // 编辑保存成功：关闭抽屉并按当前组刷新（左侧列表 / 详情 / 权限可见性同步重建）
        async function onUpdated(res, scope) {
          scope && scope.close && scope.close();
          await loadGroups(active.value ? active.value.id : '');
        }

        function onDeleted() {
          active.value = null;
          loadGroups();
        }

        onMounted(() => {
          ensureOptions();
          loadGroups();
        });

        return {
          keyword, rows, filteredRows, listLoading, active, activeTab,
          userGrid, form, roleOptions, permState, permLoading, userSelected, userTotal,
          userFilter, queueUserRefresh, refreshUsers,
          editForm, openEdit, onUpdated,
          visibleGrouped, visiblePermissionCount,
          isGroupAllSelected, isGroupIndeterminate, toggleGroup, onPermSelected,
          roleTypeName, selectGroup, onUserSelect, onUserGridLoaded,
          openCreate, onCreated,
          onDeleted
        };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
