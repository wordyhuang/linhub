<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>草稿单 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
    .draft-hint { font-size: 12px; color: #999; margin-top: 8px; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="draft-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        集中处理长期停留在草稿状态的采购单、销售单与退货单。草稿会占用单号，超期后需及时转为正式单据或删除，避免影响后续开单与对账。
      </wd-tips>

      <div class="trade-section">
        <wd-panel :border="true" title="到期提醒（待处理）"
                  description="接近草稿保留期限的单据，可直接编辑、转正式或删除；「转正式」后单据进入正常审批流转，不能再作为草稿修改。">
          <el-button size="small" :icon="Refresh" :loading="loading" @click="load">刷新</el-button>
          <el-table :data="remind" border stripe size="small" style="margin-top:12px">
            <el-table-column prop="doc_no" label="单号" min-width="180" />
            <el-table-column label="类型" width="120">
              <template #default="{ row }">{{ typeLabel(row.doc_type) }}</template>
            </el-table-column>
            <el-table-column prop="created_by" label="制单人" width="110" />
            <el-table-column prop="created_at" label="创建时间" min-width="150" />
            <el-table-column label="操作" width="180" fixed="right">
              <template #default="{ row }">
                <el-button size="small" link type="primary" @click="openEdit(row)">编辑</el-button>
                <el-button size="small" link type="warning" @click="promote(row)">转正式</el-button>
                <el-button size="small" link type="danger" @click="del(row)">删除</el-button>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无到期提醒" /></template>
          </el-table>
          <div class="draft-hint">超过草稿保留期限仍未提交的单据，请在下方超期清单中确认处理后清理。</div>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="已超保留期"
                  description="已超过保留期限的草稿，占用单号且影响统计口径，建议尽快转为正式单据或删除清理；删除后不可恢复。">
          <el-table :data="expired" border stripe size="small">
            <el-table-column prop="doc_no" label="单号" min-width="180" />
            <el-table-column label="类型" width="120">
              <template #default="{ row }">{{ typeLabel(row.doc_type) }}</template>
            </el-table-column>
            <el-table-column prop="created_by" label="制单人" width="110" />
            <el-table-column prop="created_at" label="创建时间" min-width="150" />
            <el-table-column label="操作" width="180" fixed="right">
              <template #default="{ row }">
                <el-button size="small" link type="primary" @click="openEdit(row)">编辑</el-button>
                <el-button size="small" link type="warning" @click="promote(row)">转正式</el-button>
                <el-button size="small" link type="danger" @click="del(row)">删除</el-button>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无超期草稿" /></template>
          </el-table>
        </wd-panel>
      </div>

      <el-dialog v-model="editVisible" title="编辑草稿" width="480px">
        <el-form label-width="90px">
          <el-form-item label="单号"><span>{{ editing.doc_no }}</span></el-form-item>
          <el-form-item label="备注">
            <el-input v-model="editing.remark" type="textarea" :rows="3" placeholder="填写备注" />
          </el-form-item>
          <el-form-item v-if="editing.doc_type === 'purchase_order'" label="预计到货">
            <el-date-picker v-model="editing.expected_arrival_at" type="datetime" value-format="YYYY-MM-DD HH:mm:ss" placeholder="选择预计到货时间" style="width:100%" />
          </el-form-item>
        </el-form>
        <template #footer>
          <el-button size="small" @click="editVisible = false">取消</el-button>
          <el-button size="small" type="primary" :loading="saving" @click="saveEdit">保存</el-button>
        </template>
      </el-dialog>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, onMounted } = Vue;

    const TYPE_MAP = {
      purchase_order: '采购单',
      sale_order: '销售单',
      purchase_return: '采购退货',
      sale_return: '销售退货'
    };

    const app = Vue.createApp({
      template: '#draft-tpl',
      setup() {
        const Refresh = Icons.Refresh;
        const loading = ref(false);
        const remind = ref([]);
        const expired = ref([]);
        const editVisible = ref(false);
        const saving = ref(false);
        const editing = ref({ doc_no: '', doc_type: '', id: 0, remark: '', expected_arrival_at: '' });

        function typeLabel(t) { return TYPE_MAP[t] || (t || '-'); }

        function openEdit(row) {
          editing.value = { doc_no: row.doc_no, doc_type: row.doc_type, id: row.id, remark: row.remark || '', expected_arrival_at: row.expected_arrival_at || '' };
          editVisible.value = true;
        }

        async function saveEdit() {
          saving.value = true;
          try {
            const fd = new FormData();
            fd.append('doc_type', editing.value.doc_type);
            fd.append('id', editing.value.id);
            fd.append('remark', editing.value.remark || '');
            if (editing.value.doc_type === 'purchase_order' && editing.value.expected_arrival_at) {
              fd.append('expected_arrival_at', editing.value.expected_arrival_at);
            }
            const res = await WD.request.post('/trade/toolbox/draftEdit', fd);
            if (res.success) { ElementPlus.ElMessage.success(res.message || '草稿已更新'); editVisible.value = false; load(); }
            else ElementPlus.ElMessage.error(res.message);
          } finally {
            saving.value = false;
          }
        }

        async function promote(row) {
          const fd = new FormData();
          fd.append('doc_type', row.doc_type);
          fd.append('id', row.id);
          const res = await WD.request.post('/trade/toolbox/draftPromote', fd);
          if (res.success) { ElementPlus.ElMessage.success(res.message || '草稿已转正式'); load(); }
          else ElementPlus.ElMessage.error(res.message || '转换失败');
        }

        async function del(row) {
          try {
            await ElementPlus.ElMessageBox.confirm('确认删除该草稿？删除后不可恢复。', '删除草稿', { type: 'warning' });
          } catch (e) { return; }
          const fd = new FormData();
          fd.append('doc_type', row.doc_type);
          fd.append('id', row.id);
          const res = await WD.request.post('/trade/toolbox/draftDelete', fd);
          if (res.success) { ElementPlus.ElMessage.success(res.message || '草稿已删除'); load(); }
          else ElementPlus.ElMessage.error(res.message);
        }

        async function load() {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/toolbox/draftRows');
            if (res.success) {
              remind.value = (res.data && res.data.remind) || [];
              expired.value = (res.data && res.data.expired) || [];
            } else {
              ElementPlus.ElMessage.error(res.message || '加载草稿单失败');
            }
          } finally {
            loading.value = false;
          }
        }

        onMounted(load);

        return { Refresh, loading, remind, expired, typeLabel, load,
          editVisible, saving, editing, openEdit, saveEdit, promote, del };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
