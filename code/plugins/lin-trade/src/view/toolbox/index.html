<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具中心 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .tool-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .tool-card { cursor: pointer; transition: transform .15s; }
    .tool-card:hover { transform: translateY(-2px); }
    .tool-card .icon { font-size: 28px; color: #409eff; margin-bottom: 8px; }
    .tool-card .t { font-size: 15px; font-weight: 600; color: #333; }
    .tool-card .d { font-size: 12px; color: #999; margin-top: 4px; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="tool-tpl">
    <div class="tool-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        工具中心收纳批量处理类功能：期初库存导入与草稿单清理。这些操作不进入正常的单据流转，执行前请先确认数据范围，必要时先备份。
      </wd-tips>

      <wd-panel :border="true" title="可用工具"
                description="点击卡片进入对应工具页；批量导入不可回滚，草稿删除不可恢复，操作前请核对清单。">
        <div class="tool-grid">
        <el-card shadow="hover" class="tool-card" @click="go('/trade/toolbox/import')">
          <div class="icon"><el-icon><Upload /></el-icon></div>
          <div class="t">批量导入</div>
          <div class="d">期初库存批量导入，按商品编码/仓库/数量/成本单价</div>
        </el-card>
        <el-card shadow="hover" class="tool-card" @click="go('/trade/toolbox/draft')">
          <div class="icon"><el-icon><Document /></el-icon></div>
          <div class="t">草稿单</div>
          <div class="d">采购/销售/退货草稿到期提醒与超期清理</div>
        </el-card>
      </div>
      </wd-panel>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;

    const app = Vue.createApp({
      template: '#tool-tpl',
      setup() {
        function go(path) {
          const wd = window.WorkDesktop && window.WorkDesktop.WorkDesktop;
          if (wd && wd.router && wd.router.push) { wd.router.push(path); return; }
          window.location.href = path;
        }
        return { go, Upload: Icons.Upload, Document: Icons.Document };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(window.ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
