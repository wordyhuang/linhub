<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批量导入 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="import-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        用于上线或建档阶段批量录入期初库存。每次导入会生成一个批次号并记录日志，导入结果立即写入库存与成本，请逐行核对后再提交。
      </wd-tips>

      <div class="trade-section">
        <wd-panel :border="true" title="期初库存导入"
                  description="模板列：商品编码 / 仓库 / 数量 / 成本单价。红线：仅允许导入无任何业务流水的商品，已有采购、销售、盘点等记录的商品会被跳过。">
          <el-button size="small" type="primary" :icon="Plus" @click="addRow">新增行</el-button>
          <el-button size="small" type="success" :icon="UploadFilled" :loading="submitting" @click="submit">导入</el-button>
          <el-button size="small" :icon="Download" @click="downloadTemplate">下载模板</el-button>
          <el-button size="small" :icon="Refresh" :loading="loading" @click="load">刷新</el-button>
          <el-table :data="rows" border stripe size="small" style="margin-top:12px">
            <el-table-column label="商品" min-width="180">
              <template #default="{ row }">
                <el-select v-model="row.product_no" size="small" filterable placeholder="选择商品" style="width:100%">
                  <el-option v-for="p in products" :key="p.id" :label="p.name + ' / ' + p.product_no" :value="p.product_no" />
                </el-select>
              </template>
            </el-table-column>
            <el-table-column label="仓库" min-width="150">
              <template #default="{ row }">
                <el-select v-model="row.warehouse_name" size="small" placeholder="选择仓库" style="width:100%">
                  <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.name" />
                </el-select>
              </template>
            </el-table-column>
            <el-table-column label="数量" width="140">
              <template #default="{ row }">
                <el-input-number v-model="row.quantity" :min="1" size="small" controls-position="right" style="width:120px" />
              </template>
            </el-table-column>
            <el-table-column label="成本单价" width="140">
              <template #default="{ row }">
                <el-input-number v-model="row.cost_price" :min="0" :precision="2" size="small" controls-position="right" style="width:120px" />
              </template>
            </el-table-column>
            <el-table-column width="70">
              <template #default="{ row }">
                <el-button size="small" type="danger" link @click="removeRow(row)">删除</el-button>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="请新增导入行" /></template>
          </el-table>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="导入日志"
                  description="每批导入独占一个批次号；状态为「部分成功」表示有行被规则跳过，需按提示修正后重新提交剩余行。">
          <el-table :data="logs" border stripe size="small">
            <el-table-column prop="batch_no" label="批次号" min-width="180" />
            <el-table-column prop="import_type" label="类型" width="110" />
            <el-table-column prop="total_rows" label="总行数" width="90" align="right" />
            <el-table-column prop="success_rows" label="成功" width="90" align="right" />
            <el-table-column prop="status" label="状态" width="100">
              <template #default="{ row }">
                <el-tag size="small" :type="row.status === 'success' ? 'success' : (row.status === 'partial' ? 'warning' : (row.status === 'running' ? 'info' : 'danger'))">{{ row.status_label || row.status }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="operator" label="操作人" width="100" />
            <el-table-column prop="created_at" label="时间" min-width="150" />
            <template #empty><el-empty :image-size="70" description="暂无导入记录" /></template>
          </el-table>
        </wd-panel>
      </div>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#import-tpl',
      setup() {
        const Plus = Icons.Plus;
        const UploadFilled = Icons.UploadFilled;
        const Refresh = Icons.Refresh;
        const Download = Icons.Download;
        const loading = ref(false);
        const submitting = ref(false);
        const rows = ref([]);
        const products = ref([]);
        const warehouses = ref([]);
        const logs = ref([]);

        function newRow() {
          return { product_no: '', warehouse_name: '', quantity: 1, cost_price: 0 };
        }

        function addRow() { rows.value.push(newRow()); }

        function downloadTemplate() {
          window.location.href = '/trade/toolbox/importTemplate';
        }

        function removeRow(row) {
          const i = rows.value.indexOf(row);
          if (i > -1) rows.value.splice(i, 1);
        }

        async function loadOptions() {
          const res = await WD.request.get('/trade/toolbox/importOptions');
          if (res.success) {
            products.value = res.data.products || [];
            warehouses.value = res.data.warehouses || [];
          } else {
            ElementPlus.ElMessage.error(res.message || '加载选项失败');
          }
        }

        async function loadLogs() {
          const res = await WD.request.get('/trade/toolbox/importLogs');
          if (res.success) logs.value = res.data || [];
        }

        async function load() {
          loading.value = true;
          try {
            await Promise.all([loadOptions(), loadLogs()]);
          } finally {
            loading.value = false;
          }
        }

        async function submit() {
          if (!rows.value.filter(function (r) { return r.product_no; }).length) {
            ElementPlus.ElMessage.warning('请先填写导入行');
            return;
          }
          submitting.value = true;
          try {
            const fd = new FormData();
            fd.append('rows', JSON.stringify(rows.value));
            const res = await WD.request.post('/trade/toolbox/importSubmit', fd);
            if (res.success) {
              ElementPlus.ElMessage.success((res.data && res.data.status === 'success' ? '全部导入成功' : '导入完成，部分行被跳过') );
              rows.value = [];
              loadLogs();
            } else {
              ElementPlus.ElMessage.error(res.message || '导入失败');
            }
          } finally {
            submitting.value = false;
          }
        }

        onMounted(load);

        return { Plus, UploadFilled, Refresh, Download, loading, submitting, rows, products, warehouses, logs, addRow, removeRow, submit, load, downloadTemplate };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
