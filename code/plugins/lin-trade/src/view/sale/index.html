<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销售管理 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .trade-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
    }

    .trade-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    /* 明细库存不足提示（销售可超卖，仅标红提醒） */
    .over-stock {
      color: var(--el-color-danger, #f56c6c);
      font-weight: 600;
    }

    /* 新建抽屉底部合计区 */
    .create-total {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 24px;
      padding: 10px 4px 0;
      font-size: 13px;
      color: var(--el-text-color-regular, #606266);
    }

    .create-total b {
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="sale-tpl">
  <div class="trade-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      销售管理覆盖销售单的完整流转：新建草稿 → 待审核 → 已提交 → 分次出库 → 已完成，异常时可作废。
      出库前建议先在「客户信用」页做信用预检；已出库的单据要冲销请用「退货」，不要作废。
      开单支持回车流转（选品 → 数量 → 单价 → 下一行）、自动带出参考售价与实时库存。
    </wd-tips>

    <wd-panel :border="true" title="销售单列表"
              description="只有草稿与待审核状态可作废，已出库订单请走退货；出库数量按未发数量累计，退货不能超过已出库数量。">
      <wd-data-grid ref="grid" api="/trade/sale/rows" api-method="get" :active="true" filter="trade-sale" :with-index="false" :tools="{ refresh: true }"
                    @selection-change="onSelChange">
        <template #toolbar>
          <div class="trade-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="订单号" size="small" clearable style="width:200px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:130px" @change="doSearch">
                <el-option v-for="s in statusOptions" :key="s.value" :label="s.label" :value="s.value" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
              <el-button size="small" :icon="Collection" @click="saveFilter">保存筛选</el-button>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <el-button size="small" type="danger" plain :disabled="!voidableSel.length" :loading="batchVoiding" @click="doBatchVoid">
                批量作废{{ voidableSel.length ? '（' + voidableSel.length + '）' : '' }}
              </el-button>
              <el-button size="small" :icon="Download" @click="doExport">导出</el-button>
              <el-button size="small" type="primary" :icon="Plus" @click="openCreate">新建销售单</el-button>
            </div>
          </div>
        </template>

        <el-table-column type="selection" width="42" :selectable="canVoid" />
        <el-table-column prop="order_no" label="订单号" min-width="150" show-overflow-tooltip />
        <el-table-column label="客户" min-width="120">
          <template #default="{ row }">{{ row.customer_name || row.customer_id || '-' }}</template>
        </el-table-column>
        <el-table-column label="日期" width="120">
          <template #default="{ row }">{{ fmtDate(row.created_at) }}</template>
        </el-table-column>
        <el-table-column label="仓库" min-width="110" show-overflow-tooltip>
          <template #default="{ row }">{{ row.warehouse_name || '-' }}</template>
        </el-table-column>
        <el-table-column label="金额" width="110" align="right">
          <template #default="{ row }">{{ fmtNum(row.total_amount, 2) }}</template>
        </el-table-column>
        <el-table-column prop="outbound_no" label="已出库行数" width="100" align="right" />
        <el-table-column label="状态" width="96">
          <template #default="{ row }">
            <el-tag size="small" :type="stTag(row.status)" effect="light">{{ stName(row) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="创建人" width="90">
          <template #default="{ row }">{{ row.created_by || '-' }}</template>
        </el-table-column>
        <el-table-column label="操作" width="300" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <wd-drawer-button v-if="canOutbound(row)" label="出库" title="销售出库" drawer-size="560px" size="small" type="primary"
                                filter="trade-sale" @open="openOp(row, 'outbound')">
                <template #default>
                  <op-detail :op="op" :st-name="stName" :st-tag="stTag" />
                </template>
                <template #footer="f">
                  <el-button @click="f.close">取消</el-button>
                  <el-button type="primary" :loading="submitting" @click="opSubmit(f)">提交</el-button>
                </template>
              </wd-drawer-button>
              <wd-drawer-button v-if="canReturn(row)" label="退货" title="销售退货" drawer-size="560px" size="small" type="warning"
                                filter="trade-sale" @open="openOp(row, 'return')">
                <template #default>
                  <op-detail :op="op" :st-name="stName" :st-tag="stTag" />
                </template>
                <template #footer="f">
                  <el-button @click="f.close">取消</el-button>
                  <el-button type="primary" :loading="submitting" @click="opSubmit(f)">提交</el-button>
                </template>
              </wd-drawer-button>
              <wd-popconfirm-button v-if="canAudit(row)" title="确认审核通过该销售单？" :tip="'确认通过「' + row.order_no + '」？'"
                                    api="/trade/sale/audit" :api-param="{ id: row.id, approve: 1 }"
                                    type="success" size="small" head-refresh-datagrid="trade-sale">通过</wd-popconfirm-button>
              <wd-popconfirm-button v-if="canAudit(row)" title="确认驳回该销售单？" :tip="'驳回后「' + row.order_no + '」回到草稿'"
                                    api="/trade/sale/audit" :api-param="{ id: row.id, approve: 0 }"
                                    type="warning" size="small" head-refresh-datagrid="trade-sale">驳回</wd-popconfirm-button>
              <wd-popconfirm-button v-if="canVoid(row)" title="确认作废销售单？" :tip="'确认作废「' + row.order_no + '」？'"
                                    api="/trade/sale/cancel" :api-param="{ id: row.id }"
                                    type="danger" size="small" head-refresh-datagrid="trade-sale">作废</wd-popconfirm-button>
              <wd-route-button size="small" type="default" route-path="/trade/print/index"
                               :query="{ type: 'sale', id: row.id }" target="_blank">打印</wd-route-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty>
          <el-empty :image-size="80" description="暂无销售单">
            <el-button type="primary" :icon="Plus" @click="openCreate">新建销售单</el-button>
          </el-empty>
        </template>
      </wd-data-grid>
    </wd-panel>

    <!-- 新建销售单：受控抽屉（支持空态引导/保存并新增连续开单） -->
    <el-drawer v-model="createVisible" title="新建销售单" size="820px" :append-to-body="true" :close-on-click-modal="false">
      <el-form label-width="80px" @submit.prevent>
        <el-row :gutter="12">
          <el-col :span="12">
            <el-form-item label="客户">
              <el-select v-model="form.customer_id" placeholder="选择客户（可空）" clearable filterable style="width:100%"
                         :ref="el => setCellRef('customer', el)" @change="focusCell('wh')">
                <el-option v-for="c in customers" :key="c.id" :label="c.name" :value="c.id" />
              </el-select>
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="仓库" required>
              <el-select v-model="form.warehouse_id" placeholder="选择仓库（必填，决定库存口径）" style="width:100%"
                         :ref="el => setCellRef('wh', el)" @change="onWhChange">
                <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" />
              </el-select>
            </el-form-item>
          </el-col>
        </el-row>
        <el-row :gutter="12">
          <el-col :span="12">
            <el-form-item label="整单优惠">
              <el-input-number v-model="form.discount_amount" :min="0" :precision="2" placeholder="整单优惠金额（可空）" style="width:100%" />
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="备注">
              <el-input v-model="form.remark" placeholder="备注说明" maxlength="200" />
            </el-form-item>
          </el-col>
        </el-row>
      </el-form>

      <el-divider style="margin:2px 0 10px" />
      <div style="margin-bottom:8px">
        <el-button size="small" :icon="Plus" @click="addItem">添加明细</el-button>
      </div>
      <el-table :data="form.items" size="small" border>
        <el-table-column label="商品" min-width="220">
          <template #default="{ row, $index }">
            <el-select v-model="row.product_id" placeholder="搜索/选择商品" filterable style="width:100%" size="small"
                       :ref="el => setCellRef('product-' + $index, el)" @change="onPickProduct(row, $index)">
              <el-option v-for="p in products" :key="p.id" :label="prodLabel(p)" :value="p.id" />
            </el-select>
          </template>
        </el-table-column>
        <el-table-column label="单位" width="64" align="center">
          <template #default="{ row }">{{ row.unit_name || '-' }}</template>
        </el-table-column>
        <el-table-column label="库存" width="80" align="right">
          <template #default="{ row }">
            <span :class="{ 'over-stock': row.stock_qty !== null && Number(row.quantity) > Number(row.stock_qty) }">
              {{ row.stock_qty === null ? '-' : fmtNum(row.stock_qty, 2) }}
            </span>
          </template>
        </el-table-column>
        <el-table-column label="数量" width="120">
          <template #default="{ row, $index }">
            <el-input-number v-model="row.quantity" :min="0" :precision="0" controls-position="right" size="small" style="width:100%"
                             :ref="el => setCellRef('qty-' + $index, el)" @keyup.enter="focusCell('price-' + $index)" />
          </template>
        </el-table-column>
        <el-table-column label="单价" width="130">
          <template #default="{ row, $index }">
            <el-input-number v-model="row.price" :min="0" :precision="2" controls-position="right" size="small" style="width:100%"
                             :ref="el => setCellRef('price-' + $index, el)" @keyup.enter="nextRow($index)" />
          </template>
        </el-table-column>
        <el-table-column label="金额" width="100" align="right">
          <template #default="{ row }">{{ fmtNum(rowAmount(row), 2) }}</template>
        </el-table-column>
        <el-table-column label="操作" width="60" align="center">
          <template #default="{ $index }">
            <el-button size="small" text type="danger" :icon="Delete" @click="removeItem($index)" />
          </template>
        </el-table-column>
      </el-table>

      <div class="create-total">
        <span>共 {{ form.items.length }} 行</span>
        <span>明细合计：<b>￥{{ fmtNum(totalAmount, 2) }}</b></span>
        <span>整单优惠：￥{{ fmtNum(form.discount_amount || 0, 2) }}</span>
        <span>应收：<b style="color:var(--el-color-danger,#f56c6c)">￥{{ fmtNum(payAmount, 2) }}</b></span>
      </div>

      <template #footer>
        <el-button @click="createVisible = false">取消</el-button>
        <el-button :loading="saving" @click="saveOrder(false)">保存草稿</el-button>
        <el-button type="primary" :loading="saving" @click="saveOrder(true)">保存并新增</el-button>
      </template>
    </el-drawer>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    // HTML 转义（防呆弹窗内嵌 HTML 用）
    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, reactive, computed, nextTick, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#sale-tpl',
      setup() {
        const Search = Icons.Search;
        const Plus = Icons.Plus;
        const Delete = Icons.Delete;
        const Download = Icons.Download;
        const Collection = Icons.Collection;

        const statusOptions = [
          { value: 'draft', label: '草稿' },
          { value: 'pending_audit', label: '待审核' },
          { value: 'submitted', label: '已提交' },
          { value: 'partial', label: '部分出库' },
          { value: 'done', label: '已完成' },
          { value: 'closed', label: '已关闭' },
          { value: 'voided', label: '已作废' }
        ];
        const STATUS_TAGS = {
          draft: 'info', pending_audit: 'warning', submitted: 'primary', partial: 'warning', done: 'success', closed: 'info', voided: 'danger'
        };

        const grid = ref(null);
        const keyword = ref('');
        const status = ref('');

        const saving = ref(false);
        const createVisible = ref(false);
        const form = reactive({ customer_id: null, warehouse_id: null, discount_amount: 0, remark: '', items: [] });
        const customers = ref([]);
        const warehouses = ref([]);
        const products = ref([]);
        const prodMap = ref({});
        let formOptionsLoaded = false;

        const submitting = ref(false);
        const op = reactive({ id: 0, mode: 'outbound', order_no: '', status: '', rows: [] });

        // 批量作废
        const selRows = ref([]);
        const batchVoiding = ref(false);
        const voidableSel = computed(function () { return selRows.value.filter(canVoid); });
        function onSelChange(rows) { selRows.value = rows || []; }

        // 状态名走后端翻译（status_label），缺失时回退原始值
        function stName(row) { return row.status_label || row.status; }
        function stTag(st) { return STATUS_TAGS[st] || 'info'; }
        // 日期只展示到天（后端 created_at 为 Y-m-d H:i:s）
        function fmtDate(v) { return v ? String(v).slice(0, 10) : '-'; }
        // 操作可用性（PRD 3.3 状态机：待审核不可出库/退货/作废，审核通过后才可流转）
        function canOutbound(row) { return ['submitted', 'partial'].indexOf(row.status) >= 0; }
        function canReturn(row) { return ['submitted', 'partial', 'done'].indexOf(row.status) >= 0 && Number(row.outbound_no) > 0; }
        function canAudit(row) { return row.status === 'pending_audit'; }
        function canVoid(row) { return ['draft', 'submitted'].indexOf(row.status) >= 0; }

        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim(), status: status.value });
        }

        // 导出：拼当前筛选条件（空值剔除），按浏览器下载
        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }
        function doExport() {
          window.location.href = '/trade/sale/export' + qs({ keyword: keyword.value.trim(), status: status.value });
        }

        // ---------- 保存筛选方案（localStorage，URL 参数优先） ----------
        const FILTER_KEY = 'lin-trade-sale-filter-v1';
        function saveFilter() {
          localStorage.setItem(FILTER_KEY, JSON.stringify({ keyword: keyword.value.trim(), status: status.value }));
          ElementPlus.ElMessage.success('筛选方案已保存，下次进入自动应用');
        }

        // ---------- 回车流转：函数式 ref 收集 + 聚焦 ----------
        const cellRefs = {};
        function setCellRef(key, el) {
          if (el) cellRefs[key] = el; else delete cellRefs[key];
        }
        async function focusCell(key) {
          await nextTick();
          const el = cellRefs[key];
          if (!el) return;
          const input = el.$el && el.$el.querySelector ? el.$el.querySelector('input') : null;
          if (input) input.focus();
        }

        // ---------- 开单：选项与商品（带实时库存） ----------
        async function loadFormOptions() {
          try {
            const res = await WD.request.get('/trade/sale/customers');
            customers.value = res.data || [];
          } catch (e) { customers.value = []; }
          try {
            const res2 = await WD.request.get('/trade/warehouse/options');
            warehouses.value = res2.data || [];
          } catch (e) { warehouses.value = []; }
        }
        async function loadProducts() {
          const wh = parseInt(form.warehouse_id, 10) || 0;
          const url = '/trade/product/options' + (wh > 0 ? '?warehouse_id=' + wh : '');
          try {
            const res = await WD.request.get(url);
            products.value = res.data || [];
            const map = {};
            products.value.forEach(p => { map[Number(p.id)] = p; });
            prodMap.value = map;
            // 换仓后刷新已有行的库存展示
            form.items.forEach(r => {
              const p = map[Number(r.product_id)];
              if (p) r.stock_qty = p.stock_qty === undefined ? null : Number(p.stock_qty);
            });
          } catch (e) { products.value = []; prodMap.value = {}; }
        }

        function prodLabel(p) { return p.name + (p.spec ? '（' + p.spec + '）' : ''); }

        function blankItem() { return { product_id: '', quantity: 1, price: null, unit_name: '', stock_qty: null }; }
        function addItem() { form.items.push(blankItem()); }
        function removeItem(idx) { form.items.splice(idx, 1); }
        function rowAmount(r) { return (parseFloat(r.quantity) || 0) * (parseFloat(r.price) || 0); }
        const totalAmount = computed(function () { return form.items.reduce((s, r) => s + rowAmount(r), 0); });
        const payAmount = computed(function () { return Math.max(0, totalAmount.value - (parseFloat(form.discount_amount) || 0)); });

        // 选品：重复提醒 → 带出单位/库存 → 无价时按参考售价回填 → 聚焦数量
        function onPickProduct(row, idx) {
          const p = prodMap.value[Number(row.product_id)];
          if (!p) return;
          const dup = form.items.findIndex((r, i) => i !== idx && Number(r.product_id) === Number(row.product_id));
          if (dup >= 0) ElementPlus.ElMessage.warning('该商品已在第 ' + (dup + 1) + ' 行，如需分开计价可保留两行');
          row.unit_name = p.unit_name || '';
          row.stock_qty = p.stock_qty === undefined ? null : Number(p.stock_qty);
          if (!(parseFloat(row.price) > 0) && parseFloat(p.reference_sale_price) > 0) {
            row.price = parseFloat(p.reference_sale_price);
            ElementPlus.ElMessage.info('已按参考售价填入单价：' + fmtNum(row.price, 2) + ' 元');
          }
          focusCell('qty-' + idx);
        }

        // 单价回车：最后一行则新增一行并聚焦商品，否则聚焦下一行商品
        function nextRow(idx) {
          if (idx >= form.items.length - 1) {
            addItem();
            focusCell('product-' + (form.items.length - 1));
          } else {
            focusCell('product-' + (idx + 1));
          }
        }

        // 换仓库：重载商品刷新库存口径，并聚焦第一行商品
        async function onWhChange() {
          await loadProducts();
          focusCell('product-0');
        }

        function openCreate() {
          form.customer_id = null;
          form.warehouse_id = null;
          form.discount_amount = 0;
          form.remark = '';
          form.items = [blankItem()];
          createVisible.value = true;
          if (!formOptionsLoaded) { formOptionsLoaded = true; loadFormOptions(); }
          loadProducts();
          focusCell('customer');
        }

        // 保存前防呆：售价低于参考成本时确认
        async function confirmLowPrice(items) {
          const lows = [];
          items.forEach(it => {
            const p = prodMap.value[it.product_id];
            if (p && parseFloat(p.reference_cost_price) > 0 && it.price < parseFloat(p.reference_cost_price)) {
              lows.push({ name: p.name, price: it.price, cost: parseFloat(p.reference_cost_price) });
            }
          });
          if (!lows.length) return true;
          const rows = lows.map(l => '<li>' + escapeHtml(l.name) + '：售价 <b>' + fmtNum(l.price, 2) + '</b> 低于参考成本 <b>' + fmtNum(l.cost, 2) + '</b></li>').join('');
          try {
            await ElementPlus.ElMessageBox.confirm(
              '<p>以下 ' + lows.length + ' 行售价低于参考成本，请确认是否继续保存：</p><ul style="margin:8px 0 0;padding-left:18px">' + rows + '</ul>',
              '低价提醒',
              { dangerouslyUseHTMLString: true, confirmButtonText: '继续保存', cancelButtonText: '返回修改', type: 'warning' }
            );
            return true;
          } catch (e) { return false; }
        }

        async function saveOrder(keep) {
          if (!form.warehouse_id) { ElementPlus.ElMessage.warning('请选择仓库'); focusCell('wh'); return; }
          const items = [];
          form.items.forEach(r => {
            const pid = parseInt(r.product_id, 10);
            const qty = parseFloat(r.quantity);
            const price = parseFloat(r.price);
            if (pid && qty > 0) items.push({ product_id: pid, quantity: qty, price: price || 0 });
          });
          if (!items.length) { ElementPlus.ElMessage.warning('请至少添加一行有效明细（选商品、数量大于 0）'); return; }
          const go = await confirmLowPrice(items);
          if (!go) return;
          const payload = {
            warehouse_id: parseInt(form.warehouse_id, 10) || 0,
            customer_id: parseInt(form.customer_id, 10) || null,
            discount_amount: parseFloat(form.discount_amount) || 0,
            remark: form.remark,
            items
          };
          saving.value = true;
          try {
            const res = await WD.request.post('/trade/sale/save', { data: JSON.stringify(payload) });
            ElementPlus.ElMessage[res.success ? 'success' : 'error'](res.message || (res.success ? '创建成功' : '创建失败'));
            if (!res.success) return;
            grid.value && grid.value.refresh();
            if (keep) {
              // 连续开单：保留客户/仓库，重置明细、优惠与备注
              form.discount_amount = 0;
              form.remark = '';
              form.items = [blankItem()];
              loadProducts();
              focusCell('product-0');
            } else {
              createVisible.value = false;
            }
          } finally {
            saving.value = false;
          }
        }

        // ---------- 批量作废 ----------
        async function doBatchVoid() {
          const rows = voidableSel.value;
          if (!rows.length) return;
          const nos = rows.slice(0, 5).map(r => r.order_no);
          const more = rows.length > 5 ? ' 等 ' + rows.length + ' 单' : '';
          try {
            await ElementPlus.ElMessageBox.confirm(
              '确认批量作废「' + nos.join('、') + '」' + more + '？仅草稿/已提交状态可作废，操作后立即生效。',
              '批量作废',
              { type: 'warning', confirmButtonText: '确认作废', cancelButtonText: '取消' }
            );
          } catch (e) { return; }
          batchVoiding.value = true;
          try {
            const res = await WD.request.post('/trade/sale/batchCancel', { ids: JSON.stringify(rows.map(r => Number(r.id))) });
            grid.value && grid.value.refresh();
            selRows.value = [];
            if (res.success) {
              const d = res.data || {};
              if (d.fail && d.fail.length) {
                ElementPlus.ElMessageBox.alert(
                  '成功 ' + (d.ok || []).length + ' 单；失败 ' + d.fail.length + ' 单：' + d.fail.map(f => '#' + f.id + '（' + f.reason + '）').join('、'),
                  '部分失败', { type: 'warning' }
                );
              } else {
                ElementPlus.ElMessage.success(res.message || '批量作废成功');
              }
            } else {
              ElementPlus.ElMessage.error(res.message || '批量作废失败');
            }
          } finally {
            batchVoiding.value = false;
          }
        }

        async function openOp(row, mode) {
          op.id = row.id;
          op.mode = mode;
          op.order_no = row.order_no;
          op.status = row.status;
          op.rows = [];
          const res = await WD.request.get('/trade/sale/detail?id=' + row.id);
          if (!res.success) { ElementPlus.ElMessage.error(res.message || '加载明细失败'); return; }
          const d = res.data;
          op.order_no = d.order_no;
          op.status = d.status;
          op.status_label = d.status_label || d.status;
          const list = (d.items || []).map(it => {
            const max = mode === 'outbound'
              ? (parseFloat(it.quantity) - parseFloat(it.outbound_qty || 0))
              : (parseFloat(it.outbound_qty || 0) - parseFloat(it.returned_qty || 0));
            const done = mode === 'outbound' ? it.outbound_qty : it.returned_qty;
            return { itemId: it.id, product_id: it.product_id, product_name: it.product_name, quantity: it.quantity, done: done || 0, max: max, input: 0 };
          });
          op.rows = list;
        }

        async function opSubmit(f) {
          const vals = {};
          for (let i = 0; i < op.rows.length; i++) {
            const r = op.rows[i];
            const v = Number(r.input) || 0;
            if (v < 0 || v > r.max) { ElementPlus.ElMessage.warning('明细' + (i + 1) + '数量超出可操作上限[' + r.max + ']'); return; }
            if (v > 0) vals[r.itemId] = v;
          }
          const act = op.mode === 'outbound' ? 'outbound' : 'return';
          submitting.value = true;
          try {
            const res = await WD.request.post('/trade/sale/' + act, { id: op.id, rows: JSON.stringify(vals) });
            if (res.success) {
              f && f.close();
              grid.value && grid.value.refresh();
              if (act === 'return' && res.data && res.data.return_id) {
                const returnId = res.data.return_id;
                ElementPlus.ElMessageBox.confirm(
                  '销售退货单已创建，是否立即打印销售退货单？',
                  '退货成功',
                  { confirmButtonText: '打印退货单', cancelButtonText: '取消', type: 'success' }
                ).then(function () {
                  window.open('/trade/print/index?type=sale_return&id=' + returnId, '_blank');
                }).catch(function () {});
              } else {
                ElementPlus.ElMessage.success(res.message || '操作成功');
              }
            } else {
              ElementPlus.ElMessage.error(res.message || '操作失败');
            }
          } finally {
            submitting.value = false;
          }
        }

        // 进入页面：URL 参数优先，其次恢复上次保存的筛选方案（有才触发二次搜索，避免无谓请求）
        onMounted(function () {
          const params = new URLSearchParams(window.location.search);
          const uk = params.get('keyword') || '';
          const us = params.get('status') || '';
          if (uk || us) {
            keyword.value = uk;
            status.value = us;
            doSearch();
            return;
          }
          try {
            const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || 'null');
            if (saved && (saved.keyword || saved.status)) {
              keyword.value = saved.keyword || '';
              status.value = saved.status || '';
              doSearch();
            }
          } catch (e) { /* 忽略损坏的本地缓存 */ }
        });

        return {
          statusOptions, grid, keyword, status, saving, form, submitting, op, createVisible,
          customers, warehouses, products, prodLabel, onPickProduct, onWhChange,
          addItem, removeItem, rowAmount, totalAmount, payAmount, saveOrder,
          setCellRef, focusCell, nextRow,
          selRows, voidableSel, onSelChange, batchVoiding, doBatchVoid, saveFilter,
          doSearch, stName, stTag, canOutbound, canReturn, canAudit, canVoid, openCreate,
          openOp, opSubmit, doExport, fmtDate, fmtNum,
          Search, Plus, Delete, Download, Collection
        };
      }
    });

    // 出库/退货明细子组件（复用出库、退货两个抽屉的表单体）
    const OpDetail = {
      name: 'OpDetail',
      props: { op: { type: Object, required: true }, stName: Function, stTag: Function },
      methods: {
        fmtNum,
        progressOf(row) {
          const q = Number(row.quantity) || 0;
          if (q <= 0) return 0;
          return Math.min(100, Math.round((Number(row.done) / q) * 100));
        }
      },
      template: `
        <div>
          <p style="margin:0 0 10px;color:var(--el-text-color-secondary,#909399);font-size:13px">
            订单号 {{ op.order_no }} | {{ stName(op) }}
          </p>
          <el-table :data="op.rows" size="small" border stripe>
            <el-table-column label="商品" min-width="160" show-overflow-tooltip>
              <template #default="{ row }">{{ row.product_name || ('#' + row.product_id) }}</template>
            </el-table-column>
            <el-table-column label="数量" width="90" align="right">
              <template #default="{ row }">{{ fmtNum(row.quantity, 2) }}</template>
            </el-table-column>
            <el-table-column label="已处理" width="150" align="right">
              <template #default="{ row }">
                <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
                  <span>{{ fmtNum(row.done, 2) }}</span>
                  <el-progress :percentage="progressOf(row)" :stroke-width="6" :show-text="false"
                               :status="progressOf(row) >= 100 ? 'success' : ''" style="width:56px;flex:none" />
                </div>
              </template>
            </el-table-column>
            <el-table-column label="本次数量">
              <template #default="{ row }">
                <el-input-number v-model="row.input" :min="0" :max="Math.max(0, row.max)" size="small" controls-position="right" style="width:130px" />
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="无可处理明细" /></template>
          </el-table>
        </div>`
    };
    app.component('op-detail', OpDetail);

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
