<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户信用 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
    .credit-opt { margin-left: 4px; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="credit-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        客户信用页用于设置每个客户的赊销额度，查看额度占用情况，并在出库前做信用预检、查询赊销结清状态。
        额度、已占用、可用三者会联动，可用为负数时显示红色；预检结果分为通过、预警、拦截三档。
      </wd-tips>

      <div class="trade-section">
        <wd-panel :border="true" title="客户信用额度管理"
                  description="信用额度按客户维护，保存后立即生效。已占用为未结清应收金额，可用 = 额度 − 已占用；超额客户在出库预检时会被拦截或预警。">
          <el-table :data="list" border stripe size="small">
            <el-table-column label="客户" min-width="140">
              <template #default="{ row }">{{ (row.customer && row.customer.name) || ('#' + row.customer_id) }}</template>
            </el-table-column>
            <el-table-column label="信用额度" width="140">
              <template #default="{ row }">
                <el-input-number v-model="row.credit_limit" :min="0" :precision="2" size="small" controls-position="right" style="width:110px" />
              </template>
            </el-table-column>
            <el-table-column label="已占用" width="110" align="right">
              <template #default="{ row }">{{ fmtNum(row.occupancy, 2) }}</template>
            </el-table-column>
            <el-table-column label="可用" width="110" align="right">
              <template #default="{ row }">
                <span :style="{ color: row.available < 0 ? '#f56c6c' : '#67c23a' }">{{ fmtNum(row.available, 2) }}</span>
              </template>
            </el-table-column>
            <el-table-column label="额度使用" width="110" align="right">
              <template #default="{ row }">{{ fmtNum(row.used_amount, 2) }}</template>
            </el-table-column>
            <el-table-column width="90" fixed="right">
              <template #default="{ row }">
                <el-button size="small" type="primary" link @click="saveLimit(row)">保存</el-button>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无客户信用记录" /></template>
          </el-table>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="信用预检（出库前）"
                  description="选择客户并填入本次出库金额后点击「预检」：额度充足显示通过，已超出显示预警或拦截，仅作参考，不改变单据状态。">
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
            <el-select v-model="checkCid" placeholder="选择客户" size="small" style="width:180px" filterable>
              <el-option v-for="c in customers" :key="c.id" :label="c.name" :value="c.id" />
            </el-select>
            <el-input-number v-model="checkAmount" :min="0" :precision="2" placeholder="本次出库金额" size="small" controls-position="right" style="width:150px" />
            <el-button size="small" type="primary" :icon="Search" @click="doCheck">预检</el-button>
            <el-tag v-if="checkResult" size="small" :type="checkResult === 'block' ? 'danger' : (checkResult === 'alert' ? 'warning' : 'success')" class="credit-opt">
              {{ checkResult === 'block' ? '拦截(超出额度)' : (checkResult === 'alert' ? '预警(已超出)' : '通过') }}
            </el-tag>
          </div>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="赊销结清查询"
                  description="按销售单号查询未结清明细：金额为单据总额，已结为累计收款，未结为仍需收回的金额；结清后自动从列表移除。">
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px">
            <el-input v-model="outKeyword" placeholder="销售单号" size="small" style="width:200px" clearable />
            <el-button size="small" type="primary" :icon="Search" :loading="outLoading" @click="loadOutstanding">查询</el-button>
          </div>
          <el-table :data="unsettled" border stripe size="small">
            <el-table-column prop="order_no" label="销售单号" min-width="150" />
            <el-table-column prop="customer_name" label="客户" min-width="140" />
            <el-table-column label="金额" min-width="110" align="right">
              <template #default="{ row }">{{ fmtNum(row.amount, 2) }}</template>
            </el-table-column>
            <el-table-column label="已结" min-width="100" align="right">
              <template #default="{ row }">{{ fmtNum(row.settled, 2) }}</template>
            </el-table-column>
            <el-table-column label="未结" min-width="110" align="right">
              <template #default="{ row }"><b style="color:#f56c6c">{{ fmtNum(row.unsettled, 2) }}</b></template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无未结清销售单" /></template>
          </el-table>
          <div style="margin-top:12px;display:flex;justify-content:flex-end">
            <el-pagination
              background
              layout="total, prev, pager, next"
              :total="outTotal"
              :current-page="outPage"
              :page-size="outPageSize"
              @current-change="onOutPage" />
          </div>
        </wd-panel>
      </div>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#credit-tpl',
      setup() {
        const Refresh = Icons.Refresh;
        const Search = Icons.Search;
        const list = ref([]);
        const customers = ref([]);
        const unsettled = ref([]);
        const outKeyword = ref('');
        const outLoading = ref(false);
        const outTotal = ref(0);
        const outPage = ref(1);
        const outPageSize = ref(20);
        const checkCid = ref('');
        const checkAmount = ref(0);
        const checkResult = ref('');
        const loading = ref(false);

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        async function loadOutstanding() {
          outLoading.value = true;
          try {
            const res = await WD.request.get('/trade/sale/credit/outstandingRows' + qs({
              keyword: outKeyword.value, page: outPage.value, pageSize: outPageSize.value
            }));
            if (res.success) {
              unsettled.value = (res.data && res.data.list) || [];
              outTotal.value = (res.data && res.data.total) || 0;
            } else {
              ElementPlus.ElMessage.error(res.message || '加载未结清清单失败');
            }
          } finally {
            outLoading.value = false;
          }
        }

        function onOutPage(p) { outPage.value = p; loadOutstanding(); }

        async function load() {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/sale/creditRows');
            if (res.success) list.value = res.data || [];
            else ElementPlus.ElMessage.error(res.message || '加载失败');
            const cRes = await WD.request.get('/trade/sale/customers');
            if (cRes.success) customers.value = cRes.data || [];
          } finally {
            loading.value = false;
          }
        }

        async function saveLimit(row) {
          const fd = new FormData();
          fd.append('customer_id', row.customer_id);
          fd.append('credit_limit', row.credit_limit);
          const res = await WD.request.post('/trade/sale/credit/setLimit', fd);
          if (res.success) { ElementPlus.ElMessage.success(res.message || '已保存'); load(); }
          else ElementPlus.ElMessage.error(res.message);
        }

        async function doCheck() {
          if (!checkCid.value) { ElementPlus.ElMessage.warning('请选择客户'); return; }
          const fd = new FormData();
          fd.append('customer_id', checkCid.value);
          fd.append('delta_amount', checkAmount.value);
          const res = await WD.request.post('/trade/sale/creditCheck', fd);
          if (res.success) checkResult.value = res.data.result;
          else { ElementPlus.ElMessage.error(res.message); checkResult.value = 'block'; }
        }

        onMounted(function () { load(); loadOutstanding(); });

        return { Refresh, Search, list, customers, unsettled, checkCid, checkAmount, checkResult, loading, saveLimit, doCheck, load,
          outKeyword, outLoading, outTotal, outPage, outPageSize, loadOutstanding, onOutPage, fmtNum };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
