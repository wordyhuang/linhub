<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购订单 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .trade-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
    }

    .trade-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .trade-ordergrid {
      width: 100%;
    }

    .trade-expand {
      padding: 8px 24px;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="order-tpl">
  <div class="trade-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      采购订单是采购入库与退货的源头：先建单并录入明细，再按到货情况分次入库或退货。
      展开行可查看每行明细的已收/已退进度；只有草稿与已提交状态可作废，已入库的订单请走退货流程。
    </wd-tips>

    <wd-panel :border="true" title="采购订单列表"
              description="入库按剩余未收数量累计，退货不能超过已收数量；作废后订单不可再入库或退货，历史单据仍会保留在台账中。">
      <wd-data-grid ref="grid" api="/trade/purchase/rows" api-method="get" :active="true" filter="trade-purchase" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="trade-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="订单号" size="small" clearable style="width:200px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:130px" @change="doSearch">
                <el-option v-for="s in statusOptions" :key="s.value" :label="s.label" :value="s.value" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
              <el-button size="small" :icon="Collection" @click="saveFilter">保存筛选</el-button>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <el-button size="small" :icon="Download" @click="doExport">导出</el-button>
              <el-button size="small" type="primary" :icon="Plus" @click="openCreate">新建订单</el-button>
            </div>
          </div>
        </template>

        <el-table-column type="expand">
          <template #default="{ row }">
            <div class="trade-expand">
              <order-progress :id="row.id" />
            </div>
          </template>
        </el-table-column>
        <el-table-column prop="order_no" label="订单号" min-width="150" show-overflow-tooltip />
        <el-table-column label="供应商" min-width="120">
          <template #default="{ row }">{{ row.supplier_name || '-' }}</template>
        </el-table-column>
        <el-table-column prop="expected_arrival_at" label="预计到货" width="130">
          <template #default="{ row }">{{ (row.expected_arrival_at || '').slice(0, 10) || '-' }}</template>
        </el-table-column>
        <el-table-column label="仓库" min-width="110" show-overflow-tooltip>
          <template #default="{ row }">{{ row.warehouse_name || '-' }}</template>
        </el-table-column>
        <el-table-column label="金额" width="110" align="right">
          <template #default="{ row }">{{ fmtNum(row.total_amount, 2) }}</template>
        </el-table-column>
        <el-table-column prop="inbound_no" label="已入库行数" width="100" align="right" />
        <el-table-column label="状态" width="96">
          <template #default="{ row }">
            <el-tag size="small" :type="stTag(row.status)" effect="light">{{ stName(row) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="250" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <wd-drawer-button v-if="canInbound(row)" label="入库" title="采购入库" drawer-size="560px" size="small" type="primary"
                                filter="trade-purchase" @open="openOp(row, 'inbound')">
                <template #default>
                  <op-detail :op="op" :st-name="stName" :st-tag="stTag" />
                </template>
                <template #footer="f">
                  <el-button @click="f.close">取消</el-button>
                  <el-button type="primary" :loading="submitting" @click="opSubmit(f)">提交</el-button>
                </template>
              </wd-drawer-button>
              <wd-drawer-button v-if="canReturn(row)" label="退货" title="采购退货" drawer-size="560px" size="small" type="warning"
                                filter="trade-purchase" @open="openOp(row, 'return')">
                <template #default>
                  <op-detail :op="op" :st-name="stName" :st-tag="stTag" />
                </template>
                <template #footer="f">
                  <el-button @click="f.close">取消</el-button>
                  <el-button type="primary" :loading="submitting" @click="opSubmit(f)">提交</el-button>
                </template>
              </wd-drawer-button>
              <wd-popconfirm-button v-if="canVoid(row)" title="确认作废采购单？" :tip="'确认作废「' + row.order_no + '」？'"
                                    api="/trade/purchase/cancel" :api-param="{ id: row.id }"
                                    type="danger" size="small" head-refresh-datagrid="trade-purchase">作废</wd-popconfirm-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty>
          <el-empty :image-size="80" description="暂无采购单">
            <el-button type="primary" :icon="Plus" @click="openCreate">新建订单</el-button>
          </el-empty>
        </template>
      </wd-data-grid>
    </wd-panel>

    <!-- 新建订单弹出层 -->
    <el-drawer v-model="createVisible" title="新建采购订单" size="780px" :append-to-body="true" :close-on-click-modal="false">
      <el-form label-width="92px">
        <el-row :gutter="12">
          <el-col :span="12">
            <el-form-item label="供应商">
              <el-select v-model="form.supplier_id" placeholder="请选择供应商" clearable filterable style="width:100%"
                         :ref="el => setCellRef('supplier', el)" @change="focusCell('wh')">
                <el-option v-for="s in suppliers" :key="s.id" :label="s.name" :value="s.id" />
              </el-select>
            </el-form-item>
          </el-col>
          <el-col :span="12">
            <el-form-item label="入库仓库" required>
              <el-select v-model="form.warehouse_id" placeholder="请选择仓库（决定库存参考口径）" clearable filterable style="width:100%"
                         :ref="el => setCellRef('wh', el)" @change="onWhChange">
                <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" />
              </el-select>
            </el-form-item>
          </el-col>
        </el-row>
        <el-form-item label="预计到货">
          <el-date-picker v-model="form.expected_arrival_at" type="date" value-format="YYYY-MM-DD"
                          placeholder="选择预计到货日期" clearable style="width:100%" />
        </el-form-item>
        <el-form-item label="备注">
          <el-input v-model="form.remark" placeholder="备注说明" maxlength="200" />
        </el-form-item>

        <el-form-item label="采购明细">
          <div style="width:100%">
            <el-table :data="form.items" size="small" border stripe>
              <el-table-column label="商品" min-width="200">
                <template #default="{ row, $index }">
                  <el-select v-model="row.product_id" placeholder="选择商品" clearable filterable style="width:100%"
                             :ref="el => setCellRef('product-' + $index, el)" @change="onPickProduct(row, $index)">
                    <el-option v-for="p in products" :key="p.id" :label="prodLabel(p)" :value="p.id" />
                  </el-select>
                </template>
              </el-table-column>
              <el-table-column label="库存参考" width="90" align="right">
                <template #default="{ row }">{{ stockOf(row) === null ? '-' : fmtNum(stockOf(row), 2) }}</template>
              </el-table-column>
              <el-table-column label="数量" width="120">
                <template #default="{ row, $index }">
                  <el-input-number v-model="row.quantity" :min="0" :precision="2" :step="1" size="small"
                                   controls-position="right" style="width:100%"
                                   :ref="el => setCellRef('qty-' + $index, el)" @keyup.enter="focusCell('price-' + $index)" />
                </template>
              </el-table-column>
              <el-table-column label="单价" width="120">
                <template #default="{ row, $index }">
                  <el-input-number v-model="row.price" :min="0" :precision="2" size="small"
                                   controls-position="right" style="width:100%"
                                   :ref="el => setCellRef('price-' + $index, el)" @keyup.enter="nextRow($index)" />
                </template>
              </el-table-column>
              <el-table-column label="金额" width="110" align="right">
                <template #default="{ row }">{{ rowAmount(row) }}</template>
              </el-table-column>
              <el-table-column label="操作" width="70" align="center">
                <template #default="{ $index }">
                  <el-button size="small" text type="danger" :icon="Delete" @click="removeItem($index)">移除</el-button>
                </template>
              </el-table-column>
            </el-table>
            <el-button size="small" :icon="Plus" style="margin-top:8px" @click="addItem">添加明细</el-button>
            <div style="margin-top:8px;text-align:right;font-size:13px">
              合计：<b style="font-size:15px;color:#f56c6c">￥{{ fmtNum(totalAmount, 2) }}</b>
            </div>
          </div>
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button @click="createVisible = false">取消</el-button>
        <el-button :loading="saving" @click="saveOrder(false)">保存订单</el-button>
        <el-button type="primary" :loading="saving" @click="saveOrder(true)">保存并新增</el-button>
      </template>
    </el-drawer>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, reactive, computed, nextTick, onMounted } = Vue;

    const statusOptions = [
      { value: 'draft', label: '草稿' },
      { value: 'submitted', label: '已提交' },
      { value: 'partial', label: '部分入库' },
      { value: 'done', label: '已完成' },
      { value: 'closed', label: '已关闭' },
      { value: 'voided', label: '已作废' }
    ];
    const STATUS_TAGS = {
      draft: 'info', submitted: 'primary', partial: 'warning', done: 'success', closed: 'info', voided: 'danger'
    };
    const INBOUND_STATES = ['draft', 'submitted', 'partial'];
    const RETURN_STATES = ['submitted', 'partial', 'done'];
    const VOID_STATES = ['draft', 'submitted'];

    const app = Vue.createApp({
      template: '#order-tpl',
      setup() {
        const Search = Icons.Search;
        const Plus = Icons.Plus;
        const Delete = Icons.Delete;
        const Download = Icons.Download;
        const Collection = Icons.Collection;

        const grid = ref(null);
        const keyword = ref('');
        const status = ref('');

        // 新建订单抽屉
        const createVisible = ref(false);
        const saving = ref(false);
        const suppliers = ref([]);
        const warehouses = ref([]);
        const products = ref([]);
        const stockMap = ref({});
        const form = reactive({ supplier_id: '', warehouse_id: '', expected_arrival_at: '', remark: '', items: [] });
        const totalAmount = computed(() => form.items.reduce((sum, r) => sum + ((Number(r.quantity) || 0) * (Number(r.price) || 0)), 0));

        // 入库/退货操作抽屉
        const submitting = ref(false);
        const op = reactive({ id: 0, mode: 'inbound', order_no: '', status: '', rows: [] });

        // 明细单元格 ref 收集：key 形如 supplier / wh / product-0 / qty-0 / price-0
        const cellRefs = {};
        function setCellRef(key, el) { if (el) cellRefs[key] = el; }
        async function focusCell(key) {
          await nextTick();
          const el = cellRefs[key];
          if (!el) return;
          const input = el.$el ? el.$el.querySelector('input') : null;
          if (input) { input.focus(); if (input.select) input.select(); }
        }

        // 状态名走后端翻译（status_label），缺失时回退原始值
        function stName(row) { return row.status_label || row.status; }
        function stTag(st) { return STATUS_TAGS[st] || 'info'; }
        function canInbound(row) { return INBOUND_STATES.indexOf(row.status) >= 0; }
        function canReturn(row) { return RETURN_STATES.indexOf(row.status) >= 0; }
        function canVoid(row) { return VOID_STATES.indexOf(row.status) >= 0; }

        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim(), status: status.value });
        }

        function prodLabel(p) {
          let s = p.name;
          if (p.spec) s += ' / ' + p.spec;
          if (p.unit_name) s += ' ' + p.unit_name;
          return s;
        }

        function blankItem() { return { product_id: '', quantity: 1, price: null }; }
        function addItem() { form.items.push(blankItem()); }
        function removeItem(idx) { form.items.splice(idx, 1); }
        function rowAmount(r) { return fmtNum((Number(r.quantity) || 0) * (Number(r.price) || 0), 2); }

        async function loadOptions() {
          if (suppliers.value.length) return;
          const res = await WD.request.get('/trade/purchase/formOptions');
          if (res.success) {
            suppliers.value = res.data.suppliers || [];
            warehouses.value = res.data.warehouses || [];
            products.value = res.data.products || [];
          } else {
            ElementPlus.ElMessage.error(res.message || '加载下拉选项失败');
          }
        }

        // 加载当前仓库的实时库存（仅作采购参考，不做上限拦截）
        async function loadStock() {
          const wid = Number(form.warehouse_id) || 0;
          if (!wid) { stockMap.value = {}; return; }
          const res = await WD.request.get('/trade/inventory/quantities?warehouse_id=' + wid);
          stockMap.value = res.success ? (res.data || {}) : {};
        }
        function stockOf(row) {
          const pid = Number(row.product_id);
          if (!pid) return null;
          const v = stockMap.value[pid];
          return v === undefined || v === null ? null : Number(v);
        }

        // 仓库变化：刷新库存参考口径，并聚焦到第一行商品
        async function onWhChange() {
          await loadStock();
          focusCell('product-0');
        }

        // 单价回车：最后一行则新增一行并聚焦其商品，否则聚焦下一行商品
        async function nextRow(idx) {
          if (idx >= form.items.length - 1) {
            addItem();
            await nextTick();
            focusCell('product-' + (idx + 1));
          } else {
            focusCell('product-' + (idx + 1));
          }
        }

        // 列表筛选参数序列化
        function qs(obj) {
          const parts = [];
          for (const k in obj) { if (obj[k] !== '' && obj[k] !== null && obj[k] !== undefined) parts.push(k + '=' + encodeURIComponent(obj[k])); }
          return parts.length ? '?' + parts.join('&') : '';
        }

        // 导出当前筛选下的采购订单（CSV 下载）
        function doExport() {
          const url = '/trade/purchase/export' + qs({ status: status.value, keyword: keyword.value.trim() });
          window.open(url, '_blank');
        }

        // 保存当前筛选方案到 localStorage
        function saveFilter() {
          try {
            localStorage.setItem('lin-trade-purchase-filter-v1', JSON.stringify({ keyword: keyword.value.trim(), status: status.value }));
            ElementPlus.ElMessage.success('筛选方案已保存，下次进入自动恢复');
          } catch (e) { /* localStorage 不可用时静默跳过 */ }
        }

        async function openCreate(prefill, keep) {
          if (!keep) {
            form.supplier_id = '';
            form.warehouse_id = '';
            form.expected_arrival_at = '';
            form.remark = '';
          }
          form.items = [blankItem()];
          await loadOptions();
          await loadStock();
          // 库存预警页跳转带入的采购建议（PG-INV-05）：预填缺口明细
          if (Array.isArray(prefill) && prefill.length) {
            form.items = prefill.map(it => ({
              product_id: Number(it.product_id) || '',
              quantity: Number(it.quantity) || 1,
              price: null
            }));
            ElementPlus.ElMessage.success('已带入 ' + form.items.length + ' 条采购建议明细');
          }
          createVisible.value = true;
          focusCell('product-0');
        }

        // 从库存预警页带 ?create=1&items=[...] 进入时，自动打开新建抽屉并预填（PG-INV-05）；
        // 否则按「URL 筛选参数 > localStorage 保存的筛选方案」恢复列表筛选
        onMounted(() => {
          const p = new URLSearchParams(window.location.search);
          if (p.get('create') === '1') {
            let items = [];
            try { items = JSON.parse(p.get('items') || '[]') || []; } catch (e) { items = []; }
            openCreate(items);
            return;
          }
          const urlKw = p.get('keyword') || '';
          const urlSt = p.get('status') || '';
          if (urlKw || urlSt) {
            keyword.value = urlKw;
            status.value = urlSt;
            doSearch();
            return;
          }
          try {
            const saved = JSON.parse(localStorage.getItem('lin-trade-purchase-filter-v1') || 'null');
            if (saved && (saved.keyword || saved.status)) {
              keyword.value = saved.keyword || '';
              status.value = saved.status || '';
              doSearch();
            }
          } catch (e) { /* 恢复失败时使用默认筛选 */ }
        });

        // 选中商品：回填参考进价（未手动改价时），并聚焦数量格
        function onPickProduct(row, idx) {
          const p = products.value.find(x => x.id === Number(row.product_id));
          if (!p) return;
          const ref = Number(p.reference_cost_price) || 0;
          if (!row.price && ref > 0) {
            row.price = ref;
            ElementPlus.ElMessage.info('已按参考进价 ￥' + ref + ' 回填');
          } else if (ref > 0) {
            ElementPlus.ElMessage.info('参考进价 ￥' + ref + '，可手动调整');
          }
          focusCell('qty-' + idx);
        }

        async function saveOrder(keep) {
          if (!form.warehouse_id) { ElementPlus.ElMessage.warning('请选择入库仓库'); focusCell('wh'); return; }
          const items = [];
          form.items.forEach(r => {
            const pid = Number(r.product_id);
            const qty = Number(r.quantity);
            const price = Number(r.price) || 0;
            if (pid && qty > 0) items.push({ product_id: pid, quantity: qty, price: price || 0 });
          });
          if (!items.length) { ElementPlus.ElMessage.warning('请至少添加一行明细'); focusCell('product-0'); return; }

          const payload = {
            warehouse_id: Number(form.warehouse_id),
            supplier_id: Number(form.supplier_id) || null,
            expected_arrival_at: form.expected_arrival_at || '',
            remark: form.remark,
            items
          };
          saving.value = true;
          try {
            const res = await WD.request.post('/trade/purchase/save', { data: JSON.stringify(payload) });
            ElementPlus.ElMessage[res.success ? 'success' : 'error'](res.message || (res.success ? '创建成功' : '创建失败'));
            if (res.success) {
              grid.value && grid.value.refresh();
              if (keep) {
                // 连续开单：保留供应商/仓库/预计到货，只清明细与备注
                form.remark = '';
                form.items = [blankItem()];
                await loadStock();
                focusCell('product-0');
              } else {
                createVisible.value = false;
              }
            }
          } finally {
            saving.value = false;
          }
        }

        async function openOp(row, mode) {
          op.id = row.id;
          op.mode = mode;
          op.order_no = row.order_no;
          op.status = row.status;
          op.rows = [];
          const res = await WD.request.get('/trade/purchase/detail?id=' + row.id);
          if (!res.success) { ElementPlus.ElMessage.error(res.message || '加载明细失败'); return; }
          const d = res.data;
          op.order_no = d.order_no;
          op.status = d.status;
          op.status_label = d.status_label || d.status;
          op.rows = (d.items || []).map(it => {
            const max = mode === 'inbound'
              ? (parseFloat(it.quantity) - parseFloat(it.received_qty || 0))
              : (parseFloat(it.received_qty || 0) - parseFloat(it.returned_qty || 0));
            const done = mode === 'inbound' ? it.received_qty : it.returned_qty;
            return { itemId: it.id, product_id: it.product_id, product_name: it.product_name, quantity: it.quantity, done: done || 0, max: max, input: 0 };
          });
        }

        async function opSubmit(f) {
          const vals = {};
          for (let i = 0; i < op.rows.length; i++) {
            const r = op.rows[i];
            const v = Number(r.input) || 0;
            if (v < 0 || v > r.max) { ElementPlus.ElMessage.warning('明细' + (i + 1) + '数量超出可操作上限[' + r.max + ']'); return; }
            if (v > 0) vals[r.itemId] = v;
          }
          const act = op.mode === 'inbound' ? 'inbound' : 'return';
          submitting.value = true;
          try {
            const res = await WD.request.post('/trade/purchase/' + act, { id: op.id, rows: JSON.stringify(vals) });
            ElementPlus.ElMessage[res.success ? 'success' : 'error'](res.message || (res.success ? '操作成功' : '操作失败'));
            if (res.success) { f && f.close(); grid.value && grid.value.refresh(); }
          } finally {
            submitting.value = false;
          }
        }

        return {
          Search, Plus, Delete, Download, Collection,
          statusOptions, grid, keyword, status,
          createVisible, saving, suppliers, warehouses, products, form, totalAmount,
          submitting, op,
          stName, stTag, canInbound, canReturn, canVoid, doSearch, prodLabel,
          addItem, removeItem, rowAmount, loadOptions, openCreate, onPickProduct, saveOrder, openOp, opSubmit,
          stockOf, onWhChange, setCellRef, focusCell, nextRow, saveFilter, doExport,
          fmtNum
        };
      }
    });

    // 入库/退货明细子组件（复用入库、退货两个抽屉的表单）
    const OpDetail = {
      name: 'OpDetail',
      props: { op: { type: Object, required: true }, stName: Function, stTag: Function },
      methods: { fmtNum },
      template: `
        <div>
          <p style="margin:0 0 10px;color:var(--el-text-color-secondary,#909399);font-size:13px">
            订单号 {{ op.order_no }} | {{ stName(op) }}
          </p>
          <el-table :data="op.rows" size="small" border stripe>
            <el-table-column label="商品" min-width="160" show-overflow-tooltip>
              <template #default="{ row }">{{ row.product_name || ('#' + row.product_id) }}</template>
            </el-table-column>
            <el-table-column label="数量" width="90" align="right">
              <template #default="{ row }">{{ fmtNum(row.quantity, 2) }}</template>
            </el-table-column>
            <el-table-column label="已处理" width="90" align="right">
              <template #default="{ row }">{{ fmtNum(row.done, 2) }}</template>
            </el-table-column>
            <el-table-column label="本次数量">
              <template #default="{ row }">
                <el-input-number v-model="row.input" :min="0" :max="Math.max(0, row.max)" size="small" controls-position="right" style="width:130px" />
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="无可处理明细" /></template>
          </el-table>
        </div>`
    };
    app.component('op-detail', OpDetail);

    // 行展开：展示订单明细的已收/已退进度
    const OrderProgress = {
      name: 'OrderProgress',
      props: { id: { type: Number, required: true } },
      setup(props) {
        const loading = ref(true);
        const items = ref([]);
        const load = async () => {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/purchase/detail?id=' + props.id);
            if (res.success) items.value = res.data.items || [];
            else ElementPlus.ElMessage.error(res.message || '加载明细失败');
          } finally {
            loading.value = false;
          }
        };
        load();
        function progressOf(row) {
          const q = Number(row.quantity) || 0;
          if (q <= 0) return 0;
          return Math.min(100, Math.round((Number(row.received_qty) / q) * 100));
        }
        return { loading, items, progressOf, fmtNum };
      },
      template: `
        <el-table v-if="!loading" :data="items" size="small" border>
          <el-table-column label="商品" min-width="160" show-overflow-tooltip>
            <template #default="{ row }">{{ row.product_name || ('#' + row.product_id) }}</template>
          </el-table-column>
          <el-table-column label="数量" width="90" align="right">
            <template #default="{ row }">{{ fmtNum(row.quantity, 2) }}</template>
          </el-table-column>
          <el-table-column label="已收" width="150" align="right">
            <template #default="{ row }">
              <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">
                <span>{{ fmtNum(row.received_qty, 2) }}</span>
                <el-progress :percentage="progressOf(row)" :stroke-width="6" :show-text="false"
                             :status="progressOf(row) >= 100 ? 'success' : ''" style="width:56px;flex:none" />
              </div>
            </template>
          </el-table-column>
          <el-table-column label="已退" width="90" align="right">
            <template #default="{ row }">{{ fmtNum(row.returned_qty, 2) }}</template>
          </el-table-column>
          <el-table-column label="单价" align="right">
            <template #default="{ row }">{{ fmtNum(row.price, 2) }}</template>
          </el-table-column>
          <template #empty><el-empty :image-size="60" description="暂无明细" /></template>
        </el-table>
        <div v-else style="padding:16px 0;text-align:center;color:#909399">加载中...</div>`
    };
    app.component('order-progress', OrderProgress);

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
