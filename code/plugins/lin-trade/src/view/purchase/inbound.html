<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购入库 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .trade-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
    }

    .trade-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="inbound-tpl">
  <div class="trade-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      采购入库按采购订单分批收货：录入本次实收数量并提交，库存与成本随即更新。
      列表只展示「已提交 / 部分入库」的待入库订单，本次实收不能超过未收数量，全部收满后订单自动转为已完成。
    </wd-tips>

    <wd-panel :border="true" title="待入库订单"
              description="入库数量会累加到订单的已收数量，并同步写入库存流水；若发现收错，请到采购退货按已收数量退回，不能直接改单。">
      <wd-data-grid ref="grid" api="/trade/purchase/inboundRows" api-method="get" :active="true" filter="trade-purchase-inbound" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="trade-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="订单号" size="small" clearable style="width:200px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <span style="font-size:12px;color:#909399">仅展示「已提交 / 部分入库」的待入库订单</span>
          </div>
        </template>

        <el-table-column prop="order_no" label="订单号" min-width="150" show-overflow-tooltip />
        <el-table-column label="供应商" min-width="130">
          <template #default="{ row }">{{ row.supplier_name || '-' }}</template>
        </el-table-column>
        <el-table-column label="仓库" min-width="110" show-overflow-tooltip>
          <template #default="{ row }">{{ row.warehouse_name || '-' }}</template>
        </el-table-column>
        <el-table-column label="金额" width="110" align="right">
          <template #default="{ row }">{{ fmtNum(row.total_amount, 2) }}</template>
        </el-table-column>
        <el-table-column label="待处理行数" width="100" align="right">
          <template #default="{ row }">{{ (row.rows || []).length }}</template>
        </el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag size="small" :type="stTag(row.status)" effect="light">{{ stName(row) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="120" fixed="right">
          <template #default="{ row }">
            <wd-drawer-button label="入库" title="采购入库" drawer-size="600px" size="small" type="primary"
                              filter="trade-purchase-inbound" @open="openOp(row)">
              <template #default>
                <inbound-op :op="op" :st-name="stName" />
              </template>
              <template #footer="f">
                <el-button @click="f.close">取消</el-button>
                <el-button type="primary" :loading="submitting" @click="opSubmit(f)">提交入库</el-button>
              </template>
            </wd-drawer-button>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="80" description="暂无待入库订单" /></template>
      </wd-data-grid>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, reactive } = Vue;

    const STATUS_TAGS = {
      draft: 'info', submitted: 'primary', partial: 'warning', done: 'success', closed: 'info', voided: 'danger'
    };

    const app = Vue.createApp({
      template: '#inbound-tpl',
      setup() {
        const Search = Icons.Search;
        const grid = ref(null);
        const keyword = ref('');
        const submitting = ref(false);
        const op = reactive({ id: 0, order_no: '', status: '', rows: [] });

        // 状态名走后端翻译（status_label），缺失时回退原始值
        function stName(row) { return row.status_label || row.status; }
        function stTag(st) { return STATUS_TAGS[st] || 'info'; }
        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim() });
        }

        // 行内 rows 已由后端按"未收 > 0"组装
        function openOp(row) {
          op.id = row.id;
          op.order_no = row.order_no;
          op.status = row.status;
          op.status_label = row.status_label || row.status;
          op.rows = (row.rows || []).map(r => ({
            itemId: r.itemId,
            product: r.product,
            quantity: r.quantity,
            received: r.received,
            pending: r.pending,
            input: 0
          }));
        }

        async function opSubmit(f) {
          const vals = {};
          for (let i = 0; i < op.rows.length; i++) {
            const r = op.rows[i];
            const v = Number(r.input) || 0;
            if (v < 0 || v > r.pending) { ElementPlus.ElMessage.warning('明细' + (i + 1) + '本次实收超出未收上限[' + r.pending + ']'); return; }
            if (v > 0) vals[r.itemId] = v;
          }
          submitting.value = true;
          try {
            const res = await WD.request.post('/trade/purchase/inbound', { id: op.id, rows: JSON.stringify(vals) });
            ElementPlus.ElMessage[res.success ? 'success' : 'error'](res.message || (res.success ? '入库成功' : '入库失败'));
            if (res.success) { f && f.close(); grid.value && grid.value.refresh(); }
          } finally {
            submitting.value = false;
          }
        }

        return { Search, grid, keyword, submitting, op, stName, stTag, doSearch, openOp, opSubmit, fmtNum };
      }
    });

    const InboundOp = {
      name: 'InboundOp',
      props: { op: { type: Object, required: true }, stName: Function },
      methods: { fmtNum },
      template: `
        <div>
          <p style="margin:0 0 10px;color:var(--el-text-color-secondary,#909399);font-size:13px">
            订单号 {{ op.order_no }} | {{ stName(op) }}
          </p>
          <el-table :data="op.rows" size="small" border stripe>
            <el-table-column label="商品" min-width="150">
              <template #default="{ row }">{{ row.product }}</template>
            </el-table-column>
            <el-table-column label="数量" width="90" align="right">
              <template #default="{ row }">{{ fmtNum(row.quantity, 2) }}</template>
            </el-table-column>
            <el-table-column label="已收" width="80" align="right">
              <template #default="{ row }">{{ fmtNum(row.received, 2) }}</template>
            </el-table-column>
            <el-table-column label="未收" width="80" align="right">
              <template #default="{ row }">{{ fmtNum(row.pending, 2) }}</template>
            </el-table-column>
            <el-table-column label="本次实收">
              <template #default="{ row }">
                <el-input-number v-model="row.input" :min="0" :max="Math.max(0, row.pending)" size="small" controls-position="right" style="width:130px" />
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="无可入库明细" /></template>
          </el-table>
        </div>`
    };
    app.component('inbound-op', InboundOp);

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
