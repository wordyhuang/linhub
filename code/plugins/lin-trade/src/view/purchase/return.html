<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购退货 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .trade-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
    }

    .trade-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="return-tpl">
  <div class="trade-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      采购退货用于把已入库的商品退回供应商：按已收数量扣减库存与应付。
      列表只展示已入库且有可退余量的订单，可退数量 = 已收 − 已退；提交成功后可立即打印采购退货单。
    </wd-tips>

    <wd-panel :border="true" title="待退货订单"
              description="退货数量不能超过可退余量，累计退货不能大于累计入库；退货提交后库存即时扣减，操作不可撤销，请核对数量后再提交。">
      <wd-data-grid ref="grid" api="/trade/purchase/returnRows" api-method="get" :active="true" filter="trade-purchase-return" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="trade-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="订单号" size="small" clearable style="width:200px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <span style="font-size:12px;color:#909399">仅展示已入库且有可退余量的订单，可退数量 = 已收 - 已退</span>
          </div>
        </template>

        <el-table-column prop="order_no" label="订单号" min-width="150" show-overflow-tooltip />
        <el-table-column label="供应商" min-width="130">
          <template #default="{ row }">{{ row.supplier_name || '-' }}</template>
        </el-table-column>
        <el-table-column label="仓库" min-width="110" show-overflow-tooltip>
          <template #default="{ row }">{{ row.warehouse_name || '-' }}</template>
        </el-table-column>
        <el-table-column label="金额" width="110" align="right">
          <template #default="{ row }">{{ fmtNum(row.total_amount, 2) }}</template>
        </el-table-column>
        <el-table-column label="可退行数" width="100" align="right">
          <template #default="{ row }">{{ (row.rows || []).length }}</template>
        </el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag size="small" :type="stTag(row.status)" effect="light">{{ stName(row) }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="120" fixed="right">
          <template #default="{ row }">
            <wd-drawer-button label="退货" title="采购退货" drawer-size="600px" size="small" type="warning"
                              filter="trade-purchase-return" @open="openOp(row)">
              <template #default>
                <return-op :op="op" :st-name="stName" />
              </template>
              <template #footer="f">
                <el-button @click="f.close">取消</el-button>
                <el-button type="primary" :loading="submitting" @click="opSubmit(f)">提交退货</el-button>
              </template>
            </wd-drawer-button>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="80" description="暂无待退货订单" /></template>
      </wd-data-grid>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, reactive } = Vue;

    const STATUS_TAGS = {
      draft: 'info', submitted: 'primary', partial: 'warning', done: 'success', closed: 'info', voided: 'danger'
    };

    const app = Vue.createApp({
      template: '#return-tpl',
      setup() {
        const Search = Icons.Search;
        const grid = ref(null);
        const keyword = ref('');
        const submitting = ref(false);
        const op = reactive({ id: 0, order_no: '', status: '', rows: [] });

        // 状态名走后端翻译（status_label），缺失时回退原始值
        function stName(row) { return row.status_label || row.status; }
        function stTag(st) { return STATUS_TAGS[st] || 'info'; }
        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim() });
        }

        // 行内 rows 已由后端按"已收 - 已退 > 0"组装
        function openOp(row) {
          op.id = row.id;
          op.order_no = row.order_no;
          op.status = row.status;
          op.status_label = row.status_label || row.status;
          op.rows = (row.rows || []).map(r => ({
            itemId: r.itemId,
            product: r.product,
            received: r.received,
            returned: r.returned,
            avail: r.avail,
            input: 0
          }));
        }

        async function opSubmit(f) {
          const vals = {};
          for (let i = 0; i < op.rows.length; i++) {
            const r = op.rows[i];
            const v = Number(r.input) || 0;
            if (v < 0 || v > r.avail) { ElementPlus.ElMessage.warning('明细' + (i + 1) + '退货数量超出可退上限[' + r.avail + ']'); return; }
            if (v > 0) vals[r.itemId] = v;
          }
          submitting.value = true;
          try {
            const res = await WD.request.post('/trade/purchase/return', { id: op.id, rows: JSON.stringify(vals) });
            if (res.success) {
              f && f.close();
              grid.value && grid.value.refresh();
              const returnId = res.data && res.data.return_id;
              ElementPlus.ElMessageBox.confirm(
                '退货单已创建，是否立即打印采购退货单？',
                '退货成功',
                { confirmButtonText: '打印退货单', cancelButtonText: '取消', type: 'success' }
              ).then(function () {
                if (returnId) window.open('/trade/print/index?type=purchase_return&id=' + returnId, '_blank');
              }).catch(function () {});
            } else {
              ElementPlus.ElMessage.error(res.message || '退货失败');
            }
          } finally {
            submitting.value = false;
          }
        }

        return { Search, grid, keyword, submitting, op, stName, stTag, doSearch, openOp, opSubmit, fmtNum };
      }
    });

    const ReturnOp = {
      name: 'ReturnOp',
      props: { op: { type: Object, required: true }, stName: Function },
      methods: { fmtNum },
      template: `
        <div>
          <p style="margin:0 0 10px;color:var(--el-text-color-secondary,#909399);font-size:13px">
            订单号 {{ op.order_no }} | {{ stName(op) }}
          </p>
          <el-table :data="op.rows" size="small" border stripe>
            <el-table-column label="商品" min-width="150">
              <template #default="{ row }">{{ row.product }}</template>
            </el-table-column>
            <el-table-column label="已收" width="80" align="right">
              <template #default="{ row }">{{ fmtNum(row.received, 2) }}</template>
            </el-table-column>
            <el-table-column label="已退" width="80" align="right">
              <template #default="{ row }">{{ fmtNum(row.returned, 2) }}</template>
            </el-table-column>
            <el-table-column label="可退" width="80" align="right">
              <template #default="{ row }">{{ fmtNum(row.avail, 2) }}</template>
            </el-table-column>
            <el-table-column label="本次退货">
              <template #default="{ row }">
                <el-input-number v-model="row.input" :min="0" :max="Math.max(0, row.avail)" size="small" controls-position="right" style="width:130px" />
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="无可退明细" /></template>
          </el-table>
        </div>`
    };
    app.component('return-op', ReturnOp);

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
