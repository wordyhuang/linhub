<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计量单位 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .trade-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
    }

    .trade-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .trade-tag {
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="unit-tpl">
  <div class="trade-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      计量单位用于标识商品的库存与交易口径（如件、箱、千克），在商品档案中引用。修改单位名称不会改变已有库存数量。
    </wd-tips>

    <wd-panel :border="true" title="计量单位"
              description="单位名称需唯一；停用单位后不可再被新商品选用，已使用该单位的商品保持原样。">
      <wd-data-grid ref="grid" api="/trade/unit/rows" api-method="get" :active="true" filter="trade-unit" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="trade-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="单位名称" size="small" clearable style="width:200px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:110px" @change="doSearch">
                <el-option label="启用" value="1" />
                <el-option label="停用" value="0" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <wd-drawer-button label="新增单位" title="新增单位" drawer-size="420px" size="small" type="primary"
                              filter="trade-unit" :data="{ name: '' }">
              <wd-data-form mode="create" submit-api="/trade/unit/save" submit-method="post"
                            submit-keys="name" :head-close-drawer="true" :head-refresh-datagrid="'trade-unit'"
                            :confirm-leave="true" label-width="80px"
                            :rules="{ name: [{ required: true, message: '请填写单位名称', trigger: 'blur' }] }">
                <wd-form-item label="名称" prop="name" required>
                  <el-input v-model="model.name" placeholder="输入单位名称，如：件、箱、千克" maxlength="30" />
                </wd-form-item>
              </wd-data-form>
            </wd-drawer-button>
          </div>
        </template>

        <el-table-column prop="name" label="名称" min-width="180" show-overflow-tooltip />
        <el-table-column label="状态" width="90">
          <template #default="{ row }">
            <el-tag size="small" :type="on(row.status) ? 'success' : 'info'" effect="light"
                    class="trade-tag">{{ row.status_label || (on(row.status) ? '启用' : '停用') }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="220" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <wd-drawer-button label="编辑" title="编辑单位" drawer-size="420px" size="small" type="primary"
                                filter="trade-unit" :data="row">
                <wd-data-form mode="edit" submit-api="/trade/unit/save" submit-method="post"
                              submit-keys="id,name" :head-close-drawer="true" :head-refresh-datagrid="'trade-unit'"
                              :confirm-leave="true" label-width="80px"
                              :rules="{ name: [{ required: true, message: '请填写单位名称', trigger: 'blur' }] }">
                  <wd-form-item label="名称" prop="name" required>
                    <el-input v-model="model.name" placeholder="输入单位名称" maxlength="30" />
                  </wd-form-item>
                </wd-data-form>
              </wd-drawer-button>
              <wd-popconfirm-button :title="on(row.status) ? '确认停用单位？' : '确认启用单位？'"
                                    :tip="'确认「' + row.name + '」' + (on(row.status) ? '停用' : '启用') + '？'"
                                    api="/trade/unit/switch"
                                    :api-param="{ id: row.id, mode: on(row.status) ? 'off' : 'on' }"
                                    :type="on(row.status) ? 'danger' : 'success'" size="small"
                                    head-refresh-datagrid="trade-unit">
                {{ on(row.status) ? '停用' : '启用' }}
              </wd-popconfirm-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="80" description="暂无单位" /></template>
      </wd-data-grid>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive } = Vue;

    const app = Vue.createApp({
      template: '#unit-tpl',
      setup() {
        const grid = ref(null);
        const keyword = ref('');
        const status = ref('');
        const Search = window.ElementPlusIconsVue.Search;

        function on(v) { return parseInt(v, 10) === 1; }

        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim(), status: status.value });
        }

        return { grid, keyword, status, Search, on, doSearch };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
