<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>林销 · 业务概览</title>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 6px 2px 12px; box-sizing: border-box;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    .tile {
      border: 1px solid #ebeef5; border-radius: 8px;
      padding: 10px 14px; background: #fff; min-width: 0;
    }
    .tile .label { font-size: 12px; color: #909399; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .value { font-size: 22px; font-weight: 600; color: #303133; margin-top: 4px; line-height: 1.25; white-space: nowrap; }
    .tile .sub   { font-size: 11px; color: #c0c4cc; margin-top: 2px; white-space: nowrap; }
    .tile.warn .value { color: #e6a23c; }
    @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="stats">
    <div class="tile">
      <div class="label">商品总数</div>
      <div class="value">{$v_product_total} <span style="font-size:12px;font-weight:400;color:#909399;">种</span></div>
      <div class="sub">在库商品 {$v_stock_products} 种</div>
    </div>
    <div class="tile">
      <div class="label">库存总金额</div>
      <div class="value">¥{$v_stock_amount}</div>
      <div class="sub">库存总量 {$v_stock_qty}（近似进价口径）</div>
    </div>
    <div class="tile{$v_low_warn}">
      <div class="label">低库存预警</div>
      <div class="value">{$v_low_count} <span style="font-size:12px;font-weight:400;color:#909399;">种</span></div>
      <div class="sub">低于安全库存商品数</div>
    </div>
    <div class="tile">
      <div class="label">本月采购单</div>
      <div class="value">{$v_po_cnt} <span style="font-size:12px;font-weight:400;color:#909399;">单</span></div>
      <div class="sub">采购金额 ¥{$v_po_amount}</div>
    </div>
    <div class="tile">
      <div class="label">本月销售单</div>
      <div class="value">{$v_so_cnt} <span style="font-size:12px;font-weight:400;color:#909399;">单</span></div>
      <div class="sub">销售金额 ¥{$v_so_amount}</div>
    </div>
    <div class="tile">
      <div class="label">今日出入库</div>
      <div class="value">+{$v_today_in} <span style="font-size:12px;font-weight:400;color:#909399;">/</span> -{$v_today_out}</div>
      <div class="sub">入库量 / 出库量</div>
    </div>
  </div>
</body>
</html>
