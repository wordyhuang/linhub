<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .trade-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
    }

    .trade-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .trade-tag {
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="product-tpl">
  <div class="trade-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      商品档案是进销存的基础数据：维护编号、名称、规格、单位、分类与安全库存，并登记参考进价与参考售价。
      停用商品不会出现在采购、销售等新单据的商品下拉中，历史单据不受影响。
    </wd-tips>

    <wd-panel :border="true" title="商品档案"
              description="编号留空将由系统自动生成；参考进/售价仅作默认取价参考，实际出入库价格以单据为准。">
      <wd-data-grid ref="grid" api="/trade/product/rows" api-method="get" :active="true" filter="trade-product" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="trade-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="商品名称 / 编号" size="small" clearable style="width:200px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:110px" @change="doSearch">
                <el-option label="启用" value="1" />
                <el-option label="停用" value="0" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <wd-drawer-button label="新增商品" title="新增商品" drawer-size="480px" size="small" type="primary"
                              filter="trade-product" :data="createDefaults">
              <wd-data-form mode="create" submit-api="/trade/product/save" submit-method="post"
                            submit-keys="product_no,name,spec,unit_id,category_id,is_production,safety_stock,reference_cost_price,reference_sale_price"
                            :head-close-drawer="true" :head-refresh-datagrid="'trade-product'"
                            :confirm-leave="true" label-width="90px"
                            :rules="{ name: [{ required: true, message: '请填写名称', trigger: 'blur' }] }">
                <wd-form-item label="编号" prop="product_no">
                  <el-input v-model="model.product_no" placeholder="留空则自动生成" maxlength="40" />
                </wd-form-item>
                <wd-form-item label="名称" prop="name" required>
                  <el-input v-model="model.name" placeholder="输入商品名称" maxlength="80" />
                </wd-form-item>
                <wd-form-item label="规格" prop="spec">
                  <el-input v-model="model.spec" placeholder="输入规格" maxlength="60" />
                </wd-form-item>
                <wd-form-item label="单位" prop="unit_id">
                  <wd-select v-model="model.unit_id" api="/trade/unit/options" api-method="get"
                             text-prop="name" value-prop="id" placeholder="选择单位" clearable style="width:100%" />
                </wd-form-item>
                <wd-form-item label="分类" prop="category_id">
                  <wd-select v-model="model.category_id" api="/trade/category/options" api-method="get"
                             text-prop="name" value-prop="id" placeholder="选择分类" clearable style="width:100%" />
                </wd-form-item>
                <wd-form-item label="生产" prop="is_production">
                  <el-select v-model="model.is_production" style="width:100%">
                    <el-option label="否" :value="0" />
                    <el-option label="是" :value="1" />
                  </el-select>
                </wd-form-item>
                <wd-form-item label="安全库存" prop="safety_stock">
                  <el-input-number v-model="model.safety_stock" :min="0" :precision="0" style="width:100%" />
                </wd-form-item>
                <wd-form-item label="参考进价" prop="reference_cost_price">
                  <el-input-number v-model="model.reference_cost_price" :min="0" :precision="2" style="width:100%" />
                </wd-form-item>
                <wd-form-item label="参考售价" prop="reference_sale_price">
                  <el-input-number v-model="model.reference_sale_price" :min="0" :precision="2" style="width:100%" />
                </wd-form-item>
              </wd-data-form>
            </wd-drawer-button>
          </div>
        </template>

        <el-table-column prop="product_no" label="编号" min-width="120" />
        <el-table-column prop="name" label="名称" min-width="160" show-overflow-tooltip />
        <el-table-column prop="spec" label="规格" min-width="120" show-overflow-tooltip />
        <el-table-column label="单位" width="90">
          <template #default="{ row }">{{ (row.unit && row.unit.name) || '-' }}</template>
        </el-table-column>
        <el-table-column label="分类" width="110">
          <template #default="{ row }">{{ (row.category && row.category.name) || '-' }}</template>
        </el-table-column>
        <el-table-column label="生产" width="80">
          <template #default="{ row }">
            <el-tag size="small" :type="on(row.is_production) ? 'warning' : 'info'" effect="plain">
              {{ on(row.is_production) ? '是' : '否' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="安全库存" width="96" align="right">
          <template #default="{ row }">{{ fmtNum(row.safety_stock, 0) }}</template>
        </el-table-column>
        <el-table-column label="状态" width="90">
          <template #default="{ row }">
            <el-tag size="small" :type="on(row.status) ? 'success' : 'info'" effect="light"
                    class="trade-tag">{{ row.status_label || (on(row.status) ? '启用' : '停用') }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="220" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <wd-drawer-button label="编辑" title="编辑商品" drawer-size="480px" size="small" type="primary"
                                filter="trade-product" :data="editRow(row)">
                <wd-data-form mode="edit" submit-api="/trade/product/save" submit-method="post"
                              submit-keys="id,product_no,name,spec,unit_id,category_id,is_production,safety_stock,reference_cost_price,reference_sale_price"
                              :head-close-drawer="true" :head-refresh-datagrid="'trade-product'"
                              :confirm-leave="true" label-width="90px"
                              :rules="{ name: [{ required: true, message: '请填写名称', trigger: 'blur' }] }">
                  <wd-form-item label="编号" prop="product_no">
                    <el-input v-model="model.product_no" placeholder="留空则自动生成" maxlength="40" />
                  </wd-form-item>
                  <wd-form-item label="名称" prop="name" required>
                    <el-input v-model="model.name" placeholder="输入商品名称" maxlength="80" />
                  </wd-form-item>
                  <wd-form-item label="规格" prop="spec">
                    <el-input v-model="model.spec" placeholder="输入规格" maxlength="60" />
                  </wd-form-item>
                  <wd-form-item label="单位" prop="unit_id">
                    <wd-select v-model="model.unit_id" api="/trade/unit/options" api-method="get"
                               text-prop="name" value-prop="id" placeholder="选择单位" clearable style="width:100%" />
                  </wd-form-item>
                  <wd-form-item label="分类" prop="category_id">
                    <wd-select v-model="model.category_id" api="/trade/category/options" api-method="get"
                               text-prop="name" value-prop="id" placeholder="选择分类" clearable style="width:100%" />
                  </wd-form-item>
                  <wd-form-item label="生产" prop="is_production">
                    <el-select v-model="model.is_production" style="width:100%">
                      <el-option label="否" :value="0" />
                      <el-option label="是" :value="1" />
                    </el-select>
                  </wd-form-item>
                  <wd-form-item label="安全库存" prop="safety_stock">
                    <el-input-number v-model="model.safety_stock" :min="0" :precision="0" style="width:100%" />
                  </wd-form-item>
                  <wd-form-item label="参考进价" prop="reference_cost_price">
                    <el-input-number v-model="model.reference_cost_price" :min="0" :precision="2" style="width:100%" />
                  </wd-form-item>
                  <wd-form-item label="参考售价" prop="reference_sale_price">
                    <el-input-number v-model="model.reference_sale_price" :min="0" :precision="2" style="width:100%" />
                  </wd-form-item>
                </wd-data-form>
              </wd-drawer-button>
              <wd-popconfirm-button :title="on(row.status) ? '确认停用商品？' : '确认启用商品？'"
                                    :tip="'确认「' + row.name + '」' + (on(row.status) ? '停用' : '启用') + '？'"
                                    api="/trade/product/switch"
                                    :api-param="{ id: row.id, mode: on(row.status) ? 'off' : 'on' }"
                                    :type="on(row.status) ? 'danger' : 'success'" size="small"
                                    head-refresh-datagrid="trade-product">
                {{ on(row.status) ? '停用' : '启用' }}
              </wd-popconfirm-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="80" description="暂无商品" /></template>
      </wd-data-grid>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const { ref, reactive, computed } = Vue;

    const app = Vue.createApp({
      template: '#product-tpl',
      setup() {
        const grid = ref(null);
        const keyword = ref('');
        const status = ref('');
        const Search = window.ElementPlusIconsVue.Search;
        // 新增抽屉初始值（wd-data-form create 模式经 data 回填）
        const createDefaults = {
          product_no: '', name: '', spec: '', unit_id: null, category_id: null,
          is_production: 1, safety_stock: 0, reference_cost_price: 0, reference_sale_price: 0
        };

        function on(v) { return parseInt(v, 10) === 1; }

        // 下拉选项接口返回的 id 是字符串，列表行的外键是数字；
        // 编辑回填前统一成字符串，避免下拉框匹配不到选项而直接显示原始 ID。
        function editRow(row) {
          const toKey = (v) => (v === null || v === undefined || v === '') ? null : String(v);
          return Object.assign({}, row, {
            unit_id: toKey(row.unit_id),
            category_id: toKey(row.category_id)
          });
        }

        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim(), status: status.value });
        }

        return { grid, keyword, status, Search, createDefaults, on, doSearch, fmtNum, editRow };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
