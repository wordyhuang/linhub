<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC 分类分析 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
    .abc-sum { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
    .abc-stat { min-width: 160px; flex: 1; }
    .abc-stat .num { font-size: 22px; font-weight: 700; }
    .abc-stat .lbl { font-size: 12px; color: #999; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .abc-desc { font-size: 12px; color: #909399; margin-bottom: 10px; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="abc-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        ABC 分类按近 90 天出库金额贡献把商品分为 A/B/C 三类，分类结果会写回商品档案，便于制定差异化的备货与盘点策略。
        数据随出库变化，建议按月重新分类；A 类商品应重点保供，C 类可降低安全库存。
      </wd-tips>

      <div class="trade-section">
        <wd-panel :border="true" title="ABC 分类统计（近 90 天出库金额贡献）"
                  description="按出库金额降序累计：占比 ≤80% 为 A 类，≤95% 为 B 类，其余为 C 类；统计口径为销售出库，不含退货冲减。">
          <div class="abc-sum">
          <el-card shadow="never" class="abc-stat">
            <div class="num" style="color:#409eff">{{ stats.total || 0 }}</div>
            <div class="lbl">已分类商品数</div>
          </el-card>
          <el-card shadow="never" class="abc-stat">
            <div class="num" style="color:#f56c6c">{{ stats.a || 0 }}</div>
            <div class="lbl">A 类（核心品类）</div>
            <el-progress :percentage="pct('a')" color="#f56c6c" :stroke-width="8" />
          </el-card>
          <el-card shadow="never" class="abc-stat">
            <div class="num" style="color:#e6a23c">{{ stats.b || 0 }}</div>
            <div class="lbl">B 类（重要品类）</div>
            <el-progress :percentage="pct('b')" color="#e6a23c" :stroke-width="8" />
          </el-card>
          <el-card shadow="never" class="abc-stat">
            <div class="num" style="color:#909399">{{ stats.c || 0 }}</div>
            <div class="lbl">C 类（长尾品类）</div>
            <el-progress :percentage="pct('c')" color="#909399" :stroke-width="8" />
          </el-card>
          </div>
          <div class="abc-desc" style="margin-bottom:0">分类依据：近 90 天销售出库金额降序累计，A 类 ≤80%、B 类 ≤95%、其余 C 类。分类结果已写回商品档案。</div>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="商品分类明细"
                  description="「重新分类」会按当前出库数据重算并覆盖全部商品分类，请确认数据完整后再执行；筛选只影响展示，不改变分类结果。">
          <div class="toolbar">
          <el-radio-group v-model="cls" size="small" @change="load">
            <el-radio-button label="">全部</el-radio-button>
            <el-radio-button label="A">A 类</el-radio-button>
            <el-radio-button label="B">B 类</el-radio-button>
            <el-radio-button label="C">C 类</el-radio-button>
          </el-radio-group>
          <span style="flex:1"></span>
          <el-button size="small" type="primary" :icon="DataAnalysis" :loading="loading" @click="reclassify">重新分类</el-button>
          <el-button size="small" :icon="Refresh" :loading="loading" @click="load">刷新</el-button>
          </div>
          <el-table :data="list" border stripe size="small">
            <el-table-column prop="product_no" label="编号" min-width="120" />
            <el-table-column prop="name" label="商品" min-width="180" show-overflow-tooltip />
            <el-table-column label="分类" width="90">
              <template #default="{ row }">
                <el-tag size="small" :type="abcType(row.abc_class)">{{ row.abc_class || '-' }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="参考进价" min-width="120" align="right">
              <template #default="{ row }">{{ fmtNum(row.reference_cost_price, 2) }}</template>
            </el-table-column>
            <el-table-column label="状态" width="90">
              <template #default="{ row }">
                <el-tag size="small" :type="row.status === 1 ? 'success' : 'info'">{{ row.status_label || (row.status === 1 ? '启用' : '停用') }}</el-tag>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无商品数据（请先触发分类）" /></template>
          </el-table>
        </wd-panel>
      </div>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#abc-tpl',
      setup() {
        const DataAnalysis = Icons.DataAnalysis;
        const Refresh = Icons.Refresh;
        const loading = ref(false);
        const cls = ref('');
        const stats = ref({ total: 0, a: 0, b: 0, c: 0 });
        const list = ref([]);

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        function abcType(c) {
          return c === 'A' ? 'danger' : (c === 'B' ? 'warning' : 'info');
        }

        function pct(k) {
          const t = Number(stats.value.total) || 0;
          return t > 0 ? Math.round(Number(stats.value[k] || 0) / t * 100) : 0;
        }

        async function load() {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/inventory/abcRows' + qs({ class: cls.value }));
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '加载失败'); return; }
            const d = res.data || {};
            stats.value = d.stats || stats.value;
            list.value = d.list || [];
          } finally { loading.value = false; }
        }

        // 重新分类：abcRows 端点每次进入都会重算分类结果，这里复用 load 并给出提示
        async function reclassify() {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/inventory/abcRows' + qs({ class: cls.value }));
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '分类失败'); return; }
            const d = res.data || {};
            stats.value = d.stats || { total: 0, a: 0, b: 0, c: 0 };
            list.value = d.list || [];
            ElementPlus.ElMessage.success('已按近 90 天出库金额重新分类');
          } finally { loading.value = false; }
        }

        onMounted(load);

        return { DataAnalysis, Refresh, loading, cls, stats, list, abcType, pct, load, reclassify, fmtNum };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
