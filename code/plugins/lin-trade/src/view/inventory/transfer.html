<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存调拨 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .over-stock input { color: #f56c6c; font-weight: 600; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="transfer-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        库存调拨用于把商品从一个仓库转到另一个仓库：选择源仓库与目标仓库、录入商品与数量后提交。
        明细中的源仓库存随源仓库自动刷新，调拨数量不能超过源仓库存，超库存行会标红且无法提交；
        提交即生成在途调拨记录并同步扣减源仓库存。
      </wd-tips>

      <div class="trade-section">
        <wd-panel :border="true" title="发起调拨"
                  description="源仓库与目标仓库不能相同；提交后立即扣减源仓库存并计入在途，调拨记录可在下方列表查看。">
          <el-form :inline="true" :model="form" size="small">
            <el-form-item label="源仓库">
              <el-select v-model="form.from_warehouse_id" placeholder="调出仓库" style="width:170px" @change="onFromChange">
                <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" :disabled="w.id === form.to_warehouse_id" />
              </el-select>
            </el-form-item>
            <el-form-item label="目标仓库">
              <el-select v-model="form.to_warehouse_id" placeholder="调入仓库" style="width:170px">
                <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" :disabled="w.id === form.from_warehouse_id" />
              </el-select>
            </el-form-item>
          </el-form>

          <el-table :data="form.items" border stripe size="small" style="margin-bottom:10px">
            <el-table-column label="商品" min-width="220">
              <template #default="{ row }">
                <el-select v-model="row.product_id" filterable placeholder="选择商品" style="width:100%">
                  <el-option v-for="p in products" :key="p.id" :label="p.name + '（' + (p.spec||'') + '）'" :value="p.id" />
                </el-select>
              </template>
            </el-table-column>
            <el-table-column label="源仓库存" width="100" align="right">
              <template #default="{ row }">{{ stockOf(row) === null ? '-' : fmtNum(stockOf(row), 2) }}</template>
            </el-table-column>
            <el-table-column label="数量" width="160">
              <template #default="{ row }">
                <el-input-number v-model="row.quantity" :min="0" :precision="2" :controls="false" size="small"
                                 style="width:120px" placeholder="0" :class="{ 'over-stock': isOver(row) }" />
              </template>
            </el-table-column>
            <el-table-column label="操作" width="90">
              <template #default="{ $index }">
                <el-button link type="danger" size="small" @click="removeItem($index)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
          <div style="display:flex;gap:8px;align-items:center">
            <el-button size="small" :icon="Plus" @click="addItem">添加商品</el-button>
            <el-button size="small" type="primary" :icon="Switch" :loading="submitting" @click="submit">提交调拨</el-button>
          </div>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="调拨记录 / 在途"
                  description="在途为已扣减源仓但尚未完成入库的调拨；已完成表示目标仓库存已入账。列表仅作查询，不提供撤销操作。">
          <div class="toolbar">
          <el-radio-group v-model="status" size="small" @change="load">
            <el-radio-button label="">全部</el-radio-button>
            <el-radio-button label="submitted">在途</el-radio-button>
            <el-radio-button label="done">已完成</el-radio-button>
          </el-radio-group>
          <span style="flex:1"></span>
          <el-button size="small" :icon="Refresh" :loading="loading" @click="load">刷新</el-button>
          </div>
          <el-table :data="list" border stripe size="small">
            <el-table-column prop="transfer_no" label="调拨单号" min-width="150" />
            <el-table-column label="源仓库" min-width="120">
              <template #default="{ row }">{{ row.from_warehouse_name }}</template>
            </el-table-column>
            <el-table-column label="目标仓库" min-width="120">
              <template #default="{ row }">{{ row.to_warehouse_name }}</template>
            </el-table-column>
            <el-table-column label="状态" width="100">
              <template #default="{ row }">
                <el-tag size="small" :type="row.status === 'submitted' ? 'warning' : 'success'">{{ row.status_name || row.status }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="操作人" min-width="100">
              <template #default="{ row }">{{ row.operator || '-' }}</template>
            </el-table-column>
            <el-table-column prop="created_at" label="调拨时间" min-width="160" />
            <el-table-column prop="remark" label="备注" min-width="120" show-overflow-tooltip />
            <template #empty><el-empty :image-size="70" description="暂无调拨记录" /></template>
          </el-table>
        </wd-panel>
      </div>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, reactive, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#transfer-tpl',
      setup() {
        const Plus = Icons.Plus;
        const Switch = Icons.Switch;
        const Refresh = Icons.Refresh;

        const warehouses = ref([]);
        const products = ref([]);
        const stockMap = ref({});
        const form = reactive({ from_warehouse_id: null, to_warehouse_id: null, items: [] });
        const submitting = ref(false);
        const loading = ref(false);
        const status = ref('');
        const list = ref([]);

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        function addItem() {
          form.items.push({ product_id: null, quantity: null });
        }
        function removeItem(index) {
          form.items.splice(index, 1);
        }

        // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
        function fmtNum(v, dec) {
          if (v === null || v === undefined || v === '') return '-';
          const n = Number(v);
          if (isNaN(n)) return '-';
          return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        }

        // 加载源仓库实时库存，供明细行参考与超库存拦截
        async function loadStock() {
          const wid = Number(form.from_warehouse_id) || 0;
          if (!wid) { stockMap.value = {}; return; }
          try {
            const res = await WD.request.get('/trade/inventory/quantities?warehouse_id=' + wid);
            stockMap.value = res.success ? (res.data || {}) : {};
          } catch (e) { stockMap.value = {}; }
        }
        function onFromChange() { loadStock(); }
        function stockOf(row) {
          const pid = Number(row.product_id);
          if (!pid) return null;
          const v = stockMap.value[pid];
          return v === undefined || v === null ? null : Number(v);
        }
        function isOver(row) {
          const s = stockOf(row);
          return s !== null && Number(row.quantity) > s;
        }

        async function loadOptions() {
          try {
            const res = await WD.request.get('/trade/purchase/formOptions');
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '加载选项失败'); return; }
            warehouses.value = res.data.warehouses || [];
            products.value = res.data.products || [];
          } catch (e) { ElementPlus.ElMessage.error('加载选项失败：' + e.message); }
        }

        async function load() {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/inventory/transferRows' + qs({ status: status.value, page: 1, pageSize: 100 }));
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '加载失败'); return; }
            list.value = (res.data && res.data.list) || [];
          } finally { loading.value = false; }
        }

        async function submit() {
          if (!form.from_warehouse_id || !form.to_warehouse_id) {
            ElementPlus.ElMessage.warning('请选择源仓库与目标仓库'); return;
          }
          const items = form.items.filter(function (it) { return it.product_id && Number(it.quantity) > 0; });
          if (items.length === 0) { ElementPlus.ElMessage.warning('请至少添加一行有效商品'); return; }
          // 超库存拦截：调拨数量不能超过源仓库存
          const overCount = items.filter(isOver).length;
          if (overCount > 0) {
            ElementPlus.ElMessage.error('有 ' + overCount + ' 行数量超过源仓库存，请调整后再提交');
            return;
          }
          submitting.value = true;
          try {
            const fd = new FormData();
            fd.append('from_warehouse_id', form.from_warehouse_id);
            fd.append('to_warehouse_id', form.to_warehouse_id);
            fd.append('items', JSON.stringify(items.map(function (it) { return { product_id: it.product_id, quantity: it.quantity }; })));
            const res = await WD.request.post('/trade/inventory/transfer', fd);
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '调拨失败'); return; }
            ElementPlus.ElMessage.success('调拨完成');
            form.items = [];
            load();
          } finally { submitting.value = false; }
        }

        onMounted(function () { loadOptions(); load(); });

        return { Plus, Switch, Refresh, warehouses, products, form, submitting, loading, status, list,
                 addItem, removeItem, submit, load, fmtNum, stockOf, isOver, onFromChange };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
