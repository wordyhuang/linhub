<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呆滞清单 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
    .dull-sum { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
    .dull-stat { min-width: 150px; }
    .dull-stat .num { font-size: 22px; font-weight: 700; color: #e6a23c; }
    .dull-stat .lbl { font-size: 12px; color: #999; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="dull-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        呆滞清单按「连续 N 天无出库」筛出滞销商品，并统计其库存量与占用金额，帮助识别积压资金。
        建议结合 ABC 分类处理：A 类优先促销或调拨，C 类可考虑清仓；建议促销价仅供参考。
      </wd-tips>

      <wd-panel :border="true" title="筛选条件" style="margin-bottom:12px"
                description="呆滞天数口径为最后一次出库至今的天数；切换天数后点「刷新」重新计算。">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
          <el-select v-model="days" size="small" style="width:140px">
            <el-option label="30天" :value="30" />
            <el-option label="60天" :value="60" />
            <el-option label="90天" :value="90" />
            <el-option label="180天" :value="180" />
          </el-select>
          <el-button size="small" type="primary" :icon="Refresh" :loading="loading" @click="load">刷新</el-button>
        </div>
      </wd-panel>

      <wd-panel :border="true" title="呆滞概览" style="margin-bottom:12px"
                description="占用金额按参考进价 × 呆滞库存量估算；呆滞商品数不含库存为 0 的停用商品。">
        <div class="dull-sum" style="margin-bottom:0">
          <el-card shadow="never" class="dull-stat">
            <div class="num">{{ list.length }}</div>
            <div class="lbl">呆滞商品数</div>
          </el-card>
          <el-card shadow="never" class="dull-stat">
            <div class="num">{{ fmtNum(totalQty, 0) }}</div>
            <div class="lbl">呆滞库存量</div>
          </el-card>
          <el-card shadow="never" class="dull-stat">
            <div class="num">{{ fmtNum(totalOccupancy, 2) }}</div>
            <div class="lbl">占用金额</div>
          </el-card>
        </div>
      </wd-panel>

      <div class="trade-section">
        <wd-panel :border="true" title="呆滞商品清单（连续 N 天无出库反馈）"
                  description="呆滞天数越长、占用金额越高的行越应优先处理；建议促销价为按参考售价打折测算的参考值，落地前请人工确认。">
          <el-table :data="list" border stripe size="small">
            <el-table-column prop="product_no" label="编号" min-width="120" />
            <el-table-column prop="name" label="商品" min-width="160" show-overflow-tooltip />
            <el-table-column prop="abc_class" label="ABC" width="80">
              <template #default="{ row }">
                <el-tag v-if="row.abc_class" size="small" :type="row.abc_class === 'A' ? 'danger' : (row.abc_class === 'B' ? 'warning' : 'info')">{{ row.abc_class }}</el-tag>
                <span v-else>-</span>
              </template>
            </el-table-column>
            <el-table-column label="数量" width="100" align="right">
              <template #default="{ row }">{{ fmtNum(row.quantity, 0) }}</template>
            </el-table-column>
            <el-table-column label="占用金额" min-width="120" align="right">
              <template #default="{ row }">{{ fmtNum(row.occupancy_amount, 2) }}</template>
            </el-table-column>
            <el-table-column prop="dull_days" label="呆滞天数" width="100" align="right" />
            <el-table-column label="建议促销价" min-width="120" align="right">
              <template #default="{ row }"><span style="color:#e6a23c">{{ fmtNum(row.promo_suggestion, 2) }}</span></template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无呆滞商品" /></template>
          </el-table>
        </wd-panel>
      </div>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, computed, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#dull-tpl',
      setup() {
        const Refresh = Icons.Refresh;
        const loading = ref(false);
        const days = ref(90);
        const list = ref([]);

        const totalQty = computed(() => list.value.reduce(function (a, r) { return a + (Number(r.quantity) || 0); }, 0));
        const totalOccupancy = computed(() => list.value.reduce(function (a, r) { return a + (Number(r.occupancy_amount) || 0); }, 0));

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        async function load() {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/inventory/dullRows' + qs({ days: days.value, limit: 100 }));
            if (res.success) list.value = res.data || [];
            else ElementPlus.ElMessage.error(res.message || '加载失败');
          } finally {
            loading.value = false;
          }
        }

        onMounted(load);

        return { Refresh, loading, days, list, totalQty, totalOccupancy, load, fmtNum };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
