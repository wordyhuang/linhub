<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存盘点 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .el-input-number { width: 150px; }
    .action-link { margin-right: 8px; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="stocktake-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        库存盘点用于核对账面库存与实物是否一致：先生成盘点单，再逐项录入实盘数量，完成后系统按差异自动调整库存。
        盘点期间请暂停该仓库的出入库操作，避免实盘数与账面数错位；已确认并调整的盘点单不可再次修改。
      </wd-tips>

      <div class="trade-section">
        <wd-panel :border="true" title="发起盘点"
                  description="商品范围不选则默认盘点该仓库的全部在库商品；生成后盘点单状态为「盘点中」，此时账面数以生成时点为准。">
          <el-form :inline="true" :model="form" size="small">
            <el-form-item label="盘点仓库">
              <el-select v-model="form.warehouse_id" placeholder="请选择仓库" style="width:180px">
                <el-option v-for="w in warehouses" :key="w.id" :label="w.name" :value="w.id" />
              </el-select>
            </el-form-item>
            <el-form-item label="商品范围">
              <el-select v-model="form.product_ids" multiple filterable collapse-tags placeholder="不选=全部在库商品" style="width:320px">
                <el-option v-for="p in products" :key="p.id" :label="p.name + '（' + p.spec + '）'" :value="p.id" />
              </el-select>
            </el-form-item>
            <el-form-item label="备注">
              <el-input v-model="form.remark" placeholder="选填" style="width:200px" />
            </el-form-item>
            <el-form-item>
              <el-button type="primary" :icon="Check" :loading="creating" @click="createStocktake">生成盘点单</el-button>
            </el-form-item>
          </el-form>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="盘点单列表"
                  description="「完成调整」会把实盘差异写入库存并置为已调整，操作不可撤销；「预警一键采购建议」可把低库存商品直接带入采购订单。">
          <div class="toolbar">
          <el-radio-group v-model="status" size="small" @change="reload">
            <el-radio-button label="">全部</el-radio-button>
            <el-radio-button label="taking">盘点中</el-radio-button>
            <el-radio-button label="confirmed">已确认</el-radio-button>
            <el-radio-button label="adjusted">已调整</el-radio-button>
          </el-radio-group>
          <span style="flex:1"></span>
          <el-button size="small" :icon="Refresh" :loading="loading" @click="load">刷新</el-button>
          <el-button size="small" type="danger" plain :icon="Van" @click="openPurchase">预警一键采购建议</el-button>
          </div>
          <el-table :data="list" border stripe size="small">
            <el-table-column prop="stocktake_no" label="盘点单号" min-width="150" />
            <el-table-column prop="warehouse_name" label="仓库" min-width="120" />
            <el-table-column label="状态" width="100">
              <template #default="{ row }">
                <el-tag size="small" :type="statusTag(row.status)">{{ row.status_name || row.status }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="盘点人" min-width="100">
              <template #default="{ row }">{{ row.operator || '-' }}</template>
            </el-table-column>
            <el-table-column prop="created_at" label="盘点时间" min-width="160" />
            <el-table-column label="操作" width="180" fixed="right">
              <template #default="{ row }">
                <el-button class="action-link" link type="primary" size="small" @click="openItems(row)">明细/实盘</el-button>
                <el-button v-if="row.status === 'taking'" link type="success" size="small" @click="finish(row)">完成调整</el-button>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无盘点单" /></template>
          </el-table>
        </wd-panel>
      </div>

      <!-- 盘点明细 + 实盘录入 -->
      <el-dialog v-model="itemsVisible" :title="'盘点明细 - ' + (current && current.stocktake_no)" width="820px">
        <el-table :data="currentItems" border stripe size="small" max-height="420">
          <el-table-column prop="product_no" label="编号" min-width="110" />
          <el-table-column prop="name" label="商品" min-width="160" show-overflow-tooltip />
          <el-table-column label="账面" width="100" align="right">
            <template #default="{ row }">{{ fmtNum(row.book_qty, 2) }}</template>
          </el-table-column>
          <el-table-column label="实盘" width="140" align="right">
            <template #default="{ row }">
              <el-input-number v-if="current && current.status === 'taking'" v-model="row.actual_qty" :min="0" :precision="2" :controls="false" size="small" style="width:100px" />
              <span v-else>{{ fmtNum(row.actual_qty, 2) }}</span>
            </template>
          </el-table-column>
          <el-table-column label="差异" width="100" align="right">
            <template #default="{ row }">
              <span :style="Number(row.diff_qty) !== 0 ? diffCls : {}">{{ fmtDiff(row) }}</span>
            </template>
          </el-table-column>
          <template #empty><el-empty :image-size="60" description="无明细" /></template>
        </el-table>
        <template #footer>
          <el-button size="small" @click="itemsVisible = false">关闭</el-button>
          <el-button v-if="current && current.status === 'taking'" size="small" type="primary" :loading="confirming" @click="confirmCurrent">
            保存实盘并完成调整
          </el-button>
        </template>
      </el-dialog>

      <!-- 预警一键采购建议 -->
      <el-dialog v-model="purchaseVisible" title="预警一键采购建议" width="760px">
        <div v-if="suggestLoading" style="text-align:center;padding:24px"><el-icon class="is-loading"><Loading /></el-icon> 生成中...</div>
        <template v-else>
          <div style="margin-bottom:10px;color:#909399;font-size:13px">
            以下商品库存低于安全库存，建议补货量 = 安全库存 - 当前库存：
          </div>
          <el-table :data="suggests" border stripe size="small" max-height="380">
            <el-table-column prop="product_no" label="编号" min-width="110" />
            <el-table-column prop="product_name" label="商品" min-width="160" show-overflow-tooltip />
            <el-table-column prop="warehouse_name" label="仓库" min-width="110" show-overflow-tooltip />
            <el-table-column label="当前库存" width="100" align="right">
              <template #default="{ row }">{{ fmtNum(row.quantity, 2) }}</template>
            </el-table-column>
            <el-table-column label="安全库存" width="100" align="right">
              <template #default="{ row }">{{ fmtNum(row.safety_stock, 2) }}</template>
            </el-table-column>
            <el-table-column label="建议补货" width="110" align="right">
              <template #default="{ row }">
                <span style="color:#e6a23c;font-weight:600">{{ fmtNum(row.suggest_qty, 2) }}</span>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="60" description="暂无低库存商品" /></template>
          </el-table>
        </template>
      </el-dialog>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, reactive, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#stocktake-tpl',
      setup() {
        const Check = Icons.Check;
        const Refresh = Icons.Refresh;
        const Van = Icons.Van;
        const Loading = Icons.Loading;
        const diffCls = { color: '#e6a23c' };

        const warehouses = ref([]);
        const products = ref([]);
        const form = reactive({ warehouse_id: null, product_ids: [], remark: '' });
        const creating = ref(false);
        const loading = ref(false);
        const status = ref('');
        const list = ref([]);

        const itemsVisible = ref(false);
        const current = ref(null);
        const currentItems = ref([]);
        const confirming = ref(false);

        const purchaseVisible = ref(false);
        const suggestLoading = ref(false);
        const suggests = ref([]);

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        async function loadOptions() {
          try {
            const res = await WD.request.get('/trade/purchase/formOptions');
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '加载选项失败'); return; }
            warehouses.value = res.data.warehouses || [];
            products.value = res.data.products || [];
          } catch (e) { ElementPlus.ElMessage.error('加载选项失败：' + e.message); }
        }

        async function load() {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/inventory/stocktakeRows' + qs({ status: status.value, page: 1, pageSize: 100 }));
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '加载失败'); return; }
            list.value = (res.data && res.data.list) || [];
          } finally { loading.value = false; }
        }

        function reload() { if (itemsVisible.value) itemsVisible.value = false; load(); }

        function statusTag(s) {
          return s === 'taking' ? 'warning' : (s === 'confirmed' ? 'primary' : 'success');
        }

        function fmtDiff(row) {
          const d = Number(row.diff_qty) || 0;
          return (d > 0 ? '+' : '') + d;
        }

        async function createStocktake() {
          if (!form.warehouse_id) { ElementPlus.ElMessage.warning('请选择盘点仓库'); return; }
          creating.value = true;
          try {
            const fd = new FormData();
            fd.append('warehouse_id', form.warehouse_id);
            fd.append('product_ids', JSON.stringify(form.product_ids || []));
            fd.append('remark', form.remark || '');
            const res = await WD.request.post('/trade/inventory/stocktake', fd);
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '创建失败'); return; }
            ElementPlus.ElMessage.success('盘点单已创建');
            form.product_ids = [];
            form.remark = '';
            load();
          } finally { creating.value = false; }
        }

        function openItems(row) {
          current.value = row;
          currentItems.value = (row.items || []).map(function (it) { return Object.assign({}, it); });
          itemsVisible.value = true;
        }

        function fmtDiffForSubmit(row) {
          return Number(row.actual_qty) - Number(row.book_qty);
        }

        async function confirmCurrent() {
          if (!current.value) return;
          confirming.value = true;
          try {
            // 提交实盘明细（仅差异物项也可全量提交，服务端再核算 diff）
            const items = currentItems.value.map(function (it) {
              return { id: it.id, actual_qty: Number(it.actual_qty) };
            });
            const fd = new FormData();
            fd.append('id', current.value.id);
            fd.append('items', JSON.stringify(items));
            const res = await WD.request.post('/trade/inventory/confirmStocktake', fd);
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '确认失败'); return; }
            ElementPlus.ElMessage.success('盘点调整完成');
            itemsVisible.value = false;
            load();
          } finally { confirming.value = false; }
        }

        async function finish(row) {
          // 不录入实盘直接完成（实盘=账面）
          ElementPlus.ElMessageBox.confirm('确认完成盘点单 ' + row.stocktake_no + ' 并调整库存？', '提示', { type: 'warning' })
            .then(async function () {
              const fd = new FormData();
              fd.append('id', row.id);
              const res = await WD.request.post('/trade/inventory/confirmStocktake', fd);
              if (!res.success) { ElementPlus.ElMessage.error(res.message || '确认失败'); return; }
              ElementPlus.ElMessage.success('盘点调整完成');
              load();
            }).catch(function () {});
        }

        async function openPurchase() {
          purchaseVisible.value = true;
          suggestLoading.value = true;
          suggests.value = [];
          try {
            const res = await WD.request.get('/trade/inventory/rows' + qs({ filter: 'low', page: 1, pageSize: 200 }));
            if (!res.success) { ElementPlus.ElMessage.error(res.message || '生成失败'); return; }
            suggests.value = (res.data && res.data.list) || [];
          } finally { suggestLoading.value = false; }
        }

        onMounted(function () { loadOptions(); load(); });

        return {
          Check, Refresh, Van, Loading, diffCls,
          warehouses, products, form, creating, loading, status, list,
          itemsVisible, current, currentItems, confirming,
          purchaseVisible, suggestLoading, suggests,
          load, reload, statusTag, fmtDiff, createStocktake, fmtNum,
          openItems, fmtDiffForSubmit, confirmCurrent, finish, openPurchase
        };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
