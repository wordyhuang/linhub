<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品分类 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .trade-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
    }

    .trade-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .trade-tag {
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="category-tpl">
  <div class="trade-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      商品分类用于按品类组织商品档案，支持上下级结构。新增商品时可选择分类，便于按品类筛选与统计。
    </wd-tips>

    <wd-panel :border="true" title="商品分类"
              description="上级分类可留空表示顶级分类；编辑时不能把自己选为上级，避免形成循环层级。停用分类不影响已归属商品。">
      <wd-data-grid ref="grid" api="/trade/category/rows" api-method="get" :active="true" filter="trade-category" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="trade-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="分类名称" size="small" clearable style="width:200px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:110px" @change="doSearch">
                <el-option label="启用" value="1" />
                <el-option label="停用" value="0" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <wd-drawer-button label="新增分类" title="新增分类" drawer-size="440px" size="small" type="primary"
                              filter="trade-category" :data="{ name: '', parent_id: null, sort: 0 }">
              <wd-data-form mode="create" submit-api="/trade/category/save" submit-method="post"
                            submit-keys="name,parent_id,sort" :head-close-drawer="true" :head-refresh-datagrid="'trade-category'"
                            :confirm-leave="true" label-width="80px"
                            :rules="{ name: [{ required: true, message: '请填写分类名称', trigger: 'blur' }] }">
                <wd-form-item label="名称" prop="name" required>
                  <el-input v-model="model.name" placeholder="输入分类名称" maxlength="40" />
                </wd-form-item>
                <wd-form-item label="上级分类" prop="parent_id">
                  <el-select v-model="model.parent_id" clearable placeholder="选择上级分类（可选）" style="width:100%">
                    <el-option v-for="c in activeCategories" :key="c.id" :label="c.name" :value="c.id" />
                  </el-select>
                </wd-form-item>
                <wd-form-item label="排序" prop="sort">
                  <el-input-number v-model="model.sort" :min="0" :precision="0" style="width:100%" />
                </wd-form-item>
              </wd-data-form>
            </wd-drawer-button>
          </div>
        </template>

        <el-table-column prop="name" label="名称" min-width="160" show-overflow-tooltip />
        <el-table-column label="上级分类" min-width="120">
          <template #default="{ row }">{{ row.parent_name || '-' }}</template>
        </el-table-column>
        <el-table-column prop="sort" label="排序" width="80" align="right" />
        <el-table-column label="状态" width="90">
          <template #default="{ row }">
            <el-tag size="small" :type="on(row.status) ? 'success' : 'info'" effect="light"
                    class="trade-tag">{{ row.status_label || (on(row.status) ? '启用' : '停用') }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="220" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <wd-drawer-button label="编辑" title="编辑分类" drawer-size="440px" size="small" type="primary"
                                filter="trade-category" :data="editRow(row)">
                <wd-data-form mode="edit" submit-api="/trade/category/save" submit-method="post"
                              submit-keys="id,name,parent_id,sort" :head-close-drawer="true" :head-refresh-datagrid="'trade-category'"
                              :confirm-leave="true" label-width="80px"
                              :rules="{ name: [{ required: true, message: '请填写分类名称', trigger: 'blur' }] }">
                  <wd-form-item label="名称" prop="name" required>
                    <el-input v-model="model.name" placeholder="输入分类名称" maxlength="40" />
                  </wd-form-item>
                  <wd-form-item label="上级分类" prop="parent_id">
                    <el-select v-model="model.parent_id" clearable placeholder="选择上级分类（可选）" style="width:100%">
                      <el-option v-for="c in activeCategories" :key="c.id" :label="c.name" :value="c.id"
                                 :disabled="c.id === model.id" />
                    </el-select>
                  </wd-form-item>
                  <wd-form-item label="排序" prop="sort">
                    <el-input-number v-model="model.sort" :min="0" :precision="0" style="width:100%" />
                  </wd-form-item>
                </wd-data-form>
              </wd-drawer-button>
              <wd-popconfirm-button :title="on(row.status) ? '确认停用分类？' : '确认启用分类？'"
                                    :tip="'确认「' + row.name + '」' + (on(row.status) ? '停用' : '启用') + '？'"
                                    api="/trade/category/switch"
                                    :api-param="{ id: row.id, mode: on(row.status) ? 'off' : 'on' }"
                                    :type="on(row.status) ? 'danger' : 'success'" size="small"
                                    head-refresh-datagrid="trade-category">
                {{ on(row.status) ? '停用' : '启用' }}
              </wd-popconfirm-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="80" description="暂无分类" /></template>
      </wd-data-grid>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#category-tpl',
      setup() {
        const grid = ref(null);
        const keyword = ref('');
        const status = ref('');
        const activeCategories = ref([]);
        const Search = window.ElementPlusIconsVue.Search;

        function on(v) { return parseInt(v, 10) === 1; }

        // 下拉选项接口返回的 id 是字符串，列表行的外键是数字；
        // 编辑回填前统一成字符串，顶级分类（parent_id=0）回填为空，避免下拉显示原始 ID。
        function editRow(row) {
          const pid = String(row.parent_id === null || row.parent_id === undefined ? '' : row.parent_id);
          return Object.assign({}, row, {
            parent_id: (pid === '' || pid === '0') ? null : pid
          });
        }

        async function loadActive() {
          try {
            const res = await WD.request.get('/trade/category/options');
            activeCategories.value = (res && res.data) || [];
          } catch (e) { activeCategories.value = []; }
        }

        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim(), status: status.value });
        }

        onMounted(loadActive);

        return { grid, keyword, status, activeCategories, Search, on, doSearch, editRow };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
