<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单据打印 - 林销</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #303133;
      background: #f5f7fa;
    }

    /* ---------- classic：A4 标准版 ---------- */
    .print-sheet {
      max-width: 860px;
      margin: 24px auto;
      padding: 32px 40px 40px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      box-sizing: border-box;
    }

    .doc-title {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 4px;
      margin: 0 0 24px;
    }

    .doc-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 32px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .doc-meta .m-label {
      color: #909399;
      margin-right: 8px;
    }

    table.doc-items {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 12px;
    }

    table.doc-items th,
    table.doc-items td {
      border: 1px solid #dcdfe6;
      padding: 8px 10px;
      text-align: left;
    }

    table.doc-items th {
      background: #f5f7fa;
      font-weight: 600;
    }

    table.doc-items td.num,
    table.doc-items th.num {
      text-align: right;
    }

    .doc-total {
      text-align: right;
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 24px;
    }

    .doc-summary {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .doc-summary th,
    .doc-summary td {
      border: 1px solid #dcdfe6;
      padding: 8px 10px;
      text-align: right;
    }

    .doc-summary th {
      background: #f5f7fa;
      font-weight: 600;
      text-align: left;
    }

    .doc-remark {
      font-size: 13px;
      color: #606266;
      margin: 4px 0 0;
    }

    .doc-foot {
      margin-top: 48px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #606266;
    }

    .no-print {
      text-align: center;
      margin: 16px auto 0;
    }

    .no-print button {
      padding: 8px 28px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #409eff;
      background: #409eff;
      color: #fff;
      border-radius: 4px;
    }

    .no-print .tip {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: #909399;
    }

    .no-print .warn {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      color: #e6a23c;
    }

    /* ---------- compact：58mm 小票版 ---------- */
    body.tpl-compact {
      background: #fff;
    }

    body.tpl-compact .print-sheet {
      max-width: 58mm;
      margin: 8px auto;
      padding: 4mm 3mm 6mm;
      box-shadow: 0 0 6px rgba(0, 0, 0, .18);
      font-size: 12px;
    }

    body.tpl-compact .doc-title {
      font-size: 16px;
      letter-spacing: 2px;
      margin: 0 0 8px;
    }

    body.tpl-compact .doc-meta {
      display: block;
      font-size: 11px;
      gap: 0;
      margin-bottom: 6px;
    }

    body.tpl-compact .doc-meta>div {
      margin: 2px 0;
    }

    body.tpl-compact table.doc-items,
    body.tpl-compact table.doc-summary {
      font-size: 11px;
      margin-bottom: 6px;
    }

    body.tpl-compact table.doc-items th,
    body.tpl-compact table.doc-items td,
    body.tpl-compact table.doc-summary th,
    body.tpl-compact table.doc-summary td {
      padding: 3px 4px;
    }

    body.tpl-compact .doc-total {
      font-size: 12px;
      margin: 0 0 6px;
    }

    body.tpl-compact .doc-remark {
      font-size: 11px;
    }

    body.tpl-compact .doc-foot {
      margin-top: 12px;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
    }

    @media print {
      body {
        background: #fff;
      }

      .print-sheet {
        box-shadow: none;
        margin: 0;
        max-width: none;
        padding: 0;
      }

      .no-print {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="no-print">
    <span class="warn" id="tplWarn" style="display:none"></span>
    <button type="button" onclick="window.print()">打 印</button>
    <span class="tip" id="tplTip">如未弹出打印对话框，请点击上方按钮</span>
  </div>
  <div class="print-sheet" id="sheet">
    <p class="doc-title" id="docTitle">单据打印</p>
    <div class="doc-meta" id="docMeta"></div>
    <table class="doc-items" id="docItemsTable">
      <thead>
        <tr id="docHead">
          <th style="width:44px">#</th>
          <th>商品</th>
          <th class="num">数量</th>
          <th class="num">单价</th>
          <th class="num">金额</th>
        </tr>
      </thead>
      <tbody id="docRows">
        <tr>
          <td colspan="5" style="text-align:center;color:#909399">加载中…</td>
        </tr>
      </tbody>
    </table>
    <table class="doc-summary" id="docSummary" style="display:none">
      <tbody id="docSummaryRows"></tbody>
    </table>
    <p class="doc-total" id="docTotal"></p>
    <p class="doc-remark" id="docRemark"></p>
    <div class="doc-foot">
      <span>制单：<span id="docCreator">-</span></span>
      <span>打印时间：<span id="docPrintAt"></span></span>
    </div>
  </div>

  <script>
    // 单据打印页（PRD 3.6 / PG-TOOL-03）
    // ?type=<7类单据>&id=<单据ID>&tpl=classic|compact&demo=1(预览样例)
    // 模板优先级：URL tpl > localStorage('trade.print.template') > classic；非法值降级 classic。
    var TEMPLATES = ['classic', 'compact'];
    var DOC_TYPES = {
      purchase:       { title: '采购订单',   api: '/trade/purchase/detail',              noKey: 'order_no',      party: ['供应商', 'supplier_name'], cols: ['quantity', 'price', 'amount'],    amount: true },
      sale:           { title: '销售订单',   api: '/trade/sale/detail',                  noKey: 'order_no',      party: ['客户', 'customer_name'],   cols: ['quantity', 'price', 'amount'],    amount: true },
      purchase_return:{ title: '采购退货单', api: '/trade/purchase/returnDetail',        noKey: 'return_no',     party: ['供应商', 'supplier_name'], cols: ['quantity', 'price', 'amount'],    amount: true },
      sale_return:    { title: '销售退货单', api: '/trade/sale/returnDetail',            noKey: 'return_no',     party: ['客户', 'customer_name'],   cols: ['quantity', 'price', 'amount'],    amount: true },
      stocktake:      { title: '盘点单',     api: '/trade/inventory/stocktakeDetail',    noKey: 'stocktake_no',  party: null,                        cols: ['book_qty', 'actual_qty', 'diff_qty'], amount: false },
      transfer:       { title: '调拨单',     api: '/trade/inventory/transferDetail',     noKey: 'transfer_no',   party: null,                        cols: ['quantity'],                        amount: false },
      reconciliation: { title: '对账单',     api: '/trade/report/reconciliationDetail',  noKey: 'rc_no',         party: null,                        cols: [],                                  amount: false, summary: true }
    };
    var COL_LABEL = {
      quantity: '数量', price: '单价', amount: '金额',
      book_qty: '账面数量', actual_qty: '实盘数量', diff_qty: '差异'
    };
    var PRODUCT_NAMES = {};
    var WAREHOUSE_NAMES = {};

    function qs(key) {
      var m = new RegExp('[?&]' + key + '=([^&]*)').exec(location.search);
      return m ? decodeURIComponent(m[1]) : '';
    }

    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      var n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function productName(id) {
      return PRODUCT_NAMES[id] || ('#' + id);
    }

    function warehouseName(id) {
      if (id == null || id === '') return '-';
      return WAREHOUSE_NAMES[id] || ('#' + id);
    }

    function loadDictionaries() {
      var jobs = [
        fetch('/trade/product/options').then(function (r) { return r.json(); }).then(function (res) {
          (res.data || []).forEach(function (p) {
            PRODUCT_NAMES[p.id] = p.name + (p.spec ? '（' + p.spec + '）' : '');
          });
        }).catch(function () { }),
        fetch('/trade/warehouse/options').then(function (r) { return r.json(); }).then(function (res) {
          (res.data || []).forEach(function (w) { WAREHOUSE_NAMES[w.id] = w.name; });
        }).catch(function () { })
      ];
      return Promise.all(jobs);
    }

    function metaRows(type, d) {
      var conf = DOC_TYPES[type];
      var rows = [['单号', d[conf.noKey]]];
      if (conf.party) {
        rows.push([conf.party[0], d[conf.party[1]]]);
      }
      if (type === 'purchase' || type === 'sale') {
        rows.push(['仓库', warehouseName(d.warehouse_id)]);
      } else if (type === 'stocktake') {
        rows.push(['仓库', d.warehouse_name || warehouseName(d.warehouse_id)]);
      } else if (type === 'transfer') {
        rows.push(['调出仓库', d.from_warehouse_name || warehouseName(d.from_warehouse_id)]);
        rows.push(['调入仓库', d.to_warehouse_name || warehouseName(d.to_warehouse_id)]);
      } else if (type === 'reconciliation') {
        rows.push(['类型', d.biz_type === 'customer' ? '客户对账' : (d.biz_type === 'supplier' ? '供应商对账' : (d.biz_type || '-'))]);
        rows.push(['期间', (d.period_start || '-') + ' ~ ' + (d.period_end || '-')]);
      }
      rows.push(['日期', d.created_at]);
      rows.push(['状态', d.status_label || d.status_name || d.status]);
      return rows;
    }

    function failRow(text) {
      var colspan = DOC_TYPES[qs('type')] && DOC_TYPES[qs('type')].cols ? DOC_TYPES[qs('type')].cols.length + 2 : 5;
      document.getElementById('docRows').innerHTML =
        '<tr><td colspan="' + colspan + '" style="text-align:center;color:#f56c6c">' + esc(text) + '</td></tr>';
    }

    function buildHead(cols) {
      var html = '<th style="width:44px">#</th><th>商品</th>';
      cols.forEach(function (c) { html += '<th class="num">' + esc(COL_LABEL[c] || c) + '</th>'; });
      document.getElementById('docHead').innerHTML = html;
      document.getElementById('docItemsTable').style.display = '';
    }

    function render(type, d) {
      var conf = DOC_TYPES[type];
      document.title = conf.title + ' ' + (d[conf.noKey] || '') + ' - 林销';
      document.getElementById('docTitle').textContent = conf.title;

      document.getElementById('docMeta').innerHTML = metaRows(type, d).map(function (row) {
        return '<div><span class="m-label">' + esc(row[0]) + '</span>' + esc(row[1] || '-') + '</div>';
      }).join('');

      var items = d.items || [];
      var tbody = document.getElementById('docRows');
      var totalText = '';
      if (conf.summary) {
        // 对账单：明细表隐藏，渲染摘要（口径与对账单详情页一致）
        document.getElementById('docItemsTable').style.display = 'none';
        var sn = d.snapshot || {};
        var sumRows = [
          ['期初余额', sn.opening], ['本期发生', sn.in_amount],
          ['退货', sn.return_amount], ['收款/付款', sn.pay_amount],
          ['期末余额', d.balance_amount]
        ];
        document.getElementById('docSummaryRows').innerHTML = sumRows.map(function (r) {
          return '<tr><th>' + esc(r[0]) + '</th><td class="num">' + fmtNum(r[1], 2) + '</td></tr>';
        }).join('');
        document.getElementById('docSummary').style.display = '';
        document.getElementById('docTotal').textContent = '';
      } else {
        document.getElementById('docSummary').style.display = 'none';
        buildHead(conf.cols);
        var colspan = conf.cols.length + 2;
        if (!items.length) {
          tbody.innerHTML = '<tr><td colspan="' + colspan + '" style="text-align:center;color:#909399">无明细</td></tr>';
        } else {
          tbody.innerHTML = items.map(function (it, i) {
            var html = '<tr><td>' + (i + 1) + '</td><td>' + esc(it.product_name || productName(it.product_id)) + '</td>';
            conf.cols.forEach(function (c) {
              html += '<td class="num">' + fmtNum(it[c], 2) + '</td>';
            });
            return html + '</tr>';
          }).join('');
        }
        if (conf.amount) {
          var total = d.total_amount != null && d.total_amount !== ''
            ? Number(d.total_amount)
            : items.reduce(function (sum, it) { return sum + Number(it.amount || 0); }, 0);
          totalText = '合计金额：¥ ' + fmtNum(total, 2);
        }
        document.getElementById('docTotal').textContent = totalText;
      }
      document.getElementById('docRemark').textContent = d.remark ? '备注：' + d.remark : '';
      document.getElementById('docCreator').textContent = d.created_by || '-';
      document.getElementById('docPrintAt').textContent = new Date().toLocaleString('zh-CN');
    }

    // 模板预览样例（demo=1 时使用，供模板设置页实时预览）
    var DEMO = {
      purchase: { order_no: 'CG202610240001', supplier_name: '华东建材供应商', warehouse_id: 1, created_at: '2026-10-24 09:30:00', status: 'submitted', remark: '预览样例数据', total_amount: 3560, items: [{ product_id: 1, quantity: 40, price: 46, amount: 1840 }, { product_id: 2, quantity: 60, price: 28.67, amount: 1720 }] },
      sale: { order_no: 'XS202610240001', customer_name: '金鑫五金门市', warehouse_id: 1, created_at: '2026-10-24 10:12:00', status: 'submitted', remark: '预览样例数据', total_amount: 4880, items: [{ product_id: 1, quantity: 20, price: 128, amount: 2560 }, { product_id: 2, quantity: 40, price: 58, amount: 2320 }] },
      purchase_return: { return_no: 'CT202610240001', supplier_name: '华东建材供应商', created_at: '2026-10-24 11:00:00', status: 'done', remark: '预览样例数据', total_amount: 460, items: [{ product_id: 1, quantity: 10, price: 46, amount: 460 }] },
      sale_return: { return_no: 'XT202610240001', customer_name: '金鑫五金门市', created_at: '2026-10-24 11:20:00', status: 'done', remark: '预览样例数据', total_amount: 580, items: [{ product_id: 2, quantity: 10, price: 58, amount: 580 }] },
      stocktake: { stocktake_no: 'PD202610240001', warehouse_name: '主仓库', created_at: '2026-10-24 08:00:00', status: 'done', remark: '预览样例数据', items: [{ product_id: 1, product_name: '镀锌管 DN25（4m）', book_qty: 120, actual_qty: 118, diff_qty: -2 }, { product_id: 2, product_name: '自攻丝 4*30（盒）', book_qty: 80, actual_qty: 80, diff_qty: 0 }] },
      transfer: { transfer_no: 'DB202610240001', from_warehouse_name: '主仓库', to_warehouse_name: '二分仓', created_at: '2026-10-24 14:00:00', status: 'done', remark: '预览样例数据', items: [{ product_id: 1, product_name: '镀锌管 DN25（4m）', quantity: 30 }] },
      reconciliation: { rc_no: 'DZ202610240001', biz_type: 'customer', period_start: '2026-10-01', period_end: '2026-10-24', created_at: '2026-10-24 16:00:00', status: 'generated', remark: '预览样例数据', balance_amount: 12860.5, snapshot: { opening: 9200, in_amount: 4880, return_amount: 580, pay_amount: 639.5 } }
    };

    (function boot() {
      // 模板解析与降级（PG-TOOL-03：模板缺失自动降级 classic）
      var tpl = (qs('tpl') || localStorage.getItem('trade.print.template') || 'classic').toLowerCase();
      if (TEMPLATES.indexOf(tpl) < 0) {
        document.getElementById('tplWarn').textContent = '模板「' + tpl + '」不存在，已自动降级为 classic（A4 标准版）';
        document.getElementById('tplWarn').style.display = '';
        tpl = 'classic';
      }
      if ('compact' === tpl) {
        document.body.className = 'tpl-compact';
        document.getElementById('tplTip').textContent = '58mm 小票模板，请选择对应纸型打印';
      }

      var type = qs('type');
      var id = qs('id');
      var conf = DOC_TYPES[type];
      if (!conf) {
        failRow('参数错误：需提供有效的 type');
        return;
      }
      if (qs('demo') === '1') {
        render(type, DEMO[type]);
        return;
      }
      if (!id) {
        failRow('参数错误：需提供有效的 id');
        return;
      }
      Promise.all([
        loadDictionaries(),
        fetch(conf.api + '?id=' + encodeURIComponent(id)).then(function (r) { return r.json(); })
      ]).then(function (all) {
        var res = all[1];
        if (!res || res.code !== 0 || !res.data) {
          failRow((res && res.message) || '单据加载失败');
          return;
        }
        render(type, res.data);
      }).catch(function (e) {
        failRow('加载失败：' + ((e && e.message) || '网络异常'));
      });
    })();
  </script>
</body>

</html>
