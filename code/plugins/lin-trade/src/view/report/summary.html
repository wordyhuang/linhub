<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>进销存汇总 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="summary-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        按商品汇总指定期间的进销存数据：期初库存 + 本期采购 − 本期销售 = 期末库存，并给出销售额、成本与毛利。毛利口径分「加权」（按实际加权成本核算）与「估算」（按参考进价估算）两种，可导出为表格文件。
      </wd-tips>

      <div class="trade-section">
        <wd-panel :border="true" title="查询条件"
                  description="期间留空时统计全部历史数据；「导出」按当前期间导出全量明细，不受列表分页限制。">
          <div class="trade-filter" style="margin-bottom:0">
            <span style="font-size:13px;color:#666">开始</span>
            <el-date-picker v-model="start" type="date" value-format="YYYY-MM-DD" placeholder="开始日期" size="small" style="width:150px" />
            <span style="font-size:13px;color:#666">结束</span>
            <el-date-picker v-model="end" type="date" value-format="YYYY-MM-DD" placeholder="结束日期" size="small" style="width:150px" />
            <el-button size="small" type="primary" :icon="Refresh" :loading="loading" @click="loadData">查询</el-button>
            <el-button size="small" type="success" :icon="Download" @click="doExport">导出</el-button>
          </div>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="汇总明细（按商品）"
                  description="期初与期末库存按时点回算，「加权」口径以实际入库成本核算，「估算」口径以商品档案参考进价推算，仅作参考；毛利为负数时以红色标注。">
          <el-table :data="list" border stripe size="small">
            <el-table-column prop="product_no" label="商品编码" min-width="120" />
            <el-table-column prop="name" label="商品名称" min-width="150" show-overflow-tooltip />
            <el-table-column prop="spec" label="规格" min-width="90" />
            <el-table-column label="期初库存" min-width="90" align="right">
              <template #default="{ row }">{{ fmtNum(row.open_qty, 0) }}</template>
            </el-table-column>
            <el-table-column label="本期采购" min-width="90" align="right">
              <template #default="{ row }">{{ fmtNum(row.buy_qty, 0) }}</template>
            </el-table-column>
            <el-table-column label="本期销售" min-width="90" align="right">
              <template #default="{ row }">{{ fmtNum(row.sell_qty, 0) }}</template>
            </el-table-column>
            <el-table-column label="期末库存" min-width="90" align="right">
              <template #default="{ row }">{{ fmtNum(row.end_qty, 0) }}</template>
            </el-table-column>
            <el-table-column label="销售额" min-width="110" align="right">
              <template #default="{ row }">{{ fmtNum(row.amount, 2) }}</template>
            </el-table-column>
            <el-table-column label="成本" min-width="100" align="right">
              <template #default="{ row }">{{ fmtNum(row.cost, 2) }}</template>
            </el-table-column>
            <el-table-column label="毛利" min-width="100" align="right">
              <template #default="{ row }">
                <span :style="{ color: row.profit < 0 ? '#f56c6c' : '#67c23a' }">{{ fmtNum(row.profit, 2) }}</span>
              </template>
            </el-table-column>
            <el-table-column label="成本口径" width="90">
              <template #default="{ row }">
                <el-tag size="small" :type="row.profit_method === 'weighted' ? 'warning' : 'info'">
                  {{ row.profit_method === 'weighted' ? '加权' : '估算' }}
                </el-tag>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无进销存汇总数据" /></template>
          </el-table>
          <div style="margin-top:12px;display:flex;justify-content:flex-end">
            <el-pagination
              background
              layout="total, prev, pager, next, sizes"
              :total="total"
              :current-page="page"
              :page-size="pageSize"
              :page-sizes="[10, 20, 50, 100]"
              @current-change="onPage"
              @size-change="onSize" />
          </div>
        </wd-panel>
      </div>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    // 数字/金额格式化：千分位 + 指定小数位，空值显示 '-'
    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      if (isNaN(n)) return '-';
      return n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, onMounted } = Vue;

    const app = Vue.createApp({
      template: '#summary-tpl',
      setup() {
        const Refresh = Icons.Refresh;
        const Download = Icons.Download;
        const start = ref('');
        const end = ref('');
        const loading = ref(false);
        const list = ref([]);
        const total = ref(0);
        const page = ref(1);
        const pageSize = ref(20);

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        async function loadData() {
          loading.value = true;
          try {
            const res = await WD.request.get('/trade/report/summaryRows' + qs({
              start: start.value, end: end.value, page: page.value, pageSize: pageSize.value
            }));
            if (res.success) {
              list.value = (res.data && res.data.list) || [];
              total.value = (res.data && res.data.total) || 0;
            } else {
              ElementPlus.ElMessage.error(res.message || '加载进销存汇总失败');
            }
          } finally {
            loading.value = false;
          }
        }

        function doExport() {
          window.location.href = '/trade/report/export' + qs({
            type: 'summary', start: start.value, end: end.value
          });
        }

        function onPage(p) { page.value = p; loadData(); }
        function onSize(s) { pageSize.value = s; page.value = 1; loadData(); }

        onMounted(loadData);

        return { Refresh, Download, start, end, loading, list, total, page, pageSize, loadData, doExport, onPage, onSize, fmtNum };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
