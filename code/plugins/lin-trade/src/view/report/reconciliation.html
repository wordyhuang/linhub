<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对账单 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    .trade-page { padding: 16px 20px 24px; box-sizing: border-box; }
    .trade-section { margin-bottom: 20px; }
    .trade-section h3 { font-size: 15px; margin: 0 0 10px; color: #333; }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="rec-tpl">
    <div class="trade-page">
      <wd-tips type="box" style="display:flex;margin-bottom:12px">
        按客户或供应商生成指定期间的对账单，汇总期初余额、本期发生、退货与收付款，得出期末余额。生成后先确认、再发送；作废后不可恢复，请谨慎操作。
      </wd-tips>

      <div class="trade-section">
        <wd-panel :border="true" title="生成对账单"
                  description="选择对账类型后，下方对象下拉会自动切换为客户或供应商档案；对账期间为闭区间，需同时指定起止日期。">
          <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
            <el-select v-model="genBiz" size="small" style="width:100px">
              <el-option label="客户" value="customer" />
              <el-option label="供应商" value="supplier" />
            </el-select>
            <el-select v-model="genTarget" placeholder="选择对象" size="small" style="width:180px" filterable>
              <el-option v-for="t in targets" :key="t.id" :label="t.name" :value="t.id" />
            </el-select>
            <el-date-picker v-model="genStart" type="date" value-format="YYYY-MM-DD" placeholder="期间开始" size="small" style="width:140px" />
            <el-date-picker v-model="genEnd" type="date" value-format="YYYY-MM-DD" placeholder="期间结束" size="small" style="width:140px" />
            <el-button size="small" type="primary" :icon="DocumentAdd" :loading="genLoading" @click="doGenerate">生成</el-button>
          </div>
        </wd-panel>
      </div>

      <div class="trade-section">
        <wd-panel :border="true" title="对账单列表"
                  description="状态流转为 生成 → 确认 → 发送；「确认」仅对已生成单据可用，「发送」与「作废」对已生成、已确认状态可用。期末余额在生成时做快照，后续新单据不会改变已生成的对账单。">
          <el-table :data="list" border stripe size="small">
            <el-table-column prop="rc_no" label="对账单号" min-width="160" />
            <el-table-column prop="biz_type" label="类型" width="90">
              <template #default="{ row }">
                <el-tag size="small" :type="row.biz_type === 'customer' ? 'primary' : 'warning'">{{ row.biz_type === 'customer' ? '客户' : '供应商' }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column prop="target_name" label="对象" min-width="120" />
            <el-table-column prop="period_start" label="期间起" min-width="110" />
            <el-table-column prop="period_end" label="期间止" min-width="110" />
            <el-table-column prop="balance_amount" label="期末余额" min-width="120" align="right">
              <template #default="{ row }"><b style="color:#409eff">{{ row.balance_amount }}</b></template>
            </el-table-column>
            <el-table-column prop="status" label="状态" width="100">
              <template #default="{ row }">
                <el-tag size="small" :type="row.status === 'voided' ? 'danger' : (row.status === 'sent' ? 'success' : (row.status === 'confirmed' ? 'warning' : 'info'))">{{ row.status_label || row.status }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column width="220" fixed="right">
              <template #default="{ row }">
                <el-button size="small" link type="primary" @click="viewDetail(row)">详情</el-button>
                <el-button v-if="row.status === 'generated'" size="small" link type="warning" @click="action(row.id, 'confirm')">确认</el-button>
                <el-button v-if="['generated', 'confirmed'].includes(row.status)" size="small" link type="success" @click="action(row.id, 'send')">发送</el-button>
                <el-button v-if="['generated', 'confirmed'].includes(row.status)" size="small" link type="danger" @click="action(row.id, 'void')">作废</el-button>
              </template>
            </el-table-column>
            <template #empty><el-empty :image-size="70" description="暂无对账单" /></template>
          </el-table>
        </wd-panel>
      </div>

      <el-dialog v-model="detailVisible" title="对账单详情" width="680px">
        <div v-if="detail">
          <el-descriptions :column="2" border size="small">
            <el-descriptions-item label="对账单号">{{ detail.rc_no }}</el-descriptions-item>
            <el-descriptions-item label="类型">{{ detail.biz_type }}</el-descriptions-item>
            <el-descriptions-item label="期间">{{ detail.period_start }} ~ {{ detail.period_end }}</el-descriptions-item>
            <el-descriptions-item label="状态">{{ detail.status_label || detail.status }}</el-descriptions-item>
            <el-descriptions-item label="期末余额" :span="2"><b style="color:#409eff">{{ detail.balance_amount }}</b></el-descriptions-item>
          </el-descriptions>
          <template v-if="detail.snapshot">
            <h4 style="margin:16px 0 8px">摘要</h4>
            <el-descriptions :column="2" border size="small">
              <el-descriptions-item label="期初余额">{{ detail.snapshot.opening }}</el-descriptions-item>
              <el-descriptions-item label="本期发生">{{ detail.snapshot.in_amount }}</el-descriptions-item>
              <el-descriptions-item label="退货">{{ detail.snapshot.return_amount }}</el-descriptions-item>
              <el-descriptions-item label="收款/付款">{{ detail.snapshot.pay_amount }}</el-descriptions-item>
            </el-descriptions>
          </template>
        </div>
      </el-dialog>
    </div>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const Icons = window.ElementPlusIconsVue;
    const { ref, onMounted, watch } = Vue;

    const app = Vue.createApp({
      template: '#rec-tpl',
      setup() {
        const DocumentAdd = Icons.DocumentAdd;
        const genBiz = ref('customer');
        const genTarget = ref('');
        const genStart = ref('');
        const genEnd = ref('');
        const genLoading = ref(false);
        const targets = ref([]);
        const list = ref([]);
        const detailVisible = ref(false);
        const detail = ref(null);

        function qs(obj) {
          const p = new URLSearchParams();
          for (const [k, v] of Object.entries(obj)) { if (v !== '' && v != null) p.append(k, v); }
          const s = p.toString();
          return s ? '?' + s : '';
        }

        async function loadTargets() {
          const res = await WD.request.get('/trade/report/targets' + qs({ biz_type: genBiz.value }));
          if (res.success) targets.value = res.data || [];
          else ElementPlus.ElMessage.error(res.message || '加载对象失败');
        }

        async function loadList() {
          const res = await WD.request.get('/trade/report/reconciliationList');
          if (res.success) list.value = res.data || [];
          else ElementPlus.ElMessage.error(res.message || '加载对账单失败');
        }

        async function doGenerate() {
          if (!genTarget.value) { ElementPlus.ElMessage.warning('请选择对账对象'); return; }
          if (!genStart.value || !genEnd.value) { ElementPlus.ElMessage.warning('请选择对账期间'); return; }
          genLoading.value = true;
          try {
            const fd = new FormData();
            fd.append('biz_type', genBiz.value);
            fd.append('target_id', genTarget.value);
            fd.append('period_start', genStart.value);
            fd.append('period_end', genEnd.value);
            const res = await WD.request.post('/trade/report/reconciliationGenerate', fd);
            if (res.success) { ElementPlus.ElMessage.success(res.message || '已生成'); loadList(); }
            else ElementPlus.ElMessage.error(res.message);
          } finally {
            genLoading.value = false;
          }
        }

        async function action(id, act) {
          const fd = new FormData();
          fd.append('id', id);
          fd.append('action', act);
          const res = await WD.request.post('/trade/report/reconciliationAction', fd);
          if (res.success) { ElementPlus.ElMessage.success(res.message || '操作成功'); loadList(); }
          else ElementPlus.ElMessage.error(res.message);
        }

        async function viewDetail(row) {
          const res = await WD.request.get('/trade/report/reconciliationDetail' + qs({ id: row.id }));
          if (res.success) { detail.value = res.data; detailVisible.value = true; }
          else ElementPlus.ElMessage.error(res.message);
        }

        watch(genBiz, function () {
          genTarget.value = '';
          loadTargets();
        });

        onMounted(function () { loadList(); loadTargets(); });

        return {
          DocumentAdd, genBiz, genTarget, genStart, genEnd, genLoading, targets, list,
          detailVisible, detail, doGenerate, action, viewDetail
        };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
