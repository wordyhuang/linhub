<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应商档案 - 林销</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .trade-page {
      height: 100%;
      padding: 16px 20px 24px;
      box-sizing: border-box;
    }

    .trade-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .trade-tag {
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="text/x-template" id="supplier-tpl">
  <div class="trade-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      供应商档案是采购业务的前置数据：维护供应商编号、联系人、电话、地址与结清备注。
      采购订单只能选择启用状态的供应商，停用不影响历史采购单。
    </wd-tips>

    <wd-panel :border="true" title="供应商档案"
              description="编号由系统自动生成且编辑时不可修改；结清备注用于记录对账/结算时的约定说明，可随单据打印。">
      <wd-data-grid ref="grid" api="/trade/supplier/rows" api-method="get" :active="true" filter="trade-supplier" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="trade-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="供应商名称 / 编号 / 联系人 / 电话" size="small" clearable style="width:240px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:110px" @change="doSearch">
                <el-option label="启用" value="1" />
                <el-option label="停用" value="0" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <wd-drawer-button label="新增供应商" title="新增供应商" drawer-size="520px" size="small" type="primary"
                              filter="trade-supplier" :data="{ name: '', contact: '', phone: '', address: '', remark: '', settle_note: '' }">
              <wd-data-form mode="create" submit-api="/trade/supplier/save" submit-method="post"
                            submit-keys="name,contact,phone,address,remark,settle_note"
                            :head-close-drawer="true" :head-refresh-datagrid="'trade-supplier'"
                            :confirm-leave="true" label-width="90px"
                            :rules="{ name: [{ required: true, message: '请填写供应商名称', trigger: 'blur' }] }">
                <wd-form-item label="名称" prop="name" required>
                  <el-input v-model="model.name" placeholder="输入供应商名称" maxlength="80" />
                </wd-form-item>
                <wd-form-item label="联系人" prop="contact">
                  <el-input v-model="model.contact" placeholder="输入联系人" maxlength="40" />
                </wd-form-item>
                <wd-form-item label="联系电话" prop="phone">
                  <el-input v-model="model.phone" placeholder="输入联系电话" maxlength="30" />
                </wd-form-item>
                <wd-form-item label="地址" prop="address">
                  <el-input v-model="model.address" placeholder="输入地址" maxlength="120" />
                </wd-form-item>
                <wd-form-item label="备注" prop="remark">
                  <el-input v-model="model.remark" type="textarea" :rows="2" placeholder="输入备注" maxlength="200" />
                </wd-form-item>
                <wd-form-item label="结清备注" prop="settle_note">
                  <el-input v-model="model.settle_note" placeholder="输入结清备注" maxlength="200" />
                </wd-form-item>
              </wd-data-form>
            </wd-drawer-button>
          </div>
        </template>

        <el-table-column prop="supplier_no" label="编号" min-width="110" />
        <el-table-column prop="name" label="名称" min-width="160" show-overflow-tooltip />
        <el-table-column prop="contact" label="联系人" min-width="90" show-overflow-tooltip />
        <el-table-column prop="phone" label="联系电话" min-width="120" show-overflow-tooltip />
        <el-table-column prop="address" label="地址" min-width="170" show-overflow-tooltip />
        <el-table-column prop="remark" label="备注" min-width="140" show-overflow-tooltip />
        <el-table-column prop="settle_note" label="结清备注" min-width="140" show-overflow-tooltip />
        <el-table-column label="状态" width="90">
          <template #default="{ row }">
            <el-tag size="small" :type="on(row.status) ? 'success' : 'info'" effect="light"
                    class="trade-tag">{{ row.status_label || (on(row.status) ? '启用' : '停用') }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="220" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <wd-drawer-button label="编辑" title="编辑供应商" drawer-size="520px" size="small" type="primary"
                                filter="trade-supplier" :data="row">
                <wd-data-form mode="edit" submit-api="/trade/supplier/save" submit-method="post"
                              submit-keys="id,name,contact,phone,address,remark,settle_note"
                              :head-close-drawer="true" :head-refresh-datagrid="'trade-supplier'"
                              :confirm-leave="true" label-width="90px"
                              :rules="{ name: [{ required: true, message: '请填写供应商名称', trigger: 'blur' }] }">
                  <wd-form-item label="编号" prop="supplier_no">
                    <el-input v-model="model.supplier_no" disabled />
                  </wd-form-item>
                  <wd-form-item label="名称" prop="name" required>
                    <el-input v-model="model.name" placeholder="输入供应商名称" maxlength="80" />
                  </wd-form-item>
                  <wd-form-item label="联系人" prop="contact">
                    <el-input v-model="model.contact" placeholder="输入联系人" maxlength="40" />
                  </wd-form-item>
                  <wd-form-item label="联系电话" prop="phone">
                    <el-input v-model="model.phone" placeholder="输入联系电话" maxlength="30" />
                  </wd-form-item>
                  <wd-form-item label="地址" prop="address">
                    <el-input v-model="model.address" placeholder="输入地址" maxlength="120" />
                  </wd-form-item>
                  <wd-form-item label="备注" prop="remark">
                    <el-input v-model="model.remark" type="textarea" :rows="2" placeholder="输入备注" maxlength="200" />
                  </wd-form-item>
                  <wd-form-item label="结清备注" prop="settle_note">
                    <el-input v-model="model.settle_note" placeholder="输入结清备注" maxlength="200" />
                  </wd-form-item>
                </wd-data-form>
              </wd-drawer-button>
              <wd-popconfirm-button :title="on(row.status) ? '确认停用供应商？' : '确认启用供应商？'"
                                    :tip="'确认「' + row.name + '」' + (on(row.status) ? '停用' : '启用') + '？'"
                                    api="/trade/supplier/switch"
                                    :api-param="{ id: row.id, mode: on(row.status) ? 'off' : 'on' }"
                                    :type="on(row.status) ? 'danger' : 'success'" size="small"
                                    head-refresh-datagrid="trade-supplier">
                {{ on(row.status) ? '停用' : '启用' }}
              </wd-popconfirm-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="80" description="暂无供应商" /></template>
      </wd-data-grid>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive } = Vue;

    const app = Vue.createApp({
      template: '#supplier-tpl',
      setup() {
        const grid = ref(null);
        const keyword = ref('');
        const status = ref('');
        const Search = window.ElementPlusIconsVue.Search;

        function on(v) { return parseInt(v, 10) === 1; }

        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim(), status: status.value });
        }

        return { grid, keyword, status, Search, on, doSearch };
      }
    });

    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) {
      app.component(name, comp);
    }
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>

</html>
