<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商机管理 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .crm-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    /* ── 卡片模式（DataGrid modeSwitch 内建视图） ── */
    .opp-card { background: #fff; border: 1px solid #ebeef5; border-radius: 6px; padding: 10px 12px; }
    .opp-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .opp-card .nm { font-size: 13px; font-weight: 600; color: #303133; display: flex; align-items: center; gap: 6px; }
    .opp-card .meta { margin-top: 6px; font-size: 12px; color: #909399; display: flex; align-items: center; gap: 6px; }
    .opp-card .amt { margin-left: auto; color: #e6a23c; font-weight: 600; }
    .opp-card .ops { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .opp-card .ops .el-button + .el-button { margin-left: 0; }
  /* wd-panel description 右对齐（组件无对齐 prop，覆盖内建 flex 容器） */
  .wd-panel__header-main { justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-opp-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      商机阶段单向推进：初步接触 → 需求确认 → 方案报价（须有报价附件或预计金额）→ 商务谈判 → 赢单/输单；
      回退必须填写原因留痕；落终态必须填写结果原因，输单商机可重开。
      右上角工具按钮可在表格 / 卡片清单两种视图间切换。
    </wd-tips>

    <wd-panel :border="true" title="商机管理"
              description="阶段推进走乐观锁（version），并发冲突时会提示刷新重试。">

      <wd-data-grid ref="grid" api="/lin-crm/opportunity/rows" api-method="post" :active="false"
                    filter="crm-opp" :with-index="false" row-key="id"
                    mode-switch :tools="{ refresh: true, modeSwitch: true }">
        <template #toolbar>
          <div class="crm-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="商机名称 / 编号" size="small" clearable style="width:180px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="stage" placeholder="全部阶段" size="small" clearable style="width:120px" @change="doSearch">
                <el-option v-for="(t, k) in stageLabels" :key="k" :label="t" :value="k" />
              </el-select>
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:110px" @change="doSearch">
                <el-option label="进行中" value="open" /><el-option label="赢单" value="won" /><el-option label="输单" value="lost" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <!-- 新增入口 = 弹层触发器（规范 §0.13 DrawerButton） -->
            <wd-drawer-button v-if="can('lin-crm:opportunity:create')" label="新增商机" title="新增商机" drawer-size="420px"
                              size="small" type="primary" @open="resetForm">
              <template #default>
                <el-form label-width="100px" size="small">
                  <el-form-item label="商机名称" required><el-input v-model="form.name" /></el-form-item>
                  <el-form-item label="客户ID" required><el-input-number v-model="form.customer_id" :min="1" style="width:100%" /></el-form-item>
                  <el-form-item label="预计金额"><el-input-number v-model="form.amount" :min="0" :precision="2" style="width:100%" /></el-form-item>
                </el-form>
              </template>
              <template #footer="f">
                <el-button size="small" @click="f.close">取消</el-button>
                <wd-api-button label="保存" type="primary" size="small" api="/lin-crm/opportunity/save"
                               :api-param="{ name: form.name, customer_id: form.customer_id, amount: form.amount }"
                               :disabled="!form.name.trim() || !form.customer_id"
                               head-refresh-datagrid="crm-opp" @api-success="f.close">保存</wd-api-button>
              </template>
            </wd-drawer-button>
          </div>
        </template>

        <el-table-column prop="code" label="编号" width="120" />
        <el-table-column prop="name" label="商机名称" min-width="160" show-overflow-tooltip />
        <el-table-column label="客户" width="110">
          <template #default="{ row }">#{{ row.customer_id }}</template>
        </el-table-column>
        <el-table-column label="阶段" width="110">
          <template #default="{ row }">
            <el-tag :type="{ initial: 'info', confirm: '', proposal: 'warning', negotiate: 'warning' }[row.stage] || 'info'" size="small">
              {{ stageLabels[row.stage] || row.stage }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="状态" width="90">
          <template #default="{ row }">
            <el-tag :type="{ open: 'primary', won: 'success', lost: 'danger' }[row.status] || 'info'" size="small">
              {{ { open: '进行中', won: '赢单', lost: '输单' }[row.status] || row.status }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="预计金额" width="120" align="right">
          <template #default="{ row }">{{ fmtNum(row.amount, 2) }}</template>
        </el-table-column>
        <el-table-column prop="win_rate" label="赢率%" width="80" align="right" />
        <el-table-column prop="stage_changed_at" label="阶段变更时间" width="160" />
        <el-table-column label="操作" width="200" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <template v-if="row.status === 'open'">
                <el-button v-if="can('lin-crm:opportunity:edit')" size="small" type="primary" @click="openStage(row)">推进</el-button>
                <el-button v-if="can('lin-crm:opportunity:won')" size="small" type="success" @click="openResult(row, 'won')">赢单</el-button>
                <el-dropdown trigger="click" @command="(cmd) => rowCommand(cmd, row)">
                  <el-button size="small">更多<el-icon><ArrowDown /></el-icon></el-button>
                  <template #dropdown>
                    <el-dropdown-menu>
                      <el-dropdown-item v-if="can('lin-crm:opportunity:edit')" command="rollback">阶段回退</el-dropdown-item>
                      <el-dropdown-item v-if="can('lin-crm:opportunity:lost')" command="lost">
                        <span style="color:#f56c6c">标记输单</span>
                      </el-dropdown-item>
                    </el-dropdown-menu>
                  </template>
                </el-dropdown>
              </template>
              <!-- 终态回退：行内气泡二次确认（规范 §1.7 / §0.13 PopconfirmButton） -->
              <wd-popconfirm-button v-else-if="row.status === 'lost'" label="重开" type="warning" size="small"
                                    title="确认重开该输单商机？" tips="重开后回到进行中，可继续推进阶段"
                                    api="/lin-crm/opportunity/result"
                                    :api-param="{ id: row.id, result: 'lost', reason: 'reopen', reopen: 1 }"
                                    head-refresh-datagrid="crm-opp">重开</wd-popconfirm-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty>
          <el-empty :image-size="80" description="暂无商机，点击右上角「新增商机」开始" />
        </template>
        <!-- ── 卡片清单模式（DataGrid 内建 modeSwitch 视图） ── -->
        <template #card-item="{ row }">
          <div class="opp-card">
            <div class="nm">
              {{ row.name }}
              <el-tag :type="{ initial: 'info', confirm: '', proposal: 'warning', negotiate: 'warning' }[row.stage] || 'info'" size="small">
                {{ stageLabels[row.stage] || row.stage }}
              </el-tag>
              <el-tag :type="{ open: 'primary', won: 'success', lost: 'danger' }[row.status] || 'info'" size="small" effect="plain">
                {{ { open: '进行中', won: '赢单', lost: '输单' }[row.status] || row.status }}
              </el-tag>
            </div>
            <div class="meta">编号 {{ row.code }} · 客户 #{{ row.customer_id }} · 赢率 {{ row.win_rate }}% · {{ (row.stage_changed_at || '').slice(0, 10) }}<span class="amt">¥{{ fmtNum(row.amount, 0) }}</span></div>
            <div class="ops" v-if="row.status === 'open'">
              <el-button v-if="can('lin-crm:opportunity:edit')" size="small" type="primary" @click="openStage(row)">推进</el-button>
              <el-button v-if="can('lin-crm:opportunity:won')" size="small" type="success" @click="openResult(row, 'won')">赢单</el-button>
              <el-button v-if="can('lin-crm:opportunity:edit')" size="small" @click="openStage(row, true)">阶段回退</el-button>
              <el-button v-if="can('lin-crm:opportunity:lost')" size="small" type="danger" plain @click="openResult(row, 'lost')">标记输单</el-button>
            </div>
            <div class="ops" v-else-if="row.status === 'lost'">
              <wd-popconfirm-button label="重开" type="warning" size="small"
                                    title="确认重开该输单商机？" tips="重开后回到进行中，可继续推进阶段"
                                    api="/lin-crm/opportunity/result"
                                    :api-param="{ id: row.id, result: 'lost', reason: 'reopen', reopen: 1 }"
                                    head-refresh-datagrid="crm-opp">重开</wd-popconfirm-button>
            </div>
          </div>
        </template>
      </wd-data-grid>
    </wd-panel>

    <!-- 阶段推进/回退对话框（表格行与卡片操作共用；提交走 wd-api-button 单请求闭环） -->
    <el-dialog v-model="stageVisible" :title="stageRollback ? '阶段回退' : '阶段推进'" width="420px">
      <el-form label-width="90px" size="small">
        <el-form-item label="目标阶段">
          <el-select v-model="stageForm.stage" style="width:100%">
            <el-option v-for="(t, k) in stageLabels" :key="k" :label="t" :value="k" />
          </el-select>
        </el-form-item>
        <el-form-item v-if="stageRollback" label="回退原因" required>
          <el-input v-model="stageForm.reason" type="textarea" :rows="2" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button size="small" @click="stageVisible = false">取消</el-button>
        <wd-api-button label="确认" type="primary" size="small" api="/lin-crm/opportunity/stage"
                       :api-param="{ id: stageForm.id, stage: stageForm.stage, version: stageForm.version, rollback: stageRollback ? 1 : 0, reason: stageForm.reason }"
                       :disabled="!!stageRollback && !stageForm.reason.trim()"
                       head-refresh-datagrid="crm-opp" @api-success="afterDialog(stageVisible)">确认</wd-api-button>
      </template>
    </el-dialog>

    <!-- 赢单/输单对话框（落终态必填结果原因） -->
    <el-dialog v-model="resultVisible" :title="resultType === 'won' ? '标记赢单' : '标记输单'" width="420px">
      <el-form label-width="90px" size="small">
        <el-form-item label="结果原因" required><el-input v-model="resultForm.reason" type="textarea" :rows="2" /></el-form-item>
        <el-form-item v-if="resultType === 'lost'" label="竞争对手"><el-input v-model="resultForm.competitor" /></el-form-item>
      </el-form>
      <template #footer>
        <el-button size="small" @click="resultVisible = false">取消</el-button>
        <wd-api-button label="确认" size="small" :type="resultType === 'won' ? 'success' : 'danger'" api="/lin-crm/opportunity/result"
                       :api-param="{ id: resultForm.id, result: resultForm.result, reason: resultForm.reason, competitor: resultForm.competitor }"
                       :disabled="!resultForm.reason.trim()"
                       head-refresh-datagrid="crm-opp" @api-success="afterDialog(resultVisible)">确认</wd-api-button>
      </template>
    </el-dialog>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive } = Vue;

    const stageLabels = { initial: '初步接触', confirm: '需求确认', proposal: '方案报价', negotiate: '商务谈判' };

    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return isNaN(n) ? '-' : n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    const app = Vue.createApp({
      template: '#crm-opp-tpl',
      setup() {
        const grid = ref(null);
        const keyword = ref('');
        const stage = ref('');
        const status = ref('');
        const Search = window.ElementPlusIconsVue.Search;
        const ArrowDown = window.ElementPlusIconsVue.ArrowDown;

        // 权限显隐
        const permSet = ref(new Set());
        async function loadPerms() {
          try {
            const res = await fetch('/lin-crm/perms'); const body = await res.json();
            if (body.code === 0) permSet.value = new Set(body.data.perms || []);
          } catch (e) { /* 失败时按钮隐藏更安全 */ }
        }
        const can = (code) => permSet.value.has(code);

        const form = reactive({ name: '', customer_id: null, amount: 0 });
        function resetForm() { Object.assign(form, { name: '', customer_id: null, amount: 0 }); }

        const stageVisible = ref(false);
        const stageRollback = ref(false);
        const stageForm = reactive({ id: 0, stage: 'confirm', reason: '', version: -1 });

        const resultVisible = ref(false);
        const resultType = ref('won');
        const resultForm = reactive({ id: 0, result: 'won', reason: '', competitor: '' });

        function doSearch() { grid.value && grid.value.search({ keyword: keyword.value.trim(), stage: stage.value, status: status.value }); }

        // wd-api-button 成功后：仅关弹层（刷新由 head-refresh-datagrid 声明式完成；
        // 勿再手动 grid.refresh()，否则双刷新竞态会取消在途请求并弹出 canceled 提示）
        function afterDialog(visibleRef) {
          visibleRef.value = false; // 刷新由 head-refresh-datagrid 声明式完成
        }
        function openStage(row, rollback = false) {
          Object.assign(stageForm, { id: row.id, stage: row.stage, reason: '', version: row.version });
          stageRollback.value = rollback;
          stageVisible.value = true;
        }
        function openResult(row, type) { Object.assign(resultForm, { id: row.id, result: type, reason: '', competitor: '' }); resultType.value = type; resultVisible.value = true; }
        function rowCommand(cmd, row) {
          if (cmd === 'rollback') openStage(row, true);
          else if (cmd === 'lost') openResult(row, 'lost');
        }

        Vue.onMounted(() => {
          loadPerms();
          doSearch();
          // 默认进入「列表（卡片清单）」模式：DataGrid 内部初始为 table 且无默认视图 prop，
          // 挂载后程序化触发工具栏「表格/列表切换」按钮（tools 仅 refresh+modeSwitch，末位即切换钮）
          Vue.nextTick(() => {
            const btns = document.querySelectorAll('.wd-datagrid .el-button.is-circle');
            if (btns.length) btns[btns.length - 1].click();
          });
        });

        return { grid, keyword, stage, status, Search, ArrowDown, can, stageLabels,
                 form, resetForm,
                 stageVisible, stageRollback, stageForm, resultVisible, resultType, resultForm,
                 doSearch, afterDialog, openStage, openResult, rowCommand, fmtNum };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
