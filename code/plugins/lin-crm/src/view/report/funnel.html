<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>林客漏斗分析 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .funnel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .funnel-bar { height: 34px; border-radius: 4px; color: #fff; display: flex; align-items: center;
                  padding: 0 10px; font-size: 13px; min-width: 60px; background: #409eff; }
    .stage-label { width: 90px; text-align: right; font-size: 13px; color: #606266; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-funnel-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      漏斗展示四个开放阶段的商机数量与金额占比（按最大阶段归一）；赢单率 = 赢单数 /（赢单 + 输单）。
    </wd-tips>

    <wd-panel :border="true" :title="'漏斗分析（赢率 ' + (data.win_rate ?? 0) + '%，赢单 ' + (data.won ?? 0) + ' / 输单 ' + (data.lost ?? 0) + '）'">
      <div style="margin-bottom:18px">
        <div class="funnel-row" v-for="f in funnel" :key="f.stage">
          <span class="stage-label">{{ stageLabels[f.stage] || f.stage }}</span>
          <div class="funnel-bar" :style="{ width: barWidth(f.count) + 'px' }">
            {{ f.count }} 个 / ¥{{ fmtNum(f.amount, 0) }}
          </div>
        </div>
      </div>
      <el-table :data="funnel" size="small" border>
        <el-table-column label="阶段" width="110"><template #default="{ row }">{{ stageLabels[row.stage] || row.stage }}</template></el-table-column>
        <el-table-column prop="count" label="商机数" width="90" align="right" />
        <el-table-column label="金额" width="140" align="right"><template #default="{ row }">¥ {{ fmtNum(row.amount, 2) }}</template></el-table-column>
        <el-table-column label="占比" width="90" align="right"><template #default="{ row }">{{ row.convert_rate }}%</template></el-table-column>
        <el-table-column label="平均停留(天)" width="120" align="right"><template #default="{ row }">{{ row.avg_stay_days }}</template></el-table-column>
        <template #empty><el-empty :image-size="60" description="暂无数据" /></template>
      </el-table>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, computed } = Vue;

    const stageLabels = { initial: '初步接触', confirm: '需求确认', proposal: '方案报价', negotiate: '商务谈判' };

    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return isNaN(n) ? '-' : n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    const app = Vue.createApp({
      template: '#crm-funnel-tpl',
      setup() {
        const data = ref({});
        const funnel = computed(() => data.value.funnel || []);
        const maxCount = computed(() => Math.max(1, ...funnel.value.map(f => f.count)));
        function barWidth(count) { return Math.max(60, Math.round(count / maxCount.value * 420)); }
        (async () => {
          const res = await fetch('/lin-crm/report/funnel', { method: 'POST' });
          const body = await res.json();
          if (body.code === 0) data.value = body.data;
          else ElementPlus.ElMessage.error(body.message || '加载失败');
        })();
        return { data, funnel, stageLabels, barWidth, fmtNum };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
