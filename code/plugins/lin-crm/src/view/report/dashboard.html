<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>林客工作台 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .card { border: 1px solid #e4e7ed; border-radius: 8px; padding: 16px; }
    .card .label { font-size: 13px; color: #909399; }
    .card .value { font-size: 26px; font-weight: 600; margin-top: 6px; color: #303133; }
    @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  /* wd-panel description 右对齐（组件无对齐 prop，覆盖内建 flex 容器） */
  .wd-panel__header-main { justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-dashboard-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      销售工作台：数据每 5 分钟缓存刷新（可在 CRM 设置调整缓存周期）。
      本月预测 = 各开放阶段商机金额 × 阶段赢率的加权合计。
    </wd-tips>

    <div class="cards">
      <div class="card"><div class="label">今日新增线索</div><div class="value">{{ data.lead_today ?? '-' }}</div></div>
      <div class="card"><div class="label">今日新增客户</div><div class="value">{{ data.customer_today ?? '-' }}</div></div>
      <div class="card"><div class="label">本月预测（加权）</div><div class="value">¥ {{ fmtNum(data.forecast_month, 2) }}</div></div>
      <div class="card"><div class="label">应收逾期合计</div><div class="value" style="color:#f56c6c">¥ {{ fmtNum(data.receivable_overdue_total, 2) }}</div></div>
    </div>

    <wd-panel :border="true" title="超期未跟进 TOP5" description="私海客户超过保护期天数未跟进（公海规则保护期口径），建议尽快跟进或退回公海。">
      <el-table :data="data.overdue_followup_top5 || []" size="small" border>
        <el-table-column prop="id" label="客户ID" width="90" />
        <el-table-column prop="name" label="客户名称" min-width="160" />
        <el-table-column prop="owner_id" label="负责人ID" width="100" />
        <el-table-column prop="last_followup_at" label="最近跟进" width="170" />
        <template #empty><el-empty :image-size="60" description="没有超期未跟进客户" /></template>
      </el-table>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref } = Vue;

    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return isNaN(n) ? '-' : n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    const app = Vue.createApp({
      template: '#crm-dashboard-tpl',
      setup() {
        const data = ref({});
        (async () => {
          const res = await fetch('/lin-crm/report/dashboard', { method: 'POST' });
          const body = await res.json();
          if (body.code === 0) data.value = body.data;
          else ElementPlus.ElMessage.error(body.message || '加载失败');
        })();
        return { data, fmtNum };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
