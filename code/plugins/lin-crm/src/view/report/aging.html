<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>林客应收账龄 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .card { border: 1px solid #e4e7ed; border-radius: 8px; padding: 14px; }
    .card .label { font-size: 13px; color: #909399; }
    .card .value { font-size: 22px; font-weight: 600; margin-top: 6px; }
    @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-aging-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      应收账龄按回款期次的计划收款日距今天数分四档：≤30 天 / 31-60 天 / 61-90 天 / 90 天以上。
      明细只列未收余额大于零的期次，可用于催收跟进（导出走报表导出接口落审计）。
    </wd-tips>

    <div class="cards">
      <div class="card"><div class="label">≤30 天</div><div class="value">¥ {{ fmtNum(buckets.b30, 2) }}</div></div>
      <div class="card"><div class="label">31-60 天</div><div class="value">¥ {{ fmtNum(buckets.b60, 2) }}</div></div>
      <div class="card"><div class="label">61-90 天</div><div class="value">¥ {{ fmtNum(buckets.b90, 2) }}</div></div>
      <div class="card"><div class="label" style="color:#f56c6c">90 天以上</div><div class="value" style="color:#f56c6c">¥ {{ fmtNum(buckets.b90p, 2) }}</div></div>
    </div>

    <wd-panel :border="true" title="逾期明细">
      <el-table :data="detail" size="small" border>
        <el-table-column prop="contract_id" label="合同ID" width="90" />
        <el-table-column prop="code" label="合同编号" width="130" />
        <el-table-column prop="name" label="合同名称" min-width="160" show-overflow-tooltip />
        <el-table-column label="未收余额" width="130" align="right"><template #default="{ row }">¥ {{ fmtNum(row.due, 2) }}</template></el-table-column>
        <el-table-column prop="overdue_days" label="逾期天数" width="100" align="right" />
        <el-table-column label="账龄档" width="110">
          <template #default="{ row }">
            <el-tag :type="{ b30: 'info', b60: 'warning', b90: 'danger', b90p: 'danger' }[row.bucket]" size="small">
              {{ bucketLabels[row.bucket] || row.bucket }}
            </el-tag>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="60" description="没有逾期期次" /></template>
      </el-table>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, computed } = Vue;

    const bucketLabels = { b30: '≤30天', b60: '31-60天', b90: '61-90天', b90p: '90天以上' };

    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return isNaN(n) ? '-' : n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    const app = Vue.createApp({
      template: '#crm-aging-tpl',
      setup() {
        const data = ref({});
        const buckets = computed(() => data.value.buckets || {});
        const detail = computed(() => data.value.detail || []);
        (async () => {
          const res = await fetch('/lin-crm/report/aging', { method: 'POST' });
          const body = await res.json();
          if (body.code === 0) data.value = body.data;
          else ElementPlus.ElMessage.error(body.message || '加载失败');
        })();
        return { buckets, detail, bucketLabels, fmtNum };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
