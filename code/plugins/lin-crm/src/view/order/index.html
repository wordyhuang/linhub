<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跟单看板 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .crm-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    /* ── 卡片模式（DataGrid modeSwitch 内建视图；扁平平行行，无嵌套） ── */
    .ord-card { background: #fff; padding: 0px; }
    .ord-card .hd { display: flex; align-items: center; gap: 8px; }
    .ord-card .hd .amt { margin-left: auto; color: #e6a23c; font-weight: 600; font-size: 13px; }
    .ord-card .meta { margin-top: 6px; font-size: 12px; color: #909399; }
    .ord-card .prog { margin-top: 6px; }
    .ord-card .ops { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .ord-card .ops .el-button + .el-button { margin-left: 0; }
    /* wd-panel description 右对齐（组件无对齐 prop，覆盖内建 flex 容器） */
    .wd-panel__header-main { justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-order-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      跟单看板汇聚林销（进销存）销售订单的履约进度：CRM 客户与订单按客户名称自动关联，未匹配的订单以「未关联」展示；
      跟单记录与预警仅存于 CRM 侧，不改动订单数据。右上角工具按钮可在表格 / 卡片清单两种视图间切换。
    </wd-tips>

    <wd-panel :border="true" title="跟单看板"
              description="以客户视角跟踪签约后履约：订单状态与出库进度实时读自林销，只读不双写。">

      <wd-data-grid ref="grid" api="/lin-crm/order/rows" api-method="post" :active="false"
                    filter="crm-order" :with-index="false" row-key="id"
                    mode-switch :tools="{ refresh: true, modeSwitch: true }">
        <template #toolbar>
          <div class="crm-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="订单号 / 客户名称" size="small" clearable style="width:180px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:120px" @change="doSearch">
                <el-option v-for="(t, k) in statusLabels" :key="k" :label="t" :value="k" />
              </el-select>
              <el-checkbox v-model="onlyMine" size="small" @change="doSearch">只看我的客户</el-checkbox>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
          </div>
        </template>

        <el-table-column prop="order_no" label="订单号" width="130" />
        <el-table-column label="客户" min-width="150" show-overflow-tooltip>
          <template #default="{ row }">
            <el-link v-if="row.linked" type="primary" :underline="false"
                     @click="openCustomer(row)">{{ row.crm_customer_name }}</el-link>
            <template v-else>{{ row.trade_customer_name }} <el-tag size="small" type="info" effect="plain">未关联</el-tag></template>
          </template>
        </el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag :type="{ draft: 'info', submitted: 'primary', partial: 'warning', done: 'success', closed: 'info', voided: 'danger' }[row.status] || 'info'"
                    size="small">{{ row.status_label }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="订单金额" width="120" align="right">
          <template #default="{ row }">{{ fmtNum(row.total_amount, 2) }}</template>
        </el-table-column>
        <el-table-column label="出库进度" width="170">
          <template #default="{ row }">
            <el-progress :percentage="row.progress_pct" :stroke-width="8"
                         :status="row.progress_pct >= 100 ? 'success' : undefined" />
          </template>
        </el-table-column>
        <el-table-column prop="updated_at" label="最近更新" width="160" />
        <el-table-column label="操作" width="180" fixed="right">
          <template #default="{ row }">
            <el-button size="small" @click="openItems(row)">明细</el-button>
            <el-button v-if="can('lin-crm:order:follow')" size="small" type="primary" @click="openFollow(row)">跟进</el-button>
            <el-button size="small" @click="openTimeline(row)">记录</el-button>
          </template>
        </el-table-column>
        <template #empty>
          <el-empty v-if="!available" :image-size="80" description="林销（进销存）功能包未安装或未启用，跟单看板暂无数据" />
          <el-empty v-else :image-size="80" description="暂无订单数据" />
        </template>

        <!-- ── 卡片清单模式（DataGrid modeSwitch 内建视图；扁平平行行） ── -->
        <template #card-item="{ row }">
          <div class="ord-card">
            <div class="hd">
              <span>{{ row.order_no }}</span>
              <el-tag :type="{ draft: 'info', submitted: 'primary', partial: 'warning', done: 'success', closed: 'info', voided: 'danger' }[row.status] || 'info'"
                      size="small">{{ row.status_label }}</el-tag>
              <span class="amt">¥{{ fmtNum(row.total_amount, 0) }}</span>
            </div>
            <div class="meta">
              <el-link v-if="row.linked" type="primary" :underline="false"
                       @click="openCustomer(row)">{{ row.crm_customer_name }}</el-link>
              <span v-else>{{ row.trade_customer_name }}（未关联）</span>
            </div>
            <div class="prog">
              <el-progress :percentage="row.progress_pct" :stroke-width="7"
                           :status="row.progress_pct >= 100 ? 'success' : undefined" />
            </div>
            <div class="ops">
              <el-button size="small" @click="openItems(row)">明细</el-button>
              <el-button v-if="can('lin-crm:order:follow')" size="small" type="primary" @click="openFollow(row)">跟进</el-button>
              <el-button size="small" @click="openTimeline(row)">记录</el-button>
            </div>
          </div>
        </template>
      </wd-data-grid>
    </wd-panel>

    <!-- 明细抽屉（共享单例：表格行与卡片共用，openItems 打开） -->
    <wd-drawer v-model="itemsVisible" :title="'订单明细 · ' + itemsOrderNo" size="560px">
      <el-table :data="items" size="small" border v-loading="itemsLoading">
        <el-table-column prop="product_name" label="商品" min-width="120" show-overflow-tooltip />
        <el-table-column prop="quantity" label="计划量" width="80" align="right" />
        <el-table-column prop="outbound_qty" label="已出库" width="80" align="right" />
        <el-table-column prop="returned_qty" label="已退货" width="80" align="right" />
        <el-table-column label="进度" width="120">
          <template #default="{ row }">
            <el-progress :percentage="row.pct" :stroke-width="7" :status="row.pct >= 100 ? 'success' : undefined" />
          </template>
        </el-table-column>
      </el-table>
    </wd-drawer>

    <!-- 跟进抽屉（共享单例：新增跟单记录，内容必填） -->
    <wd-drawer v-model="followVisible" title="新增跟单记录" size="400px">
      <div style="margin-bottom:10px;font-size:12px;color:#909399">订单：{{ followOrderNo }}</div>
      <el-form label-width="90px" size="small">
        <el-form-item label="方式">
          <el-select v-model="followForm.method" style="width:100%">
            <el-option label="电话" value="phone" /><el-option label="拜访" value="visit" />
            <el-option label="微信" value="wechat" /><el-option label="其他" value="other" />
          </el-select>
        </el-form-item>
        <el-form-item label="内容" required><el-input v-model="followForm.content" type="textarea" :rows="4"
                                                     placeholder="生产/发货/物流/签收等履约进展或异常" /></el-form-item>
        <el-form-item label="下次跟进">
          <el-date-picker v-model="followForm.next_at" type="datetime" value-format="YYYY-MM-DD HH:mm:ss" style="width:100%" />
        </el-form-item>
      </el-form>
      <template #footer>
        <el-button size="small" @click="followVisible = false">取消</el-button>
        <wd-api-button label="保存" type="primary" size="small" api="/lin-crm/order/follow"
                       :api-param="{ order_id: followForm.order_id, method: followForm.method, content: followForm.content, next_at: followForm.next_at }"
                       :disabled="!followForm.content.trim()"
                       @api-success="followVisible = false">保存</wd-api-button>
      </template>
    </wd-drawer>

    <!-- 跟单记录抽屉（共享单例：时间线） -->
    <wd-drawer v-model="tlVisible" :title="'跟单记录 · ' + tlOrderNo" size="440px">
      <el-empty v-if="!tlEvents.length" :image-size="60" description="暂无跟单记录，点击「跟进」新增" />
      <el-timeline v-else style="padding-left:6px;margin-top:6px">
        <el-timeline-item v-for="(ev, i) in tlEvents" :key="i" :timestamp="ev.created_at" placement="top">
          <div style="font-size:13px;font-weight:600;color:#303133">{{ methodLabel(ev.method) }}</div>
          <div style="font-size:12px;color:#606266;white-space:pre-wrap">{{ ev.content }}</div>
        </el-timeline-item>
      </el-timeline>
    </wd-drawer>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive } = Vue;

    const statusLabels = { draft: '草稿', submitted: '已提交', partial: '部分出库', done: '已完成', closed: '已关闭', voided: '已作废' };
    const methodLabels = { phone: '电话', visit: '拜访', wechat: '微信', other: '其他' };

    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return isNaN(n) ? '-' : n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    const app = Vue.createApp({
      template: '#crm-order-tpl',
      setup() {
        const grid = ref(null);
        const keyword = ref('');
        const status = ref('');
        const onlyMine = ref(false);
        const available = ref(true);
        const Search = window.ElementPlusIconsVue.Search;

        // 权限显隐
        const permSet = ref(new Set());
        async function loadPerms() {
          try {
            const res = await fetch('/lin-crm/perms'); const body = await res.json();
            if (body.code === 0) permSet.value = new Set(body.data.perms || []);
          } catch (e) { /* 失败时按钮隐藏更安全 */ }
        }
        const can = (code) => permSet.value.has(code);

        function doSearch() {
          grid.value && grid.value.search({ keyword: keyword.value.trim(), status: status.value, only_mine: onlyMine.value ? 1 : 0 });
        }
        // 弱依赖空态：首查响应 available=false 时提示（DataGrid 仍展示空表）
        async function firstLoad() {
          try {
            const res = await fetch('/lin-crm/order/rows', { method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ page: 1, page_size: 1 }) });
            const body = await res.json();
            if (body.code === 0 && body.data && body.data.available === false) available.value = false;
          } catch (e) { /* 保持默认 available */ }
        }

        // ── 明细抽屉（共享单例） ──
        const itemsVisible = ref(false);
        const itemsOrderNo = ref('');
        const items = ref([]);
        const itemsLoading = ref(false);
        async function openItems(row) {
          itemsOrderNo.value = row.order_no;
          itemsVisible.value = true;
          itemsLoading.value = true;
          try {
            const res = await fetch('/lin-crm/order/items', { method: 'POST',
              headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: row.id }) });
            const body = await res.json();
            items.value = body.code === 0 ? (body.data || []) : [];
          } catch (e) { items.value = []; }
          itemsLoading.value = false;
        }

        // ── 跟进抽屉（共享单例；提交走 wd-api-button，提示由 http 层自动完成） ──
        const followVisible = ref(false);
        const followOrderNo = ref('');
        const followForm = reactive({ order_id: 0, method: 'phone', content: '', next_at: null });
        function openFollow(row) {
          Object.assign(followForm, { order_id: row.id, method: 'phone', content: '', next_at: null });
          followOrderNo.value = row.order_no;
          followVisible.value = true;
        }

        // ── 跟单记录抽屉（共享单例：时间线） ──
        const tlVisible = ref(false);
        const tlOrderNo = ref('');
        const tlEvents = ref([]);
        const methodLabel = (m) => methodLabels[m] || (m || '-');
        async function openTimeline(row) {
          tlOrderNo.value = row.order_no;
          tlVisible.value = true;
          tlEvents.value = [];
          try {
            const res = await fetch('/lin-crm/order/timeline', { method: 'POST',
              headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: row.id }) });
            const body = await res.json();
            tlEvents.value = body.code === 0 ? (body.data || []) : [];
          } catch (e) { tlEvents.value = []; }
        }

        function openCustomer(row) {
          // 跳转客户列表并按名称检索（客户页支持 keyword 查询参数时直接过滤，否则落在列表首页）
          window.location.href = '/lin-crm/customer/index?keyword=' + encodeURIComponent(row.crm_customer_name || '');
        }

        Vue.onMounted(() => {
          loadPerms();
          firstLoad();
          doSearch(); // :active=false，首查由这里带参发起（避免与自动首查竞态报 canceled）
          // 默认进入「列表（卡片清单）」模式：DataGrid 内部初始为 table 且无默认视图 prop，
          // 挂载后程序化触发工具栏「表格/列表切换」按钮（tools 仅 refresh+modeSwitch，末位即切换钮）
          Vue.nextTick(() => {
            const btns = document.querySelectorAll('.wd-datagrid .el-button.is-circle');
            if (btns.length) btns[btns.length - 1].click();
          });
        });

        return { grid, keyword, status, onlyMine, available, Search, can, statusLabels, methodLabel,
                 doSearch, fmtNum,
                 itemsVisible, itemsOrderNo, items, itemsLoading, openItems,
                 followVisible, followOrderNo, followForm, openFollow,
                 tlVisible, tlOrderNo, tlEvents, openTimeline, openCustomer };      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
