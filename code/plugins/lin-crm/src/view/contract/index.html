<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同管理 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .crm-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .num { text-align: right; }
    .el-table .ovd-row td.el-table__cell { background: #fef0f0; }
  /* wd-panel description 右对齐（组件无对齐 prop，覆盖内建 flex 容器） */
  .wd-panel__header-main { justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-contract-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      {{ isReceivable
        ? '应收台账按回款期次展示：登记回款支持部分收款与流水号幂等，超收会被拦截；期次收齐后合同自动落「已结清」。'
        : '合同状态流转：草稿 → 审核中 → 生效 →（已结清/已终止）。仅生效合同可维护回款计划；金额变更与终止走变更留痕。' }}
    </wd-tips>

    <!-- ── 应收台账视图 ── -->
    <wd-panel v-if="isReceivable" :border="true" title="应收台账（回款期次）" description="按计划收款日期升序；部分收款状态 partial，收齐 settled。">
      <wd-data-grid ref="planGrid" api="/lin-crm/contract/plan-rows" api-method="post" :active="true"
                    filter="crm-plan" :with-index="false" :tools="{ refresh: true }" :row-class-name="planRowClass">
        <template #toolbar>
          <div class="crm-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-select v-model="planStatus" placeholder="全部期次状态" size="small" clearable style="width:140px" @change="doPlanSearch">
                <el-option label="待收" value="pending" /><el-option label="部分收款" value="partial" /><el-option label="已收齐" value="settled" />
              </el-select>
              <span style="font-size:12px;color:#c0c4cc">红色行 = 已逾期未收</span>
            </div>
          </div>
        </template>
        <el-table-column prop="contract_code" label="合同编号" width="150" />
        <el-table-column prop="contract_name" label="合同名称" min-width="160" show-overflow-tooltip />
        <el-table-column prop="period_no" label="期次" width="70" align="center" />
        <el-table-column prop="plan_date" label="计划收款日" width="120" />
        <el-table-column label="期次金额" width="120" align="right"><template #default="{ row }">{{ fmtNum(row.amount, 2) }}</template></el-table-column>
        <el-table-column label="已收金额" width="120" align="right"><template #default="{ row }">{{ fmtNum(row.received_amount, 2) }}</template></el-table-column>
        <el-table-column label="未收余额" width="120" align="right">
          <template #default="{ row }">{{ fmtNum(row.amount - row.received_amount, 2) }}</template>
        </el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag :type="{ settled: 'success', partial: 'warning', pending: 'info' }[row.status] || 'info'" size="small">
              {{ { settled: '已收齐', partial: '部分收款', pending: '待收' }[row.status] || row.status }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="130" fixed="right">
          <template #default="{ row }">
            <!-- 轻量录入（≤3 字段）：Dialog 形态 DrawerButton + footer wd-api-button（规范 §0.13） -->
            <wd-drawer-button v-if="row.status !== 'settled' && can('lin-crm:receivable:register')"
                              label="登记回款" title="回款登记" mode="dialog" drawer-size="420px" size="small"
                              type="primary" @open="openReceive(row)">
              <template #default>
                <el-form label-width="100px" size="small">
                  <el-form-item label="本次金额" required><el-input-number v-model="receiveForm.amount" :min="0.01" :precision="2" style="width:100%" /></el-form-item>
                  <el-form-item label="收款日期"><el-date-picker v-model="receiveForm.paid_at" type="date" value-format="YYYY-MM-DD" style="width:100%" /></el-form-item>
                  <el-form-item label="流水号"><el-input v-model="receiveForm.trade_no" placeholder="留空不幂等；重复流水号自动幂等命中" /></el-form-item>
                </el-form>
                <p style="color:#909399;font-size:12px;margin:0">期次未收余额：{{ fmtNum(receiveBalance, 2) }}</p>
              </template>
              <template #footer="f">
                <el-button size="small" @click="f.close">取消</el-button>
                <wd-api-button label="登记" type="primary" size="small" api="/lin-crm/contract/receivable"
                               :api-param="{ plan_id: receiveForm.plan_id, amount: receiveForm.amount, paid_at: receiveForm.paid_at, trade_no: receiveForm.trade_no }"
                               head-refresh-datagrid="crm-plan" @api-success="f.close">登记</wd-api-button>
              </template>
            </wd-drawer-button>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="80" description="暂无回款期次" /></template>
      </wd-data-grid>
    </wd-panel>

    <!-- ── 合同管理视图 ── -->
    <wd-panel v-else :border="true" title="合同管理" description="草稿可编辑；提交后进入审核；生效合同可维护回款计划与登记回款。">
      <wd-data-grid ref="grid" api="/lin-crm/contract/rows" api-method="post" :active="true"
                    filter="crm-contract" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="crm-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="合同名称 / 编号" size="small" clearable style="width:180px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:120px" @change="doSearch">
                <el-option label="草稿" value="draft" /><el-option label="审核中" value="auditing" />
                <el-option label="生效" value="effective" /><el-option label="已结清" value="settled" />
                <el-option label="已终止" value="terminated" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <!-- 新增入口 = 弹层触发器（规范 §0.13 DrawerButton） -->
            <wd-drawer-button v-if="can('lin-crm:contract:create')" label="新建合同" title="新建合同" drawer-size="440px"
                              size="small" type="primary" @open="resetForm">
              <template #default>
                <el-form label-width="100px" size="small">
                  <el-form-item label="合同名称" required><el-input v-model="form.name" /></el-form-item>
                  <el-form-item label="客户ID" required><el-input-number v-model="form.customer_id" :min="1" style="width:100%" /></el-form-item>
                  <el-form-item label="关联商机ID"><el-input-number v-model="form.opportunity_id" :min="0" style="width:100%" /></el-form-item>
                  <el-form-item label="合同金额" required><el-input-number v-model="form.amount" :min="0" :precision="2" style="width:100%" /></el-form-item>
                  <el-form-item label="有效期至"><el-date-picker v-model="form.effective_to" type="date" value-format="YYYY-MM-DD" style="width:100%" /></el-form-item>
                  <el-form-item label="备注"><el-input v-model="form.remark" type="textarea" :rows="2" /></el-form-item>
                </el-form>
              </template>
              <template #footer="f">
                <el-button size="small" @click="f.close">取消</el-button>
                <wd-api-button label="保存草稿" type="primary" size="small" api="/lin-crm/contract/save"
                               :api-param="{ name: form.name, customer_id: form.customer_id, opportunity_id: form.opportunity_id, amount: form.amount, effective_to: form.effective_to, remark: form.remark }"
                               :disabled="!form.name.trim() || !form.customer_id"
                               head-refresh-datagrid="crm-contract" @api-success="f.close">保存草稿</wd-api-button>
              </template>
            </wd-drawer-button>
          </div>
        </template>

        <el-table-column prop="code" label="编号" width="130" />
        <el-table-column prop="name" label="合同名称" min-width="160" show-overflow-tooltip />
        <el-table-column label="客户" width="110"><template #default="{ row }">#{{ row.customer_id }}</template></el-table-column>
        <el-table-column label="合同额" width="120" align="right"><template #default="{ row }">{{ fmtNum(row.amount, 2) }}</template></el-table-column>
        <el-table-column label="已回款" width="120" align="right"><template #default="{ row }">{{ fmtNum(row.paid_amount, 2) }}</template></el-table-column>
        <el-table-column label="应收余额" width="120" align="right"><template #default="{ row }">{{ fmtNum(row.balance, 2) }}</template></el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag :type="statusType(row.status)" size="small">{{ statusLabels[row.status] || row.status }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="effective_to" label="有效期至" width="120" />
        <el-table-column label="操作" width="330" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <!-- 状态推送直接动作：ApiButton（规范 §0.13） -->
              <wd-api-button v-if="row.status === 'draft' && can('lin-crm:contract:create')"
                             label="提交审核" type="primary" size="small" tips="提交后进入审核，不可编辑"
                             api="/lin-crm/contract/submit" :api-param="{ id: row.id }"
                             head-refresh-datagrid="crm-contract">提交审核</wd-api-button>
              <!-- 审批动作分级：通过 = 气泡轻确认；驳回 = 输入意见（PromptButton，失败保留弹窗） -->
              <wd-popconfirm-button v-if="row.status === 'auditing' && can('lin-crm:contract:audit')"
                                    label="通过" type="success" size="small"
                                    :title="'确认通过合同「' + row.name + '」的审批？'" tips="通过后合同生效"
                                    api="/lin-crm/contract/audit" :api-param="{ id: row.id, approve: 1, opinion: '' }"
                                    head-refresh-datagrid="crm-contract">通过</wd-popconfirm-button>
              <wd-prompt-button v-if="row.status === 'auditing' && can('lin-crm:contract:audit')"
                                label="驳回" type="danger" size="small"
                                api="/lin-crm/contract/audit" :api-param="{ id: row.id, approve: 0 }"
                                param-key="opinion" prompt-title="审批驳回" prompt-placeholder="驳回意见（必填，将通知负责人）"
                                head-refresh-datagrid="crm-contract">驳回</wd-prompt-button>
              <!-- 回款计划：复杂编辑（期次小表）走抽屉（规范 §0.13 DrawerButton） -->
              <wd-drawer-button v-if="row.status === 'effective' && can('lin-crm:receivable:plan')"
                                label="回款计划" title="回款计划维护" drawer-size="560px" size="small"
                                @open="openPlan(row)">
                <template #default>
                  <el-table :data="plans" size="small" border>
                    <el-table-column label="期次" width="80" align="center">
                      <template #default="{ row }">{{ row.period_no }}</template>
                    </el-table-column>
                    <el-table-column label="计划金额" align="right">
                      <template #default="{ row }">
                        <el-input-number v-model="row.amount" :min="0" :precision="2" size="small" style="width:100%" :disabled="row.locked" />
                      </template>
                    </el-table-column>
                    <el-table-column label="计划收款日" width="180">
                      <template #default="{ row }">
                        <el-date-picker v-model="row.plan_date" type="date" value-format="YYYY-MM-DD" size="small" style="width:100%" :disabled="row.locked" />
                      </template>
                    </el-table-column>
                    <el-table-column label="操作" width="70" align="center">
                      <template #default="{ $index }">
                        <el-button size="small" link type="danger" :disabled="row.locked" @click="plans.splice($index, 1)">删</el-button>
                      </template>
                    </el-table-column>
                  </el-table>
                  <div style="margin-top:8px">
                    <el-button size="small" @click="plans.push({ period_no: plans.length + 1, amount: 0, plan_date: '', locked: false })">加一期</el-button>
                    <span style="font-size:12px;color:#c0c4cc">已产生回款的期次锁定不可改</span>
                  </div>
                </template>
                <template #footer="f">
                  <el-button size="small" @click="f.close">取消</el-button>
                  <wd-api-button label="保存计划" type="primary" size="small" api="/lin-crm/contract/plan-save"
                                 :api-param="{ contract_id: planContract ? planContract.id : 0, plans: planPayload }"
                                 :disabled="!planPayload.length"
                                 head-refresh-datagrid="crm-contract" @api-success="f.close">保存计划</wd-api-button>
                </template>
              </wd-drawer-button>
              <wd-drawer-button v-if="row.status === 'effective' && can('lin-crm:contract:change')"
                                label="变更" title="合同变更（留痕）" mode="dialog" drawer-size="440px" size="small"
                                @open="openChange(row)">
                <template #default>
                  <el-form label-width="100px" size="small">
                    <el-form-item label="变更字段">
                      <el-select v-model="changeForm.field" style="width:100%">
                        <el-option label="合同金额" value="amount" /><el-option label="有效期至" value="effective_to" />
                      </el-select>
                    </el-form-item>
                    <el-form-item label="新值" required><el-input v-model="changeForm.value" /></el-form-item>
                    <el-form-item label="变更原因" required><el-input v-model="changeForm.reason" type="textarea" :rows="2" /></el-form-item>
                  </el-form>
                </template>
                <template #footer="f">
                  <el-button size="small" @click="f.close">取消</el-button>
                  <wd-api-button label="提交变更" type="primary" size="small" api="/lin-crm/contract/change"
                                 :api-param="{ id: changeForm.id, field: changeForm.field, value: changeForm.value, reason: changeForm.reason }"
                                 :disabled="!changeForm.value.trim() || !changeForm.reason.trim()"
                                 head-refresh-datagrid="crm-contract" @api-success="f.close">提交变更</wd-api-button>
                </template>
              </wd-drawer-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty><el-empty :image-size="80" description="暂无合同，点击右上角「新建合同」开始" /></template>
      </wd-data-grid>
    </wd-panel>

  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive, computed } = Vue;

    const isReceivable = location.pathname.replace(/\/+$/, '').endsWith('/receivable');
    const statusLabels = { draft: '草稿', auditing: '审核中', effective: '生效', settled: '已结清', terminated: '已终止' };

    function fmtNum(v, dec) {
      if (v === null || v === undefined || v === '') return '-';
      const n = Number(v);
      return isNaN(n) ? '-' : n.toLocaleString('zh-CN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    const app = Vue.createApp({
      template: '#crm-contract-tpl',
      setup() {
        const grid = ref(null);
        const planGrid = ref(null);
        const keyword = ref('');
        const status = ref('');
        const planStatus = ref('');
        const Search = window.ElementPlusIconsVue.Search;

        // 权限显隐（显隐不构成授权，后端仍强制校验）
        const permSet = ref(new Set());
        async function loadPerms() {
          try {
            const res = await fetch('/lin-crm/perms'); const body = await res.json();
            if (body.code === 0) permSet.value = new Set(body.data.perms || []);
          } catch (e) { /* 失败时按钮隐藏更安全 */ }
        }
        const can = (code) => permSet.value.has(code);
        Vue.onMounted(loadPerms); // 权限码用于按钮显隐；显隐不构成授权，后端仍强制校验

        const form = reactive({ name: '', customer_id: null, opportunity_id: 0, amount: 0, effective_to: null, remark: '' });
        function resetForm() { Object.assign(form, { name: '', customer_id: null, opportunity_id: 0, amount: 0, effective_to: null, remark: '' }); }

        const planContract = ref(null);
        const plans = ref([]);
        // 未锁定（未产生回款）期次才提交保存
        const planPayload = computed(() => plans.value.filter(p => !p.locked)
          .map(p => ({ period_no: p.period_no, amount: p.amount, plan_date: p.plan_date })));

        const receiveForm = reactive({ plan_id: 0, amount: 0, paid_at: '', trade_no: '' });
        const receiveBalance = ref(0);

        const changeForm = reactive({ id: 0, field: 'amount', value: '', reason: '' });

        function doSearch() { grid.value && grid.value.search({ keyword: keyword.value.trim(), status: status.value }); }
        function doPlanSearch() { planGrid.value && planGrid.value.search({ status: planStatus.value }); }
        function statusType(s) { return { draft: 'info', auditing: 'warning', effective: 'success', settled: '', terminated: 'danger' }[s] || 'info'; }
        // 逾期行高亮：计划收款日已过且未收齐
        function planRowClass({ row }) {
          return row.status !== 'settled' && row.plan_date && row.plan_date < new Date().toISOString().slice(0, 10) ? 'ovd-row' : '';
        }

        async function openPlan(row) {
          planContract.value = row;
          // 拉取既有期次（走台账接口按合同过滤后前端再筛）
          const res = await fetch('/lin-crm/contract/plan-rows', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ page_size: 200 }) });
          const body = await res.json();
          const all = body.code === 0 ? (body.data.list || []) : [];
          plans.value = all.filter(p => p.contract_id === row.id)
            .map(p => ({ period_no: p.period_no, amount: Number(p.amount), plan_date: p.plan_date, locked: Number(p.received_amount) > 0 }));
        }
        function openReceive(row) {
          // 一键登记：金额预填期次未收余额、日期预填今天，可直接确认
          const balance = Number(row.amount) - Number(row.received_amount);
          Object.assign(receiveForm, { plan_id: row.id, amount: balance, paid_at: new Date().toISOString().slice(0, 10), trade_no: '' });
          receiveBalance.value = balance;
        }
        function openChange(row) { Object.assign(changeForm, { id: row.id, field: 'amount', value: '', reason: '' }); }

        return { grid, planGrid, keyword, status, planStatus, Search, isReceivable, statusLabels, can,
                 form, resetForm, planContract, plans, planPayload, receiveForm, receiveBalance, changeForm,
                 doSearch, doPlanSearch, statusType, planRowClass,
                 openPlan, openReceive, openChange, fmtNum };
        // 注：台账首查由 planGrid 的 :active="true" 自动完成（planStatus 初始为空）；
        // 不要在 onMounted 再调 doPlanSearch()——会与自动首查竞态，在途请求被组件取消报「网络异常，canceled」。
        // 注：提交审核/审批通过/驳回/回款登记/计划保存/变更 均由 wd-* 按钮直发请求（自动提示 + head-refresh-datagrid 联动刷新）。
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
