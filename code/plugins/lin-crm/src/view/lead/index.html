<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线索管理 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .crm-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .batch-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px;
                 background: #fdf6ec; border: 1px solid #faecd8; border-radius: 6px; padding: 8px 12px; }
    .batch-bar .cnt { font-size: 13px; color: #e6a23c; font-weight: 600; }
    .tl-detail { font-size: 12px; color: #909399; margin-top: 2px; white-space: pre-wrap; word-break: break-all; }
  /* wd-panel description 右对齐（组件无对齐 prop，覆盖内建 flex 容器） */
  .wd-panel__header-main { justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-lead-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      线索按「待分配 → 已分配 → 跟进中 → 已转化/已回收」流转；线索池视图仅展示待分配与已回收线索。
      录入时按手机号与客户、既有线索双查重；转化将在事务内生成客户 + 联系人，可选同时创建商机。
    </wd-tips>

    <wd-panel :border="true" :title="isPool ? '线索池' : '线索管理'"
              :description="isPool ? '展示待分配/已回收线索：可手动分配或轮询自动分配' : '录入来源渠道必填；转化后线索关闭并跳转客户。'">
      <wd-data-grid ref="grid" api="/lin-crm/lead/rows" api-method="post" :active="false"
                    filter="crm-lead" :with-index="false" :tools="{ refresh: true }">
        <template #toolbar>
          <div class="crm-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="线索名称 / 手机号" size="small" clearable style="width:180px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-model="status" placeholder="全部状态" size="small" clearable style="width:120px" @change="doSearch">
                <el-option v-for="(t, k) in statusLabels" :key="k" :label="t" :value="k" />
              </el-select>
              <el-select v-model="intent" placeholder="全部意向" size="small" clearable style="width:110px" @change="doSearch">
                <el-option label="高" value="high" /><el-option label="中" value="mid" /><el-option label="低" value="low" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
            </div>
            <!-- 新增入口 = 弹层触发器（规范 §0.13 DrawerButton：4-15 字段新增/编辑） -->
            <wd-drawer-button v-if="can('lin-crm:lead:create')" label="录入线索" title="录入线索" drawer-size="420px"
                              size="small" type="primary" @open="resetForm">
              <template #default>
                <el-form label-width="90px" size="small">
                  <el-form-item label="名称" required><el-input v-model="form.name" maxlength="80" /></el-form-item>
                  <el-form-item label="手机号" required><el-input v-model="form.phone" maxlength="11" /></el-form-item>
                  <el-form-item label="来源渠道" required><el-input v-model="form.source" placeholder="如：官网/展会/转介绍" /></el-form-item>
                  <el-form-item label="意向级别">
                    <el-select v-model="form.intent_level" style="width:100%">
                      <el-option label="高" value="high" /><el-option label="中" value="mid" /><el-option label="低" value="low" />
                    </el-select>
                  </el-form-item>
                </el-form>
              </template>
              <template #footer="f">
                <el-button size="small" @click="f.close">取消</el-button>
                <wd-api-button label="保存" type="primary" size="small" api="/lin-crm/lead/save"
                               :api-param="{ name: form.name, phone: form.phone, source: form.source, intent_level: form.intent_level }"
                               :disabled="!form.name.trim() || !form.phone.trim() || !form.source.trim()"
                               head-refresh-datagrid="crm-lead" @api-success="f.close">保存</wd-api-button>
              </template>
            </wd-drawer-button>
          </div>
        </template>

        <el-table-column width="42" align="center">
          <template #default="{ row }">
            <el-checkbox v-if="['unassigned','recycled'].includes(row.status)" :model-value="!!selMap[row.id]" @change="toggleSel(row)" />
          </template>
        </el-table-column>
        <el-table-column prop="code" label="编号" width="120" />
        <el-table-column prop="name" label="线索名称" min-width="140" show-overflow-tooltip />
        <el-table-column prop="phone" label="手机号" width="130" />
        <el-table-column prop="source" label="来源渠道" width="110" show-overflow-tooltip />
        <el-table-column label="意向" width="80">
          <template #default="{ row }">
            <el-tag :type="{ high: 'danger', mid: 'warning', low: 'info' }[row.intent_level] || 'info'" size="small">
              {{ { high: '高', mid: '中', low: '低' }[row.intent_level] || row.intent_level }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="状态" width="100">
          <template #default="{ row }">
            <el-tag size="small">{{ statusLabels[row.status] || row.status }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="recycle_reason" label="回收原因" width="120" show-overflow-tooltip />
        <el-table-column prop="updated_at" label="更新时间" width="160" />
        <el-table-column label="操作" width="230" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <wd-drawer-button label="详情" title="线索详情" drawer-size="560px" size="small" @open="openDetail(row)">
                <template #default>
                  <div v-loading="detailLoading" style="min-height:200px">
                    <template v-if="detail">
                      <el-tabs v-model="detailTab">
                        <el-tab-pane label="基本资料" name="info">
                          <el-descriptions :column="2" border size="small">
                            <el-descriptions-item label="编号">{{ detail.code }}</el-descriptions-item>
                            <el-descriptions-item label="名称">{{ detail.name }}</el-descriptions-item>
                            <el-descriptions-item label="手机号">{{ detail.phone }}</el-descriptions-item>
                            <el-descriptions-item label="来源渠道">{{ detail.source }}</el-descriptions-item>
                            <el-descriptions-item label="意向级别">{{ { high: '高', mid: '中', low: '低' }[detail.intent_level] || detail.intent_level }}</el-descriptions-item>
                            <el-descriptions-item label="状态">{{ statusLabels[detail.status] || detail.status }}</el-descriptions-item>
                            <el-descriptions-item label="负责人ID">{{ detail.owner_id || '-' }}</el-descriptions-item>
                            <el-descriptions-item label="已转客户">{{ detail.converted_customer_id ? '#' + detail.converted_customer_id : '-' }}</el-descriptions-item>
                            <el-descriptions-item label="回收原因" :span="2">{{ detail.recycle_reason || '-' }}</el-descriptions-item>
                          </el-descriptions>
                        </el-tab-pane>
                        <el-tab-pane :label="'动态时间线' + (timeline.length ? '（' + timeline.length + '）' : '')" name="timeline">
                          <el-empty v-if="!timeline.length" :image-size="60" description="暂无动态" />
                          <el-timeline v-else style="padding-left:6px;margin-top:6px">
                            <el-timeline-item v-for="(ev, i) in timeline" :key="i" :timestamp="ev.time" placement="top"
                                              :type="{ followup: 'primary', recycle: 'danger' }[ev.type] || 'info'">
                              <div style="font-size:13px;font-weight:600;color:#303133">{{ ev.title }}</div>
                              <div class="tl-detail">{{ ev.detail }}</div>
                            </el-timeline-item>
                          </el-timeline>
                        </el-tab-pane>
                      </el-tabs>
                    </template>
                  </div>
                </template>
              </wd-drawer-button>
              <!-- 直接动作：点击即请求，自动 loading/提示/刷新（规范 §0.13 ApiButton） -->
              <wd-api-button v-if="['unassigned','recycled'].includes(row.status) && can('lin-crm:lead:assign')"
                             label="分配给我" type="success" size="small" tips="分配给当前登录人；获取不到时自动轮询"
                             api="/lin-crm/lead/assign" :api-param="{ id: row.id, to_user_id: meId }"
                             head-refresh-datagrid="crm-lead">分配给我</wd-api-button>
              <wd-drawer-button v-if="['assigned','following'].includes(row.status) && can('lin-crm:followup:create')"
                                label="跟进" title="线索跟进" drawer-size="400px" size="small" @open="openFollow(row)">
                <template #default>
                  <el-form label-width="90px" size="small">
                    <el-form-item label="意向级别">
                      <el-select v-model="followForm.intent_level" style="width:100%">
                        <el-option label="高" value="high" /><el-option label="中" value="mid" /><el-option label="低" value="low" />
                      </el-select>
                    </el-form-item>
                    <el-form-item label="跟进方式">
                      <el-select v-model="followForm.method" style="width:100%">
                        <el-option label="电话" value="phone" /><el-option label="拜访" value="visit" />
                        <el-option label="微信" value="wechat" /><el-option label="邮件" value="email" />
                      </el-select>
                    </el-form-item>
                    <el-form-item label="跟进内容" required><el-input v-model="followForm.content" type="textarea" :rows="3" /></el-form-item>
                    <el-form-item label="下次跟进">
                      <el-date-picker v-model="followForm.next_at" type="datetime" value-format="YYYY-MM-DD HH:mm:ss" style="width:100%" />
                    </el-form-item>
                  </el-form>
                </template>
                <template #footer="f">
                  <el-button size="small" @click="f.close">取消</el-button>
                  <wd-api-button label="保存" type="primary" size="small" api="/lin-crm/lead/follow"
                                 :api-param="{ id: followForm.id, intent_level: followForm.intent_level, method: followForm.method, content: followForm.content, next_at: followForm.next_at }"
                                 :disabled="!followForm.content.trim()"
                                 head-refresh-datagrid="crm-lead" @api-success="f.close">保存</wd-api-button>
                </template>
              </wd-drawer-button>
              <wd-drawer-button v-if="['assigned','following'].includes(row.status) && can('lin-crm:lead:convert')"
                                label="转化" title="线索转化" mode="dialog" drawer-size="440px" size="small"
                                @open="openConvert(row)">
                <template #default>
                  <el-form label-width="100px" size="small">
                    <el-form-item label="同时建商机">
                      <el-switch v-model="convertForm.with_opportunity" />
                    </el-form-item>
                    <el-form-item v-if="convertForm.with_opportunity" label="商机名称">
                      <el-input v-model="convertForm.opportunity_name" placeholder="留空自动生成" />
                    </el-form-item>
                    <el-form-item v-if="convertForm.with_opportunity" label="商机金额">
                      <el-input-number v-model="convertForm.opportunity_amount" :min="0" style="width:100%" />
                    </el-form-item>
                  </el-form>
                </template>
                <template #footer="f">
                  <el-button size="small" @click="f.close">取消</el-button>
                  <wd-api-button label="确认转化" type="primary" size="small" api="/lin-crm/lead/convert"
                                 :api-param="{ id: convertForm.id, with_opportunity: convertForm.with_opportunity ? 1 : 0, opportunity_name: convertForm.opportunity_name, opportunity_amount: convertForm.opportunity_amount }"
                                 head-refresh-datagrid="crm-lead" @api-success="onConverted($event, f.close)">确认转化</wd-api-button>
                </template>
              </wd-drawer-button>
              <!-- 单字段输入 + 请求：PromptButton（输入值并入 apiParam.reason；失败保留弹窗可改） -->
              <wd-prompt-button v-if="['assigned','following'].includes(row.status)"
                                label="回收" type="warning" size="small"
                                api="/lin-crm/lead/recycle" :api-param="{ id: row.id }"
                                param-key="reason" prompt-title="回收线索" prompt-placeholder="回收原因（必填，将留痕）"
                                head-refresh-datagrid="crm-lead">回收</wd-prompt-button>
            </el-button-group>
          </template>
        </el-table-column>
        <template #empty>
          <el-empty :image-size="80" description="暂无线索，点击右上角「录入线索」开始" />
        </template>
      </wd-data-grid>

      <!-- 批量分配条：工具栏/批量场景用 ConfirmButton 强打断（规范 §0.13） -->
      <div v-if="selCount > 0" class="batch-bar">
        <span class="cnt">已选 {{ selCount }} 条待分配线索</span>
        <wd-confirm-button v-if="can('lin-crm:lead:assign')" label="批量分配给我" type="success" size="small"
                           api="/lin-crm/lead/batch" :api-param="{ ids: selIdList, to_user_id: meId }"
                           confirm-text="确认将选中的线索分配给我？获取不到当前用户时将自动轮询分配。"
                           head-refresh-datagrid="crm-lead" @api-success="clearSel">批量分配给我</wd-confirm-button>
        <wd-confirm-button v-if="can('lin-crm:lead:assign')" label="轮询分配" plain size="small"
                           api="/lin-crm/lead/batch" :api-param="{ ids: selIdList, to_user_id: 0 }"
                           confirm-text="确认将选中的线索按轮询策略分配（给当前持有线索最少的人）？"
                           head-refresh-datagrid="crm-lead" @api-success="clearSel">轮询分配</wd-confirm-button>
        <el-button size="small" link @click="clearSel">取消选择</el-button>
      </div>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive, computed } = Vue;

    const isPool = location.pathname.replace(/\/+$/, '').endsWith('/pool');
    const statusLabels = { unassigned: '待分配', assigned: '已分配', following: '跟进中', converted: '已转化', recycled: '已回收' };
    const VIEW_KEY = 'lincrm-view-lead' + (isPool ? '-pool' : '');

    const app = Vue.createApp({
      template: '#crm-lead-tpl',
      setup() {
        const grid = ref(null);
        const keyword = ref('');
        const status = ref(isPool ? 'unassigned' : '');
        const intent = ref('');
        const Search = window.ElementPlusIconsVue.Search;

        // 权限显隐
        const permSet = ref(new Set());
        const meId = ref(0);
        async function loadPerms() {
          try {
            const res = await fetch('/lin-crm/perms'); const body = await res.json();
            if (body.code === 0) { permSet.value = new Set(body.data.perms || []); meId.value = body.data.user_id || 0; }
          } catch (e) { /* 失败时按钮隐藏更安全 */ }
        }
        const can = (code) => permSet.value.has(code);

        const form = reactive({ name: '', phone: '', source: '', intent_level: 'mid' });
        function resetForm() { Object.assign(form, { name: '', phone: '', source: '', intent_level: 'mid' }); }

        const detailLoading = ref(false);
        const detail = ref(null);
        const detailTab = ref('info');
        const timeline = ref([]);

        const followForm = reactive({ id: 0, intent_level: 'mid', method: 'phone', content: '', next_at: null });
        const convertForm = reactive({ id: 0, with_opportunity: false, opportunity_name: '', opportunity_amount: 0 });

        // 多选（仅池内行可勾选）
        const selMap = reactive({});
        const selCount = computed(() => Object.keys(selMap).filter(k => selMap[k]).length);
        const selIdList = computed(() => Object.keys(selMap).filter(k => selMap[k]).map(Number));
        function toggleSel(row) { selMap[row.id] = !selMap[row.id]; }
        function clearSel() { Object.keys(selMap).forEach(k => { delete selMap[k]; }); }

        // 视图记忆
        function restoreView() {
          try {
            const saved = JSON.parse(localStorage.getItem(VIEW_KEY) || '{}');
            if (saved.keyword) keyword.value = saved.keyword;
            if (!isPool && saved.status) status.value = saved.status;
            if (saved.intent) intent.value = saved.intent;
          } catch (e) { /* 忽略 */ }
        }
        function saveView() {
          try { localStorage.setItem(VIEW_KEY, JSON.stringify({ keyword: keyword.value, status: status.value, intent: intent.value })); } catch (e) { /* 忽略 */ }
        }

        function doSearch() {
          const params = { keyword: keyword.value.trim(), intent_level: intent.value };
          params.status = isPool ? 'unassigned' : status.value;
          if (isPool) params.pool = 1;
          saveView();
          grid.value && grid.value.search(params);
        }

        function openFollow(row) {
          Object.assign(followForm, { id: row.id, intent_level: row.intent_level || 'mid', method: 'phone', content: '', next_at: null });
        }
        function openConvert(row) {
          Object.assign(convertForm, { id: row.id, with_opportunity: false, opportunity_name: '', opportunity_amount: 0 });
        }
        // 转化成功：结果提示（wd-api-success 载荷 { data, code, message }）
        function onConverted(ev, close) {
          close && close();
          if (ev && ev.data && ev.data.customer_id) {
            ElementPlus.ElMessageBox.alert('已生成客户 #' + ev.data.customer_id + (ev.data.opportunity_id ? ' 与商机 #' + ev.data.opportunity_id : ''), '转化结果');
          }
        }
        async function openDetail(row) {
          detailLoading.value = true;
          detail.value = null; timeline.value = []; detailTab.value = 'info';
          try {
            const d = await fetch('/lin-crm/lead/timeline', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: row.id }) }).then(r => r.json());
            if (d.code === 0) { detail.value = d.data.lead || {}; timeline.value = d.data.list || []; }
            else ElementPlus.ElMessage.error(d.message || '加载失败');
          } finally { detailLoading.value = false; }
        }

        Vue.onMounted(() => {
          loadPerms();
          restoreView();
          if (isPool) status.value = 'unassigned';
          doSearch();
        });

        return { grid, keyword, status, intent, Search, isPool, statusLabels, can, meId,
                 form, resetForm, detailLoading, detail, detailTab, timeline,
                 followForm, convertForm,
                 selMap, selCount, selIdList, toggleSel, clearSel,
                 doSearch, openFollow, openConvert, onConverted, openDetail };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
