<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户合并 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .merge-grid { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 8px; align-items: center; max-width: 760px; }
    .merge-card { border: 1px solid #dcdfe6; border-radius: 6px; padding: 12px; min-height: 150px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-merge-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      合并向导：左侧为「主档」（保留），右侧为「从档」（合并后软删）。
      从档名下的联系人、商机、合同、跟进、附件将改挂主档，操作留审计痕迹，不可自动撤销。
    </wd-tips>
    <wd-panel :border="true" title="客户合并">
      <div class="merge-grid">
        <div class="merge-card">
          <h4 style="margin-top:0">主档（保留）</h4>
          <el-select v-model="mainId" filterable remote :remote-method="searchMain" placeholder="搜索选择主档客户" style="width:100%" size="small">
            <el-option v-for="c in mainOptions" :key="c.id" :label="c.code + ' ' + c.name" :value="c.id" />
          </el-select>
          <p v-if="mainRow" style="font-size:12px;color:#606266;margin:8px 0 0">
            手机号：{{ mainRow.phone }}｜归属：{{ mainRow.pool_status === 'private_pool' ? '私海' : '公海' }}
          </p>
        </div>
        <el-icon style="color:#909399"><ArrowLeft /></el-icon>
        <div class="merge-card">
          <h4 style="margin-top:0">从档（合并后删除）</h4>
          <el-select v-model="slaveId" filterable remote :remote-method="searchSlave" placeholder="搜索选择从档客户" style="width:100%" size="small">
            <el-option v-for="c in slaveOptions" :key="c.id" :label="c.code + ' ' + c.name" :value="c.id" />
          </el-select>
          <p v-if="slaveRow" style="font-size:12px;color:#606266;margin:8px 0 0">
            手机号：{{ slaveRow.phone }}｜归属：{{ slaveRow.pool_status === 'private_pool' ? '私海' : '公海' }}
          </p>
        </div>
      </div>
      <div style="margin-top:16px">
        <el-button type="primary" size="small" @click="doMerge" :loading="loading">执行合并</el-button>
      </div>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, computed } = Vue;

    async function searchCustomers(kw) {
      const res = await fetch('/lin-crm/customer/rows', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keyword: kw, page_size: 20 }) });
      const body = await res.json();
      return body.code === 0 ? (body.data.list || []) : [];
    }

    const app = Vue.createApp({
      template: '#crm-merge-tpl',
      setup() {
        const mainId = ref(null);
        const slaveId = ref(null);
        const mainOptions = ref([]);
        const slaveOptions = ref([]);
        const loading = ref(false);

        const mainRow = computed(() => mainOptions.value.find(c => c.id === mainId.value) || null);
        const slaveRow = computed(() => slaveOptions.value.find(c => c.id === slaveId.value) || null);

        async function searchMain(kw) { if (kw) mainOptions.value = await searchCustomers(kw); }
        async function searchSlave(kw) { if (kw) slaveOptions.value = await searchCustomers(kw); }

        async function doMerge() {
          if (!mainId.value || !slaveId.value) { ElementPlus.ElMessage.warning('请选择主档与从档客户'); return; }
          if (mainId.value === slaveId.value) { ElementPlus.ElMessage.warning('主档与从档不能是同一客户'); return; }
          try { await ElementPlus.ElMessageBox.confirm('确认合并？从档将被软删，其关联数据改挂主档。', '合并确认', { type: 'warning' }); }
          catch { return; }
          loading.value = true;
          try {
            const res = await fetch('/lin-crm/customer/merge', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ main_id: mainId.value, slave_id: slaveId.value }) });
            const body = await res.json();
            if (body.code === 0) { ElementPlus.ElMessage.success('合并完成'); mainId.value = slaveId.value = null; }
            else ElementPlus.ElMessage.error(body.message || '合并失败');
          } finally { loading.value = false; }
        }
        return { mainId, slaveId, mainOptions, slaveOptions, mainRow, slaveRow, loading, searchMain, searchSlave, doMerge };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
