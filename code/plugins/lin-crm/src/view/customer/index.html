<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户管理 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .crm-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .batch-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px;
                 background: #fdf6ec; border: 1px solid #faecd8; border-radius: 6px; padding: 8px 12px; }
    .batch-bar .cnt { font-size: 13px; color: #e6a23c; font-weight: 600; }
    .tl-detail { font-size: 12px; color: #909399; margin-top: 2px; white-space: pre-wrap; word-break: break-all; }
    .gs-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-radius: 4px; }
    .gs-item:hover { background: #f5f7fa; }
    .gs-item .nm { font-size: 13px; color: #303133; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gs-item .mt { font-size: 12px; color: #c0c4cc; white-space: nowrap; }
    /* ── 卡片模式（DataGrid modeSwitch 内建视图；扁平三行） ── */
    .cus-card { background: #fff; border: 1px solid #ebeef5; border-radius: 6px; padding: 10px 12px; }
    .cus-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .cus-card .hd { display: flex; align-items: center; gap: 8px; }
    .cus-card .hd .pt { margin-left: auto; font-size: 12px; color: #909399; }
    .cus-card .meta { margin-top: 6px; font-size: 12px; color: #909399; }
    .cus-card .ops { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .cus-card .ops .el-button + .el-button { margin-left: 0; }
  /* wd-panel description 右对齐（组件无对齐 prop，覆盖内建 flex 容器） */
  .wd-panel__header-main { justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-customer-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      客户档案按「私海保护期 + 公海认领」机制运转：私海客户超期未跟进会自动释放回公海；
      新建时按名称/手机号查重拦截撞单；手机号默认脱敏，查看完整号码将落审计日志。
    </wd-tips>

    <wd-panel :border="true" :title="isPool ? '公海客户' : '客户档案'"
              :description="isPool ? '公海客户可认领进私海（受私海持有上限约束）' : '编号留空由系统自动生成；编辑不会改写保护期字段。'">
      <wd-data-grid ref="grid" api="/lin-crm/customer/rows" api-method="post" :active="false"
                    filter="crm-customer" :with-index="false" mode-switch :tools="{ refresh: true, modeSwitch: true }">
        <template #toolbar>
          <div class="crm-toolbar">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <el-input v-model="keyword" placeholder="客户名称 / 手机号" size="small" clearable style="width:200px"
                        @keyup.enter="doSearch" @clear="doSearch" />
              <el-select v-if="!isPool" v-model="poolStatus" placeholder="全部归属" size="small" clearable style="width:110px" @change="doSearch">
                <el-option label="私海" value="private_pool" />
                <el-option label="公海" value="public_pool" />
              </el-select>
              <el-select v-model="level" placeholder="全部级别" size="small" clearable style="width:110px" @change="doSearch">
                <el-option label="普通" value="normal" />
                <el-option label="重要" value="important" />
                <el-option label="关键" value="key" />
              </el-select>
              <el-button size="small" :icon="Search" @click="doSearch">查询</el-button>
              <el-button size="small" :icon="SearchIcon" title="全局搜索客户/线索/商机/合同" @click="gsVisible = true" />
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <el-button v-if="due" size="small" type="warning" plain @click="clearDue">待跟进过滤中 · 清除</el-button>
              <el-button v-if="can('lin-crm:customer:create')" size="small" type="primary" @click="openCreate">新增客户</el-button>
            </div>
          </div>
        </template>

        <el-table-column width="42" align="center">
          <template #default="{ row }">
            <el-checkbox :model-value="!!selMap[row.id]" @change="toggleSel(row)" />
          </template>
        </el-table-column>
        <el-table-column prop="code" label="编号" width="120" />
        <el-table-column prop="name" label="客户名称" min-width="150" show-overflow-tooltip>
          <template #default="{ row }">
            <el-link type="primary" :underline="false" @click="openDetail(row)">{{ row.name }}</el-link>
          </template>
        </el-table-column>
        <el-table-column prop="phone" label="手机号" width="125" />
        <el-table-column prop="industry" label="行业" width="90" show-overflow-tooltip />
        <el-table-column label="归属" width="80">
          <template #default="{ row }">
            <el-tag :type="row.pool_status === 'private_pool' ? 'primary' : 'warning'" size="small">
              {{ poolLabel(row.pool_status) }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="保护期" width="96">
          <template #default="{ row }">
            <el-tag v-if="row.protect_left !== null && row.protect_left !== undefined" size="small"
                    :type="row.protect_left <= 7 ? 'danger' : 'info'" effect="plain">
              剩 {{ row.protect_left }} 天
            </el-tag>
            <span v-else style="color:#c0c4cc">-</span>
          </template>
        </el-table-column>
        <el-table-column prop="owner_id" label="负责人ID" width="86" />
        <el-table-column prop="last_followup_at" label="最近跟进" width="155" />
        <el-table-column label="操作" width="160" fixed="right">
          <template #default="{ row }">
            <el-button-group size="small">
              <el-button link size="small" type="primary" @click="openDetail(row)">详情</el-button>
              <el-button v-if="can('lin-crm:followup:create')" link size="small" type="primary" @click="openFollowup(row)">跟进</el-button>
              <el-dropdown trigger="click" @command="(cmd) => rowCommand(cmd, row)">
                <el-button link size="small">更多<el-icon><ArrowDown /></el-icon></el-button>
                <template #dropdown>
                  <el-dropdown-menu>
                    <el-dropdown-item v-if="row.pool_status === 'public_pool' && can('lin-crm:customer:create')" command="claim">认领</el-dropdown-item>
                    <el-dropdown-item v-if="row.pool_status === 'private_pool'" command="giveback">退回公海</el-dropdown-item>
                    <el-dropdown-item v-if="can('lin-crm:customer:transfer')" command="transfer">转移</el-dropdown-item>
                    <!-- 抹除操作：收纳进「更多」，点击后强打断二次确认（规范 §1.7 / §0.9） -->
                    <el-dropdown-item v-if="can('lin-crm:customer:delete')" command="delete"
                                      style="color:var(--el-color-danger)">删除…</el-dropdown-item>
                  </el-dropdown-menu>
                </template>
              </el-dropdown>
            </el-button-group>
          </template>
        </el-table-column>
        <!-- ── 卡片清单模式（DataGrid 内建 modeSwitch 视图；扁平三层：标题行 / 信息行 / 操作行） ── -->
        <template #card-item="{ row }">
          <div class="cus-card">
            <div class="hd">
              <el-checkbox :model-value="!!selMap[row.id]" @change="toggleSel(row)" />
              <el-link type="primary" :underline="false" @click="openDetail(row)">{{ row.name }}</el-link>
              <el-tag :type="row.pool_status === 'private_pool' ? 'primary' : 'warning'" size="small">{{ poolLabel(row.pool_status) }}</el-tag>
              <el-tag :type="{ normal: 'info', important: 'warning', key: 'danger' }[row.level] || 'info'" size="small" effect="plain">
                {{ { normal: '普通', important: '重要', key: '关键' }[row.level] || row.level || '普通' }}
              </el-tag>
              <span class="pt">
                <el-tag v-if="row.protect_left !== null && row.protect_left !== undefined" size="small"
                        :type="row.protect_left <= 7 ? 'danger' : 'info'" effect="plain">剩 {{ row.protect_left }} 天</el-tag>
                <template v-else>跟进 {{ (row.last_followup_at || '-').slice(0, 10) }}</template>
              </span>
            </div>
            <div class="meta">{{ row.code }}<template v-if="row.industry"> · {{ row.industry }}</template> · {{ row.phone || '-' }} · 负责人 #{{ row.owner_id }}</div>
            <div class="ops">
              <el-button size="small" type="primary" plain @click="openDetail(row)">详情</el-button>
              <el-button v-if="can('lin-crm:followup:create')" size="small" type="primary" @click="openFollowup(row)">跟进</el-button>
              <el-button v-if="row.pool_status === 'public_pool' && can('lin-crm:customer:create')" size="small" type="success" plain @click="claim(row)">认领</el-button>
              <el-button v-if="row.pool_status === 'private_pool'" size="small" type="warning" plain @click="giveback(row)">退回公海</el-button>
              <el-button v-if="can('lin-crm:customer:transfer')" size="small" @click="openTransfer(row)">转移</el-button>
              <el-button v-if="can('lin-crm:customer:delete')" size="small" type="danger" plain @click="delRow(row)">删除</el-button>
            </div>
          </div>
        </template>
        <template #empty>
          <el-empty :image-size="80" :description="isPool ? '公海暂无可认领客户' : '暂无客户，点击右上角「新增客户」建立第一条档案'" />
        </template>
      </wd-data-grid>

      <!-- 批量操作条：工具栏/批量场景用 ConfirmButton（强打断），低风险批量动作用 ApiButton（规范 §0.13） -->
      <div v-if="selCount > 0" class="batch-bar">
        <span class="cnt">已选 {{ selCount }} 项</span>
        <wd-api-button v-if="isPool && can('lin-crm:customer:create')" label="批量认领" type="success" size="small"
                       api="/lin-crm/customer/batch" :api-param="{ ids: selIdList, action: 'claim' }"
                       :head-refresh-datagrid="false" @api-success="clearSel">批量认领</wd-api-button>
        <wd-confirm-button v-if="!isPool" label="批量退回公海" type="warning" plain size="small"
                           api="/lin-crm/customer/batch" :api-param="{ ids: selIdList, action: 'pool' }"
                           confirm-text="确认将选中的客户退回公海？退回后您将失去这些客户的归属与保护期。"
                           :head-refresh-datagrid="false" @api-success="clearSel">批量退回公海</wd-confirm-button>
        <wd-confirm-button v-if="can('lin-crm:customer:delete')" label="批量删除" type="danger" size="small"
                           api="/lin-crm/customer/batch" :api-param="{ ids: selIdList, action: 'delete' }"
                           confirm-text="确认删除选中的客户？将移入回收站，30 天内可恢复。"
                           :head-refresh-datagrid="false" @api-success="clearSel">批量删除</wd-confirm-button>
        <el-button size="small" link @click="clearSel">取消选择</el-button>
      </div>
    </wd-panel>

    <!-- 新增/编辑抽屉（wd-drawer 原生支持 v-model 程序化打开；wd-drawer-button 不支持） -->
    <wd-drawer v-model="drawer" :title="form.id ? '编辑客户' : '新增客户'" size="440px">
      <wd-data-form mode="edit" submit-api="/lin-crm/customer/save" submit-method="post"
                    submit-keys="id,name,phone,industry,source,level,contact_name,contact_phone,remark"
                    :head-close-drawer="true" :head-refresh-datagrid="'crm-customer'" label-width="90px"
                    :rules="{ name: [{ required: true, message: '请填写名称', trigger: 'blur' }],
                              phone: [{ required: true, message: '请填写手机号', trigger: 'blur' }] }">
        <wd-form-item label="名称" prop="name" required><el-input v-model="model.name" maxlength="80" /></wd-form-item>
        <wd-form-item label="手机号" prop="phone" required><el-input v-model="model.phone" maxlength="11" /></wd-form-item>
        <wd-form-item label="行业" prop="industry"><el-input v-model="model.industry" /></wd-form-item>
        <wd-form-item label="来源" prop="source"><el-input v-model="model.source" /></wd-form-item>
        <wd-form-item label="级别" prop="level">
          <el-select v-model="model.level" style="width:100%">
            <el-option label="普通" value="normal" /><el-option label="重要" value="important" /><el-option label="关键" value="key" />
          </el-select>
        </wd-form-item>
        <wd-form-item v-if="!form.id" label="主联系人" prop="contact_name"><el-input v-model="model.contact_name" /></wd-form-item>
        <wd-form-item v-if="!form.id" label="联系电话" prop="contact_phone"><el-input v-model="model.contact_phone" /></wd-form-item>
        <wd-form-item label="备注" prop="remark"><el-input v-model="model.remark" type="textarea" :rows="2" /></wd-form-item>
      </wd-data-form>
    </wd-drawer>

    <!-- 详情抽屉（共享单例：表格与卡片共用，openDetail 打开） -->
    <wd-drawer v-model="detailVisible" title="客户 360" size="640px">
      <div v-loading="detailLoading" style="min-height:200px">
        <template v-if="detail">
          <el-tabs v-model="detailTab">
            <el-tab-pane label="基本资料" name="info">
              <el-descriptions :column="2" border size="small">
                <el-descriptions-item label="编号">{{ detail.code }}</el-descriptions-item>
                <el-descriptions-item label="名称">{{ detail.name }}</el-descriptions-item>
                <el-descriptions-item label="手机号">{{ detail.phone }}</el-descriptions-item>
                <el-descriptions-item label="归属">{{ poolLabel(detail.pool_status) }}</el-descriptions-item>
                <el-descriptions-item label="保护期至">{{ detail.protect_until || '-' }}</el-descriptions-item>
                <el-descriptions-item label="最近跟进">{{ detail.last_followup_at || '-' }}</el-descriptions-item>
              </el-descriptions>
              <h4 style="margin:14px 0 6px">联系人</h4>
              <el-table :data="detail.contacts || []" size="small" border>
                <el-table-column prop="name" label="姓名" /><el-table-column prop="phone" label="电话" />
                <el-table-column label="主">
                  <template #default="{ row }">{{ row.is_primary == 1 ? '是' : '' }}</template>
                </el-table-column>
              </el-table>
            </el-tab-pane>
            <el-tab-pane :label="'动态时间线' + (timeline.length ? '（' + timeline.length + '）' : '')" name="timeline">
              <el-empty v-if="!timeline.length" :image-size="60" description="暂无动态：跟进、商机、合同与回款将按时间汇聚在这里" />
              <el-timeline v-else style="padding-left:6px;margin-top:6px">
                <el-timeline-item v-for="(ev, i) in timeline" :key="i" :timestamp="ev.time" placement="top"
                                  :type="timelineType(ev.type)">
                  <div style="font-size:13px;font-weight:600;color:#303133">{{ ev.title }}</div>
                  <div class="tl-detail">{{ ev.detail }}</div>
                </el-timeline-item>
              </el-timeline>
            </el-tab-pane>
          </el-tabs>
        </template>
      </div>
    </wd-drawer>

    <!-- 跟进抽屉（共享单例：表格与卡片共用，openFollowup 打开） -->
    <wd-drawer v-model="followVisible" title="新增跟进" size="400px">
      <el-form label-width="90px" size="small">
        <el-form-item label="方式">
          <el-select v-model="followForm.method" style="width:100%">
            <el-option label="电话" value="phone" /><el-option label="拜访" value="visit" />
            <el-option label="微信" value="wechat" /><el-option label="邮件" value="email" />
          </el-select>
        </el-form-item>
        <el-form-item label="内容" required><el-input v-model="followForm.content" type="textarea" :rows="4" /></el-form-item>
        <el-form-item label="下次跟进">
          <el-date-picker v-model="followForm.next_at" type="datetime" value-format="YYYY-MM-DD HH:mm:ss" style="width:100%" />
        </el-form-item>
      </el-form>
      <template #footer="f">
        <el-button size="small" @click="f.close">取消</el-button>
        <wd-api-button label="保存" type="primary" size="small" api="/lin-crm/customer/followup"
                       :api-param="{ biz_type: 'customer', biz_id: followForm.id, method: followForm.method, content: followForm.content, next_at: followForm.next_at }"
                       :disabled="!followForm.content.trim()"
                       head-refresh-datagrid="crm-customer" @api-success="f.close">保存</wd-api-button>
      </template>
    </wd-drawer>

    <!-- 全局搜索对话框 -->
    <el-dialog v-model="gsVisible" title="全局搜索" width="560px">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <el-input v-model="gsKeyword" placeholder="搜索客户 / 线索 / 商机 / 合同" clearable @keyup.enter="doGlobalSearch" />
        <el-button type="primary" size="small" @click="doGlobalSearch">搜索</el-button>
      </div>
      <div v-loading="gsLoading" style="min-height:120px;max-height:420px;overflow:auto">
        <el-empty v-if="!gsLoading && !gsHasResult" :image-size="60" description="输入关键字检索四大对象" />
        <template v-for="sec in gsSections" :key="sec.key">
          <template v-if="gsResult[sec.key] && gsResult[sec.key].length">
            <div style="font-size:12px;color:#909399;margin:10px 0 4px">{{ sec.label }}</div>
            <div v-for="it in gsResult[sec.key]" :key="sec.key + '-' + it.id" class="gs-item" @click="gsGo(sec.key, it)">
              <span class="nm">{{ sec.render(it) }}</span>
              <span class="mt">{{ sec.meta(it) }}</span>
            </div>
          </template>
        </template>
      </div>
    </el-dialog>

    <!-- 转移对话框（低频操作收纳于「更多」；确认走 wd-api-button 单请求闭环） -->
    <el-dialog v-model="transferVisible" title="客户转移" width="400px">
      <el-form label-width="100px" size="small">
        <el-form-item label="目标用户ID">
          <el-input-number v-model="transferTo" :min="1" style="width:100%" />
        </el-form-item>
      </el-form>
      <p style="color:#909399;font-size:12px;margin:0">转移将连同客户名下商机与未完结合同一并移交，并双向通知。</p>
      <template #footer>
        <el-button size="small" @click="transferVisible = false">取消</el-button>
        <wd-api-button label="确认转移" type="primary" size="small" api="/lin-crm/customer/transfer"
                       :api-param="{ id: transferId, to_user_id: transferTo }"
                       head-refresh-datagrid="crm-customer" @api-success="transferVisible = false">确认转移</wd-api-button>
      </template>
    </el-dialog>
  </script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { ref, reactive, computed } = Vue;

    // 公海页（/lin-crm/customer/pool）默认只看公海，并隐藏新增入口
    const isPool = location.pathname.replace(/\/+$/, '').endsWith('/pool');
    const VIEW_KEY = 'lincrm-view-customer' + (isPool ? '-pool' : '');

    const app = Vue.createApp({
      template: '#crm-customer-tpl',
      setup() {
        const grid = ref(null);
        const keyword = ref('');
        const poolStatus = ref(isPool ? 'public_pool' : '');
        const level = ref('');
        const due = new URLSearchParams(location.search).get('due') === '1';
        const Search = window.ElementPlusIconsVue.Search;
        const SearchIcon = Search;
        const ArrowDown = window.ElementPlusIconsVue.ArrowDown;

        // 权限显隐（显隐不构成授权，后端仍强制校验）
        const permSet = ref(new Set());
        const meId = ref(0);
        async function loadPerms() {
          try {
            const res = await fetch('/lin-crm/perms'); const body = await res.json();
            if (body.code === 0) { permSet.value = new Set(body.data.perms || []); meId.value = body.data.user_id || 0; }
          } catch (e) { /* 权限接口失败时按钮全隐藏，更安全 */ }
        }
        const can = (code) => permSet.value.has(code);

        const drawer = ref(false);
        const form = reactive({ id: 0, name: '', phone: '', industry: '', source: '', level: 'normal', contact_name: '', contact_phone: '', remark: '' });

        const detailLoading = ref(false);
        const detailVisible = ref(false);
        const detail = ref(null);
        const detailTab = ref('info');
        const timeline = ref([]);
        const timelineType = (t) => ({ followup: 'primary', opportunity: 'warning', contract: 'success', receivable: 'danger', recycle: 'danger' }[t] || 'info');

        const followForm = reactive({ id: 0, biz_type: 'customer', method: 'phone', content: '', next_at: null });
        const followVisible = ref(false);

        const transferVisible = ref(false);
        const transferId = ref(0);
        const transferTo = ref(1);

        // 多选状态（行对象由网格翻页重建，以 id 映射持久）
        const selMap = reactive({});
        const selCount = computed(() => Object.keys(selMap).filter(k => selMap[k]).length);
        const selIdList = computed(() => Object.keys(selMap).filter(k => selMap[k]).map(Number));
        function toggleSel(row) { selMap[row.id] = !selMap[row.id]; }
        function clearSel() { Object.keys(selMap).forEach(k => { delete selMap[k]; }); }

        // 视图记忆：最近一次筛选条件存 localStorage，下次进入自动恢复
        function restoreView() {
          try {
            const saved = JSON.parse(localStorage.getItem(VIEW_KEY) || '{}');
            if (saved.keyword) keyword.value = saved.keyword;
            if (!isPool && saved.poolStatus) poolStatus.value = saved.poolStatus;
            if (saved.level) level.value = saved.level;
          } catch (e) { /* 忽略损坏的本地视图 */ }
        }
        function saveView() {
          try {
            localStorage.setItem(VIEW_KEY, JSON.stringify({ keyword: keyword.value, poolStatus: poolStatus.value, level: level.value }));
          } catch (e) { /* 存储不可用时静默 */ }
        }

        function doSearch() {
          const params = { keyword: keyword.value.trim(), level: level.value };
          params.pool_status = isPool ? 'public_pool' : poolStatus.value;
          if (due) params.due = 1;
          saveView();
          grid.value && grid.value.search(params);
        }
        function clearDue() { location.href = location.pathname; }
        // 首查统一由 mounted 带参发起（:active=false），避免自动首查与手动 search 竞态报 canceled

        function poolLabel(v) { return v === 'private_pool' ? '私海' : '公海'; }
        function openCreate() {
          Object.assign(form, { id: 0, name: '', phone: '', industry: '', source: '', level: 'normal', contact_name: '', contact_phone: '', remark: '' });
          drawer.value = true;
        }
        async function openDetail(row) {
          detailVisible.value = true;
          detailLoading.value = true;
          detail.value = null; timeline.value = []; detailTab.value = 'info';
          try {
            const [d, t] = await Promise.all([
              fetch('/lin-crm/customer/detail', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: row.id }) }).then(r => r.json()),
              fetch('/lin-crm/customer/timeline', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: row.id }) }).then(r => r.json()),
            ]);
            if (d.code === 0) detail.value = d.data; else ElementPlus.ElMessage.error(d.message || '加载失败');
            if (t.code === 0) timeline.value = t.data.list || [];
          } finally { detailLoading.value = false; }
        }
        function openFollowup(row) {
          Object.assign(followForm, { id: row.id, biz_type: 'customer', method: 'phone', content: '', next_at: null });
          followVisible.value = true;
        }
        async function post(url, payload) {
          const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const body = await res.json();
          if (body.code !== 0) { ElementPlus.ElMessage.error(body.message || '操作失败'); return false; }
          ElementPlus.ElMessage.success(body.message || '成功');
          grid.value && grid.value.refresh();
          return true;
        }
        function openTransfer(row) { transferId.value = row.id; transferTo.value = 1; transferVisible.value = true; }
        const claim = (row) => post('/lin-crm/customer/claim', { id: row.id });
        // 归属抹除操作（L1 轻确认）：确认 + 对象 + 后果（规范 §0.9 文案公式）
        async function giveback(row) {
          try {
            await ElementPlus.ElMessageBox.confirm(
              '确认将客户「' + row.name + '」退回公海？退回后您将失去该客户的归属与保护期。', '退回公海', { type: 'warning' });
          } catch (e) { return; }
          post('/lin-crm/customer/giveback', { id: row.id });
        }
        // 删除（L2 强打断，抹除类）：确认 + 对象 + 后果 + 不可逆提示；单请求走软删托管平台回收站
        async function delRow(row) {
          try {
            await ElementPlus.ElMessageBox.confirm(
              '确认删除客户「' + row.name + '」？删除后将移入回收站，30 天内可恢复；到期或彻底删除后不可恢复。',
              '删除客户', { type: 'warning', confirmButtonText: '删除', cancelButtonText: '取消',
                            confirmButtonClass: 'el-button--danger' });
          } catch (e) { return; }
          post('/lin-crm/customer/delete', { id: row.id });
        }
        function rowCommand(cmd, row) {
          if (cmd === 'claim') claim(row);
          else if (cmd === 'giveback') giveback(row);
          else if (cmd === 'transfer') openTransfer(row);
          else if (cmd === 'delete') delRow(row);
        }

        // 全局搜索（跨四对象；点击跳转对应列表页）
        const gsVisible = ref(false);
        const gsKeyword = ref('');
        const gsLoading = ref(false);
        const gsResult = ref({});
        const gsSections = [
          { key: 'customer', label: '客户', render: it => it.code + ' ' + it.name, meta: it => (it.phone || '') + ' · ' + (it.pool_status === 'private_pool' ? '私海' : '公海') },
          { key: 'lead', label: '线索', render: it => it.code + ' ' + it.name, meta: it => it.phone || '' },
          { key: 'opportunity', label: '商机', render: it => it.code + ' ' + it.name, meta: it => '¥' + Number(it.amount || 0).toLocaleString('zh-CN') },
          { key: 'contract', label: '合同', render: it => it.code + ' ' + it.name, meta: it => '¥' + Number(it.amount || 0).toLocaleString('zh-CN') },
        ];
        const gsHasResult = computed(() => gsSections.some(s => (gsResult.value[s.key] || []).length));
        async function doGlobalSearch() {
          if (!gsKeyword.value.trim()) { ElementPlus.ElMessage.warning('请输入关键字'); return; }
          gsLoading.value = true;
          try {
            const res = await fetch('/lin-crm/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ keyword: gsKeyword.value.trim() }) });
            const body = await res.json();
            if (body.code === 0) gsResult.value = body.data || {};
            else ElementPlus.ElMessage.error(body.message || '搜索失败');
          } finally { gsLoading.value = false; }
        }
        function gsGo(sec, it) { window.top.location.href = '/lin-crm/' + sec + '/index'; }

        Vue.onMounted(() => {
          loadPerms();
          restoreView();
          if (isPool) poolStatus.value = 'public_pool';
          doSearch(); // :active=false，首查由这里带参发起（避免与自动首查竞态报 canceled）
          // 默认进入「列表（卡片清单）」模式：DataGrid 内部初始为 table 且无默认视图 prop，
          // 挂载后程序化触发工具栏「表格/列表切换」按钮（tools 仅 refresh+modeSwitch，末位即切换钮）
          Vue.nextTick(() => {
            const btns = document.querySelectorAll('.wd-datagrid .el-button.is-circle');
            if (btns.length) btns[btns.length - 1].click();
          });
        });

        return { grid, keyword, poolStatus, level, due, clearDue, Search, SearchIcon, ArrowDown,
                 can, drawer, form, detailLoading, detail, detailTab, timeline, timelineType,
                 followForm, transferVisible, transferId, transferTo, detailVisible, followVisible, delRow,
                 selMap, selCount, selIdList, toggleSel, clearSel,
                 doSearch, poolLabel, openCreate, openDetail, openFollowup,
                 openTransfer, claim, giveback, rowCommand,
                 gsVisible, gsKeyword, gsLoading, gsResult, gsSections, gsHasResult, doGlobalSearch, gsGo };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
