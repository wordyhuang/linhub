<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公海规则 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-poolrule-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      公海规则（单行配置）：保护期天数决定客户超期未跟进自动释放回公海的门槛；
      私海持有上限约束单人认领/新建总量；释放时点为宿主调度器每日执行释放任务的时刻。
    </wd-tips>

    <wd-panel :border="true" title="公海规则">
      <el-form label-width="170px" size="small" style="max-width:460px">
        <el-form-item label="保护期（天）" required><el-input-number v-model="form.protect_days" :min="1" style="width:100%" /></el-form-item>
        <el-form-item label="私海持有上限" required><el-input-number v-model="form.private_limit" :min="1" style="width:100%" /></el-form-item>
        <el-form-item label="释放时点" required><el-input v-model="form.release_run_at" placeholder="如 02:00" /></el-form-item>
        <el-button type="primary" size="small" @click="save">保存</el-button>
      </el-form>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { reactive } = Vue;

    const app = Vue.createApp({
      template: '#crm-poolrule-tpl',
      setup() {
        const form = reactive({ protect_days: 30, private_limit: 50, release_run_at: '02:00' });
        (async () => {
          const res = await fetch('/lin-crm/setting/poolrule', { method: 'POST' });
          const body = await res.json();
          if (body.code === 0 && body.data) Object.assign(form, body.data);
          else ElementPlus.ElMessage.error(body.message || '加载失败');
        })();
        async function save() {
          const res = await fetch('/lin-crm/setting/poolrule', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form) });
          const body = await res.json();
          if (body.code === 0) ElementPlus.ElMessage.success(body.message || '已保存');
          else ElementPlus.ElMessage.error(body.message || '保存失败');
        }
        return { form, save };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
