<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM 设置 - 林客CRM</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
  <link rel="stylesheet" href="/static/vendor/element-plus/index.css">
  <link rel="stylesheet" href="/static/vendor/workdesktop-ai/style.css">
  <style>
    html, body, #app { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .crm-page { height: 100%; padding: 16px 20px 24px; box-sizing: border-box; }
    .config-grid { display: grid; grid-template-columns: repeat(2, minmax(280px, 420px)); gap: 4px 24px; }
    @media (max-width: 900px) { .config-grid { grid-template-columns: 1fr; } }
    .hint { font-size: 12px; color: #909399; margin: 2px 0 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/x-template" id="crm-config-tpl">
  <div class="crm-page">
    <wd-tips type="box" style="display:flex;margin-bottom:12px">
      12 项租户级配置：保存即时生效（覆盖默认值）。带 * 的为必填键位；数组类（阶段赢率）以逗号分隔四个开放阶段的赢率。
    </wd-tips>

    <wd-panel :border="true" title="CRM 配置" description="留空的项表示沿用系统默认值。">
      <div class="config-grid">
        <el-form label-width="150px" size="small">
          <el-form-item label="客户保护期（天）"><el-input-number v-model="patch['customer.protect_days']" :min="1" style="width:100%" /></el-form-item>
          <el-form-item label="私海持有上限"><el-input-number v-model="patch['customer.private_limit']" :min="1" style="width:100%" /></el-form-item>
          <el-form-item label="公海释放时点"><el-input v-model="patch['customer.release_run_at']" placeholder="如 02:00" /></el-form-item>
          <el-form-item label="跟进超期（天）"><el-input-number v-model="patch['lead.followup_overdue_days']" :min="1" style="width:100%" /></el-form-item>
          <el-form-item label="阶段赢率（逗号分隔）"><el-input v-model="patch['opportunity.win_rates']" placeholder="10,30,50,70,100" /></el-form-item>
          <el-form-item label="商机停滞（天）"><el-input-number v-model="patch['opportunity.stagnant_days']" :min="1" style="width:100%" /></el-form-item>
        </el-form>
        <el-form label-width="150px" size="small">
          <el-form-item label="合同需审核"><el-switch v-model="patch['contract.require_audit']" :active-value="1" :inactive-value="0" /></el-form-item>
          <el-form-item label="回款提醒偏移（天）"><el-input v-model="patch['receivable.remind_offsets']" placeholder="如 7,3,1" /></el-form-item>
          <el-form-item label="手机号脱敏"><el-switch v-model="patch['phone.mask_enabled']" :active-value="1" :inactive-value="0" /></el-form-item>
          <el-form-item label="回收站保留（天）"><el-input-number v-model="patch['recycle.retention_days']" :min="1" style="width:100%" /></el-form-item>
          <el-form-item label="导入单批上限"><el-input-number v-model="patch['import.batch_size']" :min="1" style="width:100%" /></el-form-item>
          <el-form-item label="报表缓存（秒）"><el-input-number v-model="patch['report.cache_ttl']" :min="0" style="width:100%" /></el-form-item>
        </el-form>
      </div>
      <div style="margin-top:16px">
        <el-button type="primary" size="small" @click="save">保存配置</el-button>
      </div>
    </wd-panel>
  </div>
</script>

  <script src="/static/vendor/vue/vue.global.prod.js"></script>
  <script src="/static/vendor/element-plus/index.full.min.js"></script>
  <script src="/static/vendor/icons/index.iife.min.js"></script>
  <script src="/static/vendor/workdesktop-ai/index.umd.js"></script>
  <script>
    const WD = window.WorkDesktop;
    const ElementPlus = window.ElementPlus;
    const { WorkDesktop } = WD;
    const { reactive } = Vue;

    const KEYS = ['customer.protect_days', 'customer.private_limit', 'customer.release_run_at',
                  'lead.followup_overdue_days', 'opportunity.win_rates', 'opportunity.stagnant_days',
                  'contract.require_audit', 'receivable.remind_offsets', 'phone.mask_enabled',
                  'recycle.retention_days', 'import.batch_size', 'report.cache_ttl'];

    const app = Vue.createApp({
      template: '#crm-config-tpl',
      setup() {
        const patch = reactive({});
        // 载入：默认值 + 已覆盖值（覆盖优先）
        (async () => {
          const res = await fetch('/lin-crm/setting/config', { method: 'POST' });
          const body = await res.json();
          if (body.code !== 0) { ElementPlus.ElMessage.error(body.message || '加载失败'); return; }
          const defaults = body.data.defaults || {};
          const overrides = body.data.overrides || {};
          const flat = {};
          const dig = (obj, prefix) => {
            for (const [k, v] of Object.entries(obj)) {
              const key = prefix ? prefix + '.' + k : k;
              if (v && typeof v === 'object' && !Array.isArray(v)) dig(v, key);
              else flat[key] = v;
            }
          };
          dig(defaults, '');
          for (const k of KEYS) {
            const v = overrides[k] !== undefined ? overrides[k] : flat[k];
            if (v !== undefined) patch[k] = v;
          }
          if (Array.isArray(patch['opportunity.win_rates'])) patch['opportunity.win_rates'] = patch['opportunity.win_rates'].join(',');
        })();
        async function save() {
          const payload = {};
          for (const k of KEYS) { if (patch[k] !== undefined && patch[k] !== '') payload[k] = patch[k]; }
          if (typeof payload['opportunity.win_rates'] === 'string') {
            payload['opportunity.win_rates'] = payload['opportunity.win_rates'].split(',').map(s => parseInt(s.trim(), 10) || 0);
          }
          const res = await fetch('/lin-crm/setting/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ patch: payload }) });
          const body = await res.json();
          if (body.code === 0) ElementPlus.ElMessage.success(body.message || '已保存');
          else ElementPlus.ElMessage.error(body.message || '保存失败');
        }
        return { patch, save };
      }
    });
    for (const [name, comp] of Object.entries(window.ElementPlusIconsVue)) app.component(name, comp);
    app.use(ElementPlus);
    app.use(WorkDesktop);
    app.mount('#app');
  </script>
</body>
</html>
