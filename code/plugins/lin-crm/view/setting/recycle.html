{* 林客 · 回收站（PG-SET-04；FR-TOOL-02；RL-3） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <el-alert type="warning" :closable="false" title="软删数据保留 30 天；恢复撞单将拦截并提示走客户合并；彻底删除不可逆"/>
    <el-table :data="rows" border stripe style="margin-top:12px">
      <el-table-column prop="src_table" label="来源表" width="200"/>
      <el-table-column prop="src_id" label="来源 id" width="100"/>
      <el-table-column prop="expired_at" label="过期时间" width="170"/>
      <el-table-column prop="created_at" label="删除时间" width="170"/>
      <el-table-column label="操作" width="180" fixed="right">
        <template #default="{row}">
          <el-button link type="primary" @click="restore(row)">恢复</el-button>
          <el-button link type="danger" @click="purge(row)">彻底删除</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination layout="total, prev, pager, next" :total="total" :page-size="pageSize" v-model:current-page="cur" @current-change="load"/>
  </el-card>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ rows: [], total: 0, cur: 1, pageSize: 20 });
  function load(page) {
    state.cur = page || state.cur;
    crmRequest('/crm/setting/recycle', { op: 'index', page: state.cur, page_size: state.pageSize })
      .then(function (res) { state.rows = res.data.data || res.data; state.total = res.data.total || state.rows.length; });
  }
  function act(row, op, okMsg) {
    crmRequest('/crm/setting/recycle', { op: op, id: row.id }, 'post').then(function (res) {
      ElementPlus.ElMessage.success(res.message || okMsg); load();
    });
  }
  function restore(row) { act(row, 'restore', '已恢复'); }
  function purge(row) {
    ElementPlus.ElMessageBox.confirm('彻底删除后不可恢复，确认？', '危险操作', { type: 'warning' })
      .then(function () { act(row, 'purge', '已彻底删除'); }).catch(function () {});
  }
  load(1);
  return Object.assign({}, V.toRefs(state), { load, restore, purge });
});
</script>
