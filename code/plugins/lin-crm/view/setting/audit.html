{* 林客 · 审计日志（PG-SET-05；FR-AUT-04） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <el-form inline>
      <el-select v-model="action" placeholder="全部行为" clearable style="width:180px" @change="load(1)">
        <el-option v-for="a in ['login','export','delete','transfer','phone_view','merge','release','import']" :key="a" :label="a" :value="a"/>
      </el-select>
    </el-form>
    <el-table :data="rows" border>
      <el-table-column prop="created_at" label="时间" width="170"/>
      <el-table-column prop="actor_id" label="操作人" width="100"/>
      <el-table-column prop="action" label="行为" width="120"/>
      <el-table-column prop="biz_type" label="业务" width="110"/>
      <el-table-column prop="biz_id" label="业务 id" width="90"/>
      <el-table-column prop="detail" label="详情" min-width="220"/>
      <el-table-column prop="ip" label="IP" width="140"/>
    </el-table>
    <el-pagination layout="total, prev, pager, next" :total="total" :page-size="pageSize" v-model:current-page="cur" @current-change="load"/>
  </el-card>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ rows: [], total: 0, cur: 1, pageSize: 20, action: '' });
  function load(page) {
    state.cur = page || state.cur;
    crmRequest('/crm/setting/audit', { page: state.cur, page_size: state.pageSize, action: state.action })
      .then(function (res) { state.rows = res.data.data || res.data; state.total = res.data.total || state.rows.length; });
  }
  load(1);
  return Object.assign({}, V.toRefs(state), { load });
});
</script>
