{* 林客 · 客户合并向导（PG-CUS-04；关联 FR-CUS-03） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <el-alert type="warning" :closable="false"
      title="合并后从档软删，联系人/商机/合同/跟进全部挂到主档，操作留痕（审计日志）"/>
    <el-form label-width="120px" style="max-width:520px;margin-top:16px">
      <el-form-item label="保留主档 id" required><el-input-number v-model="mainId" :min="1" style="width:100%"/></el-form-item>
      <el-form-item label="被合并从档 id" required><el-input-number v-model="slaveId" :min="1" style="width:100%"/></el-form-item>
      <el-button type="danger" @click="doMerge">执行合并</el-button>
    </el-form>
  </el-card>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ mainId: null, slaveId: null });
  function doMerge() {
    ElementPlus.ElMessageBox.confirm('确认合并？该操作将软删从档并迁移全部关联数据。', '二次确认', { type: 'warning' })
      .then(function () {
        return crmRequest('/crm/customer/merge', { main_id: state.mainId, slave_id: state.slaveId });
      })
      .then(function () { ElementPlus.ElMessage.success('合并完成'); })
      .catch(function () {});
  }
  return Object.assign({}, V.toRefs(state), { doMerge });
});
</script>
