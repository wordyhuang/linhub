{* 林客 · 公海页（PG-CUS-02；关联 FR-CUS-02：认领/退回） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <el-alert type="info" :closable="false" title="公海客户任何销售可认领；认领后进入私海并启动保护期（超期未跟进自动释放）"/>
    <el-table :data="rows" border stripe style="margin-top:12px">
      <el-table-column prop="code" label="编码" width="150"/>
      <el-table-column prop="name" label="客户名称" min-width="160"/>
      <el-table-column prop="phone" label="手机号" width="130"/>
      <el-table-column prop="source" label="来源" width="110"/>
      <el-table-column prop="created_at" label="进入公海时间" width="170"/>
      <el-table-column label="操作" width="120" fixed="right">
        <template #default="{row}">
          <el-button link type="primary" @click="claim(row)">认领</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination layout="total, prev, pager, next" :total="total" :page-size="pageSize" v-model:current-page="cur" @current-change="load"/>
  </el-card>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ rows: [], total: 0, cur: 1, pageSize: 20 });
  function load(page) {
    state.cur = page || state.cur;
    return crmRequest('/crm/customer/index', { page: state.cur, page_size: state.pageSize, pool_status: 'public_pool' })
      .then(function (res) { state.rows = res.data.data || res.data; state.total = res.data.total || state.rows.length; });
  }
  function claim(row) {
    crmRequest('/crm/customer/claim', { id: row.id }).then(function () {
      ElementPlus.ElMessage.success('认领成功，已进入私海'); load();
    });
  }
  load(1);
  return Object.assign({}, V.toRefs(state), { load, claim });
});
</script>
