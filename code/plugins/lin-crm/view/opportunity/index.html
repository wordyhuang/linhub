{* 林客 · 商机列表（PG-OPP-01/03；关联 FR-OPP-01/02/03） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <el-button v-permission="'crm:opportunity:create'" type="primary" @click="drawer = true">新建商机</el-button>
    <el-table :data="rows" border stripe style="margin-top:12px">
      <el-table-column prop="code" label="编码" width="150"/>
      <el-table-column prop="name" label="商机名称" min-width="150"/>
      <el-table-column prop="customer_id" label="客户 id" width="90"/>
      <el-table-column prop="stage" label="阶段" width="110"/>
      <el-table-column prop="amount" label="预计金额" width="120" align="right"/>
      <el-table-column prop="win_rate" label="赢率%" width="80"/>
      <el-table-column prop="status" label="状态" width="90">
        <template #default="{row}"><el-tag :type="row.status==='won'?'success':(row.status==='lost'?'danger':'primary')">{{ row.status }}</el-tag></template>
      </el-table-column>
      <el-table-column label="操作" width="220" fixed="right">
        <template #default="{row}">
          <el-button link v-permission="'crm:opportunity:edit'" v-if="row.status==='open'" @click="advance(row)">推进</el-button>
          <el-button link v-permission="'crm:opportunity:won'" v-if="row.status==='open'" @click="close(row,'won')">赢单</el-button>
          <el-button link v-permission="'crm:opportunity:lost'" v-if="row.status==='open'" @click="close(row,'lost')">输单</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination layout="total, prev, pager, next" :total="total" :page-size="pageSize" v-model:current-page="cur" @current-change="load"/>
  </el-card>
  <el-drawer v-model="drawer" title="新建商机" size="380px">
    <el-form label-width="90px">
      <el-form-item label="客户 id" required><el-input-number v-model="form.customer_id" :min="1" style="width:100%"/></el-form-item>
      <el-form-item label="商机名称" required><el-input v-model="form.name"/></el-form-item>
      <el-form-item label="预计金额"><el-input-number v-model="form.amount" :min="0" style="width:100%"/></el-form-item>
      <el-button type="primary" @click="save" style="width:100%">保存</el-button>
    </el-form>
  </el-drawer>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ rows: [], total: 0, cur: 1, pageSize: 20, drawer: false,
    form: { customer_id: null, name: '', amount: 0 } });
  function load(page) {
    state.cur = page || state.cur;
    return crmRequest('/crm/opportunity/index', { page: state.cur, page_size: state.pageSize })
      .then(function (res) { state.rows = res.data.data || res.data; state.total = res.data.total || state.rows.length; });
  }
  function save() { crmRequest('/crm/opportunity/save', state.form).then(function () { state.drawer = false; load(1); }); }
  function advance(row) {
    const order = ['initial','confirm','proposal','negotiate'];
    const next = order[order.indexOf(row.stage) + 1];
    if (!next) { ElementPlus.ElMessage.info('已在最后阶段，请落终态'); return; }
    crmRequest('/crm/opportunity/stage', { id: row.id, stage: next, version: row.version }).then(function () { load(); });
  }
  function close(row, result) {
    ElementPlus.ElMessageBox.prompt(result === 'won' ? '赢单说明' : '输单原因（必填，含竞争对手可备注）').then(function (r) {
      return crmRequest('/crm/opportunity/result', { id: row.id, result: result, reason: r.value });
    }).then(function () { load(); }).catch(function () {});
  }
  load(1);
  return Object.assign({}, V.toRefs(state), { load, save, advance, close });
});
</script>
