{* 林客 · 线索池（PG-LEA-01；关联 FR-LEA-01/03/06） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <el-button v-permission="'crm:lead:create'" type="primary" @click="drawer = true">录入线索</el-button>
    <el-table :data="rows" border stripe style="margin-top:12px">
      <el-table-column prop="code" label="编码" width="150"/>
      <el-table-column prop="name" label="线索主体" min-width="150"/>
      <el-table-column prop="phone" label="手机号" width="130"/>
      <el-table-column prop="source" label="来源渠道" width="110"/>
      <el-table-column prop="intent_level" label="意向" width="90"/>
      <el-table-column prop="status" label="状态" width="100">
        <template #default="{row}"><el-tag>{{ row.status }}</el-tag></template>
      </el-table-column>
      <el-table-column label="操作" width="180" fixed="right">
        <template #default="{row}">
          <el-button link v-permission="'crm:lead:assign'" v-if="row.status==='unassigned'||row.status==='recycled'" @click="claim(row)">认领</el-button>
          <el-button link v-permission="'crm:lead:assign'" @click="recycle(row)">回收</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination layout="total, prev, pager, next" :total="total" :page-size="pageSize" v-model:current-page="cur" @current-change="load"/>
  </el-card>
  <el-drawer v-model="drawer" title="录入线索" size="380px">
    <el-form label-width="90px">
      <el-form-item label="主体名称" required><el-input v-model="form.name"/></el-form-item>
      <el-form-item label="手机号" required><el-input v-model="form.phone"/></el-form-item>
      <el-form-item label="来源渠道" required><el-input v-model="form.source" placeholder="如：展会名片"/></el-form-item>
      <el-button type="primary" @click="save" style="width:100%">保存</el-button>
    </el-form>
  </el-drawer>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ rows: [], total: 0, cur: 1, pageSize: 20, drawer: false,
    form: { name: '', phone: '', source: '' } });
  function load(page) {
    state.cur = page || state.cur;
    return crmRequest('/crm/lead/pool', { page: state.cur, page_size: state.pageSize, pool: 1 })
      .then(function (res) { state.rows = res.data.data || res.data; state.total = res.data.total || state.rows.length; });
  }
  function save() { crmRequest('/crm/lead/save', state.form).then(function () { state.drawer = false; load(1); }); }
  function claim(row) { crmRequest('/crm/lead/assign', { id: row.id }).then(function () { load(); }); }
  function recycle(row) {
    ElementPlus.ElMessageBox.prompt('回收原因（必填）').then(function (r) {
      crmRequest('/crm/lead/recycle', { id: row.id, reason: r.value }).then(function () { load(); });
    }).catch(function () {});
  }
  load(1);
  return Object.assign({}, V.toRefs(state), { load, save, claim, recycle });
});
</script>
