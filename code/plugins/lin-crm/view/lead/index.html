{* 林客 · 线索列表（PG-LEA-02；关联 FR-LEA-02/04/05：跟进/转化） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <el-table :data="rows" border stripe>
      <el-table-column prop="code" label="编码" width="150"/>
      <el-table-column prop="name" label="线索主体" min-width="150"/>
      <el-table-column prop="intent_level" label="意向" width="90"/>
      <el-table-column prop="status" label="状态" width="110"/>
      <el-table-column prop="converted_customer_id" label="转化客户" width="110"/>
      <el-table-column label="操作" width="200" fixed="right">
        <template #default="{row}">
          <el-button link v-permission="'crm:followup:create'" @click="follow(row)">跟进</el-button>
          <el-button link v-permission="'crm:lead:convert'" v-if="['assigned','following'].includes(row.status)" @click="convert(row)">转化</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination layout="total, prev, pager, next" :total="total" :page-size="pageSize" v-model:current-page="cur" @current-change="load"/>
  </el-card>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ rows: [], total: 0, cur: 1, pageSize: 20 });
  function load(page) {
    state.cur = page || state.cur;
    return crmRequest('/crm/lead/index', { page: state.cur, page_size: state.pageSize })
      .then(function (res) { state.rows = res.data.data || res.data; state.total = res.data.total || state.rows.length; });
  }
  function follow(row) {
    ElementPlus.ElMessageBox.prompt('跟进内容').then(function (r) {
      return crmRequest('/crm/customer/followup', { biz_type: 'lead', biz_id: row.id, content: r.value, method: 'phone' });
    }).then(function () { return crmRequest('/crm/lead/follow', { id: row.id }); })
      .then(function () { ElementPlus.ElMessage.success('已跟进'); load(); }).catch(function () {});
  }
  function convert(row) {
    ElementPlus.ElMessageBox.confirm('转化后将新建客户档案（可选建商机），确认？').then(function () {
      return crmRequest('/crm/lead/convert', { id: row.id, with_opportunity: false });
    }).then(function (res) {
      ElementPlus.ElMessage.success('已转化，客户 id=' + res.data.customer_id);
      load();
    }).catch(function (e) { if (e && e.code === 40901) { ElementPlus.ElMessage.warning('撞单：已存在同主体客户，请查看'); } });
  }
  load(1);
  return Object.assign({}, V.toRefs(state), { load, follow, convert });
});
</script>
