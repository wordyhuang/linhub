{* 林客 · 合同列表（PG-CON-01/02；关联 FR-CON-01/02/07） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <el-button v-permission="'crm:contract:create'" type="primary" @click="drawer = true">新建合同</el-button>
    <el-table :data="rows" border stripe style="margin-top:12px">
      <el-table-column prop="code" label="编码" width="150" />
      <el-table-column prop="name" label="合同名称" min-width="150" />
      <el-table-column prop="amount" label="合同额" width="120" align="right" />
      <el-table-column prop="paid_amount" label="已回款" width="120" align="right" />
      <el-table-column prop="balance" label="应收余额" width="120" align="right" />
      <el-table-column prop="status" label="状态" width="100">
        <template #default="{row}"><el-tag
            :type="{draft:'info',auditing:'warning',effective:'success',settled:'success',terminated:'danger'}[row.status]">{{ row.status }}</el-tag></template>
      </el-table-column>
      <el-table-column label="操作" width="230" fixed="right">
        <template #default="{row}">
          <el-button link v-permission="'crm:contract:create'" v-if="row.status==='draft'"
            @click="submit(row)">提交审批</el-button>
          <el-button link v-permission="'crm:contract:audit'" v-if="row.status==='auditing'"
            @click="audit(row)">审批</el-button>
          <el-button link v-permission="'crm:receivable:plan'" v-if="row.status==='effective'"
            @click="goPlan(row)">回款计划</el-button>
          <el-button link v-permission="'crm:contract:change'" v-if="row.status==='effective'"
            @click="change(row)">变更</el-button>
        </template>
      </el-table-column>
    </el-table>
    <el-pagination layout="total, prev, pager, next" :total="total" :page-size="pageSize" v-model:current-page="cur"
      @current-change="load" />
  </el-card>
  <el-drawer v-model="drawer" title="新建合同" size="380px">
    <el-form label-width="90px">
      <el-form-item label="客户 id" required><el-input-number v-model="form.customer_id" :min="1"
          style="width:100%" /></el-form-item>
      <el-form-item label="合同名称" required><el-input v-model="form.name" /></el-form-item>
      <el-form-item label="合同额" required><el-input-number v-model="form.amount" :min="0" :precision="2"
          style="width:100%" /></el-form-item>
      <el-form-item label="签订日"><el-date-picker v-model="form.sign_date" type="date"
          value-format="YYYY-MM-DD" /></el-form-item>
      <el-button type="primary" @click="save" style="width:100%">保存草稿</el-button>
    </el-form>
  </el-drawer>
</div>
<script>
  crmPage(function () {
    const V = Vue;
    const state = V.reactive({
      rows: [], total: 0, cur: 1, pageSize: 20, drawer: false,
      form: { customer_id: null, name: '', amount: 0, sign_date: '' }
    });
    function load(page) {
      state.cur = page || state.cur;
      return crmRequest('/crm/contract/index', { page: state.cur, page_size: state.pageSize })
        .then(function (res) { state.rows = res.data.data || res.data; state.total = res.data.total || state.rows.length; });
    }
    function save() { crmRequest('/crm/contract/save', state.form).then(function () { state.drawer = false; load(1); }); }
    function submit(row) { crmRequest('/crm/contract/submit', { id: row.id }).then(function () { load(); }); }
    function audit(row) {
      ElementPlus.ElMessageBox.confirm('通过该合同审批？', '审批', {
        distinguishCancelAndClose: true,
        confirmButtonText: '通过', cancelButtonText: '驳回'
      })
        .then(function () { return crmRequest('/crm/contract/audit', { id: row.id, approve: true, opinion: '同意' }); })
        .catch(function (action) {
          if (action === 'cancel') {
            return ElementPlus.ElMessageBox.prompt('驳回意见（必填）').then(function (r) {
              return crmRequest('/crm/contract/audit', { id: row.id, approve: false, opinion: r.value });
            });
          }
          return Promise.reject();
        })
        .then(function () { load(); }).catch(function () { });
    }
    function goPlan(row) { location.href = '/crm/contract/receivable?contract_id=' + row.id; }
    function change(row) {
      ElementPlus.ElMessageBox.prompt('变更后合同额（原 ' + row.amount + '，变更原因必填，格式：新金额|原因）').then(function (r) {
        const parts = String(r.value).split('|');
        return crmRequest('/crm/contract/change', { id: row.id, field: 'amount', value: parts[0], reason: parts[1] || '' });
      }).then(function () { load(); }).catch(function () { });
    }
    load(1);
    return Object.assign({}, V.toRefs(state), { load, save, submit, audit, goPlan, change });
  });
</script>
