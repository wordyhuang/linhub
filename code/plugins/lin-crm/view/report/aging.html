{* 林客 · 应收账龄（PG-RPT-03；FR-RPT-04 四区间） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <template #header>应收账龄（按合同维度未收余额）</template>
    <el-row :gutter="12">
      <el-col :span="6"><el-statistic title="≤30 天" :value="a.buckets.b30"/></el-col>
      <el-col :span="6"><el-statistic title="31-60 天" :value="a.buckets.b60"/></el-col>
      <el-col :span="6"><el-statistic title="61-90 天" :value="a.buckets.b90"/></el-col>
      <el-col :span="6"><el-statistic title=">90 天" :value="a.buckets.b90p"/></el-col>
    </el-row>
    <el-table :data="a.detail" border style="margin-top:14px">
      <el-table-column prop="code" label="合同编码" width="160"/>
      <el-table-column prop="name" label="合同名称" min-width="150"/>
      <el-table-column prop="due" label="未收余额" width="130" align="right"/>
      <el-table-column prop="overdue_days" label="逾期天数" width="110"/>
      <el-table-column prop="bucket" label="账龄区间" width="110"/>
    </el-table>
  </el-card>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ a: { buckets: { b30: 0, b60: 0, b90: 0, b90p: 0 }, detail: [] } });
  crmRequest('/crm/report/aging').then(function (res) { state.a = res.data; });
  return Object.assign({}, V.toRefs(state));
});
</script>
