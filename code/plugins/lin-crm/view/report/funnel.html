{* 林客 · 漏斗分析（PG-RPT-01；FR-RPT-02） *}
{include file="common/head" /}
<div id="app">
  <el-card shadow="never">
    <template #header>漏斗与转化分析（PHP 侧聚合 + 缓存 {{ ttl }}s）</template>
    <el-table :data="f.funnel" border>
      <el-table-column prop="stage" label="阶段" width="140"/>
      <el-table-column prop="count" label="商机数" width="100"/>
      <el-table-column prop="amount" label="金额" width="140" align="right"/>
      <el-table-column prop="convert_rate" label="占比%" width="100"/>
      <el-table-column prop="avg_stay_days" label="平均停留(天)" width="130"/>
    </el-table>
    <el-alert style="margin-top:12px" type="info" :closable="false"
      :title="'赢单 ' + f.won + ' / 输单 ' + f.lost + '，胜率 ' + f.win_rate + '%'"/>
  </el-card>
</div>
<script>
crmPage(function () {
  const V = Vue;
  const state = V.reactive({ f: { funnel: [], won: 0, lost: 0, win_rate: 0 }, ttl: 300 });
  crmRequest('/crm/report/funnel').then(function (res) { state.f = res.data; });
  return Object.assign({}, V.toRefs(state));
});
</script>
