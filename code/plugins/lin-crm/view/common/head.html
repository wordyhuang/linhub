{* 林客功能包 · 公共页头（F-02 资源引入顺序硬约束；F-05 首屏服务端注入；F-06 统一请求层） *}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{* 1. element-plus css → 2. workdesktop-ai css（宿主公共布局已引入时按宿主布局裁剪，禁止多版本共存） *}
<link rel="stylesheet" href="/static/element-plus/index.css">
<link rel="stylesheet" href="/static/workdesktop-ai/workdesktop-ai.css">
<link rel="stylesheet" href="/static/lgg/crm/css/app.css">
{* 3. vue3 UMD → 4. element-plus UMD → 5. workdesktop-ai UMD *}
<script src="/static/vue3/vue.global.prod.js"></script>
<script src="/static/element-plus/index.full.min.js"></script>
<script src="/static/workdesktop-ai/workdesktop-ai.min.js"></script>
<script>
/* F-06 统一请求层：页面内禁止裸 fetch / axios.create */
window.crmRequest = function (url, data, method) {
  return window.workDesktopConfig.request({
    url: url, method: method || (data ? 'post' : 'get'), data: data || {},
  }).then(function (res) {
    if (res.code !== 0) { ElementPlus.ElMessage.error(res.message || '请求失败'); throw res; }
    return res;
  });
};
/* 首屏数据（F-05：ThinkPHP 服务端注入 init_data；页面禁二次请求同批数据） */
window.__INITIAL_DATA__ = window.__INITIAL_DATA__ || {$initData|json|raw};
window.__LG_PERMS__ = window.__LG_PERMS__ || {$perms|json|raw};
</script>
<script>
/* 页面统一引导（F-03：一律 createReadyApp，禁自行 createApp 拼装；
   F-08：v-permission 指令只控显隐，服务端二次校验为授权事实依据；
   安装时若宿主 createReadyApp 签名有差异，仅调整本函数，页面零改动） */
window.crmPage = function (setupFn) {
  var app = createReadyApp({ setup: setupFn });
  app.use(ElementPlus);
  app.directive('permission', {
    mounted: function (el, binding) {
      if ((window.__LG_PERMS__ || []).indexOf(binding.value) === -1) { el.style.display = 'none'; }
    }
  });
  app.mount('#app');
  return app;
};
</script>
